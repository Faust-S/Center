name: ArtBazy W5 private source qualification
on:
  push:
    branches:
      - work/2026-11-24-artbazy-w5-source-qualification
    paths:
      - .github/workflows/artbazy-w5-source-qualification.yml
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PRIVATE_PIN: a7cd08c40dd32e8e20de39548f9aa0bd987ea713
      PRIVATE_TREE: 2da1578792542d1ffbf4b8bcb75dce1261e7a03e
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazy
          ref: a7cd08c40dd32e8e20de39548f9aa0bd987ea713
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact private source pin
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:PRIVATE_PIN -or
              (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:PRIVATE_TREE) { throw 'SOURCE_PIN_MISMATCH' }
          Write-Host 'SOURCE_PIN=PASS'
      - name: Native original source qualification (fixed counters only)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $js=@'
          const path=require('node:path'),cp=require('node:child_process');
          const cwd=path.join(process.cwd(),'PROGRAM','2026-11-21','OS_SERVICES');
          let failed=false;
          const run=(label,args)=>{
            const p=cp.spawnSync(process.execPath,args,{cwd,encoding:'utf8',maxBuffer:64*1024*1024,windowsHide:true,env:{...process.env,CI:'true'}});
            const ok=p.status===0&&!p.error&&!p.signal;
            console.log(label+'='+(ok?'PASS':'FAIL'));
            if(!ok)failed=true;
            return {ok,out:p.stdout||'',err:p.stderr||''};
          };
          const tests=run('FIXTURES',['--test','--test-reporter=tap','verify-w5-classical-self-service.mjs','verify-w4-source-reuse.mjs','verify-w5-collection-variants.mjs','verify-w5-research-step.mjs']);
          for(const k of ['tests','pass','fail','cancelled','skipped','todo']){
            const m=tests.out.match(new RegExp('^# '+k+' (\\d+)\\s*$','m'));
            console.log('NODE_'+k.toUpperCase()+'='+(m?m[1]:'UNKNOWN'));
          }
          for(const m of tests.out.matchAll(/^not ok (\d+) - /gm))console.log('FAILED_TEST_INDEX='+m[1]);
          const jobs=[
            ['CLASSICAL','verify-w5-full-catalog-field-guides.mjs',['packets','diagnostic_rows','additional_central_procedures','open_semantic_guides','accepted_methods']],
            ['STAGES','verify-w5-staged-collection.mjs',['methods','routes','proof_gate_records','negative_cases','accepted_methods']],
            ['REUSE','verify-w5-reuse-catalog.mjs',['families','links','unique_questions','overlapping_questions']],
            ['VARIANTS','verify-w5-full-catalog-variants.mjs',['methods','diagnostic_rows','additional_rows','scenario_runs','accepted_methods']],
            ['DPS','verify-w5-dps-minimum.mjs',['methods','fields','exact_links','open_links','scopes','negative_cases','accepted_methods']],
            ['NEXT_STEP','verify-w5-research-step-original.mjs',['methods','original_scopes','focus_scopes','scenario_runs','accepted_methods']]
          ];
          for(const [label,file,keys] of jobs){
            const p=run(label,[file]);
            if(p.ok){
              try{
                const d=JSON.parse(p.out);
                for(const k of keys){
                  const v=d.totals?.[k];
                  console.log(label+'_'+k.toUpperCase()+'='+(Number.isSafeInteger(v)&&v>=0?v:'UNKNOWN'));
                  if(!Number.isSafeInteger(v)||v<0)failed=true;
                }
              }catch{console.log(label+'_REPORT=FAIL');failed=true;}
            }else{
              // Do not publish raw source or method names. Log only fixed error prefix and line/column.
              const m=p.err.match(/(?:Error|TypeError|SyntaxError|RangeError): ([A-Z][A-Z_]{2,80})(?=[:\r\n ])/);
              if(m)console.log(label+'_ERROR_CODE='+m[1]);
              const pos=p.err.match(/\.mjs:(\d+):(\d+)\)?/);
              if(pos)console.log(label+'_ERROR_POSITION='+pos[1]+':'+pos[2]);
            }
          }
          const lifecycle=[["CASH","verify-w5-dynamic-investment-cash-effect.mjs",null],["EXECUTION","verify-w5-dynamic-investment-execution.mjs",null],["INVESTMENT","w5-dynamic-investment-audit.mjs","auditDynamicInvestment"],["PERIOD","w5-dynamic-period-effect-audit.mjs","auditDynamicPeriodEffect"],["PRODUCTION","w5-dynamic-production-effect-audit.mjs","auditDynamicProductionEffect"],["DECISION","w5-dynamic-decision-record-audit.mjs","auditDynamicDecisionRecord"],["HORIZON","w5-dynamic-investment-horizon-audit.mjs","auditDynamicInvestmentHorizon"],["CONTINUATION","w5-investment-continuation-audit.mjs","auditInvestmentContinuation"],["REMAINING","w5-remaining-dynamics-plan-audit.mjs","auditRemainingDynamicsPlan"],["ECONOMICS","w5-organization-dynamic-economics-audit.mjs","auditDynamicEconomics"],["CARRYOVER","w5-investment-carryover-audit.mjs","auditSavedInvestmentCarryover"]];
          let total=0,passed=0;
          for(const [label,file,fn] of lifecycle){
            const args=fn?['--input-type=module','-e','import { '+fn+' as audit } from "./'+file+'"; console.log(JSON.stringify(await audit()))']: [file];
            const p=run('LIFECYCLE_'+label,args);
            try{
              const d=JSON.parse(p.out);
              if(!Number.isSafeInteger(d.total)||!Number.isSafeInteger(d.passed)||!Array.isArray(d.tests)||d.tests.length!==d.total){failed=true;console.log('LIFECYCLE_'+label+'_REPORT=FAIL');continue}
              total+=d.total;passed+=d.passed;
              console.log('LIFECYCLE_'+label+'_COUNT='+d.passed+'/'+d.total);
              if(d.passed!==d.total||d.tests.some(t=>t.status!=='PASS')||(d.status!==undefined&&d.status!=='PASS'))failed=true;
              d.tests.forEach((t,i)=>{if(t.status!=='PASS')console.log('LIFECYCLE_'+label+'_FAILED_INDEX='+(i+1))});
            }catch{failed=true;console.log('LIFECYCLE_'+label+'_REPORT=FAIL')}
          }
          console.log('LIFECYCLE_COUNT='+passed+'/'+total);
          if(failed)process.exitCode=1;
          '@
          $script=Join-Path $env:RUNNER_TEMP 'artbazy-w5-source.cjs'
          [System.IO.File]::WriteAllText($script,$js,[System.Text.UTF8Encoding]::new($false))
          node $script
          if ($LASTEXITCODE -ne 0) { throw 'ARTBAZY_SOURCE_QUALIFICATION_FAILED' }
      - name: Remove private checkout and temporary output
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'artbazy-w5-*' -Force | Remove-Item -Force -ErrorAction SilentlyContinue

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRIVATE_SITE_PIN: 9adf876a07cc20587cb0534daa43c8c9f0f732b0
      PRIVATE_SITE_TREE: b97ff3648862e73a896985b7983c87bada9cfb96
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/artbazy.ru
          ref: 9adf876a07cc20587cb0534daa43c8c9f0f732b0
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Verify exact private site pin
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PRIVATE_SITE_PIN"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRIVATE_SITE_TREE"
          echo SITE_PIN=PASS
      - name: Install frozen dependencies without browser download
        shell: bash
        run: |
          if bun install --frozen-lockfile --ignore-scripts >"$RUNNER_TEMP/artbazy-w5-deps.log" 2>&1; then echo SITE_DEPENDENCIES=PASS; else echo SITE_DEPENDENCIES=FAIL; exit 1; fi
      - name: Native exact subject and site projection qualification
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          let failed=false;
          const run=(label,args)=>{
            const p=spawnSync(process.execPath,args,{encoding:'utf8',maxBuffer:128*1024*1024});
            const ok=p.status===0&&!p.error&&!p.signal;
            console.log(label+'='+(ok?'PASS':'FAIL'));
            if(!ok)failed=true;
            return p;
          };
          const pin=run('SUBJECT_GUARD',['--test','scripts/verify-artbazy-subject-pin.test.mjs']);
          for(const k of ['tests','pass','fail','cancelled','skipped']){
            const m=(pin.stdout||'').match(new RegExp('^# '+k+' (\\d+)\\s*$','m'));
            console.log('SUBJECT_GUARD_'+k.toUpperCase()+'='+(m?m[1]:'UNKNOWN'));
          }
          const p=run('SITE_PROJECTION',['scripts/verify-artbazy-calculation-projection.mjs']);
          try{
            const d=JSON.parse(p.stdout||'');
            console.log('SITE_REPORT='+(d.status==='PASS'?'PASS':'FAIL'));
            if(d.status!=='PASS')failed=true;
            for(const k of ['cash_effect','execution','horizon','continuation','carryover']){
              const a=d.investment_lifecycle?.[k];
              if(a&&Number.isSafeInteger(a.passed)&&Number.isSafeInteger(a.total))console.log('SITE_'+k.toUpperCase()+'_COUNT='+a.passed+'/'+a.total);
            }
          }catch{
            console.log('SITE_REPORT=UNAVAILABLE');
            const m=(p.stderr||'').match(/(?:Error|TypeError|SyntaxError|RangeError): ([A-Z][A-Z_]{2,80})(?=[:\r\n ])/);
            if(m)console.log('SITE_ERROR_CODE='+m[1]);
            failed=true;
          }
          if(failed)process.exitCode=1;
          JS
      - name: Remove private checkout and temporary output
        if: always()
        shell: bash
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          rm -f "$RUNNER_TEMP"/artbazy-w5-*.log
