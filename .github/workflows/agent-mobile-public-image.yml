name: Public original image Android cross-build qualification
on:
  push:
    branches:
      - 'ci/once/agent-mobile-public-image/*'
    paths:
      - '.github/ci-requests/agent-mobile-public-image.json'
permissions:
  contents: read
concurrency:
  group: iwxa-mobile-public-image
  cancel-in-progress: false
jobs:
  public-image-android:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install public qualification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build python3-pil
      - name: Test qualification checks
        run: cd .ci/agent-mobile-public-image && /usr/bin/python3 -m unittest -v test_qualify
      - name: Resolve Android SDK and install pinned NDK
        id: ndk
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdk="$(command -v sdkmanager || true)"
          if [ -z "$sdk" ]; then
            for p in "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "$sdk_root"/cmdline-tools/*/bin/sdkmanager "$sdk_root/tools/bin/sdkmanager"; do
              if [ -x "$p" ]; then sdk="$p"; break; fi
            done
          fi
          test -n "$sdk"
          export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
          "$sdk" --install --channel=3 'ndk;29.0.13113456' < <(printf 'y\n%.0s' {1..100})
          test -f "$sdk_root/ndk/29.0.13113456/build/cmake/android.toolchain.cmake"
          printf 'ndk=%s\n' "$sdk_root/ndk/29.0.13113456" >> "$GITHUB_OUTPUT"
      - name: Cross-build original Android runtime
        id: build
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk }}
          IMAGE_ABI: ${{ matrix.abi }}
        run: |
          /usr/bin/python3 .ci/agent-mobile-public-image/qualify.py --mode android --abi "$IMAGE_ABI" --ndk "$NDK_ROOT" --result "$RUNNER_TEMP/iwxa-public-image-android"
      - name: Preserve independent Android build receipt
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-public-image-android-${{ matrix.abi }}
          path: ${{ runner.temp }}/iwxa-public-image-android/receipt.json
          if-no-files-found: error
          retention-days: 7
