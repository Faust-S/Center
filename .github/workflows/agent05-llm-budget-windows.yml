name: Agent 0.5 private Windows source and model budget qualification

on:
  push:
    branches:
      - work/2026-11-13-agent05-llm-budget-qualification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent05-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-agent-typescript-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Require read-only private source permission
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)) { throw 'AGENT05_PRIVATE_READ_PERMISSION_UNAVAILABLE' }
      - name: Checkout pinned Agent for private typecheck
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 1523f5693cffcfb86299e33c753cb4b53b39f408
          path: private-product
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Typecheck with no public source or diagnostic exposure
        working-directory: private-product/desktop
        shell: pwsh
        run: |
          $deps=Join-Path $env:RUNNER_TEMP 'agent05-ts-diagnostic-deps.log'
          & npm.cmd ci --no-audit --no-fund *> $deps
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_TS_DIAG_DEPS_FAILED' }
          $log=Join-Path $env:RUNNER_TEMP 'agent05-ts-diagnostic-private.log'
          & npx.cmd tsc --noEmit --pretty false *> $log
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'AGENT05_TS_DIAGNOSTIC_PASS'
          } else {
            $raw=Get-Content -LiteralPath $log -Raw
            $matches=[regex]::Matches($raw,'chain-builder[.]tsx[(]([0-9]+),[0-9]+[)]: error TS2345')
            $area='OTHER'
            foreach ($match in $matches) {
              $n=[int]$match.Groups[1].Value
              if ($n -ge 680 -and $n -le 702) { $area='INPROCESS_EVIDENCE_CALL';break }
              if ($n -ge 770 -and $n -le 795) { $area='GRAPH_PREVIEW_RESULT';break }
              if ($n -ge 646 -and $n -le 670) { $area='TASK_SOURCE_BINDING';break }
            }
            Write-Host ('AGENT05_TS2345_LOCATION='+$area)
            throw 'AGENT05_TYPESCRIPT_PRIVATE_ERROR'
          }
  private-agent-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Require read-only private source permission
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)) { throw 'AGENT05_PRIVATE_READ_PERMISSION_UNAVAILABLE' }
      - name: Checkout pinned private Agent without credential persistence
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 1523f5693cffcfb86299e33c753cb4b53b39f408
          path: private-product
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Verify exactly requested private revision
        shell: pwsh
        run: |
          $actual = (& git -C private-product rev-parse HEAD).Trim()
          if ($actual -cne '1523f5693cffcfb86299e33c753cb4b53b39f408') { throw 'AGENT05_PRIVATE_SOURCE_REVISION_MISMATCH' }
          Write-Host 'AGENT05_PINNED_PRIVATE_SOURCE_CONFIRMED'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install only pinned Python dependencies
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-python-dependencies.log'
          & python -m pip install -r requirements.txt pytest *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_PYTHON_DEPENDENCIES_FAILED' }
          Write-Host 'AGENT05_PYTHON_DEPENDENCIES_READY'
      - name: Run exact model-context and GGUF metadata tests
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-python-context.log'
          & python -m pytest -q tests/test_iwxa_basic_generation_budget.py tests/test_iwxa_gguf_metadata.py *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_PYTHON_CONTEXT_TESTS_FAILED' }
          Write-Host 'AGENT05_PYTHON_CONTEXT_TESTS_PASS'
      - name: Run cold and warm llama.cpp transport regressions
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-python-llama.log'
          & python -m pytest -q tests/test_iwxa_basic_model_binding.py tests/test_iwxa_llm_warm_session.py *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_PYTHON_LLAMA_TRANSPORT_FAILED' }
          Write-Host 'AGENT05_PYTHON_LLAMA_TRANSPORT_PASS'
      - name: Run existing Graph and restart persistence tests
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-python-graph.log'
          & python -m pytest -q tests/test_fc6_graph_node_executor.py tests/test_agent05_pinned_graph_restart.py tests/test_agent05_graph_model_budget_contract.py *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_PYTHON_GRAPH_RESTART_FAILED' }
          Write-Host 'AGENT05_PYTHON_GRAPH_RESTART_PASS'
      - name: Run real Task and conversation regression suite
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-python-tasks.log'
          & python -m pytest -q tests/test_daily_driver.py *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_PYTHON_TASKS_FAILED' }
          Write-Host 'AGENT05_PYTHON_TASKS_PASS'
      - name: Install private desktop dependencies without cache
        working-directory: private-product/desktop
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-node-dependencies.log'
          & npm.cmd ci --no-audit --no-fund *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_DESKTOP_DEPENDENCIES_FAILED' }
          Write-Host 'AGENT05_DESKTOP_DEPENDENCIES_READY'
      - name: Run targeted desktop model and conversation tests
        working-directory: private-product/desktop
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-node-targeted.log'
          & node --test tests/agent05-gguf-context-ui.test.mjs tests/dialog-conversation.test.mjs tests/graph-config-stable-id.test.mjs tests/agent05-inprocess-core-task-preview.test.mjs tests/agent05-inprocess-k02-k04.test.mjs tests/agent05-graph-full-result-readback.test.mjs tests/chain-builder-k02-recommendation.test.mjs *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_DESKTOP_TARGETED_FAILED' }
          Write-Host 'AGENT05_DESKTOP_TARGETED_PASS'
      - name: TypeScript and Vite production build
        working-directory: private-product/desktop
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-ts-vite-build.log'
          & npm.cmd run build *> $log
          if ($LASTEXITCODE -ne 0) {
            # Never print private compiler output. These are predefined
            # classes, not arbitrary source excerpts, files or paths.
            $area='OTHER'
            foreach($item in @(
              @('src/chain-builder.tsx','CHAIN_BUILDER'),
              @('src/owner-inprocess-task-preview.d.mts','OWNER_TYPES'),
              @('src/owner-inprocess-task-preview.mjs','OWNER_PREVIEW')
            )){
              if (Select-String -LiteralPath $log -SimpleMatch -Pattern $item[0] -Quiet -ErrorAction SilentlyContinue) {
                $area=[string]$item[1];break
              }
            }
            $kind='OTHER'
            foreach ($candidate in @('TS2339','TS2322','TS2345','TS2353','TS18047','TS18048','TS7006','TS2305','TS2451','TS2554','TS2367','TS2769','TS2531')) {
              if (Select-String -LiteralPath $log -SimpleMatch -Pattern $candidate -Quiet -ErrorAction SilentlyContinue) {
                $kind=$candidate;break
              }
            }
            Write-Host ('AGENT05_TYPESCRIPT_FAILURE_AREA='+$area)
            Write-Host ('AGENT05_TYPESCRIPT_FAILURE_KIND='+$kind)
            throw 'AGENT05_TYPESCRIPT_VITE_BUILD_FAILED'
          }
          Write-Host 'AGENT05_TYPESCRIPT_VITE_BUILD_PASS'
      - name: Full desktop Node suite
        working-directory: private-product/desktop
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-node-full.log'
          & npm.cmd test *> $log
          if ($LASTEXITCODE -ne 0) {
            # Fixed-known regression category only; private TAP output stays local.
            $reason='OTHER'
            if (Select-String -LiteralPath $log -SimpleMatch -Pattern 'K02/K04 model selection is optional' -Quiet -ErrorAction SilentlyContinue) {
              $reason='GRAPH_IMPORT_REGRESSION'
            }
            Write-Host ('AGENT05_NODE_SUITE_FAILURE_CATEGORY='+$reason)
            throw 'AGENT05_DESKTOP_FULL_TESTS_FAILED'
          }
          Write-Host 'AGENT05_DESKTOP_FULL_TESTS_PASS'
      # Qualify only pinned private content; never publish source, installers, logs,
      # artifacts, caches, paths, model weights, or secrets from this runner.
