name: Activity and original Agent extraction
# Requested only for a consolidated candidate, not each source edit.
on:
  push:
    branches:
      - work/2026-11-24-activity-agent-extraction-qualification
      - work/2026-11-25-activity-grouped-qualification
    paths:
      - qualification/activity/agent-extraction-candidate.json
  workflow_dispatch:

permissions:
  contents: read
jobs:
  extraction:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PRIVATE_PIN: 40a3c47bbacb1b3c527d00243cd9010baa64604b
      PRIVATE_TREE: 75b94bf071838effd90160c2300b519b705b743d
      PUBLIC_PIN: 11e79d55f5da4d12165f534f3b981fe078be4bcb
      BASELINE_PIN: 57b701c6b7a1ede36dca70b2b0d2065b1ec577e0
      BASELINE_TREE: 5c4307bd83a81c9555d2f8c55309f42b2a05f50a
    steps:
      - uses: actions/checkout@v4
        with:
          path: center-public
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 40a3c47bbacb1b3c527d00243cd9010baa64604b
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          path: private-agent
          fetch-depth: 8
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 57b701c6b7a1ede36dca70b2b0d2065b1ec577e0
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          path: private-baseline
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 11e79d55f5da4d12165f534f3b981fe078be4bcb
          path: activity-public
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source identities
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((& git -C private-agent rev-parse HEAD).Trim() -cne $env:PRIVATE_PIN -or
             (& git -C private-agent rev-parse 'HEAD^{tree}').Trim() -cne $env:PRIVATE_TREE -or
             (& git -C private-baseline rev-parse HEAD).Trim() -cne $env:BASELINE_PIN -or
             (& git -C private-baseline rev-parse 'HEAD^{tree}').Trim() -cne $env:BASELINE_TREE -or
             (& git -C activity-public rev-parse HEAD).Trim() -cne $env:PUBLIC_PIN){
            throw 'SOURCE_PIN_MISMATCH'
          }
          Write-Host 'SOURCE_PIN=PASS'
      - name: Original Core source tests and public Activity parity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $env:IWXA_ACTIVITY_PUBLIC_ROOT=(Resolve-Path activity-public).Path
          $env:IWXA_ACTIVITY_PERSONAL_PACKAGE=(Resolve-Path center-public/qualification/activity/personal-technology.iwxa).Path
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $env:IWXA_ACTIVITY_PERSONAL_PACKAGE).Hash.ToLowerInvariant() -cne 'f410d2850749f90433350f1342a22f2b2737c693942c85aae0233463f8a52b5a'){throw 'ORIGINAL_PACKAGE_DIGEST_MISMATCH'}
          Write-Host 'ORIGINAL_PACKAGE_PIN=PASS'
          Push-Location private-agent
          try{
            $install=Join-Path $env:RUNNER_TEMP 'activity-private-pip.out'
            $log=Join-Path $env:RUNNER_TEMP 'activity-private-tests.out'
            python -m pip install -q -r requirements-ci.txt *> $install
            if($LASTEXITCODE -ne 0){throw 'PYTHON_INSTALL_FAILED'}
            Write-Host 'PYTHON_INSTALL=PASS'
            python -m pytest -q --tb=short tests/test_activity_routine_source.py tests/test_activity_personal_extraction.py tests/test_activity_technology_consumer.py tests/test_activity_d05_extraction.py *> $log
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $log -Raw
            $last=($raw -split '\r?\n' | Where-Object {$_ -match '[0-9]+ (passed|failed|skipped|errors?)\b' -and $_ -match ' in [0-9.]+s'} | Select-Object -Last 1)
            foreach($key in @('passed','failed','skipped','errors')){
              if($last){$match=[regex]::Match($last,'\b([0-9]+) '+$key+'\b');if($match.Success){Write-Host ('PYTHON_'+$key.ToUpperInvariant()+'='+$match.Groups[1].Value)}}
            }
            foreach($m in [regex]::Matches($raw,'(?m)^FAILED tests/(test_activity_(?:routine_source|personal_extraction|technology_consumer|d05_extraction)\.py)::([A-Za-z0-9_]+)')){
              Write-Host ('FAILED_TEST='+$m.Groups[1].Value+'::'+$m.Groups[2].Value)
            }
            foreach($m in [regex]::Matches($raw,'(?m)^((?:runtime/activity_[a-z_]+|tests/test_activity_[a-z_]+)\.py):(\d+): ([A-Za-z]+Error)\b')){
              Write-Host ('FAILURE_LOCATION='+$m.Groups[1].Value+':'+$m.Groups[2].Value+':'+$m.Groups[3].Value)
            }
            foreach($code in @('activity_cross_runtime_request_failed','activity_cross_runtime_review_failed','activity_cross_runtime_document_mismatch','activity_cross_runtime_digest_mismatch','activity_extraction_selection_unavailable','activity_extraction_acceptance_unverified','activity_extraction_task_scope_changed','activity_extraction_source_content_limit','activity_extraction_source_empty','activity_d05_public_request_failed','activity_d05_public_review_failed','activity_d05_request_changed','activity_d05_local_area_required','activity_d05_human_acceptance_required')){
              if($raw.Contains($code)){Write-Host ('DIAGNOSTIC='+$code)}
            }
            # Only known code file aliases, line numbers and error types.
            foreach($m in [regex]::Matches($raw,'(?m)(test_activity_(?:routine_source|personal_extraction|technology_consumer|d05_extraction)\.py|activity_(?:routine_source|personal_extraction|technology_consumer|d05_extraction)\.py):(\d+):')){
              Write-Host ('TRACE_LINE='+$m.Groups[1].Value+':'+$m.Groups[2].Value)
            }
            foreach($m in [regex]::Matches($raw,'(?m)^\s*E\s+([A-Za-z]+Error)\b')){
              Write-Host ('EXCEPTION_TYPE='+$m.Groups[1].Value)
            }
            foreach($m in [regex]::Matches($raw,'(?m)^\s*E\s+(?:ValueError|AssertionError|KeyError):\s*(activity_[a-z_]{1,100})\b')){
              Write-Host ('FIXED_ACTIVITY_CODE='+$m.Groups[1].Value)
            }
            Write-Host ('ORIGINAL_CORE_EXTRACTION='+$(if($exit -eq 0){'PASS'}else{'FAIL'}))
            if($exit -ne 0){throw 'ORIGINAL_CORE_EXTRACTION_FAILED'}
          }finally{Pop-Location}
      - name: Existing desktop build and regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          Push-Location private-agent/desktop
          try{
            $install=Join-Path $env:RUNNER_TEMP 'activity-private-npm.out'
            $build=Join-Path $env:RUNNER_TEMP 'activity-private-build.out'
            $tests=Join-Path $env:RUNNER_TEMP 'activity-private-node.out'
            npm ci --no-audit --no-fund *> $install
            if($LASTEXITCODE -ne 0){throw 'NPM_INSTALL_FAILED'}
            Write-Host 'NPM_INSTALL=PASS'
            npm run build *> $build
            $buildExit=$LASTEXITCODE
            Write-Host ('BUILD='+$(if($buildExit -eq 0){'PASS'}else{'FAIL'}))
            $raw=Get-Content -LiteralPath $build -Raw
            foreach($m in [regex]::Matches($raw,'(?m)(activity-routine-extraction|activity-technology-import|activity-d05-extraction|automations-control|work-areas-control)\.tsx\((\d+),(\d+)\): error (TS\d+)')){
              Write-Host ('BUILD_DIAGNOSTIC='+$m.Groups[1].Value+':'+$m.Groups[2].Value+':'+$m.Groups[3].Value+':'+$m.Groups[4].Value)
            }
            node --test --test-reporter=tap *> $tests
            $testExit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $tests -Raw
            foreach($key in @('tests','pass','fail','cancelled','skipped','todo')){
              $m=[regex]::Match($raw,'(?m)^# '+$key+' (\d+)\s*$')
              if($m.Success){Write-Host ('NODE_'+$key.ToUpperInvariant()+'='+$m.Groups[1].Value)}
            }
            foreach($m in [regex]::Matches($raw,'(?m)^not ok (\d+) - ')){Write-Host ('FAILED_TEST_INDEX='+$m.Groups[1].Value)}
            Write-Host ('NODE_SUITE='+$(if($testExit -eq 0){'PASS'}else{'FAIL'}))
            if($testExit -ne 0){
              $baseline=Join-Path $env:RUNNER_TEMP 'activity-private-baseline-node.out'
              $baseInstall=Join-Path $env:RUNNER_TEMP 'activity-private-baseline-install.out'
              Push-Location (Join-Path $env:GITHUB_WORKSPACE 'private-baseline/desktop')
              try{
                if(((& git rev-parse HEAD).Trim() -cne $env:BASELINE_PIN)){throw 'BASELINE_PIN_UNAVAILABLE'}
                npm ci --no-audit --no-fund *> $baseInstall
                if($LASTEXITCODE -ne 0){throw 'BASELINE_NPM_INSTALL_FAILED'}
                node --test --test-reporter=tap *> $baseline
                $baseExit=$LASTEXITCODE
              }finally{Pop-Location}
              $baseRaw=Get-Content -LiteralPath $baseline -Raw
              $currentNames=@([regex]::Matches($raw,'(?m)^not ok \d+ - ([^\r\n]+)') | ForEach-Object {$_.Groups[1].Value})
              $baseNames=@([regex]::Matches($baseRaw,'(?m)^not ok \d+ - ([^\r\n]+)') | ForEach-Object {$_.Groups[1].Value})
              Write-Host ('BASELINE_NODE_FAILED='+$baseNames.Count)
              $new=@($currentNames | Where-Object {$_ -cnotin $baseNames})
              $resolved=@($baseNames | Where-Object {$_ -cnotin $currentNames})
              Write-Host ('NEW_NODE_FAILURES='+$new.Count)
              Write-Host ('RESOLVED_NODE_FAILURES='+$resolved.Count)
              if($baseExit -ne 0 -and $baseNames.Count -eq 0){throw 'BASELINE_TEST_OUTCOME_UNAVAILABLE'}
            }
            if($buildExit -ne 0 -or $testExit -ne 0){throw 'DESKTOP_QUALIFICATION_FAILED'}
          }finally{Pop-Location}
      - name: Remove private source and temporary logs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'private-agent') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'private-baseline') -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'activity-private-*' -Force | Remove-Item -Force -ErrorAction SilentlyContinue
