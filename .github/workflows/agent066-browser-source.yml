name: Agent 0.6.6 shared browser source build and Core integration
on:
  push:
    branches:
      - 'ci/once/agent066-browser-source/*'
    paths:
      - '.github/ci-requests/agent066-browser-source.json'
permissions:
  contents: read
concurrency:
  group: iwxa-agent066-browser-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    strategy:
      fail-fast: false
      matrix:
        group: [core, desktop-source, bundle]
    name: qualify / ${{ matrix.group }}
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PRIVATE_PIN: '3184ac6e3286ebb7f6f304137a3c9ccf73a1cc3e'
      PRIVATE_TREE: '6e1215df963f51f80748af0b70d276a5483cea66'
      QUALIFICATION_GROUP: ${{ matrix.group }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Checkout public admission only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-time request before private access
        shell: bash
        run: |
          python .ci/agent066-browser-source/test_bundle_evidence.py
          python .ci/agent066-browser-source/admit.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ matrix.group == 'desktop-source' }}
        with:
          node-version: '22.16.0'
      - name: Grouped source verification on temporary private checkout
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python .ci/agent066-browser-source/run.py
