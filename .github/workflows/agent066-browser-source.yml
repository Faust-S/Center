name: Agent 0.6.6 remaining native browser development only
on:
  push:
    branches:
      - 'ci/once/agent066-browser-source/*'
    paths:
      - '.github/ci-requests/agent066-browser-source.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: iwxa-agent066-browser-qualification
  cancel-in-progress: false
jobs:
  qualify:
    name: development / files and AI actions
    if: ${{ github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      PRIVATE_PIN: 'fdc0a706f822fcfc624f12b23094e80cfa186c83'
      PRIVATE_TREE: '50bfd8fe63f2f397fd1d8d587cb34c1fc07fe035'
      BASELINE_PIN: '68128b4c9a2c7140ec3503ff0f775e5bcb50743e'
      BASELINE_TREE: '73c17aa7fcdbe5182f278a2fe49eb3d8c93294e2'
      WITNESS_PIN: '6c22834aaa85fd3e4528aa4877fd4a91dcdca27b'
      WITNESS_TREE: '129acce920b5988478c5eb8cc7c266440016d419'
      QUALIFICATION_GROUP: upgrade
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Checkout public admission only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-time request before private access
        shell: bash
        run: |
          python .ci/agent066-browser-source/test_reuse_evidence.py
          python .ci/agent066-browser-source/test_installed_evidence.py
          python .ci/agent066-browser-source/admit.py
      - name: Verify five previous groups and exact encrypted candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .ci/agent066-browser-source/reuse_evidence.py prior
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build candidate once and test remaining installed browser routes
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python .ci/agent066-browser-source/run.py
