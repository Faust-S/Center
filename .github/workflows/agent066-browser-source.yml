name: Agent 0.6.6 full native browser and frozen baseline upgrade
on:
  push:
    branches:
      - 'ci/once/agent066-browser-source/*'
    paths:
      - '.github/ci-requests/agent066-browser-source.json'
permissions:
  contents: read
concurrency:
  group: iwxa-agent066-browser-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            os: windows-2022
          - group: ocr
            os: ubuntu-24.04
          - group: desktop-source
            os: windows-2022
          - group: bundle
            os: windows-2022
          - group: desktop
            os: windows-2022
          - group: upgrade
            os: windows-2022
    name: qualify / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      PRIVATE_PIN: '4967c93200a607679b4db812caa732ea85c944fe'
      PRIVATE_TREE: '293ebb7b3b0abb7eff25024bc7f453ff7de58953'
      BASELINE_PIN: '68128b4c9a2c7140ec3503ff0f775e5bcb50743e'
      BASELINE_TREE: '73c17aa7fcdbe5182f278a2fe49eb3d8c93294e2'
      QUALIFICATION_GROUP: ${{ matrix.group }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Checkout public admission only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-time request before private access
        shell: bash
        run: |
          python .ci/agent066-browser-source/test_bundle_evidence.py
          python .ci/agent066-browser-source/test_installed_evidence.py
          python .ci/agent066-browser-source/admit.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ matrix.group == 'desktop-source' || matrix.group == 'desktop' || matrix.group == 'upgrade' }}
        with:
          node-version: '22.16.0'
      - uses: actions/setup-dotnet@v4
        if: ${{ matrix.group == 'desktop' || matrix.group == 'upgrade' }}
        with:
          dotnet-version: '8.0.x'
      - name: Prepare existing owner encryption
        if: ${{ matrix.group == 'desktop' }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir cryptography==46.0.4
          python .ci/agent066-browser-source/test_delivery.py
      - name: Grouped verification on temporary private checkout
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python .ci/agent066-browser-source/run.py
      - name: Preserve encrypted clean-installed candidate
        if: ${{ matrix.group == 'desktop' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: IWXA-Agent-0.6.6-clean-candidate-4967c932-encrypted
          path: ${{ runner.temp }}/iwxa-agent066-delivery-cipher/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  delivery:
    name: delivery / qualified owner package
    needs: qualify
    if: ${{ needs.qualify.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare envelope verification
        run: python -m pip install --disable-pip-version-check --no-cache-dir cryptography==46.0.4
      - uses: actions/download-artifact@v4
        with:
          name: IWXA-Agent-0.6.6-clean-candidate-4967c932-encrypted
          path: owner-delivery
      - name: Verify the same encrypted installer after all six groups
        run: python .ci/agent066-browser-source/delivery.py owner-delivery
      - name: Publish qualified encrypted owner package
        uses: actions/upload-artifact@v4
        with:
          name: IWXA-Agent-0.6.6-qualified-4967c932-encrypted
          path: owner-delivery/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
