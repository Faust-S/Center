name: Agent 0.6.6 targeted installed browser and upgrade
on:
  push:
    branches:
      - 'ci/once/agent066-browser-source/*'
    paths:
      - '.github/ci-requests/agent066-browser-source.json'
permissions:
  contents: read
concurrency:
  group: iwxa-agent066-browser-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: upgrade
            os: windows-2022
    name: qualify / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      PRIVATE_PIN: 'a107b3a3a056694c31986f0885b3684ed3aa7cb5'
      PRIVATE_TREE: '1bb73b8ed7cefaec60e3f7ba40b806d805b475b9'
      BASELINE_PIN: '68128b4c9a2c7140ec3503ff0f775e5bcb50743e'
      BASELINE_TREE: '73c17aa7fcdbe5182f278a2fe49eb3d8c93294e2'
      QUALIFICATION_GROUP: ${{ matrix.group }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Checkout public admission only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-time request before private access
        shell: bash
        run: |
          python .ci/agent066-browser-source/test_bundle_evidence.py
          python .ci/agent066-browser-source/test_installed_evidence.py
          python .ci/agent066-browser-source/admit.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ matrix.group == 'desktop-source' || matrix.group == 'desktop' || matrix.group == 'upgrade' }}
        with:
          node-version: '22.16.0'
      - uses: actions/setup-dotnet@v4
        if: ${{ matrix.group == 'desktop' || matrix.group == 'upgrade' }}
        with:
          dotnet-version: '8.0.x'
      - name: Grouped verification on temporary private checkout
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python .ci/agent066-browser-source/run.py
