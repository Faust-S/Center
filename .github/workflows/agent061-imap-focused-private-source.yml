name: Agent061 focused live IMAP read qualification
on:
  push:
    branches:
      - work/2026-11-22-agent061-imap-focused-windows
permissions:
  contents: read
concurrency:
  group: agent061-focused-imap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-imap-read:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      AGENT061_SOURCE_PIN: '6baccf1dc91ed4eb7b9b2f61c402ad0b14e57296'
      IWXA_RUN_ETHEREAL_LIVE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require preauthorized read-only source access
        shell: pwsh
        env:
          READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:READ_TOKEN)){
            throw 'AGENT061_SOURCE_ACCESS_MISSING'
          }
          Write-Host 'AGENT061_SOURCE_ACCESS_PRESENT'
      - name: Checkout pinned original Agent
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT061_SOURCE_PIN }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify real two-account IMAP read on original Core
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $actual=(& git -C private-agent rev-parse HEAD).Trim()
          if($actual -cne $env:AGENT061_SOURCE_PIN){
            throw 'AGENT061_SOURCE_PIN_MISMATCH'
          }
          Write-Host ('AGENT061_SOURCE_SHA='+$actual)
          $deps=Join-Path $env:RUNNER_TEMP 'agent061-imap-dependencies.private.log'
          $log=Join-Path $env:RUNNER_TEMP 'agent061-imap.private.log'
          $xml=Join-Path $env:RUNNER_TEMP 'agent061-imap.private.xml'
          try{
            & python -m pip install -r private-agent/requirements-ci.txt *> $deps
            if($LASTEXITCODE -ne 0){throw 'AGENT061_DEPENDENCY_INSTALL_FAILED'}
            Write-Host 'AGENT061_DEPENDENCIES_PASS'
            $offline=Join-Path $env:RUNNER_TEMP 'agent061-imap-unit.private.log'
            $offlineXml=Join-Path $env:RUNNER_TEMP 'agent061-imap-unit.private.xml'
            Push-Location private-agent
            try{
              & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$offlineXml) tests/test_agent061_imap_search_confirmation.py *> $offline
              $unitRc=$LASTEXITCODE
              if(Test-Path -LiteralPath $offlineXml){
                [xml]$unit=Get-Content -LiteralPath $offlineXml -Raw
                $usuite=$unit.testsuites.testsuite
                if($null -eq $usuite){$usuite=$unit.testsuite}
                Write-Host ('AGENT061_IMAP_SOURCE_TESTS='+[int]$usuite.tests)
                Write-Host ('AGENT061_IMAP_SOURCE_FAILURES='+[int]$usuite.failures)
                $allow=@(
                  'test_search_does_not_return_remote_false_positive',
                  'test_negative_search_returns_no_message_even_when_server_returns_all',
                  'test_unverifiable_oversize_candidate_is_never_returned',
                  'test_search_rejects_malformed_server_uid',
                  'test_unfiltered_search_remains_available_without_fetching_mail_bodies'
                )
                foreach($case in @($unit.SelectNodes('//testcase'))){
                  if($case.SelectSingleNode('failure') -or $case.SelectSingleNode('error')){
                    if([string]$case.name -cin $allow){
                      Write-Host ('AGENT061_IMAP_SOURCE_FAILED_CASE='+[string]$case.name)
                    }
                  }
                }
              }
              if($unitRc -ne 0){throw 'AGENT061_IMAP_CONFIRMED_SEARCH_UNIT_FAILED'}
              Write-Host 'AGENT061_IMAP_CONFIRMED_SEARCH_UNIT_PASS'
            }finally{Pop-Location}
            Push-Location private-agent
            try{
              & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$xml) 'tests/test_agent06_ethereal_live.py::test_real_ethereal_two_accounts_review_and_cold_readback' *> $log
              $rc=$LASTEXITCODE
            }finally{Pop-Location}
            if(Test-Path -LiteralPath $xml){
              [xml]$d=Get-Content -LiteralPath $xml -Raw
              $suite=$d.testsuites.testsuite
              if($null -eq $suite){$suite=$d.testsuite}
              Write-Host ('AGENT061_REAL_IMAP_TESTS='+[int]$suite.tests)
              Write-Host ('AGENT061_REAL_IMAP_FAILURES='+[int]$suite.failures)
              $allowed=@(
                'ethereal_full_ACCOUNT_SETUP_failed','ethereal_full_CONFIGURE_failed',
                'ethereal_full_VERIFY_failed','ethereal_full_SEND_failed',
                'ethereal_full_READ_SEARCH_ALPHA_failed','ethereal_full_READ_SEARCH_BETA_failed',
                'ethereal_full_READ_FULL_ALPHA_failed','ethereal_full_READ_FULL_BETA_failed',
                'ethereal_full_READ_ISOLATION_ALPHA_failed','ethereal_full_READ_ISOLATION_BETA_failed',
                'ethereal_full_READ_ISOLATION_QUERY_ALPHA_failed','ethereal_full_READ_ISOLATION_QUERY_BETA_failed',
                'ethereal_full_READ_ISOLATION_RESULT_ALPHA_failed','ethereal_full_READ_ISOLATION_RESULT_BETA_failed',
                'ethereal_agent_search_exclusion_disagrees_with_direct_imap',
                'ethereal_direct_imap_other_marker_present','ethereal_remote_imap_text_search_overmatches',
                'ethereal_direct_imap_select_failed','ethereal_direct_imap_search_failed',
                'ethereal_direct_imap_fetch_failed','ethereal_direct_imap_isolation_probe_failed',
                'ethereal_full_COLD_failed','ethereal_full_SECRETS_failed',
                'ethereal_sent_message_missing_from_own_mailbox',
                'ethereal_imap_tls_or_connect_failed','ethereal_imap_login_failed',
                'ethereal_imap_noop_failed','ethereal_imap_noop_not_ok'
              )
              foreach($case in @($d.SelectNodes('//testcase'))){
                $failed=$case.SelectSingleNode('failure')
                if($null -eq $failed){$failed=$case.SelectSingleNode('error')}
                if($null -eq $failed){continue}
                $message=[string]$failed.GetAttribute('message')
                $code='OTHER'
                foreach($one in $allowed){
                  if($message.Contains($one)){$code=$one;break}
                }
                Write-Host ('AGENT061_REAL_IMAP_FAILURE_STAGE='+$code)
              }
            }
            if($rc -ne 0){throw 'AGENT061_REAL_IMAP_READ_FAILED'}
            Write-Host 'AGENT061_REAL_IMAP_READ_PASS'
          }finally{
            foreach($p in @($deps,$log,$xml,$offline,$offlineXml)){
              if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Force}
            }
          }
