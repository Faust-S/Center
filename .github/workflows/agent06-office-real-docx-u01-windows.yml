# Real installed LibreOffice is an independent reader of the reviewed DOCX
# created by Agent Core. This is not the installed Agent GUI acceptance.
name: Agent 0.6 Office real DOCX U01 readback Windows
on:
  push:
    branches: ['work/2026-11-15-agent06-office-source-qualification']
    paths: ['.github/workflows/agent06-office-real-docx-u01-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-office-real-docx-u01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reviewed-docx-and-real-office:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      AGENT_OFFICE_SHA: '69bd38383ce4f88b78ec27970354f036df876d2d'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require scoped private read-only source
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_REAL_DOCX_SOURCE_NOT_AVAILABLE'
          }
          Write-Host 'AGENT06_REAL_DOCX_SOURCE_READ_ONLY_AVAILABLE'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT_OFFICE_SHA }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source pin and synthetic test syntax
        shell: pwsh
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne $env:AGENT_OFFICE_SHA){throw 'AGENT06_REAL_DOCX_SOURCE_MISMATCH'}
          & python -B -c "import ast,pathlib; ast.parse(pathlib.Path('private-agent/tests/test_agent06_office_real_docx_u01_e2e.py').read_text(encoding='utf-8'))"
          if($LASTEXITCODE -ne 0){throw 'AGENT06_REAL_DOCX_TEST_SYNTAX_INVALID'}
          Write-Host 'AGENT06_REAL_DOCX_SOURCE_SYNTAX_PASS'
      - name: Install original Core dependencies
        shell: pwsh
        timeout-minutes: 10
        run: |
          & python -m pip install -r private-agent/requirements.txt python-docx pypdf pytest *> (Join-Path $env:RUNNER_TEMP 'agent06-real-docx-python-private.txt')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_REAL_DOCX_DEPENDENCIES_FAIL'}
          Write-Host 'AGENT06_REAL_DOCX_PYTHON_DEPENDENCIES_PASS'
      - name: Verify isolated U01 PDF output and profile contract
        shell: pwsh
        timeout-minutes: 4
        run: |
          Push-Location private-agent
          try{
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_u01_pdf_staging_windows_regression.py *> (Join-Path $env:RUNNER_TEMP 'agent06-u01-staging-regression-private.txt')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_U01_PDF_STAGING_REGRESSION_FAIL'}
            Write-Host 'AGENT06_U01_PDF_STAGING_REGRESSION_PASS'
          }finally{Pop-Location}
      - name: Install real LibreOffice Windows CLI
        shell: pwsh
        timeout-minutes: 23
        run: |
          & choco.exe install libreoffice-fresh --yes --no-progress *> (Join-Path $env:RUNNER_TEMP 'agent06-real-docx-libreoffice-private.txt')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_REAL_DOCX_LIBREOFFICE_INSTALL_FAIL'}
          $exe=Join-Path $env:ProgramFiles 'LibreOffice/program/soffice.com'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf)){
            throw 'AGENT06_REAL_DOCX_LIBREOFFICE_CLI_MISSING'
          }
          Write-Host 'AGENT06_REAL_DOCX_LIBREOFFICE_CLI_INSTALLED_PASS'
      - name: Verify real original DOCX with short U01 CLI profile and output
        shell: pwsh
        timeout-minutes: 4
        run: |
          Push-Location private-agent
          try{
            $private=Join-Path $env:RUNNER_TEMP 'agent06-u01-shallow-private.txt'
            & python -B -m pytest -q -s -p no:cacheprovider -k test_original_filename_shallow_u01_output_location_once tests/test_agent06_office_u01_cli_probe.py *> $private
            $log=Get-Content -LiteralPath $private -Raw
            foreach($cls in @('SOURCE_LOAD_ERROR','EMPTY','OTHER')){
              if($log.Contains('AGENT06_U01_SHALLOW_STDOUT='+$cls)){
                Write-Host ('AGENT06_REAL_DOCX_SHALLOW_STDOUT_CLASS='+$cls)
              }
            }
            foreach($code in @('CONNECT_FAILED','NO_ACK','NO_PDF_12S')){
              if($log.Contains('U01_ORIGINAL_SHALLOW_'+$code)){
                Write-Host ('AGENT06_REAL_DOCX_SHALLOW_ERROR_CLASS='+$code)
              }
            }
            if($LASTEXITCODE -ne 0){throw 'AGENT06_REAL_DOCX_SHALLOW_U01_HOLD'}
            if($log.Contains('AGENT06_U01_SHALLOW_OUTPUT=IMMEDIATE_PASS')){
              Write-Host 'AGENT06_REAL_DOCX_SHALLOW_U01_IMMEDIATE_PASS'
            }elseif($log.Contains('AGENT06_U01_SHALLOW_OUTPUT=DELAYED_PASS')){
              Write-Host 'AGENT06_REAL_DOCX_SHALLOW_U01_DELAYED_PASS'
            }else{throw 'AGENT06_REAL_DOCX_SHALLOW_U01_EVIDENCE_MISSING'}
          }finally{Pop-Location}
      - name: Observe one original U01 PDF conversion output location
        shell: pwsh
        timeout-minutes: 5
        run: |
          Push-Location private-agent
          try{
            $private=Join-Path $env:RUNNER_TEMP 'agent06-u01-converter-observe-private.txt'
            & python -B -m pytest -q -s -p no:cacheprovider -k test_original_u01_converter_actual_output_location_once tests/test_agent06_office_u01_cli_probe.py *> $private
            $log=Get-Content -LiteralPath $private -Raw
            foreach($cls in @('SOURCE_LOAD_ERROR','PARAMETERS_ERROR',
                'OTHER_ERROR','CONVERSION_REPORTED','EMPTY','OTHER')){
              if($log.Contains('AGENT06_U01_CONVERTER_STDOUT_CLASS='+$cls)){
                Write-Host ('AGENT06_REAL_DOCX_CONVERTER_STDOUT_CLASS='+$cls)
              }
            }
            foreach($outcome in @('IMMEDIATE','DELAYED','NO_ACK','OUTDIR_WRONG_NAME',
                'PARENT_DIR','SOURCE_DIR','CWD','NO_PDF_12S')){
              if($log.Contains('AGENT06_U01_CONVERTER_LOCATION='+$outcome)){
                Write-Host ('AGENT06_REAL_DOCX_CONVERTER_LOCATION='+$outcome)
              }
            }
            if($LASTEXITCODE -ne 0){throw 'AGENT06_REAL_DOCX_U01_LOCATION_PROBE_HOLD'}
            Write-Host 'AGENT06_REAL_DOCX_U01_LOCATION_PROBE_PASS'
          }finally{Pop-Location}
      - name: Original Core ToolRuntime DOCX review and real U01 LibreOffice readback
        shell: pwsh
        timeout-minutes: 9
        run: |
          Push-Location private-agent
          try{
            $log=Join-Path $env:RUNNER_TEMP 'agent06-real-docx-test-private.txt'
            & python -B -m pytest -q -s -p no:cacheprovider tests/test_agent06_office_real_docx_u01_e2e.py *> $log
            if($LASTEXITCODE -ne 0){
              $private=Get-Content -LiteralPath $log -Raw
              foreach($stage in @('DOCX_ACCEPTED','U01_ORIGINAL_RENDER',
                  'U01_REVISED_RENDER','U01_PDF_TEXT','PDF_TOOLRUNTIME_ACK',
                  'TWO_COLD_CORE')){
                if($private.Contains('IWXA_REAL_DOCX_STAGE='+$stage)){
                  Write-Host ('AGENT06_REAL_DOCX_VERIFIED_STAGE='+$stage)
                }
              }
              foreach($status in @('VERSION_UNVERIFIED','INSTALLATION_MISMATCH',
                  'NOT_FOUND','DISCOVERED','NOT_CONNECTED','CONNECTION_LOST',
                  'EXECUTION_FAILED','EXECUTION_TIMEOUT','OTHER_STATUS')){
                if($private.Contains('REAL_U01_LIBREOFFICE_CONNECT_STATUS_'+$status)){
                  Write-Host ('AGENT06_REAL_DOCX_U01_CONNECTION_OUTCOME='+$status)
                }
              }
              foreach($status in @('U01_CONVERSION_NOT_ACKNOWLEDGED',
                  'PDF_OUTPUT_MISSING_OR_LARGE','PDF_OUTPUT_INVALID',
                  'SOURCE_CHANGED_DURING_CONVERSION','OTHER')){
                if($private.Contains('REAL_U01_ORIGINAL_CONVERSION_STATUS_'+$status)){
                  Write-Host ('AGENT06_REAL_DOCX_ORIGINAL_U01_CONVERSION_OUTCOME='+$status)
                }
              }
              foreach($status in @('U01_CONVERSION_NOT_ACKNOWLEDGED',
                  'PDF_OUTPUT_MISSING_OR_LARGE','PDF_OUTPUT_INVALID',
                  'SOURCE_CHANGED_DURING_CONVERSION','SOURCE_REVISION_CHANGED',
                  'STAGING_ROOT_UNAVAILABLE','U01_CONNECTION_REQUIRED',
                  'PDF_SOURCE_FORMAT_UNSUPPORTED','OTHER')){
                if($private.Contains('REAL_U01_PDF_CONVERSION_STATUS_'+$status)){
                  Write-Host ('AGENT06_REAL_DOCX_U01_PDF_CONVERSION_OUTCOME='+$status)
                }
              }
              foreach($code in @('REAL_U01_LIBREOFFICE_NOT_INSTALLED',
                  'REAL_U01_LIBREOFFICE_CONNECT_FAILED',
                  'U01_CONVERSION_NOT_ACKNOWLEDGED','PDF_OUTPUT_MISSING_OR_LARGE',
                  'PDF_OUTPUT_INVALID','SOURCE_CHANGED_DURING_CONVERSION',
                  'REAL_OFFICE_TWO_COLD_CORE_READBACK_FAILED',
                  'DOCX_BODY_UNSUPPORTED','DOCX_OUTPUT_READBACK_FAILED',
                  'AssertionError','ProgramError','DocumentOperationError',
                  'FileNotFoundError','PermissionError','ValueError','TypeError')){
                if($private.Contains($code)){
                  Write-Host ('AGENT06_REAL_DOCX_FAILURE_CLASS='+$code)
                }
              }
              throw 'AGENT06_REAL_DOCX_NATIVE_TOOLRUNTIME_U01_E2E_HOLD'
            }
            Write-Host 'AGENT06_REAL_DOCX_REVIEWED_NATIVE_WRITER_U01_PDF_TWO_COLD_PASS'
          }finally{Pop-Location}
      # Intentionally no upload-artifact, caches, screenshots, source,
      # executable, generated DOCX/PDF or private logs in this public run.
