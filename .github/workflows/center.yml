          }
          if ($r.status -cne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or $r.source_commit -cne $fixed -or
              $r.product_version -cne '0.5.0' -or
              $r.native_real_upgrade_04_to_05_accepted -ne $true -or
              $r.gui_task_result_full_acceptance -cne 'PASS' -or
              $r.gui_task_cold_independent_import -cne 'PASS' -or $r.model_result_transport_verified -cne 'PASS') {
            throw 'PRIVATE_RELEASE_WINDOWS_ACCEPTANCE_UNVERIFIED'
          }
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item -LiteralPath $setup).Length
          if ($bytes -lt 1000000 -or $digest -cnotmatch '^[0-9a-f]{64}$') { throw 'PRIVATE_RELEASE_BINARY_INVALID' }
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) { throw 'PRIVATE_RELEASE_GH_CLI_MISSING' }
          $privateLog=Join-Path $env:RUNNER_TEMP 'private-gh-release.log'
          & gh release view $tag --repo $repo --json tagName *> $privateLog
          if ($LASTEXITCODE -eq 0) { throw 'PRIVATE_RELEASE_TAG_EXISTS_NO_OVERWRITE' }
          $assetName='IWXA-Personal-Agent-0.5.0-Setup.exe'
          $sums=Join-Path $env:RUNNER_TEMP 'agent05-release-SHA256SUMS.txt'
          ($digest+'  '+$assetName) | Set-Content -LiteralPath $sums -Encoding ascii
          $notes=Join-Path $env:RUNNER_TEMP 'agent05-release-notes.md'
          @(
            'IWXA Personal Agent 0.5.0 for Windows. Full installed acceptance PASS.'
            ('Exact source SHA: '+$fixed)
            ('Installer SHA-256: '+$digest)
            ('Center Windows acceptance run: '+$env:GITHUB_RUN_ID)
            'Verified: actual upgrade from published 0.4.0 to 0.5.0 preserving data and shortcuts; native cold start; local model Task, Human Review, Result, K03, independent .iwxa import.'
            'Model choice and reasoning effort remain user preferences; no subjective answer-quality gate.'
            'Private release asset only; public Center artifacts remain empty.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag ($setup+'#'+$assetName) ($sums+'#SHA256SUMS.txt') --repo $repo --target $fixed --title 'IWXA Personal Agent 0.5.0' --notes-file $notes --draft *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_DRAFT_UPLOAD_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft,targetCommitish,assets 2>$privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_READBACK_FAILED' }
          $published=$raw | ConvertFrom-Json
          $installer=@($published.assets | Where-Object { $_.name -ceq $assetName })
          $checksums=@($published.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
          if ($published.tagName -cne $tag -or !$published.isDraft -or $published.targetCommitish -cne $fixed -or
              $installer.Count -ne 1 -or [int64]$installer[0].size -ne $bytes -or $checksums.Count -ne 1) {
            throw 'PRIVATE_RELEASE_ASSET_READBACK_MISMATCH'
          }
          # Re-download both private release assets and compare actual bytes
          # with the verified local Windows product before publishing.
          $readbackDir=Join-Path $env:RUNNER_TEMP 'agent05-private-release-readback'
          New-Item -Path $readbackDir -ItemType Directory -Force | Out-Null
          & gh release download $tag --repo $repo --pattern $assetName --dir $readbackDir --clobber *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_BINARY_REDOWNLOAD_FAILED' }
          $readbackExe=Join-Path $readbackDir $assetName
          if (!(Test-Path -LiteralPath $readbackExe -PathType Leaf) -or
              (Get-Item -LiteralPath $readbackExe).Length -ne $bytes -or
              (Get-FileHash -LiteralPath $readbackExe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) {
            throw 'PRIVATE_RELEASE_BINARY_REDOWNLOAD_MISMATCH'
          }
          & gh release download $tag --repo $repo --pattern SHA256SUMS.txt --dir $readbackDir --clobber *> $privateLog
          if ($LASTEXITCODE -ne 0 -or
              !(Test-Path -LiteralPath (Join-Path $readbackDir 'SHA256SUMS.txt') -PathType Leaf) -or
              [IO.File]::ReadAllText((Join-Path $readbackDir 'SHA256SUMS.txt')).Trim() -cne ($digest+'  '+$assetName)) {
            throw 'PRIVATE_RELEASE_CHECKSUM_REDOWNLOAD_MISMATCH'
          }
          & gh release edit $tag --repo $repo --draft=false *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_PUBLISH_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft 2>$privateLog
          if ($LASTEXITCODE -ne 0 -or ($raw | ConvertFrom-Json).isDraft -ne $false) {
            throw 'PRIVATE_RELEASE_FINAL_READBACK_MISSING'
          }
          Write-Host 'PRIVATE_RELEASE_PRIVATE_REPO_UPLOAD=PASS'
          Write-Host ('PRIVATE_RELEASE_SETUP_SHA256='+$digest)
          Write-Host 'PRIVATE_RELEASE_ASSET_COUNT=2'
          Write-Host 'PRIVATE_RELEASE_VISIBILITY=PRIVATE'
 -and
                       $Matches[1] -cin @('k03_host_select_http_failed',
                           'setup_core_k03_owner_selection_not_verified','OTHER')){
                  Write-Host ('PRIVATE_INSTALLED_K03_FAILURE='+$Matches[1])
                }elseif([string]$line -cmatch '^AGENT_K03_SELECTION_HTTP_STATUS=(400|401|403|409|500|503|0)
            }
            # The GUI witness uses one additional private status file.
            $guiStatus=Join-Path $out 'native-candidate/temporary-installed-fixture/native-gui-qwen.status'
            if(Test-Path -LiteralPath $guiStatus -PathType Leaf){
              $safeGuiMarkers=@('AGENT_REAL_QWEN_GUI_TASK_RESULT_PASS',
                                'AGENT_REAL_QWEN_GUI_SUBMIT_REVIEW_ACCEPTED_PASS',
                                'AGENT_REAL_QWEN_GUI_COLD_INDEPENDENT_IMPORT_PASS')
              foreach($line in [IO.File]::ReadLines($guiStatus)){
                if([string]$line -cin $safeGuiMarkers){
                  Write-Host ('PRIVATE_INSTALLED_GUI_CHECKPOINT='+[string]$line)
                }
              }
            }
            $raw=if(Test-Path -LiteralPath $err){Get-Content -LiteralPath $err -Raw}else{''}
            $code=[regex]::Match($raw,'(full_qualification_[a-z0-9_-]+|PRIVATE_SETUP_CORE_BUILD_FAIL|private_setup_[a-z0-9_-]+)')
            if($code.Success){Write-Host ('PRIVATE_QUALIFICATION_STAGE='+$code.Value)}
            else{Write-Host 'PRIVATE_QUALIFICATION_STAGE=UNCLASSIFIED'}
            if($raw -match 'full_qualification_step_failed_native-install-and-function'){
              $nativeLogs=Join-Path $out 'native-candidate/logs'
              $stages=[ordered]@{
                native_stub='native-setup-build.json'
                managed_python='test-python-bootstrap.log'
                desktop_icon='native-desktop-icon.json'
                u04_fetch='u04-source-preparation.json'
                u04_stage='u04-stage.json'
                node_dependencies='native-desktop-dependencies.log'
                tauri_build='native-desktop-build.log'
                payload='package-build-only.json'
                setup_resource='private-setup-core-build.json'
                installed_acceptance='public-test-local-result.txt'
              }
              foreach($stage in $stages.Keys){
                if(Test-Path -LiteralPath (Join-Path $nativeLogs $stages[$stage]) -PathType Leaf){
                  Write-Host ('PRIVATE_NATIVE_ATTEMPTED_STAGE='+$stage)
                }
              }
              $logPaths=@(
                (Join-Path $out 'evidence/native-install-and-function.stderr.log'),
                (Join-Path $out 'evidence/native-install-and-function.stdout.log'),
                (Join-Path $nativeLogs 'test-python-bootstrap.log'),
                (Join-Path $nativeLogs 'native-desktop-build.log'),
                (Join-Path $nativeLogs 'native-desktop-build.log.stderr'),
                (Join-Path $nativeLogs 'native-desktop-build.log.stderr'),
                (Join-Path $nativeLogs 'native-desktop-dependencies.log.stderr'),
                (Join-Path $nativeLogs 'package-build-only.json'),
                (Join-Path $nativeLogs 'private-setup-core-build.json'),
                (Join-Path $nativeLogs 'public-test-local-result.txt')
              )
              $codes=New-Object 'System.Collections.Generic.HashSet[string]'
              $classes=New-Object 'System.Collections.Generic.HashSet[string]'
              $setupNativeActions=New-Object 'System.Collections.Generic.HashSet[string]'
              $setupNativeReasons=New-Object 'System.Collections.Generic.HashSet[string]'
              foreach($lp in $logPaths){
                if(!(Test-Path -LiteralPath $lp -PathType Leaf)){continue}
                $scanned=0
                foreach($line in [IO.File]::ReadLines($lp)){
                  if(++$scanned -gt 30000){break}
                  if($line -match '\b((?:native_candidate|private_setup|agent_setup|full_qualification|windows_python|windows_runtime|windows_release)_[a-z0-9_]{3,90}|SETUP_LOCAL_[A-Z0-9_]{3,90})\b'){
                    $null=$codes.Add($Matches[1])
                  }
                  # A Setup Core native action may fail after creating its
                  # private JSON receipt. Emit only the explicit public CLI
                  # operation and an allowlisted Setup Core error identifier.
                  # Never print the native receipt, paths or exception text.
                  if($line -cmatch 'SETUP_LOCAL_NATIVE_FAILED_--(inspect|preflight|install-locations|verify-installed|locations|repair|confirm-upgrade|uninstall)-file_'){
                    $null=$setupNativeActions.Add($Matches[1].Replace('-','_').ToUpperInvariant())
                  }
                  if($line -cmatch 'SETUP_LOCAL_NATIVE_FAILED_--(?:inspect|preflight|install-locations|verify-installed|locations|repair|confirm-upgrade|uninstall)-file_(SETUP_[A-Z0-9_]{3,80})(?:\b|$)'){
                    $null=$setupNativeReasons.Add($Matches[1])
                  }
                  if($line -match 'error\[E\d{4}\]'){$null=$classes.Add('RUST_COMPILER')}
                  if($line -match 'error TS(\d{4})'){
                    $null=$classes.Add('TYPESCRIPT')
                    Write-Host ('PRIVATE_NATIVE_TS_CODE=TS'+$Matches[1])
                  }
                  if($line -match 'error\[E(\d{4})\]'){
                    $null=$classes.Add('RUST_COMPILER')
                    Write-Host ('PRIVATE_NATIVE_RUST_CODE=E'+$Matches[1])
                  }
                  if($line -match 'Cannot find module|module not found'){$null=$classes.Add('MODULE_NOT_FOUND')}
                  if($line -match 'linker|link\.exe'){$null=$classes.Add('LINKER')}
                  if($line -match 'failed to load|failed to resolve'){$null=$classes.Add('RESOURCE_RESOLUTION')}
                  if($line -match 'not recognized as the name|command not found'){$null=$classes.Add('MISSING_TOOL')}
                  if($line -match 'failed to parse|invalid config'){$null=$classes.Add('CONFIG_PARSE')}
                  if($line -match 'unresolved import'){$null=$classes.Add('UNRESOLVED_IMPORT')}
                  if($line -match 'npm ERR!|npm error'){$null=$classes.Add('NPM')}
                  if($line -match 'failed to compile|could not compile'){$null=$classes.Add('RUST_BUILD')}
                  if($line -match 'ECONNRESET|ETIMEDOUT|Could not resolve host'){$null=$classes.Add('NETWORK')}
                  if($line -match 'windows_runtime_wheel_fetch_failed'){$null=$classes.Add('WHEEL_FETCH')}
                  if($line -match 'windows_runtime_wheel_(?:requirements_mismatch|identity_invalid|platform_or_python_mismatch)'){$null=$classes.Add('WHEEL_CONTRACT')}
                  if($line -match 'windows_python_release_digest_mismatch'){$null=$classes.Add('PYTHON_ARCHIVE_SHA')}
                  if($line -match 'windows_python_release_post_provision_verification_failed'){$null=$classes.Add('PYTHON_EXECUTABLE')}
                  if($line -match 'Invoke-WebRequest|curl: \('){$null=$classes.Add('HTTP_DOWNLOAD')}
                  if($line -match 'windows_runtime_wheel_fetch_failed:([A-Za-z0-9._-]{1,48})'){
                    Write-Host ('PRIVATE_NATIVE_WHEEL_NAME='+$Matches[1])
                  }
                  # This exception concerns a public pinned PyPI wheel, not
                  # user data. Redact locations, links and digests before
                  # emitting one bounded diagnostic to the public CI log.
                  if($line -match 'windows_runtime_wheel_fetch_failed:attrs:([^\r\n]{1,320})'){
                    $cause=$Matches[1]
                    $cause=[regex]::Replace($cause,'(?i)(?:https?://|[a-z]:\\|\\\\)[^\s,;]+','[location]')
                    $cause=[regex]::Replace($cause,'(?i)\b[0-9a-f]{40,64}\b','[digest]')
                    $cause=[regex]::Replace($cause,'[^\x20-\x7e]','?')
                    if($cause.Length -gt 160){$cause=$cause.Substring(0,160)}
                    Write-Host ('PRIVATE_PUBLIC_WHEEL_ERROR_SUMMARY='+$cause)
                  }
                  if($line -match 'HTTP (403|404|429|500|502|503|504)|returned error: (403|404|429|500|502|503|504)'){
                    $null=$classes.Add('HTTP_STATUS')
                  }
                  if($line -match 'No such host|Could not resolve|Name or service not known'){
                    $null=$classes.Add('DNS')
                  }
                  if($line -match 'timed out|timeout|ETIMEDOUT'){
                    $null=$classes.Add('TIMEOUT')
                  }
                  if($line -match 'certificate|SSL|TLS'){
                    $null=$classes.Add('CERTIFICATE_OR_TLS')
                  }
                  if($line -match 'digest_mismatch'){
                    $null=$classes.Add('DIGEST_MISMATCH')
                  }
                }
              }
              foreach($item in @($codes) | Sort-Object | Select-Object -First 16){
                Write-Host ('PRIVATE_NATIVE_ERROR_CODE='+$item)
              }
              foreach($item in @($classes) | Sort-Object){
                Write-Host ('PRIVATE_NATIVE_ERROR_CLASS='+$item)
              }
              foreach($item in @($setupNativeActions) | Sort-Object | Select-Object -First 8){
                Write-Host ('PRIVATE_NATIVE_SETUP_OPERATION='+$item)
              }
              foreach($item in @($setupNativeReasons) | Sort-Object | Select-Object -First 8){
                Write-Host ('PRIVATE_NATIVE_SETUP_REASON_CODE='+$item)
              }
              # The private repair receipt is read ONLY inside the temporary
              # runner. Print a finite product-neutral category, never a path.
              $repairReceipt=Join-Path $out 'native-candidate/temporary-installed-fixture/repair.json'
              if(Test-Path -LiteralPath $repairReceipt -PathType Leaf){
                try {
                  $repair=Get-Content -LiteralPath $repairReceipt -Raw -Encoding UTF8|ConvertFrom-Json
                  $kind=[string]$repair.unownedCategory
                  if($repair.status -eq 'ERROR' -and $kind -cin @(
                     'WEBVIEW2_PROFILE','PYTHON_BYTECODE','DESKTOP_RUNTIME',
                     'PYTHON_OR_MODEL_RUNTIME','APPLICATION_STATE','OTHER')){
                    Write-Host ('PRIVATE_NATIVE_REPAIR_UNOWNED_CATEGORY='+$kind)
                  }
                } catch {
                  Write-Host 'PRIVATE_NATIVE_REPAIR_CATEGORY_READBACK=UNAVAILABLE'
                }
              }
              Write-Host ('PRIVATE_NATIVE_SETUP_OPERATIONS_OBSERVED='+$setupNativeActions.Count)
              Write-Host ('PRIVATE_NATIVE_ERROR_CODES_OBSERVED='+$codes.Count)
              # Native Setup Core writes the detailed reason only to a
              # private local receipt. Project to a STRICT finite set of
              # public-safe cause codes, never print the original string,
              # any paths, its JSON, a stack trace or user-controlled text.
              $installReceipt=Join-Path $out 'native-candidate/temporary-installed-fixture/installed.json'
              if(Test-Path -LiteralPath $installReceipt -PathType Leaf){
                try{
                  $install=Get-Content -LiteralPath $installReceipt -Raw -Encoding UTF8 | ConvertFrom-Json
                  if([string]$install.status -ceq 'ERROR'){
                    Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=ERROR'
                    # Only exact finite enums from the product-neutral native
                    # installer may be published. No raw reason/path/stack trace.
                    $nativeClass=[string]$install.exceptionClass
                    $nativePhase=[string]$install.installPhase
                    if($nativeClass -cin @('PATH_TOO_LONG','ACCESS_DENIED','COM','REFLECTION','SECURITY','INVALID_DATA','IO','INVALID_OPERATION','ARGUMENT','NOT_SUPPORTED','OTHER')){
                      Write-Host ('PRIVATE_NATIVE_INSTALL_EXCEPTION_CLASS='+$nativeClass)
                    }
                    if($nativePhase -cin @('STAGE_EXTRACTION','STORAGE_VALIDATION','ACTIVATION','REGISTRATION','SHORTCUT','SHORTCUT_FOLDER','SHORTCUT_STAGE_CREATE','SHORTCUT_CREATE_COM','SHORTCUT_TARGET','SHORTCUT_WORKING_DIR','SHORTCUT_DESCRIPTION','SHORTCUT_SAVE','SHORTCUT_READBACK','SHORTCUT_CLAIM','REQUEST_OR_PREFLIGHT')){
                      Write-Host ('PRIVATE_NATIVE_INSTALL_PHASE='+$nativePhase)
                    }
                    $reason=[string]$install.reason
                    $safeCodes=@(
                      'SETUP_DISK_SPACE_INSUFFICIENT',
                      'SETUP_EXTRACTED_SIZE_EXCEEDED',
                      'SETUP_ZIP_ENTRY_HASH_INVALID',
                      'SETUP_ZIP_ENTRY_LENGTH_INVALID',
                      'SETUP_ZIP_ENTRY_EXPANSION',
                      'SETUP_ZIP_ENTRY_UNKNOWN',
                      'SETUP_STAGING_ROOT_NOT_EMPTY_OR_UNTRUSTED',
                      'SETUP_ENTRYPOINT_NOT_STAGED',
                      'SETUP_STORAGE_VOLUME_UNAVAILABLE',
                      'SETUP_RESERVED_FILE_COLLISION',
                      'SETUP_INSTALL_ALREADY_EXISTS',
                      'SETUP_INSTALL_ALREADY_RUNNING',
                      'SETUP_BLOCKED_',
                      'SETUP_RELATIVE_PATH_INVALID',
                      'SETUP_POST_OWNED_PRODUCT_MISMATCH',
                      'SETUP_INSTALL_ROOT_INVALID',
                      'SETUP_INSTALL_ROOT_VOLUME_ROOT',
                      'SETUP_INSTALL_ROOT_SYSTEM_FOLDER',
                      'SETUP_INSTALL_ROOT_PARENT_FILE',
                      'SETUP_INSTALL_ROOT_LINK',
                      'SETUP_STORAGE_LOCATIONS_OVERLAP',
                      'SETUP_LOCATIONS_SCHEMA_INVALID',
                      'SETUP_LOCATIONS_FIELD_',
                      'SETUP_LOCATIONS_STARTUP_MODE_INVALID',
                      'SETUP_STARTUP_SHORTCUT_CONFLICT',
                      'SETUP_START_MENU_SHORTCUT_CONFLICT',
                      'SETUP_WINDOWS_SHORTCUT_SERVICE_MISSING',
                      'SETUP_START_MENU_FOLDER_UNAVAILABLE',
                      'SETUP_DISK_PACKAGE_SIZE_UNKNOWN',
                      'SETUP_DISK_VOLUME_UNAVAILABLE',
                      'SETUP_PACKAGE_CHANGED_DURING_STAGE',
                      'SETUP_PACKAGE_MISSING',
                      'SETUP_PACKAGE_HASH_INVALID',
                      'SETUP_MANIFEST_HASH_INVALID',
                      'SETUP_MANIFEST_SCHEMA_INVALID',
                      'SETUP_LAYOUT_INVALID',
                      'SETUP_RESOURCE_HEADER_INVALID',
                      'SETUP_ZIP_FILE_COUNT_INVALID',
                      'SETUP_ZIP_LINK_FORBIDDEN',
                      'SETUP_ZIP_REGION_OUT_OF_BOUNDS',
                      'SETUP_STAGING_ESCAPE',
                      'SETUP_FILES_INVALID',
                      'SETUP_FILE_IDENTITY_INVALID',
                      'SETUP_FILE_LENGTH_INVALID',
                      'SETUP_ENTRYPOINT_MISSING',
                      'SETUP_PRODUCT_IDENTITY_INVALID',
                      'SETUP_PRODUCT_SCHEMA_INVALID',
                      'SETUP_SOURCE_IDENTITY_INVALID',
                      'SETUP_REQUIREMENTS_INVALID',
                      'SETUP_LOCATIONS_AUTHORITY_MISSING',
                      'SETUP_STAGED_ENTRYPOINT_MISSING'
                    )
                    $found=$false
                    foreach($safeCode in $safeCodes){
                      if($reason.StartsWith($safeCode,[StringComparison]::Ordinal)){
                        Write-Host ('PRIVATE_NATIVE_INSTALL_CAUSE_CODE='+$safeCode.TrimEnd('_'))
                        $found=$true
                        break
                      }
                    }
                    if(!$found){
                      $failureClass='OTHER'
                      if($reason -match '(?i)path.{0,32}too long|too long.{0,32}path|filename.{0,24}too long|longpath'){
                        $failureClass='PATH_TOO_LONG'
                      }elseif($reason -match '(?i)not enough space|disk is full|insufficient disk'){
                        $failureClass='DISK_SPACE'
                      }elseif($reason -match '(?i)access.{0,10}denied|unauthorizedaccess|permission denied'){
                        $failureClass='ACCESS_DENIED'
                      }elseif($reason -match '(?i)cannot find.{0,30}path|could not find.{0,30}path|part of the path'){
                        $failureClass='PATH_NOT_FOUND'
                      }elseif($reason -match '(?i)another process|sharing violation|being used by'){
                        $failureClass='FILE_LOCKED'
                      }elseif($reason -match '(?i)javascriptserializer|maxjsonlength|maximum.{0,20}json|json.{0,20}length'){
                        $failureClass='JSON_CAPACITY'
                      }elseif($reason -match '(?i)file.{0,12}already exists|already exists'){
                        $failureClass='FILE_ALREADY_EXISTS'
                      }elseif($reason -match '(?i)the system cannot find the file specified|the system cannot find the path specified|the directory name is invalid'){
                        $failureClass='WINDOWS_ENTRY_NOT_FOUND'
                      }elseif($reason -match '(?i)illegal characters in path|path contains invalid characters|filename.{0,30}syntax is incorrect'){
                        $failureClass='INVALID_PATH_SYNTAX'
                      }elseif($reason -match '(?i)the directory is not empty|directory not empty'){
                        $failureClass='DIRECTORY_NOT_EMPTY'
                      }elseif($reason -match '(?i)requested registry access is not allowed|access to the registry key'){
                        $failureClass='REGISTRY_ACCESS'
                      }elseif($reason -match '(?i)class not registered|0x80040154|cannot create activex component'){
                        $failureClass='SHELL_COM_UNAVAILABLE'
                      }elseif($reason -match '(?i)out of memory|insufficient memory|too many open files'){
                        $failureClass='RESOURCE_LIMIT'
                      }elseif($reason -match '(?i)key was not present in the dictionary|an item with the same key|index was out of range'){
                        $failureClass='COLLECTION_STATE'
                      }elseif($reason -match '(?i)object reference not set to an instance'){
                        $failureClass='NULL_REFERENCE'
                      }elseif($reason -match '(?i)cannot access a disposed object'){
                        $failureClass='DISPOSED_OBJECT'
                      }elseif($reason -match '(?i)invalid argument|argument.{0,40}invalid|value cannot be null'){
                        $failureClass='INVALID_ARGUMENT'
                      }elseif($reason -match '(?i)end of central directory|invalid.*zip archive|zip archive.*invalid'){
                        $failureClass='ZIP_STRUCTURE'
                      }elseif($reason.StartsWith('SETUP_',[StringComparison]::Ordinal)){
                        $failureClass='UNLISTED_ENGINE_CODE'
                      }elseif([string]::IsNullOrWhiteSpace($reason)){
                        $failureClass='MISSING_REASON'
                      }
                      Write-Host ('PRIVATE_NATIVE_INSTALL_CAUSE_CLASS='+$failureClass)
                    }
                  }else{
                    Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=NON_ERROR'
                  }
                }catch{
                  Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=UNREADABLE'
                }
              }else{
                Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=MISSING'
              }
              # The native candidate is private, but the explicitly allowed
              # SHA-256/size and verified pinned source revision can be
              # published even when the subsequent installation fails.
              $builtSetup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
              $releaseReceipt=Join-Path $nativeLogs 'private-setup-core-build.json'
              if((Test-Path -LiteralPath $builtSetup -PathType Leaf) -and
                 (Test-Path -LiteralPath $releaseReceipt -PathType Leaf)){
                try{
                  $built=Get-Content -LiteralPath $releaseReceipt -Raw -Encoding UTF8 | ConvertFrom-Json
                  if($built.status -ceq 'BUILT_UNQUALIFIED' -and
                     $built.private_source_commit -ceq $env:PRIVATE_SOURCE_SHA -and
                     $built.setup_sha256 -cmatch '^[0-9a-f]{64}$'){
                    $nativeStream=[IO.File]::OpenRead([IO.Path]::GetFullPath($builtSetup))
                    $sha=[Security.Cryptography.SHA256]::Create()
                    try{
                      $actual=([BitConverter]::ToString($sha.ComputeHash($nativeStream))).Replace('-','').ToLowerInvariant()
                    }finally{
                      $sha.Dispose()
                      $nativeStream.Dispose()
                    }
                    if($actual -ceq $built.setup_sha256){
                      Write-Host ('PRIVATE_NATIVE_SETUP_SHA256='+$actual)
                      Write-Host ('PRIVATE_NATIVE_SETUP_BYTES='+((Get-Item -LiteralPath $builtSetup -ErrorAction Stop).Length))
                    }else{
                      Write-Host 'PRIVATE_NATIVE_SETUP_DIGEST_MISMATCH'
                    }
                  }
                }catch{
                  Write-Host 'PRIVATE_NATIVE_SETUP_DIGEST_OBSERVATION_UNAVAILABLE'
                }
              }
            }
            if($raw -match 'full_qualification_step_failed_python-(targeted|full)_exit_([0-9]{1,3})'){
              Write-Host ('PRIVATE_PYTHON_EXIT_CODE='+$Matches[2])
            }
            # The Node TAP log stays private; output only counts and hashes.
            $nodeStdout=Join-Path $out 'evidence/desktop-node-tests.stdout.log'
            if(Test-Path -LiteralPath $nodeStdout -PathType Leaf){
              $nodePass=-1; $nodeFail=-1; $nodeIds=0
              foreach($line in [IO.File]::ReadLines($nodeStdout)){
                if($line -match '^# pass (\d{1,7})\s*$'){$nodePass=[int]$Matches[1]}
                if($line -match '^# fail (\d{1,7})\s*$'){$nodeFail=[int]$Matches[1]}
                if($line -match '^not ok \d+ - (.{1,350})$' -and $nodeIds -lt 12){
                  $bytes=[Text.Encoding]::UTF8.GetBytes($Matches[1].Trim())
                  $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
                  Write-Host ('PRIVATE_NODE_FAILED_ID_SHA256='+$hash)
                  $nodeIds++
                }
              }
              Write-Host ('PRIVATE_NODE_PASSED_COUNT='+$nodePass)
              Write-Host ('PRIVATE_NODE_FAILED_COUNT='+$nodeFail)
              Write-Host ('PRIVATE_NODE_FAILED_ID_COUNT='+$nodeIds)
            }
            # The pytest log remains private on the ephemeral worker. Public
            # output contains only bounded test identifiers, never captured
            # tracebacks, assertion values, task content, or provider data.
            $testStage=if($raw -match 'full_qualification_step_(?:failed|exit_unknown)_python-targeted'){'python-targeted'}else{'python-full'}
            $pytestLog=Join-Path $out ('evidence/'+$testStage+'.stdout.log')
            $pytestErr=Join-Path $out ('evidence/'+$testStage+'.stderr.log')
            if($raw -match 'full_qualification_step_exit_unknown_python-(targeted|full)'){
              Write-Host 'PRIVATE_PYTHON_EXIT_OBSERVATION=UNAVAILABLE'
            }
            if(Test-Path -LiteralPath $pytestLog -PathType Leaf){
              $outputText=Get-Content -LiteralPath $pytestLog -Raw -Encoding UTF8
              if($null -eq $outputText){$outputText=''}
              if($outputText -match '(\d{1,6})\s+passed'){Write-Host ('PRIVATE_PYTHON_PASSED_COUNT='+$Matches[1])}
              if($outputText -match '(\d{1,6})\s+failed'){Write-Host ('PRIVATE_PYTHON_FAILED_COUNT='+$Matches[1])}
              if($outputText -match 'INTERNALERROR'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=INTERNAL'}
              if($outputText -match 'ERROR collecting '){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=COLLECTION'}
              if($outputText -match 'unrecognized arguments|pytest: error:'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=ARGUMENTS'}
              if($outputText -match 'no tests ran'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=NO_TESTS'}
              if($outputText -match 'Traceback \(most recent call last\)'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=TRACEBACK_REDACTED'}
              Write-Host ('PRIVATE_PYTHON_STDOUT_BYTES='+([Text.Encoding]::UTF8.GetByteCount($outputText)))
            }else{Write-Host 'PRIVATE_PYTHON_STDOUT=NOT_FOUND'}
            if(Test-Path -LiteralPath $pytestErr -PathType Leaf){
              $errText=Get-Content -LiteralPath $pytestErr -Raw -Encoding UTF8
              if($null -eq $errText){$errText=''}
              if($errText -match 'unrecognized arguments|pytest: error:'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=ARGUMENTS'}
              if($errText -match 'Fatal Python error|INTERNALERROR'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=INTERNAL'}
              if($errText -match 'No module named pytest'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=PYTEST_MISSING'}
              Write-Host ('PRIVATE_PYTHON_STDERR_BYTES='+([Text.Encoding]::UTF8.GetByteCount($errText)))
            }else{Write-Host 'PRIVATE_PYTHON_STDERR=NOT_FOUND'}
            if(Test-Path -LiteralPath $pytestLog -PathType Leaf){
              $count=0
              $collections=0
              $locations=0
              $errors=0
              foreach($line in [IO.File]::ReadLines($pytestLog)){
                if($line -match '^(FAILED|ERROR)\s+(tests[/\\][A-Za-z0-9_/.\\:-]{1,220})\b'){
                  Write-Host ('PRIVATE_PYTHON_FAILED_TEST='+$Matches[2])
                  $count++
                }elseif($line -match '^ERROR collecting (tests[/\\][A-Za-z0-9_./\\-]{1,180}\.py)' -and $collections -lt 12){
                  Write-Host ('PRIVATE_PYTHON_COLLECTION_ERROR='+$Matches[1])
                  $collections++
                }elseif($line -match '^tests[/\\]([A-Za-z0-9_./\\-]{1,180}\.py):(\d{1,5}):' -and $locations -lt 12){
                  Write-Host ('PRIVATE_PYTHON_FAILURE_LOCATION='+$Matches[1]+':'+$Matches[2])
                  $locations++
                }elseif($line -match '^E\s+([A-Za-z][A-Za-z0-9_]*Error)\b' -and $errors -lt 12){
                  Write-Host ('PRIVATE_PYTHON_EXCEPTION_CLASS='+$Matches[1])
                  if($line -match '\[WinError (\d{1,4})\]'){
                    Write-Host ('PRIVATE_PYTHON_WINERROR='+$Matches[1])
                  }
                  if($line -match '^E\s+[A-Za-z][A-Za-z0-9_]*Error:\s+([a-z][a-z0-9_]{2,80})\s*$'){
                    Write-Host ('PRIVATE_PYTHON_ERROR_CODE='+$Matches[1])
                  }
                  $errors++
                }
                if($count -ge 20 -and $locations -ge 12 -and $errors -ge 12){break}
              }
              Write-Host ('PRIVATE_PYTHON_FAILURE_IDENTIFIERS_SHOWN='+$count)
              Write-Host ('PRIVATE_PYTHON_COLLECTION_IDENTIFIERS_SHOWN='+$collections)
            }
            throw 'PRIVATE_QUALIFICATION_NOT_ACCEPTED'
          }
          $resultPath=Join-Path $out 'result.json'
          if(!(Test-Path -LiteralPath $resultPath -PathType Leaf)){
            throw 'PRIVATE_QUALIFICATION_RESULT_MISSING'
          }
          $result=Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
          # The 0.5 candidate is a separate, explicitly marked product qualification.
          # Existing 0.4 release gates remain pinned and unchanged.
          $expectedProductVersion=if($env:PRIVATE_QA_TRIGGER -match ' agent05-full( |$)'){'0.5.0'}else{'0.4.0'}
          if($result.status -ne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or
             $result.source_commit -cne $env:PRIVATE_SOURCE_SHA -or
             $result.gui_task_result_full_acceptance -cne 'PASS' -or
             $result.gui_task_cold_independent_import -cne 'PASS' -or
             $result.model_result_transport_verified -cne 'PASS' -or
             $result.product_version -cne $expectedProductVersion -or
             ($expectedProductVersion -ceq '0.5.0' -and $result.native_real_upgrade_04_to_05_accepted -ne $true)){
            throw 'PRIVATE_QUALIFICATION_RESULT_UNVERIFIED'
          }
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if(!(Test-Path -LiteralPath $setup -PathType Leaf)){
            throw 'PRIVATE_QUALIFICATION_INSTALLER_MISSING'
          }
          $hash=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host 'PRIVATE_WINDOWS_SOURCE_AND_INSTALLED_SMOKE_PASS'
          Write-Host ('PRIVATE_SETUP_SHA256='+$hash)
          Write-Host ('PRIVATE_SOURCE_SHA='+$result.source_commit)
          Write-Host 'PRIVATE_GUI_TASK_RESULT_FULL_ACCEPTANCE=PASS'
          Write-Host 'PRIVATE_GUI_TASK_COLD_INDEPENDENT_IMPORT=PASS'
          Write-Host 'PRIVATE_MODEL_RESULT_TRANSPORT_VERIFIED=PASS'
          if($expectedProductVersion -ceq '0.5.0'){Write-Host 'PRIVATE_REAL_04_TO_05_UPGRADE=PASS'}
          Write-Host ('PRIVATE_PRODUCT_VERSION='+$expectedProductVersion)
          # Never upload private files, archives, windows screenshots, or logs.
      # Publish only after complete native installed acceptance, never as a public artifact.
      - name: Publish verified 0.4.0 Setup only to private Agent release
        if: ${{ contains(github.event.head_commit.message, ' private-release') && !contains(github.event.head_commit.message, ' private-release-v0.5') && !contains(github.event.head_commit.message, ' node-only') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IWXA_PRIVATE_RELEASE_TOKEN }}
          PRIVATE_SOURCE_SHA: ${{ steps.private-pin.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Faust-S/iwxa-personal-agent'
          $tag='v0.4.0'
          $fixed='2a2fdebf905b96ef88211692cc02f2a14069445b'
          if ($env:PRIVATE_SOURCE_SHA -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_NOT_FROZEN_0_4' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'PRIVATE_RELEASE_WRITE_TOKEN_NOT_CONFIGURED' }
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-product'
          if ((& git -C $root rev-parse HEAD).Trim() -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_MISMATCH' }
          $out=Join-Path $env:RUNNER_TEMP 'private-product-qualification'
          $receiptPath=Join-Path $out 'result.json'
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if (!(Test-Path -LiteralPath $receiptPath -PathType Leaf) -or !(Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_QUALIFIED_SETUP_MISSING'
          }
          $r=Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($r.status -cne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or $r.source_commit -cne $fixed -or
              $r.product_version -cne '0.4.0' -or $r.gui_task_result_full_acceptance -cne 'PASS' -or
              $r.gui_task_cold_independent_import -cne 'PASS' -or $r.model_result_transport_verified -cne 'PASS') {
            throw 'PRIVATE_RELEASE_WINDOWS_ACCEPTANCE_UNVERIFIED'
          }
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item -LiteralPath $setup).Length
          if ($bytes -lt 1000000 -or $digest -cnotmatch '^[0-9a-f]{64}$') { throw 'PRIVATE_RELEASE_BINARY_INVALID' }
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) { throw 'PRIVATE_RELEASE_GH_CLI_MISSING' }
          $privateLog=Join-Path $env:RUNNER_TEMP 'private-gh-release.log'
          & gh release view $tag --repo $repo --json tagName *> $privateLog
          if ($LASTEXITCODE -eq 0) { throw 'PRIVATE_RELEASE_TAG_EXISTS_NO_OVERWRITE' }
          $assetName='IWXA-Personal-Agent-0.4.0-Setup.exe'
          $sums=Join-Path $env:RUNNER_TEMP 'agent04-release-SHA256SUMS.txt'
          ($digest+'  '+$assetName) | Set-Content -LiteralPath $sums -Encoding ascii
          $notes=Join-Path $env:RUNNER_TEMP 'agent04-release-notes.md'
          @(
            'IWXA Personal Agent 0.4.0 for Windows. Full installed acceptance PASS.'
            ('Exact source SHA: '+$fixed)
            ('Installer SHA-256: '+$digest)
            ('Center Windows acceptance run: '+$env:GITHUB_RUN_ID)
            'Verified: local model transport, Task, Human Review, Result, cold independent .iwxa import.'
            'Model choice and reasoning effort remain user preferences; no subjective answer-quality gate.'
            'Private release asset only; public Center artifacts remain empty.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag ($setup+'#'+$assetName) ($sums+'#SHA256SUMS.txt') --repo $repo --target $fixed --title 'IWXA Personal Agent 0.4.0' --notes-file $notes --draft *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_DRAFT_UPLOAD_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft,targetCommitish,assets 2>$privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_READBACK_FAILED' }
          $published=$raw | ConvertFrom-Json
          $installer=@($published.assets | Where-Object { $_.name -ceq $assetName })
          $checksums=@($published.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
          if ($published.tagName -cne $tag -or !$published.isDraft -or $published.targetCommitish -cne $fixed -or
              $installer.Count -ne 1 -or [int64]$installer[0].size -ne $bytes -or $checksums.Count -ne 1) {
            throw 'PRIVATE_RELEASE_ASSET_READBACK_MISMATCH'
          }
          & gh release edit $tag --repo $repo --draft=false *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_PUBLISH_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft 2>$privateLog
          if ($LASTEXITCODE -ne 0 -or ($raw | ConvertFrom-Json).isDraft -ne $false) {
            throw 'PRIVATE_RELEASE_FINAL_READBACK_MISSING'
          }
          Write-Host 'PRIVATE_RELEASE_PRIVATE_REPO_UPLOAD=PASS'
          Write-Host ('PRIVATE_RELEASE_SETUP_SHA256='+$digest)
          Write-Host 'PRIVATE_RELEASE_ASSET_COUNT=2'
          Write-Host 'PRIVATE_RELEASE_VISIBILITY=PRIVATE'
      - name: Publish verified 0.5.0 Setup to private Agent release
        if: ${{ contains(github.event.head_commit.message, ' private-release-v0.5') && contains(github.event.head_commit.message, ' agent05-full') && !contains(github.event.head_commit.message, ' node-only') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IWXA_PRIVATE_RELEASE_TOKEN }}
          PRIVATE_SOURCE_SHA: ${{ steps.private-pin.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Faust-S/iwxa-personal-agent'
          $tag='v0.5.0'
          # Release is fail-closed: publish only after same-run native 0.5
          # first-launch, real 0.4 upgrade, Task/Review/Result and .iwxa PASS.
          $fixed='dd0d1c8bb7015e94ef109400fdfddc5f8d589b33'
          if ($env:PRIVATE_SOURCE_SHA -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_NOT_FROZEN_0_5' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'PRIVATE_RELEASE_WRITE_TOKEN_NOT_CONFIGURED' }
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-product'
          if ((& git -C $root rev-parse HEAD).Trim() -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_MISMATCH' }
          $out=Join-Path $env:RUNNER_TEMP 'private-product-qualification'
          $receiptPath=Join-Path $out 'result.json'
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if (!(Test-Path -LiteralPath $receiptPath -PathType Leaf) -or !(Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_QUALIFIED_SETUP_MISSING'
          }
          $r=Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $installedPath=Join-Path $out 'native-candidate/temporary-installed-fixture/installed-witness.json'
          if(!(Test-Path -LiteralPath $installedPath -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_INSTALLED_WITNESS_MISSING'
          }
          $installed=Get-Content -LiteralPath $installedPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if($installed.installed_native_cold_launch_verified -ne $true -or
             $installed.installed_start_menu_shortcut_verified -ne $true -or
             $installed.installed_real_qwen_task_review_verified -ne $true -or
             $installed.installed_k03_real_source_task_result_restart_verified -ne $true){
            throw 'PRIVATE_RELEASE_NATIVE_ACCEPTANCE_INCOMPLETE'
          }
          if ($r.status -cne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or $r.source_commit -cne $fixed -or
              $r.product_version -cne '0.5.0' -or
              $r.native_real_upgrade_04_to_05_accepted -ne $true -or
              $r.gui_task_result_full_acceptance -cne 'PASS' -or
              $r.gui_task_cold_independent_import -cne 'PASS' -or $r.model_result_transport_verified -cne 'PASS') {
            throw 'PRIVATE_RELEASE_WINDOWS_ACCEPTANCE_UNVERIFIED'
          }
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item -LiteralPath $setup).Length
          if ($bytes -lt 1000000 -or $digest -cnotmatch '^[0-9a-f]{64}$') { throw 'PRIVATE_RELEASE_BINARY_INVALID' }
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) { throw 'PRIVATE_RELEASE_GH_CLI_MISSING' }
          $privateLog=Join-Path $env:RUNNER_TEMP 'private-gh-release.log'
          & gh release view $tag --repo $repo --json tagName *> $privateLog
          if ($LASTEXITCODE -eq 0) { throw 'PRIVATE_RELEASE_TAG_EXISTS_NO_OVERWRITE' }
          $assetName='IWXA-Personal-Agent-0.5.0-Setup.exe'
          $sums=Join-Path $env:RUNNER_TEMP 'agent05-release-SHA256SUMS.txt'
          ($digest+'  '+$assetName) | Set-Content -LiteralPath $sums -Encoding ascii
          $notes=Join-Path $env:RUNNER_TEMP 'agent05-release-notes.md'
          @(
            'IWXA Personal Agent 0.5.0 for Windows. Full installed acceptance PASS.'
            ('Exact source SHA: '+$fixed)
            ('Installer SHA-256: '+$digest)
            ('Center Windows acceptance run: '+$env:GITHUB_RUN_ID)
            'Verified: actual upgrade from published 0.4.0 to 0.5.0 preserving data and shortcuts; native cold start; local model Task, Human Review, Result, K03, independent .iwxa import.'
            'Model choice and reasoning effort remain user preferences; no subjective answer-quality gate.'
            'Private release asset only; public Center artifacts remain empty.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag ($setup+'#'+$assetName) ($sums+'#SHA256SUMS.txt') --repo $repo --target $fixed --title 'IWXA Personal Agent 0.5.0' --notes-file $notes --draft *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_DRAFT_UPLOAD_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft,targetCommitish,assets 2>$privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_READBACK_FAILED' }
          $published=$raw | ConvertFrom-Json
          $installer=@($published.assets | Where-Object { $_.name -ceq $assetName })
          $checksums=@($published.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
          if ($published.tagName -cne $tag -or !$published.isDraft -or $published.targetCommitish -cne $fixed -or
              $installer.Count -ne 1 -or [int64]$installer[0].size -ne $bytes -or $checksums.Count -ne 1) {
            throw 'PRIVATE_RELEASE_ASSET_READBACK_MISMATCH'
          }
          # Re-download both private release assets and compare actual bytes
          # with the verified local Windows product before publishing.
          $readbackDir=Join-Path $env:RUNNER_TEMP 'agent05-private-release-readback'
          New-Item -Path $readbackDir -ItemType Directory -Force | Out-Null
          & gh release download $tag --repo $repo --pattern $assetName --dir $readbackDir --clobber *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_BINARY_REDOWNLOAD_FAILED' }
          $readbackExe=Join-Path $readbackDir $assetName
          if (!(Test-Path -LiteralPath $readbackExe -PathType Leaf) -or
              (Get-Item -LiteralPath $readbackExe).Length -ne $bytes -or
              (Get-FileHash -LiteralPath $readbackExe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) {
            throw 'PRIVATE_RELEASE_BINARY_REDOWNLOAD_MISMATCH'
          }
          & gh release download $tag --repo $repo --pattern SHA256SUMS.txt --dir $readbackDir --clobber *> $privateLog
          if ($LASTEXITCODE -ne 0 -or
              !(Test-Path -LiteralPath (Join-Path $readbackDir 'SHA256SUMS.txt') -PathType Leaf) -or
              [IO.File]::ReadAllText((Join-Path $readbackDir 'SHA256SUMS.txt')).Trim() -cne ($digest+'  '+$assetName)) {
            throw 'PRIVATE_RELEASE_CHECKSUM_REDOWNLOAD_MISMATCH'
          }
          & gh release edit $tag --repo $repo --draft=false *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_PUBLISH_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft 2>$privateLog
          if ($LASTEXITCODE -ne 0 -or ($raw | ConvertFrom-Json).isDraft -ne $false) {
            throw 'PRIVATE_RELEASE_FINAL_READBACK_MISSING'
          }
          Write-Host 'PRIVATE_RELEASE_PRIVATE_REPO_UPLOAD=PASS'
          Write-Host ('PRIVATE_RELEASE_SETUP_SHA256='+$digest)
          Write-Host 'PRIVATE_RELEASE_ASSET_COUNT=2'
          Write-Host 'PRIVATE_RELEASE_VISIBILITY=PRIVATE'
){
                  Write-Host ('PRIVATE_INSTALLED_K03_HTTP_STATUS='+$Matches[1])
                }elseif([string]$line -cmatch '^AGENT_K03_SELECTION_HTTP_REASON=(k03_host_source_changed|k03_host_selection_input_invalid|k03_builtin_surface_required|unknown_query)
            }
            # The GUI witness uses one additional private status file.
            $guiStatus=Join-Path $out 'native-candidate/temporary-installed-fixture/native-gui-qwen.status'
            if(Test-Path -LiteralPath $guiStatus -PathType Leaf){
              $safeGuiMarkers=@('AGENT_REAL_QWEN_GUI_TASK_RESULT_PASS',
                                'AGENT_REAL_QWEN_GUI_SUBMIT_REVIEW_ACCEPTED_PASS',
                                'AGENT_REAL_QWEN_GUI_COLD_INDEPENDENT_IMPORT_PASS')
              foreach($line in [IO.File]::ReadLines($guiStatus)){
                if([string]$line -cin $safeGuiMarkers){
                  Write-Host ('PRIVATE_INSTALLED_GUI_CHECKPOINT='+[string]$line)
                }
              }
            }
            $raw=if(Test-Path -LiteralPath $err){Get-Content -LiteralPath $err -Raw}else{''}
            $code=[regex]::Match($raw,'(full_qualification_[a-z0-9_-]+|PRIVATE_SETUP_CORE_BUILD_FAIL|private_setup_[a-z0-9_-]+)')
            if($code.Success){Write-Host ('PRIVATE_QUALIFICATION_STAGE='+$code.Value)}
            else{Write-Host 'PRIVATE_QUALIFICATION_STAGE=UNCLASSIFIED'}
            if($raw -match 'full_qualification_step_failed_native-install-and-function'){
              $nativeLogs=Join-Path $out 'native-candidate/logs'
              $stages=[ordered]@{
                native_stub='native-setup-build.json'
                managed_python='test-python-bootstrap.log'
                desktop_icon='native-desktop-icon.json'
                u04_fetch='u04-source-preparation.json'
                u04_stage='u04-stage.json'
                node_dependencies='native-desktop-dependencies.log'
                tauri_build='native-desktop-build.log'
                payload='package-build-only.json'
                setup_resource='private-setup-core-build.json'
                installed_acceptance='public-test-local-result.txt'
              }
              foreach($stage in $stages.Keys){
                if(Test-Path -LiteralPath (Join-Path $nativeLogs $stages[$stage]) -PathType Leaf){
                  Write-Host ('PRIVATE_NATIVE_ATTEMPTED_STAGE='+$stage)
                }
              }
              $logPaths=@(
                (Join-Path $out 'evidence/native-install-and-function.stderr.log'),
                (Join-Path $out 'evidence/native-install-and-function.stdout.log'),
                (Join-Path $nativeLogs 'test-python-bootstrap.log'),
                (Join-Path $nativeLogs 'native-desktop-build.log'),
                (Join-Path $nativeLogs 'native-desktop-build.log.stderr'),
                (Join-Path $nativeLogs 'native-desktop-build.log.stderr'),
                (Join-Path $nativeLogs 'native-desktop-dependencies.log.stderr'),
                (Join-Path $nativeLogs 'package-build-only.json'),
                (Join-Path $nativeLogs 'private-setup-core-build.json'),
                (Join-Path $nativeLogs 'public-test-local-result.txt')
              )
              $codes=New-Object 'System.Collections.Generic.HashSet[string]'
              $classes=New-Object 'System.Collections.Generic.HashSet[string]'
              $setupNativeActions=New-Object 'System.Collections.Generic.HashSet[string]'
              $setupNativeReasons=New-Object 'System.Collections.Generic.HashSet[string]'
              foreach($lp in $logPaths){
                if(!(Test-Path -LiteralPath $lp -PathType Leaf)){continue}
                $scanned=0
                foreach($line in [IO.File]::ReadLines($lp)){
                  if(++$scanned -gt 30000){break}
                  if($line -match '\b((?:native_candidate|private_setup|agent_setup|full_qualification|windows_python|windows_runtime|windows_release)_[a-z0-9_]{3,90}|SETUP_LOCAL_[A-Z0-9_]{3,90})\b'){
                    $null=$codes.Add($Matches[1])
                  }
                  # A Setup Core native action may fail after creating its
                  # private JSON receipt. Emit only the explicit public CLI
                  # operation and an allowlisted Setup Core error identifier.
                  # Never print the native receipt, paths or exception text.
                  if($line -cmatch 'SETUP_LOCAL_NATIVE_FAILED_--(inspect|preflight|install-locations|verify-installed|locations|repair|confirm-upgrade|uninstall)-file_'){
                    $null=$setupNativeActions.Add($Matches[1].Replace('-','_').ToUpperInvariant())
                  }
                  if($line -cmatch 'SETUP_LOCAL_NATIVE_FAILED_--(?:inspect|preflight|install-locations|verify-installed|locations|repair|confirm-upgrade|uninstall)-file_(SETUP_[A-Z0-9_]{3,80})(?:\b|$)'){
                    $null=$setupNativeReasons.Add($Matches[1])
                  }
                  if($line -match 'error\[E\d{4}\]'){$null=$classes.Add('RUST_COMPILER')}
                  if($line -match 'error TS(\d{4})'){
                    $null=$classes.Add('TYPESCRIPT')
                    Write-Host ('PRIVATE_NATIVE_TS_CODE=TS'+$Matches[1])
                  }
                  if($line -match 'error\[E(\d{4})\]'){
                    $null=$classes.Add('RUST_COMPILER')
                    Write-Host ('PRIVATE_NATIVE_RUST_CODE=E'+$Matches[1])
                  }
                  if($line -match 'Cannot find module|module not found'){$null=$classes.Add('MODULE_NOT_FOUND')}
                  if($line -match 'linker|link\.exe'){$null=$classes.Add('LINKER')}
                  if($line -match 'failed to load|failed to resolve'){$null=$classes.Add('RESOURCE_RESOLUTION')}
                  if($line -match 'not recognized as the name|command not found'){$null=$classes.Add('MISSING_TOOL')}
                  if($line -match 'failed to parse|invalid config'){$null=$classes.Add('CONFIG_PARSE')}
                  if($line -match 'unresolved import'){$null=$classes.Add('UNRESOLVED_IMPORT')}
                  if($line -match 'npm ERR!|npm error'){$null=$classes.Add('NPM')}
                  if($line -match 'failed to compile|could not compile'){$null=$classes.Add('RUST_BUILD')}
                  if($line -match 'ECONNRESET|ETIMEDOUT|Could not resolve host'){$null=$classes.Add('NETWORK')}
                  if($line -match 'windows_runtime_wheel_fetch_failed'){$null=$classes.Add('WHEEL_FETCH')}
                  if($line -match 'windows_runtime_wheel_(?:requirements_mismatch|identity_invalid|platform_or_python_mismatch)'){$null=$classes.Add('WHEEL_CONTRACT')}
                  if($line -match 'windows_python_release_digest_mismatch'){$null=$classes.Add('PYTHON_ARCHIVE_SHA')}
                  if($line -match 'windows_python_release_post_provision_verification_failed'){$null=$classes.Add('PYTHON_EXECUTABLE')}
                  if($line -match 'Invoke-WebRequest|curl: \('){$null=$classes.Add('HTTP_DOWNLOAD')}
                  if($line -match 'windows_runtime_wheel_fetch_failed:([A-Za-z0-9._-]{1,48})'){
                    Write-Host ('PRIVATE_NATIVE_WHEEL_NAME='+$Matches[1])
                  }
                  # This exception concerns a public pinned PyPI wheel, not
                  # user data. Redact locations, links and digests before
                  # emitting one bounded diagnostic to the public CI log.
                  if($line -match 'windows_runtime_wheel_fetch_failed:attrs:([^\r\n]{1,320})'){
                    $cause=$Matches[1]
                    $cause=[regex]::Replace($cause,'(?i)(?:https?://|[a-z]:\\|\\\\)[^\s,;]+','[location]')
                    $cause=[regex]::Replace($cause,'(?i)\b[0-9a-f]{40,64}\b','[digest]')
                    $cause=[regex]::Replace($cause,'[^\x20-\x7e]','?')
                    if($cause.Length -gt 160){$cause=$cause.Substring(0,160)}
                    Write-Host ('PRIVATE_PUBLIC_WHEEL_ERROR_SUMMARY='+$cause)
                  }
                  if($line -match 'HTTP (403|404|429|500|502|503|504)|returned error: (403|404|429|500|502|503|504)'){
                    $null=$classes.Add('HTTP_STATUS')
                  }
                  if($line -match 'No such host|Could not resolve|Name or service not known'){
                    $null=$classes.Add('DNS')
                  }
                  if($line -match 'timed out|timeout|ETIMEDOUT'){
                    $null=$classes.Add('TIMEOUT')
                  }
                  if($line -match 'certificate|SSL|TLS'){
                    $null=$classes.Add('CERTIFICATE_OR_TLS')
                  }
                  if($line -match 'digest_mismatch'){
                    $null=$classes.Add('DIGEST_MISMATCH')
                  }
                }
              }
              foreach($item in @($codes) | Sort-Object | Select-Object -First 16){
                Write-Host ('PRIVATE_NATIVE_ERROR_CODE='+$item)
              }
              foreach($item in @($classes) | Sort-Object){
                Write-Host ('PRIVATE_NATIVE_ERROR_CLASS='+$item)
              }
              foreach($item in @($setupNativeActions) | Sort-Object | Select-Object -First 8){
                Write-Host ('PRIVATE_NATIVE_SETUP_OPERATION='+$item)
              }
              foreach($item in @($setupNativeReasons) | Sort-Object | Select-Object -First 8){
                Write-Host ('PRIVATE_NATIVE_SETUP_REASON_CODE='+$item)
              }
              # The private repair receipt is read ONLY inside the temporary
              # runner. Print a finite product-neutral category, never a path.
              $repairReceipt=Join-Path $out 'native-candidate/temporary-installed-fixture/repair.json'
              if(Test-Path -LiteralPath $repairReceipt -PathType Leaf){
                try {
                  $repair=Get-Content -LiteralPath $repairReceipt -Raw -Encoding UTF8|ConvertFrom-Json
                  $kind=[string]$repair.unownedCategory
                  if($repair.status -eq 'ERROR' -and $kind -cin @(
                     'WEBVIEW2_PROFILE','PYTHON_BYTECODE','DESKTOP_RUNTIME',
                     'PYTHON_OR_MODEL_RUNTIME','APPLICATION_STATE','OTHER')){
                    Write-Host ('PRIVATE_NATIVE_REPAIR_UNOWNED_CATEGORY='+$kind)
                  }
                } catch {
                  Write-Host 'PRIVATE_NATIVE_REPAIR_CATEGORY_READBACK=UNAVAILABLE'
                }
              }
              Write-Host ('PRIVATE_NATIVE_SETUP_OPERATIONS_OBSERVED='+$setupNativeActions.Count)
              Write-Host ('PRIVATE_NATIVE_ERROR_CODES_OBSERVED='+$codes.Count)
              # Native Setup Core writes the detailed reason only to a
              # private local receipt. Project to a STRICT finite set of
              # public-safe cause codes, never print the original string,
              # any paths, its JSON, a stack trace or user-controlled text.
              $installReceipt=Join-Path $out 'native-candidate/temporary-installed-fixture/installed.json'
              if(Test-Path -LiteralPath $installReceipt -PathType Leaf){
                try{
                  $install=Get-Content -LiteralPath $installReceipt -Raw -Encoding UTF8 | ConvertFrom-Json
                  if([string]$install.status -ceq 'ERROR'){
                    Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=ERROR'
                    # Only exact finite enums from the product-neutral native
                    # installer may be published. No raw reason/path/stack trace.
                    $nativeClass=[string]$install.exceptionClass
                    $nativePhase=[string]$install.installPhase
                    if($nativeClass -cin @('PATH_TOO_LONG','ACCESS_DENIED','COM','REFLECTION','SECURITY','INVALID_DATA','IO','INVALID_OPERATION','ARGUMENT','NOT_SUPPORTED','OTHER')){
                      Write-Host ('PRIVATE_NATIVE_INSTALL_EXCEPTION_CLASS='+$nativeClass)
                    }
                    if($nativePhase -cin @('STAGE_EXTRACTION','STORAGE_VALIDATION','ACTIVATION','REGISTRATION','SHORTCUT','SHORTCUT_FOLDER','SHORTCUT_STAGE_CREATE','SHORTCUT_CREATE_COM','SHORTCUT_TARGET','SHORTCUT_WORKING_DIR','SHORTCUT_DESCRIPTION','SHORTCUT_SAVE','SHORTCUT_READBACK','SHORTCUT_CLAIM','REQUEST_OR_PREFLIGHT')){
                      Write-Host ('PRIVATE_NATIVE_INSTALL_PHASE='+$nativePhase)
                    }
                    $reason=[string]$install.reason
                    $safeCodes=@(
                      'SETUP_DISK_SPACE_INSUFFICIENT',
                      'SETUP_EXTRACTED_SIZE_EXCEEDED',
                      'SETUP_ZIP_ENTRY_HASH_INVALID',
                      'SETUP_ZIP_ENTRY_LENGTH_INVALID',
                      'SETUP_ZIP_ENTRY_EXPANSION',
                      'SETUP_ZIP_ENTRY_UNKNOWN',
                      'SETUP_STAGING_ROOT_NOT_EMPTY_OR_UNTRUSTED',
                      'SETUP_ENTRYPOINT_NOT_STAGED',
                      'SETUP_STORAGE_VOLUME_UNAVAILABLE',
                      'SETUP_RESERVED_FILE_COLLISION',
                      'SETUP_INSTALL_ALREADY_EXISTS',
                      'SETUP_INSTALL_ALREADY_RUNNING',
                      'SETUP_BLOCKED_',
                      'SETUP_RELATIVE_PATH_INVALID',
                      'SETUP_POST_OWNED_PRODUCT_MISMATCH',
                      'SETUP_INSTALL_ROOT_INVALID',
                      'SETUP_INSTALL_ROOT_VOLUME_ROOT',
                      'SETUP_INSTALL_ROOT_SYSTEM_FOLDER',
                      'SETUP_INSTALL_ROOT_PARENT_FILE',
                      'SETUP_INSTALL_ROOT_LINK',
                      'SETUP_STORAGE_LOCATIONS_OVERLAP',
                      'SETUP_LOCATIONS_SCHEMA_INVALID',
                      'SETUP_LOCATIONS_FIELD_',
                      'SETUP_LOCATIONS_STARTUP_MODE_INVALID',
                      'SETUP_STARTUP_SHORTCUT_CONFLICT',
                      'SETUP_START_MENU_SHORTCUT_CONFLICT',
                      'SETUP_WINDOWS_SHORTCUT_SERVICE_MISSING',
                      'SETUP_START_MENU_FOLDER_UNAVAILABLE',
                      'SETUP_DISK_PACKAGE_SIZE_UNKNOWN',
                      'SETUP_DISK_VOLUME_UNAVAILABLE',
                      'SETUP_PACKAGE_CHANGED_DURING_STAGE',
                      'SETUP_PACKAGE_MISSING',
                      'SETUP_PACKAGE_HASH_INVALID',
                      'SETUP_MANIFEST_HASH_INVALID',
                      'SETUP_MANIFEST_SCHEMA_INVALID',
                      'SETUP_LAYOUT_INVALID',
                      'SETUP_RESOURCE_HEADER_INVALID',
                      'SETUP_ZIP_FILE_COUNT_INVALID',
                      'SETUP_ZIP_LINK_FORBIDDEN',
                      'SETUP_ZIP_REGION_OUT_OF_BOUNDS',
                      'SETUP_STAGING_ESCAPE',
                      'SETUP_FILES_INVALID',
                      'SETUP_FILE_IDENTITY_INVALID',
                      'SETUP_FILE_LENGTH_INVALID',
                      'SETUP_ENTRYPOINT_MISSING',
                      'SETUP_PRODUCT_IDENTITY_INVALID',
                      'SETUP_PRODUCT_SCHEMA_INVALID',
                      'SETUP_SOURCE_IDENTITY_INVALID',
                      'SETUP_REQUIREMENTS_INVALID',
                      'SETUP_LOCATIONS_AUTHORITY_MISSING',
                      'SETUP_STAGED_ENTRYPOINT_MISSING'
                    )
                    $found=$false
                    foreach($safeCode in $safeCodes){
                      if($reason.StartsWith($safeCode,[StringComparison]::Ordinal)){
                        Write-Host ('PRIVATE_NATIVE_INSTALL_CAUSE_CODE='+$safeCode.TrimEnd('_'))
                        $found=$true
                        break
                      }
                    }
                    if(!$found){
                      $failureClass='OTHER'
                      if($reason -match '(?i)path.{0,32}too long|too long.{0,32}path|filename.{0,24}too long|longpath'){
                        $failureClass='PATH_TOO_LONG'
                      }elseif($reason -match '(?i)not enough space|disk is full|insufficient disk'){
                        $failureClass='DISK_SPACE'
                      }elseif($reason -match '(?i)access.{0,10}denied|unauthorizedaccess|permission denied'){
                        $failureClass='ACCESS_DENIED'
                      }elseif($reason -match '(?i)cannot find.{0,30}path|could not find.{0,30}path|part of the path'){
                        $failureClass='PATH_NOT_FOUND'
                      }elseif($reason -match '(?i)another process|sharing violation|being used by'){
                        $failureClass='FILE_LOCKED'
                      }elseif($reason -match '(?i)javascriptserializer|maxjsonlength|maximum.{0,20}json|json.{0,20}length'){
                        $failureClass='JSON_CAPACITY'
                      }elseif($reason -match '(?i)file.{0,12}already exists|already exists'){
                        $failureClass='FILE_ALREADY_EXISTS'
                      }elseif($reason -match '(?i)the system cannot find the file specified|the system cannot find the path specified|the directory name is invalid'){
                        $failureClass='WINDOWS_ENTRY_NOT_FOUND'
                      }elseif($reason -match '(?i)illegal characters in path|path contains invalid characters|filename.{0,30}syntax is incorrect'){
                        $failureClass='INVALID_PATH_SYNTAX'
                      }elseif($reason -match '(?i)the directory is not empty|directory not empty'){
                        $failureClass='DIRECTORY_NOT_EMPTY'
                      }elseif($reason -match '(?i)requested registry access is not allowed|access to the registry key'){
                        $failureClass='REGISTRY_ACCESS'
                      }elseif($reason -match '(?i)class not registered|0x80040154|cannot create activex component'){
                        $failureClass='SHELL_COM_UNAVAILABLE'
                      }elseif($reason -match '(?i)out of memory|insufficient memory|too many open files'){
                        $failureClass='RESOURCE_LIMIT'
                      }elseif($reason -match '(?i)key was not present in the dictionary|an item with the same key|index was out of range'){
                        $failureClass='COLLECTION_STATE'
                      }elseif($reason -match '(?i)object reference not set to an instance'){
                        $failureClass='NULL_REFERENCE'
                      }elseif($reason -match '(?i)cannot access a disposed object'){
                        $failureClass='DISPOSED_OBJECT'
                      }elseif($reason -match '(?i)invalid argument|argument.{0,40}invalid|value cannot be null'){
                        $failureClass='INVALID_ARGUMENT'
                      }elseif($reason -match '(?i)end of central directory|invalid.*zip archive|zip archive.*invalid'){
                        $failureClass='ZIP_STRUCTURE'
                      }elseif($reason.StartsWith('SETUP_',[StringComparison]::Ordinal)){
                        $failureClass='UNLISTED_ENGINE_CODE'
                      }elseif([string]::IsNullOrWhiteSpace($reason)){
                        $failureClass='MISSING_REASON'
                      }
                      Write-Host ('PRIVATE_NATIVE_INSTALL_CAUSE_CLASS='+$failureClass)
                    }
                  }else{
                    Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=NON_ERROR'
                  }
                }catch{
                  Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=UNREADABLE'
                }
              }else{
                Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=MISSING'
              }
              # The native candidate is private, but the explicitly allowed
              # SHA-256/size and verified pinned source revision can be
              # published even when the subsequent installation fails.
              $builtSetup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
              $releaseReceipt=Join-Path $nativeLogs 'private-setup-core-build.json'
              if((Test-Path -LiteralPath $builtSetup -PathType Leaf) -and
                 (Test-Path -LiteralPath $releaseReceipt -PathType Leaf)){
                try{
                  $built=Get-Content -LiteralPath $releaseReceipt -Raw -Encoding UTF8 | ConvertFrom-Json
                  if($built.status -ceq 'BUILT_UNQUALIFIED' -and
                     $built.private_source_commit -ceq $env:PRIVATE_SOURCE_SHA -and
                     $built.setup_sha256 -cmatch '^[0-9a-f]{64}$'){
                    $nativeStream=[IO.File]::OpenRead([IO.Path]::GetFullPath($builtSetup))
                    $sha=[Security.Cryptography.SHA256]::Create()
                    try{
                      $actual=([BitConverter]::ToString($sha.ComputeHash($nativeStream))).Replace('-','').ToLowerInvariant()
                    }finally{
                      $sha.Dispose()
                      $nativeStream.Dispose()
                    }
                    if($actual -ceq $built.setup_sha256){
                      Write-Host ('PRIVATE_NATIVE_SETUP_SHA256='+$actual)
                      Write-Host ('PRIVATE_NATIVE_SETUP_BYTES='+((Get-Item -LiteralPath $builtSetup -ErrorAction Stop).Length))
                    }else{
                      Write-Host 'PRIVATE_NATIVE_SETUP_DIGEST_MISMATCH'
                    }
                  }
                }catch{
                  Write-Host 'PRIVATE_NATIVE_SETUP_DIGEST_OBSERVATION_UNAVAILABLE'
                }
              }
            }
            if($raw -match 'full_qualification_step_failed_python-(targeted|full)_exit_([0-9]{1,3})'){
              Write-Host ('PRIVATE_PYTHON_EXIT_CODE='+$Matches[2])
            }
            # The Node TAP log stays private; output only counts and hashes.
            $nodeStdout=Join-Path $out 'evidence/desktop-node-tests.stdout.log'
            if(Test-Path -LiteralPath $nodeStdout -PathType Leaf){
              $nodePass=-1; $nodeFail=-1; $nodeIds=0
              foreach($line in [IO.File]::ReadLines($nodeStdout)){
                if($line -match '^# pass (\d{1,7})\s*$'){$nodePass=[int]$Matches[1]}
                if($line -match '^# fail (\d{1,7})\s*$'){$nodeFail=[int]$Matches[1]}
                if($line -match '^not ok \d+ - (.{1,350})$' -and $nodeIds -lt 12){
                  $bytes=[Text.Encoding]::UTF8.GetBytes($Matches[1].Trim())
                  $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
                  Write-Host ('PRIVATE_NODE_FAILED_ID_SHA256='+$hash)
                  $nodeIds++
                }
              }
              Write-Host ('PRIVATE_NODE_PASSED_COUNT='+$nodePass)
              Write-Host ('PRIVATE_NODE_FAILED_COUNT='+$nodeFail)
              Write-Host ('PRIVATE_NODE_FAILED_ID_COUNT='+$nodeIds)
            }
            # The pytest log remains private on the ephemeral worker. Public
            # output contains only bounded test identifiers, never captured
            # tracebacks, assertion values, task content, or provider data.
            $testStage=if($raw -match 'full_qualification_step_(?:failed|exit_unknown)_python-targeted'){'python-targeted'}else{'python-full'}
            $pytestLog=Join-Path $out ('evidence/'+$testStage+'.stdout.log')
            $pytestErr=Join-Path $out ('evidence/'+$testStage+'.stderr.log')
            if($raw -match 'full_qualification_step_exit_unknown_python-(targeted|full)'){
              Write-Host 'PRIVATE_PYTHON_EXIT_OBSERVATION=UNAVAILABLE'
            }
            if(Test-Path -LiteralPath $pytestLog -PathType Leaf){
              $outputText=Get-Content -LiteralPath $pytestLog -Raw -Encoding UTF8
              if($null -eq $outputText){$outputText=''}
              if($outputText -match '(\d{1,6})\s+passed'){Write-Host ('PRIVATE_PYTHON_PASSED_COUNT='+$Matches[1])}
              if($outputText -match '(\d{1,6})\s+failed'){Write-Host ('PRIVATE_PYTHON_FAILED_COUNT='+$Matches[1])}
              if($outputText -match 'INTERNALERROR'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=INTERNAL'}
              if($outputText -match 'ERROR collecting '){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=COLLECTION'}
              if($outputText -match 'unrecognized arguments|pytest: error:'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=ARGUMENTS'}
              if($outputText -match 'no tests ran'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=NO_TESTS'}
              if($outputText -match 'Traceback \(most recent call last\)'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=TRACEBACK_REDACTED'}
              Write-Host ('PRIVATE_PYTHON_STDOUT_BYTES='+([Text.Encoding]::UTF8.GetByteCount($outputText)))
            }else{Write-Host 'PRIVATE_PYTHON_STDOUT=NOT_FOUND'}
            if(Test-Path -LiteralPath $pytestErr -PathType Leaf){
              $errText=Get-Content -LiteralPath $pytestErr -Raw -Encoding UTF8
              if($null -eq $errText){$errText=''}
              if($errText -match 'unrecognized arguments|pytest: error:'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=ARGUMENTS'}
              if($errText -match 'Fatal Python error|INTERNALERROR'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=INTERNAL'}
              if($errText -match 'No module named pytest'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=PYTEST_MISSING'}
              Write-Host ('PRIVATE_PYTHON_STDERR_BYTES='+([Text.Encoding]::UTF8.GetByteCount($errText)))
            }else{Write-Host 'PRIVATE_PYTHON_STDERR=NOT_FOUND'}
            if(Test-Path -LiteralPath $pytestLog -PathType Leaf){
              $count=0
              $collections=0
              $locations=0
              $errors=0
              foreach($line in [IO.File]::ReadLines($pytestLog)){
                if($line -match '^(FAILED|ERROR)\s+(tests[/\\][A-Za-z0-9_/.\\:-]{1,220})\b'){
                  Write-Host ('PRIVATE_PYTHON_FAILED_TEST='+$Matches[2])
                  $count++
                }elseif($line -match '^ERROR collecting (tests[/\\][A-Za-z0-9_./\\-]{1,180}\.py)' -and $collections -lt 12){
                  Write-Host ('PRIVATE_PYTHON_COLLECTION_ERROR='+$Matches[1])
                  $collections++
                }elseif($line -match '^tests[/\\]([A-Za-z0-9_./\\-]{1,180}\.py):(\d{1,5}):' -and $locations -lt 12){
                  Write-Host ('PRIVATE_PYTHON_FAILURE_LOCATION='+$Matches[1]+':'+$Matches[2])
                  $locations++
                }elseif($line -match '^E\s+([A-Za-z][A-Za-z0-9_]*Error)\b' -and $errors -lt 12){
                  Write-Host ('PRIVATE_PYTHON_EXCEPTION_CLASS='+$Matches[1])
                  if($line -match '\[WinError (\d{1,4})\]'){
                    Write-Host ('PRIVATE_PYTHON_WINERROR='+$Matches[1])
                  }
                  if($line -match '^E\s+[A-Za-z][A-Za-z0-9_]*Error:\s+([a-z][a-z0-9_]{2,80})\s*$'){
                    Write-Host ('PRIVATE_PYTHON_ERROR_CODE='+$Matches[1])
                  }
                  $errors++
                }
                if($count -ge 20 -and $locations -ge 12 -and $errors -ge 12){break}
              }
              Write-Host ('PRIVATE_PYTHON_FAILURE_IDENTIFIERS_SHOWN='+$count)
              Write-Host ('PRIVATE_PYTHON_COLLECTION_IDENTIFIERS_SHOWN='+$collections)
            }
            throw 'PRIVATE_QUALIFICATION_NOT_ACCEPTED'
          }
          $resultPath=Join-Path $out 'result.json'
          if(!(Test-Path -LiteralPath $resultPath -PathType Leaf)){
            throw 'PRIVATE_QUALIFICATION_RESULT_MISSING'
          }
          $result=Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
          # The 0.5 candidate is a separate, explicitly marked product qualification.
          # Existing 0.4 release gates remain pinned and unchanged.
          $expectedProductVersion=if($env:PRIVATE_QA_TRIGGER -match ' agent05-full( |$)'){'0.5.0'}else{'0.4.0'}
          if($result.status -ne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or
             $result.source_commit -cne $env:PRIVATE_SOURCE_SHA -or
             $result.gui_task_result_full_acceptance -cne 'PASS' -or
             $result.gui_task_cold_independent_import -cne 'PASS' -or
             $result.model_result_transport_verified -cne 'PASS' -or
             $result.product_version -cne $expectedProductVersion -or
             ($expectedProductVersion -ceq '0.5.0' -and $result.native_real_upgrade_04_to_05_accepted -ne $true)){
            throw 'PRIVATE_QUALIFICATION_RESULT_UNVERIFIED'
          }
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if(!(Test-Path -LiteralPath $setup -PathType Leaf)){
            throw 'PRIVATE_QUALIFICATION_INSTALLER_MISSING'
          }
          $hash=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host 'PRIVATE_WINDOWS_SOURCE_AND_INSTALLED_SMOKE_PASS'
          Write-Host ('PRIVATE_SETUP_SHA256='+$hash)
          Write-Host ('PRIVATE_SOURCE_SHA='+$result.source_commit)
          Write-Host 'PRIVATE_GUI_TASK_RESULT_FULL_ACCEPTANCE=PASS'
          Write-Host 'PRIVATE_GUI_TASK_COLD_INDEPENDENT_IMPORT=PASS'
          Write-Host 'PRIVATE_MODEL_RESULT_TRANSPORT_VERIFIED=PASS'
          if($expectedProductVersion -ceq '0.5.0'){Write-Host 'PRIVATE_REAL_04_TO_05_UPGRADE=PASS'}
          Write-Host ('PRIVATE_PRODUCT_VERSION='+$expectedProductVersion)
          # Never upload private files, archives, windows screenshots, or logs.
      # Publish only after complete native installed acceptance, never as a public artifact.
      - name: Publish verified 0.4.0 Setup only to private Agent release
        if: ${{ contains(github.event.head_commit.message, ' private-release') && !contains(github.event.head_commit.message, ' private-release-v0.5') && !contains(github.event.head_commit.message, ' node-only') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IWXA_PRIVATE_RELEASE_TOKEN }}
          PRIVATE_SOURCE_SHA: ${{ steps.private-pin.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Faust-S/iwxa-personal-agent'
          $tag='v0.4.0'
          $fixed='2a2fdebf905b96ef88211692cc02f2a14069445b'
          if ($env:PRIVATE_SOURCE_SHA -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_NOT_FROZEN_0_4' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'PRIVATE_RELEASE_WRITE_TOKEN_NOT_CONFIGURED' }
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-product'
          if ((& git -C $root rev-parse HEAD).Trim() -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_MISMATCH' }
          $out=Join-Path $env:RUNNER_TEMP 'private-product-qualification'
          $receiptPath=Join-Path $out 'result.json'
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if (!(Test-Path -LiteralPath $receiptPath -PathType Leaf) -or !(Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_QUALIFIED_SETUP_MISSING'
          }
          $r=Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($r.status -cne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or $r.source_commit -cne $fixed -or
              $r.product_version -cne '0.4.0' -or $r.gui_task_result_full_acceptance -cne 'PASS' -or
              $r.gui_task_cold_independent_import -cne 'PASS' -or $r.model_result_transport_verified -cne 'PASS') {
            throw 'PRIVATE_RELEASE_WINDOWS_ACCEPTANCE_UNVERIFIED'
          }
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item -LiteralPath $setup).Length
          if ($bytes -lt 1000000 -or $digest -cnotmatch '^[0-9a-f]{64}$') { throw 'PRIVATE_RELEASE_BINARY_INVALID' }
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) { throw 'PRIVATE_RELEASE_GH_CLI_MISSING' }
          $privateLog=Join-Path $env:RUNNER_TEMP 'private-gh-release.log'
          & gh release view $tag --repo $repo --json tagName *> $privateLog
          if ($LASTEXITCODE -eq 0) { throw 'PRIVATE_RELEASE_TAG_EXISTS_NO_OVERWRITE' }
          $assetName='IWXA-Personal-Agent-0.4.0-Setup.exe'
          $sums=Join-Path $env:RUNNER_TEMP 'agent04-release-SHA256SUMS.txt'
          ($digest+'  '+$assetName) | Set-Content -LiteralPath $sums -Encoding ascii
          $notes=Join-Path $env:RUNNER_TEMP 'agent04-release-notes.md'
          @(
            'IWXA Personal Agent 0.4.0 for Windows. Full installed acceptance PASS.'
            ('Exact source SHA: '+$fixed)
            ('Installer SHA-256: '+$digest)
            ('Center Windows acceptance run: '+$env:GITHUB_RUN_ID)
            'Verified: local model transport, Task, Human Review, Result, cold independent .iwxa import.'
            'Model choice and reasoning effort remain user preferences; no subjective answer-quality gate.'
            'Private release asset only; public Center artifacts remain empty.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag ($setup+'#'+$assetName) ($sums+'#SHA256SUMS.txt') --repo $repo --target $fixed --title 'IWXA Personal Agent 0.4.0' --notes-file $notes --draft *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_DRAFT_UPLOAD_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft,targetCommitish,assets 2>$privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_READBACK_FAILED' }
          $published=$raw | ConvertFrom-Json
          $installer=@($published.assets | Where-Object { $_.name -ceq $assetName })
          $checksums=@($published.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
          if ($published.tagName -cne $tag -or !$published.isDraft -or $published.targetCommitish -cne $fixed -or
              $installer.Count -ne 1 -or [int64]$installer[0].size -ne $bytes -or $checksums.Count -ne 1) {
            throw 'PRIVATE_RELEASE_ASSET_READBACK_MISMATCH'
          }
          & gh release edit $tag --repo $repo --draft=false *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_PUBLISH_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft 2>$privateLog
          if ($LASTEXITCODE -ne 0 -or ($raw | ConvertFrom-Json).isDraft -ne $false) {
            throw 'PRIVATE_RELEASE_FINAL_READBACK_MISSING'
          }
          Write-Host 'PRIVATE_RELEASE_PRIVATE_REPO_UPLOAD=PASS'
          Write-Host ('PRIVATE_RELEASE_SETUP_SHA256='+$digest)
          Write-Host 'PRIVATE_RELEASE_ASSET_COUNT=2'
          Write-Host 'PRIVATE_RELEASE_VISIBILITY=PRIVATE'
      - name: Publish verified 0.5.0 Setup to private Agent release
        if: ${{ contains(github.event.head_commit.message, ' private-release-v0.5') && contains(github.event.head_commit.message, ' agent05-full') && !contains(github.event.head_commit.message, ' node-only') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IWXA_PRIVATE_RELEASE_TOKEN }}
          PRIVATE_SOURCE_SHA: ${{ steps.private-pin.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Faust-S/iwxa-personal-agent'
          $tag='v0.5.0'
          # Release is fail-closed: publish only after same-run native 0.5
          # first-launch, real 0.4 upgrade, Task/Review/Result and .iwxa PASS.
          $fixed='dd0d1c8bb7015e94ef109400fdfddc5f8d589b33'
          if ($env:PRIVATE_SOURCE_SHA -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_NOT_FROZEN_0_5' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'PRIVATE_RELEASE_WRITE_TOKEN_NOT_CONFIGURED' }
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-product'
          if ((& git -C $root rev-parse HEAD).Trim() -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_MISMATCH' }
          $out=Join-Path $env:RUNNER_TEMP 'private-product-qualification'
          $receiptPath=Join-Path $out 'result.json'
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if (!(Test-Path -LiteralPath $receiptPath -PathType Leaf) -or !(Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_QUALIFIED_SETUP_MISSING'
          }
          $r=Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $installedPath=Join-Path $out 'native-candidate/temporary-installed-fixture/installed-witness.json'
          if(!(Test-Path -LiteralPath $installedPath -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_INSTALLED_WITNESS_MISSING'
          }
          $installed=Get-Content -LiteralPath $installedPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if($installed.installed_native_cold_launch_verified -ne $true -or
             $installed.installed_start_menu_shortcut_verified -ne $true -or
             $installed.installed_real_qwen_task_review_verified -ne $true -or
             $installed.installed_k03_real_source_task_result_restart_verified -ne $true){
            throw 'PRIVATE_RELEASE_NATIVE_ACCEPTANCE_INCOMPLETE'
          }
          if ($r.status -cne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or $r.source_commit -cne $fixed -or
              $r.product_version -cne '0.5.0' -or
              $r.native_real_upgrade_04_to_05_accepted -ne $true -or
              $r.gui_task_result_full_acceptance -cne 'PASS' -or
              $r.gui_task_cold_independent_import -cne 'PASS' -or $r.model_result_transport_verified -cne 'PASS') {
            throw 'PRIVATE_RELEASE_WINDOWS_ACCEPTANCE_UNVERIFIED'
          }
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item -LiteralPath $setup).Length
          if ($bytes -lt 1000000 -or $digest -cnotmatch '^[0-9a-f]{64}$') { throw 'PRIVATE_RELEASE_BINARY_INVALID' }
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) { throw 'PRIVATE_RELEASE_GH_CLI_MISSING' }
          $privateLog=Join-Path $env:RUNNER_TEMP 'private-gh-release.log'
          & gh release view $tag --repo $repo --json tagName *> $privateLog
          if ($LASTEXITCODE -eq 0) { throw 'PRIVATE_RELEASE_TAG_EXISTS_NO_OVERWRITE' }
          $assetName='IWXA-Personal-Agent-0.5.0-Setup.exe'
          $sums=Join-Path $env:RUNNER_TEMP 'agent05-release-SHA256SUMS.txt'
          ($digest+'  '+$assetName) | Set-Content -LiteralPath $sums -Encoding ascii
          $notes=Join-Path $env:RUNNER_TEMP 'agent05-release-notes.md'
          @(
            'IWXA Personal Agent 0.5.0 for Windows. Full installed acceptance PASS.'
            ('Exact source SHA: '+$fixed)
            ('Installer SHA-256: '+$digest)
            ('Center Windows acceptance run: '+$env:GITHUB_RUN_ID)
            'Verified: actual upgrade from published 0.4.0 to 0.5.0 preserving data and shortcuts; native cold start; local model Task, Human Review, Result, K03, independent .iwxa import.'
            'Model choice and reasoning effort remain user preferences; no subjective answer-quality gate.'
            'Private release asset only; public Center artifacts remain empty.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag ($setup+'#'+$assetName) ($sums+'#SHA256SUMS.txt') --repo $repo --target $fixed --title 'IWXA Personal Agent 0.5.0' --notes-file $notes --draft *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_DRAFT_UPLOAD_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft,targetCommitish,assets 2>$privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_READBACK_FAILED' }
          $published=$raw | ConvertFrom-Json
          $installer=@($published.assets | Where-Object { $_.name -ceq $assetName })
          $checksums=@($published.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
          if ($published.tagName -cne $tag -or !$published.isDraft -or $published.targetCommitish -cne $fixed -or
              $installer.Count -ne 1 -or [int64]$installer[0].size -ne $bytes -or $checksums.Count -ne 1) {
            throw 'PRIVATE_RELEASE_ASSET_READBACK_MISMATCH'
          }
          # Re-download both private release assets and compare actual bytes
          # with the verified local Windows product before publishing.
          $readbackDir=Join-Path $env:RUNNER_TEMP 'agent05-private-release-readback'
          New-Item -Path $readbackDir -ItemType Directory -Force | Out-Null
          & gh release download $tag --repo $repo --pattern $assetName --dir $readbackDir --clobber *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_BINARY_REDOWNLOAD_FAILED' }
          $readbackExe=Join-Path $readbackDir $assetName
          if (!(Test-Path -LiteralPath $readbackExe -PathType Leaf) -or
              (Get-Item -LiteralPath $readbackExe).Length -ne $bytes -or
              (Get-FileHash -LiteralPath $readbackExe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) {
            throw 'PRIVATE_RELEASE_BINARY_REDOWNLOAD_MISMATCH'
          }
          & gh release download $tag --repo $repo --pattern SHA256SUMS.txt --dir $readbackDir --clobber *> $privateLog
          if ($LASTEXITCODE -ne 0 -or
              !(Test-Path -LiteralPath (Join-Path $readbackDir 'SHA256SUMS.txt') -PathType Leaf) -or
              [IO.File]::ReadAllText((Join-Path $readbackDir 'SHA256SUMS.txt')).Trim() -cne ($digest+'  '+$assetName)) {
            throw 'PRIVATE_RELEASE_CHECKSUM_REDOWNLOAD_MISMATCH'
          }
          & gh release edit $tag --repo $repo --draft=false *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_PUBLISH_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft 2>$privateLog
          if ($LASTEXITCODE -ne 0 -or ($raw | ConvertFrom-Json).isDraft -ne $false) {
            throw 'PRIVATE_RELEASE_FINAL_READBACK_MISSING'
          }
          Write-Host 'PRIVATE_RELEASE_PRIVATE_REPO_UPLOAD=PASS'
          Write-Host ('PRIVATE_RELEASE_SETUP_SHA256='+$digest)
          Write-Host 'PRIVATE_RELEASE_ASSET_COUNT=2'
          Write-Host 'PRIVATE_RELEASE_VISIBILITY=PRIVATE'
){
                  Write-Host ('PRIVATE_INSTALLED_K03_HTTP_REASON='+$Matches[1])
                }
              }
            }
            # The GUI witness uses one additional private status file.
            $guiStatus=Join-Path $out 'native-candidate/temporary-installed-fixture/native-gui-qwen.status'
            if(Test-Path -LiteralPath $guiStatus -PathType Leaf){
              $safeGuiMarkers=@('AGENT_REAL_QWEN_GUI_TASK_RESULT_PASS',
                                'AGENT_REAL_QWEN_GUI_SUBMIT_REVIEW_ACCEPTED_PASS',
                                'AGENT_REAL_QWEN_GUI_COLD_INDEPENDENT_IMPORT_PASS')
              foreach($line in [IO.File]::ReadLines($guiStatus)){
                if([string]$line -cin $safeGuiMarkers){
                  Write-Host ('PRIVATE_INSTALLED_GUI_CHECKPOINT='+[string]$line)
                }
              }
            }
            $raw=if(Test-Path -LiteralPath $err){Get-Content -LiteralPath $err -Raw}else{''}
            $code=[regex]::Match($raw,'(full_qualification_[a-z0-9_-]+|PRIVATE_SETUP_CORE_BUILD_FAIL|private_setup_[a-z0-9_-]+)')
            if($code.Success){Write-Host ('PRIVATE_QUALIFICATION_STAGE='+$code.Value)}
            else{Write-Host 'PRIVATE_QUALIFICATION_STAGE=UNCLASSIFIED'}
            if($raw -match 'full_qualification_step_failed_native-install-and-function'){
              $nativeLogs=Join-Path $out 'native-candidate/logs'
              $stages=[ordered]@{
                native_stub='native-setup-build.json'
                managed_python='test-python-bootstrap.log'
                desktop_icon='native-desktop-icon.json'
                u04_fetch='u04-source-preparation.json'
                u04_stage='u04-stage.json'
                node_dependencies='native-desktop-dependencies.log'
                tauri_build='native-desktop-build.log'
                payload='package-build-only.json'
                setup_resource='private-setup-core-build.json'
                installed_acceptance='public-test-local-result.txt'
              }
              foreach($stage in $stages.Keys){
                if(Test-Path -LiteralPath (Join-Path $nativeLogs $stages[$stage]) -PathType Leaf){
                  Write-Host ('PRIVATE_NATIVE_ATTEMPTED_STAGE='+$stage)
                }
              }
              $logPaths=@(
                (Join-Path $out 'evidence/native-install-and-function.stderr.log'),
                (Join-Path $out 'evidence/native-install-and-function.stdout.log'),
                (Join-Path $nativeLogs 'test-python-bootstrap.log'),
                (Join-Path $nativeLogs 'native-desktop-build.log'),
                (Join-Path $nativeLogs 'native-desktop-build.log.stderr'),
                (Join-Path $nativeLogs 'native-desktop-build.log.stderr'),
                (Join-Path $nativeLogs 'native-desktop-dependencies.log.stderr'),
                (Join-Path $nativeLogs 'package-build-only.json'),
                (Join-Path $nativeLogs 'private-setup-core-build.json'),
                (Join-Path $nativeLogs 'public-test-local-result.txt')
              )
              $codes=New-Object 'System.Collections.Generic.HashSet[string]'
              $classes=New-Object 'System.Collections.Generic.HashSet[string]'
              $setupNativeActions=New-Object 'System.Collections.Generic.HashSet[string]'
              $setupNativeReasons=New-Object 'System.Collections.Generic.HashSet[string]'
              foreach($lp in $logPaths){
                if(!(Test-Path -LiteralPath $lp -PathType Leaf)){continue}
                $scanned=0
                foreach($line in [IO.File]::ReadLines($lp)){
                  if(++$scanned -gt 30000){break}
                  if($line -match '\b((?:native_candidate|private_setup|agent_setup|full_qualification|windows_python|windows_runtime|windows_release)_[a-z0-9_]{3,90}|SETUP_LOCAL_[A-Z0-9_]{3,90})\b'){
                    $null=$codes.Add($Matches[1])
                  }
                  # A Setup Core native action may fail after creating its
                  # private JSON receipt. Emit only the explicit public CLI
                  # operation and an allowlisted Setup Core error identifier.
                  # Never print the native receipt, paths or exception text.
                  if($line -cmatch 'SETUP_LOCAL_NATIVE_FAILED_--(inspect|preflight|install-locations|verify-installed|locations|repair|confirm-upgrade|uninstall)-file_'){
                    $null=$setupNativeActions.Add($Matches[1].Replace('-','_').ToUpperInvariant())
                  }
                  if($line -cmatch 'SETUP_LOCAL_NATIVE_FAILED_--(?:inspect|preflight|install-locations|verify-installed|locations|repair|confirm-upgrade|uninstall)-file_(SETUP_[A-Z0-9_]{3,80})(?:\b|$)'){
                    $null=$setupNativeReasons.Add($Matches[1])
                  }
                  if($line -match 'error\[E\d{4}\]'){$null=$classes.Add('RUST_COMPILER')}
                  if($line -match 'error TS(\d{4})'){
                    $null=$classes.Add('TYPESCRIPT')
                    Write-Host ('PRIVATE_NATIVE_TS_CODE=TS'+$Matches[1])
                  }
                  if($line -match 'error\[E(\d{4})\]'){
                    $null=$classes.Add('RUST_COMPILER')
                    Write-Host ('PRIVATE_NATIVE_RUST_CODE=E'+$Matches[1])
                  }
                  if($line -match 'Cannot find module|module not found'){$null=$classes.Add('MODULE_NOT_FOUND')}
                  if($line -match 'linker|link\.exe'){$null=$classes.Add('LINKER')}
                  if($line -match 'failed to load|failed to resolve'){$null=$classes.Add('RESOURCE_RESOLUTION')}
                  if($line -match 'not recognized as the name|command not found'){$null=$classes.Add('MISSING_TOOL')}
                  if($line -match 'failed to parse|invalid config'){$null=$classes.Add('CONFIG_PARSE')}
                  if($line -match 'unresolved import'){$null=$classes.Add('UNRESOLVED_IMPORT')}
                  if($line -match 'npm ERR!|npm error'){$null=$classes.Add('NPM')}
                  if($line -match 'failed to compile|could not compile'){$null=$classes.Add('RUST_BUILD')}
                  if($line -match 'ECONNRESET|ETIMEDOUT|Could not resolve host'){$null=$classes.Add('NETWORK')}
                  if($line -match 'windows_runtime_wheel_fetch_failed'){$null=$classes.Add('WHEEL_FETCH')}
                  if($line -match 'windows_runtime_wheel_(?:requirements_mismatch|identity_invalid|platform_or_python_mismatch)'){$null=$classes.Add('WHEEL_CONTRACT')}
                  if($line -match 'windows_python_release_digest_mismatch'){$null=$classes.Add('PYTHON_ARCHIVE_SHA')}
                  if($line -match 'windows_python_release_post_provision_verification_failed'){$null=$classes.Add('PYTHON_EXECUTABLE')}
                  if($line -match 'Invoke-WebRequest|curl: \('){$null=$classes.Add('HTTP_DOWNLOAD')}
                  if($line -match 'windows_runtime_wheel_fetch_failed:([A-Za-z0-9._-]{1,48})'){
                    Write-Host ('PRIVATE_NATIVE_WHEEL_NAME='+$Matches[1])
                  }
                  # This exception concerns a public pinned PyPI wheel, not
                  # user data. Redact locations, links and digests before
                  # emitting one bounded diagnostic to the public CI log.
                  if($line -match 'windows_runtime_wheel_fetch_failed:attrs:([^\r\n]{1,320})'){
                    $cause=$Matches[1]
                    $cause=[regex]::Replace($cause,'(?i)(?:https?://|[a-z]:\\|\\\\)[^\s,;]+','[location]')
                    $cause=[regex]::Replace($cause,'(?i)\b[0-9a-f]{40,64}\b','[digest]')
                    $cause=[regex]::Replace($cause,'[^\x20-\x7e]','?')
                    if($cause.Length -gt 160){$cause=$cause.Substring(0,160)}
                    Write-Host ('PRIVATE_PUBLIC_WHEEL_ERROR_SUMMARY='+$cause)
                  }
                  if($line -match 'HTTP (403|404|429|500|502|503|504)|returned error: (403|404|429|500|502|503|504)'){
                    $null=$classes.Add('HTTP_STATUS')
                  }
                  if($line -match 'No such host|Could not resolve|Name or service not known'){
                    $null=$classes.Add('DNS')
                  }
                  if($line -match 'timed out|timeout|ETIMEDOUT'){
                    $null=$classes.Add('TIMEOUT')
                  }
                  if($line -match 'certificate|SSL|TLS'){
                    $null=$classes.Add('CERTIFICATE_OR_TLS')
                  }
                  if($line -match 'digest_mismatch'){
                    $null=$classes.Add('DIGEST_MISMATCH')
                  }
                }
              }
              foreach($item in @($codes) | Sort-Object | Select-Object -First 16){
                Write-Host ('PRIVATE_NATIVE_ERROR_CODE='+$item)
              }
              foreach($item in @($classes) | Sort-Object){
                Write-Host ('PRIVATE_NATIVE_ERROR_CLASS='+$item)
              }
              foreach($item in @($setupNativeActions) | Sort-Object | Select-Object -First 8){
                Write-Host ('PRIVATE_NATIVE_SETUP_OPERATION='+$item)
              }
              foreach($item in @($setupNativeReasons) | Sort-Object | Select-Object -First 8){
                Write-Host ('PRIVATE_NATIVE_SETUP_REASON_CODE='+$item)
              }
              # The private repair receipt is read ONLY inside the temporary
              # runner. Print a finite product-neutral category, never a path.
              $repairReceipt=Join-Path $out 'native-candidate/temporary-installed-fixture/repair.json'
              if(Test-Path -LiteralPath $repairReceipt -PathType Leaf){
                try {
                  $repair=Get-Content -LiteralPath $repairReceipt -Raw -Encoding UTF8|ConvertFrom-Json
                  $kind=[string]$repair.unownedCategory
                  if($repair.status -eq 'ERROR' -and $kind -cin @(
                     'WEBVIEW2_PROFILE','PYTHON_BYTECODE','DESKTOP_RUNTIME',
                     'PYTHON_OR_MODEL_RUNTIME','APPLICATION_STATE','OTHER')){
                    Write-Host ('PRIVATE_NATIVE_REPAIR_UNOWNED_CATEGORY='+$kind)
                  }
                } catch {
                  Write-Host 'PRIVATE_NATIVE_REPAIR_CATEGORY_READBACK=UNAVAILABLE'
                }
              }
              Write-Host ('PRIVATE_NATIVE_SETUP_OPERATIONS_OBSERVED='+$setupNativeActions.Count)
              Write-Host ('PRIVATE_NATIVE_ERROR_CODES_OBSERVED='+$codes.Count)
              # Native Setup Core writes the detailed reason only to a
              # private local receipt. Project to a STRICT finite set of
              # public-safe cause codes, never print the original string,
              # any paths, its JSON, a stack trace or user-controlled text.
              $installReceipt=Join-Path $out 'native-candidate/temporary-installed-fixture/installed.json'
              if(Test-Path -LiteralPath $installReceipt -PathType Leaf){
                try{
                  $install=Get-Content -LiteralPath $installReceipt -Raw -Encoding UTF8 | ConvertFrom-Json
                  if([string]$install.status -ceq 'ERROR'){
                    Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=ERROR'
                    # Only exact finite enums from the product-neutral native
                    # installer may be published. No raw reason/path/stack trace.
                    $nativeClass=[string]$install.exceptionClass
                    $nativePhase=[string]$install.installPhase
                    if($nativeClass -cin @('PATH_TOO_LONG','ACCESS_DENIED','COM','REFLECTION','SECURITY','INVALID_DATA','IO','INVALID_OPERATION','ARGUMENT','NOT_SUPPORTED','OTHER')){
                      Write-Host ('PRIVATE_NATIVE_INSTALL_EXCEPTION_CLASS='+$nativeClass)
                    }
                    if($nativePhase -cin @('STAGE_EXTRACTION','STORAGE_VALIDATION','ACTIVATION','REGISTRATION','SHORTCUT','SHORTCUT_FOLDER','SHORTCUT_STAGE_CREATE','SHORTCUT_CREATE_COM','SHORTCUT_TARGET','SHORTCUT_WORKING_DIR','SHORTCUT_DESCRIPTION','SHORTCUT_SAVE','SHORTCUT_READBACK','SHORTCUT_CLAIM','REQUEST_OR_PREFLIGHT')){
                      Write-Host ('PRIVATE_NATIVE_INSTALL_PHASE='+$nativePhase)
                    }
                    $reason=[string]$install.reason
                    $safeCodes=@(
                      'SETUP_DISK_SPACE_INSUFFICIENT',
                      'SETUP_EXTRACTED_SIZE_EXCEEDED',
                      'SETUP_ZIP_ENTRY_HASH_INVALID',
                      'SETUP_ZIP_ENTRY_LENGTH_INVALID',
                      'SETUP_ZIP_ENTRY_EXPANSION',
                      'SETUP_ZIP_ENTRY_UNKNOWN',
                      'SETUP_STAGING_ROOT_NOT_EMPTY_OR_UNTRUSTED',
                      'SETUP_ENTRYPOINT_NOT_STAGED',
                      'SETUP_STORAGE_VOLUME_UNAVAILABLE',
                      'SETUP_RESERVED_FILE_COLLISION',
                      'SETUP_INSTALL_ALREADY_EXISTS',
                      'SETUP_INSTALL_ALREADY_RUNNING',
                      'SETUP_BLOCKED_',
                      'SETUP_RELATIVE_PATH_INVALID',
                      'SETUP_POST_OWNED_PRODUCT_MISMATCH',
                      'SETUP_INSTALL_ROOT_INVALID',
                      'SETUP_INSTALL_ROOT_VOLUME_ROOT',
                      'SETUP_INSTALL_ROOT_SYSTEM_FOLDER',
                      'SETUP_INSTALL_ROOT_PARENT_FILE',
                      'SETUP_INSTALL_ROOT_LINK',
                      'SETUP_STORAGE_LOCATIONS_OVERLAP',
                      'SETUP_LOCATIONS_SCHEMA_INVALID',
                      'SETUP_LOCATIONS_FIELD_',
                      'SETUP_LOCATIONS_STARTUP_MODE_INVALID',
                      'SETUP_STARTUP_SHORTCUT_CONFLICT',
                      'SETUP_START_MENU_SHORTCUT_CONFLICT',
                      'SETUP_WINDOWS_SHORTCUT_SERVICE_MISSING',
                      'SETUP_START_MENU_FOLDER_UNAVAILABLE',
                      'SETUP_DISK_PACKAGE_SIZE_UNKNOWN',
                      'SETUP_DISK_VOLUME_UNAVAILABLE',
                      'SETUP_PACKAGE_CHANGED_DURING_STAGE',
                      'SETUP_PACKAGE_MISSING',
                      'SETUP_PACKAGE_HASH_INVALID',
                      'SETUP_MANIFEST_HASH_INVALID',
                      'SETUP_MANIFEST_SCHEMA_INVALID',
                      'SETUP_LAYOUT_INVALID',
                      'SETUP_RESOURCE_HEADER_INVALID',
                      'SETUP_ZIP_FILE_COUNT_INVALID',
                      'SETUP_ZIP_LINK_FORBIDDEN',
                      'SETUP_ZIP_REGION_OUT_OF_BOUNDS',
                      'SETUP_STAGING_ESCAPE',
                      'SETUP_FILES_INVALID',
                      'SETUP_FILE_IDENTITY_INVALID',
                      'SETUP_FILE_LENGTH_INVALID',
                      'SETUP_ENTRYPOINT_MISSING',
                      'SETUP_PRODUCT_IDENTITY_INVALID',
                      'SETUP_PRODUCT_SCHEMA_INVALID',
                      'SETUP_SOURCE_IDENTITY_INVALID',
                      'SETUP_REQUIREMENTS_INVALID',
                      'SETUP_LOCATIONS_AUTHORITY_MISSING',
                      'SETUP_STAGED_ENTRYPOINT_MISSING'
                    )
                    $found=$false
                    foreach($safeCode in $safeCodes){
                      if($reason.StartsWith($safeCode,[StringComparison]::Ordinal)){
                        Write-Host ('PRIVATE_NATIVE_INSTALL_CAUSE_CODE='+$safeCode.TrimEnd('_'))
                        $found=$true
                        break
                      }
                    }
                    if(!$found){
                      $failureClass='OTHER'
                      if($reason -match '(?i)path.{0,32}too long|too long.{0,32}path|filename.{0,24}too long|longpath'){
                        $failureClass='PATH_TOO_LONG'
                      }elseif($reason -match '(?i)not enough space|disk is full|insufficient disk'){
                        $failureClass='DISK_SPACE'
                      }elseif($reason -match '(?i)access.{0,10}denied|unauthorizedaccess|permission denied'){
                        $failureClass='ACCESS_DENIED'
                      }elseif($reason -match '(?i)cannot find.{0,30}path|could not find.{0,30}path|part of the path'){
                        $failureClass='PATH_NOT_FOUND'
                      }elseif($reason -match '(?i)another process|sharing violation|being used by'){
                        $failureClass='FILE_LOCKED'
                      }elseif($reason -match '(?i)javascriptserializer|maxjsonlength|maximum.{0,20}json|json.{0,20}length'){
                        $failureClass='JSON_CAPACITY'
                      }elseif($reason -match '(?i)file.{0,12}already exists|already exists'){
                        $failureClass='FILE_ALREADY_EXISTS'
                      }elseif($reason -match '(?i)the system cannot find the file specified|the system cannot find the path specified|the directory name is invalid'){
                        $failureClass='WINDOWS_ENTRY_NOT_FOUND'
                      }elseif($reason -match '(?i)illegal characters in path|path contains invalid characters|filename.{0,30}syntax is incorrect'){
                        $failureClass='INVALID_PATH_SYNTAX'
                      }elseif($reason -match '(?i)the directory is not empty|directory not empty'){
                        $failureClass='DIRECTORY_NOT_EMPTY'
                      }elseif($reason -match '(?i)requested registry access is not allowed|access to the registry key'){
                        $failureClass='REGISTRY_ACCESS'
                      }elseif($reason -match '(?i)class not registered|0x80040154|cannot create activex component'){
                        $failureClass='SHELL_COM_UNAVAILABLE'
                      }elseif($reason -match '(?i)out of memory|insufficient memory|too many open files'){
                        $failureClass='RESOURCE_LIMIT'
                      }elseif($reason -match '(?i)key was not present in the dictionary|an item with the same key|index was out of range'){
                        $failureClass='COLLECTION_STATE'
                      }elseif($reason -match '(?i)object reference not set to an instance'){
                        $failureClass='NULL_REFERENCE'
                      }elseif($reason -match '(?i)cannot access a disposed object'){
                        $failureClass='DISPOSED_OBJECT'
                      }elseif($reason -match '(?i)invalid argument|argument.{0,40}invalid|value cannot be null'){
                        $failureClass='INVALID_ARGUMENT'
                      }elseif($reason -match '(?i)end of central directory|invalid.*zip archive|zip archive.*invalid'){
                        $failureClass='ZIP_STRUCTURE'
                      }elseif($reason.StartsWith('SETUP_',[StringComparison]::Ordinal)){
                        $failureClass='UNLISTED_ENGINE_CODE'
                      }elseif([string]::IsNullOrWhiteSpace($reason)){
                        $failureClass='MISSING_REASON'
                      }
                      Write-Host ('PRIVATE_NATIVE_INSTALL_CAUSE_CLASS='+$failureClass)
                    }
                  }else{
                    Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=NON_ERROR'
                  }
                }catch{
                  Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=UNREADABLE'
                }
              }else{
                Write-Host 'PRIVATE_NATIVE_INSTALL_RECEIPT=MISSING'
              }
              # The native candidate is private, but the explicitly allowed
              # SHA-256/size and verified pinned source revision can be
              # published even when the subsequent installation fails.
              $builtSetup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
              $releaseReceipt=Join-Path $nativeLogs 'private-setup-core-build.json'
              if((Test-Path -LiteralPath $builtSetup -PathType Leaf) -and
                 (Test-Path -LiteralPath $releaseReceipt -PathType Leaf)){
                try{
                  $built=Get-Content -LiteralPath $releaseReceipt -Raw -Encoding UTF8 | ConvertFrom-Json
                  if($built.status -ceq 'BUILT_UNQUALIFIED' -and
                     $built.private_source_commit -ceq $env:PRIVATE_SOURCE_SHA -and
                     $built.setup_sha256 -cmatch '^[0-9a-f]{64}$'){
                    $nativeStream=[IO.File]::OpenRead([IO.Path]::GetFullPath($builtSetup))
                    $sha=[Security.Cryptography.SHA256]::Create()
                    try{
                      $actual=([BitConverter]::ToString($sha.ComputeHash($nativeStream))).Replace('-','').ToLowerInvariant()
                    }finally{
                      $sha.Dispose()
                      $nativeStream.Dispose()
                    }
                    if($actual -ceq $built.setup_sha256){
                      Write-Host ('PRIVATE_NATIVE_SETUP_SHA256='+$actual)
                      Write-Host ('PRIVATE_NATIVE_SETUP_BYTES='+((Get-Item -LiteralPath $builtSetup -ErrorAction Stop).Length))
                    }else{
                      Write-Host 'PRIVATE_NATIVE_SETUP_DIGEST_MISMATCH'
                    }
                  }
                }catch{
                  Write-Host 'PRIVATE_NATIVE_SETUP_DIGEST_OBSERVATION_UNAVAILABLE'
                }
              }
            }
            if($raw -match 'full_qualification_step_failed_python-(targeted|full)_exit_([0-9]{1,3})'){
              Write-Host ('PRIVATE_PYTHON_EXIT_CODE='+$Matches[2])
            }
            # The Node TAP log stays private; output only counts and hashes.
            $nodeStdout=Join-Path $out 'evidence/desktop-node-tests.stdout.log'
            if(Test-Path -LiteralPath $nodeStdout -PathType Leaf){
              $nodePass=-1; $nodeFail=-1; $nodeIds=0
              foreach($line in [IO.File]::ReadLines($nodeStdout)){
                if($line -match '^# pass (\d{1,7})\s*$'){$nodePass=[int]$Matches[1]}
                if($line -match '^# fail (\d{1,7})\s*$'){$nodeFail=[int]$Matches[1]}
                if($line -match '^not ok \d+ - (.{1,350})$' -and $nodeIds -lt 12){
                  $bytes=[Text.Encoding]::UTF8.GetBytes($Matches[1].Trim())
                  $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
                  Write-Host ('PRIVATE_NODE_FAILED_ID_SHA256='+$hash)
                  $nodeIds++
                }
              }
              Write-Host ('PRIVATE_NODE_PASSED_COUNT='+$nodePass)
              Write-Host ('PRIVATE_NODE_FAILED_COUNT='+$nodeFail)
              Write-Host ('PRIVATE_NODE_FAILED_ID_COUNT='+$nodeIds)
            }
            # The pytest log remains private on the ephemeral worker. Public
            # output contains only bounded test identifiers, never captured
            # tracebacks, assertion values, task content, or provider data.
            $testStage=if($raw -match 'full_qualification_step_(?:failed|exit_unknown)_python-targeted'){'python-targeted'}else{'python-full'}
            $pytestLog=Join-Path $out ('evidence/'+$testStage+'.stdout.log')
            $pytestErr=Join-Path $out ('evidence/'+$testStage+'.stderr.log')
            if($raw -match 'full_qualification_step_exit_unknown_python-(targeted|full)'){
              Write-Host 'PRIVATE_PYTHON_EXIT_OBSERVATION=UNAVAILABLE'
            }
            if(Test-Path -LiteralPath $pytestLog -PathType Leaf){
              $outputText=Get-Content -LiteralPath $pytestLog -Raw -Encoding UTF8
              if($null -eq $outputText){$outputText=''}
              if($outputText -match '(\d{1,6})\s+passed'){Write-Host ('PRIVATE_PYTHON_PASSED_COUNT='+$Matches[1])}
              if($outputText -match '(\d{1,6})\s+failed'){Write-Host ('PRIVATE_PYTHON_FAILED_COUNT='+$Matches[1])}
              if($outputText -match 'INTERNALERROR'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=INTERNAL'}
              if($outputText -match 'ERROR collecting '){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=COLLECTION'}
              if($outputText -match 'unrecognized arguments|pytest: error:'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=ARGUMENTS'}
              if($outputText -match 'no tests ran'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=NO_TESTS'}
              if($outputText -match 'Traceback \(most recent call last\)'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=TRACEBACK_REDACTED'}
              Write-Host ('PRIVATE_PYTHON_STDOUT_BYTES='+([Text.Encoding]::UTF8.GetByteCount($outputText)))
            }else{Write-Host 'PRIVATE_PYTHON_STDOUT=NOT_FOUND'}
            if(Test-Path -LiteralPath $pytestErr -PathType Leaf){
              $errText=Get-Content -LiteralPath $pytestErr -Raw -Encoding UTF8
              if($null -eq $errText){$errText=''}
              if($errText -match 'unrecognized arguments|pytest: error:'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=ARGUMENTS'}
              if($errText -match 'Fatal Python error|INTERNALERROR'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=INTERNAL'}
              if($errText -match 'No module named pytest'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=PYTEST_MISSING'}
              Write-Host ('PRIVATE_PYTHON_STDERR_BYTES='+([Text.Encoding]::UTF8.GetByteCount($errText)))
            }else{Write-Host 'PRIVATE_PYTHON_STDERR=NOT_FOUND'}
            if(Test-Path -LiteralPath $pytestLog -PathType Leaf){
              $count=0
              $collections=0
              $locations=0
              $errors=0
              foreach($line in [IO.File]::ReadLines($pytestLog)){
                if($line -match '^(FAILED|ERROR)\s+(tests[/\\][A-Za-z0-9_/.\\:-]{1,220})\b'){
                  Write-Host ('PRIVATE_PYTHON_FAILED_TEST='+$Matches[2])
                  $count++
                }elseif($line -match '^ERROR collecting (tests[/\\][A-Za-z0-9_./\\-]{1,180}\.py)' -and $collections -lt 12){
                  Write-Host ('PRIVATE_PYTHON_COLLECTION_ERROR='+$Matches[1])
                  $collections++
                }elseif($line -match '^tests[/\\]([A-Za-z0-9_./\\-]{1,180}\.py):(\d{1,5}):' -and $locations -lt 12){
                  Write-Host ('PRIVATE_PYTHON_FAILURE_LOCATION='+$Matches[1]+':'+$Matches[2])
                  $locations++
                }elseif($line -match '^E\s+([A-Za-z][A-Za-z0-9_]*Error)\b' -and $errors -lt 12){
                  Write-Host ('PRIVATE_PYTHON_EXCEPTION_CLASS='+$Matches[1])
                  if($line -match '\[WinError (\d{1,4})\]'){
                    Write-Host ('PRIVATE_PYTHON_WINERROR='+$Matches[1])
                  }
                  if($line -match '^E\s+[A-Za-z][A-Za-z0-9_]*Error:\s+([a-z][a-z0-9_]{2,80})\s*$'){
                    Write-Host ('PRIVATE_PYTHON_ERROR_CODE='+$Matches[1])
                  }
                  $errors++
                }
                if($count -ge 20 -and $locations -ge 12 -and $errors -ge 12){break}
              }
              Write-Host ('PRIVATE_PYTHON_FAILURE_IDENTIFIERS_SHOWN='+$count)
              Write-Host ('PRIVATE_PYTHON_COLLECTION_IDENTIFIERS_SHOWN='+$collections)
            }
            throw 'PRIVATE_QUALIFICATION_NOT_ACCEPTED'
          }
          $resultPath=Join-Path $out 'result.json'
          if(!(Test-Path -LiteralPath $resultPath -PathType Leaf)){
            throw 'PRIVATE_QUALIFICATION_RESULT_MISSING'
          }
          $result=Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
          # The 0.5 candidate is a separate, explicitly marked product qualification.
          # Existing 0.4 release gates remain pinned and unchanged.
          $expectedProductVersion=if($env:PRIVATE_QA_TRIGGER -match ' agent05-full( |$)'){'0.5.0'}else{'0.4.0'}
          if($result.status -ne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or
             $result.source_commit -cne $env:PRIVATE_SOURCE_SHA -or
             $result.gui_task_result_full_acceptance -cne 'PASS' -or
             $result.gui_task_cold_independent_import -cne 'PASS' -or
             $result.model_result_transport_verified -cne 'PASS' -or
             $result.product_version -cne $expectedProductVersion -or
             ($expectedProductVersion -ceq '0.5.0' -and $result.native_real_upgrade_04_to_05_accepted -ne $true)){
            throw 'PRIVATE_QUALIFICATION_RESULT_UNVERIFIED'
          }
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if(!(Test-Path -LiteralPath $setup -PathType Leaf)){
            throw 'PRIVATE_QUALIFICATION_INSTALLER_MISSING'
          }
          $hash=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host 'PRIVATE_WINDOWS_SOURCE_AND_INSTALLED_SMOKE_PASS'
          Write-Host ('PRIVATE_SETUP_SHA256='+$hash)
          Write-Host ('PRIVATE_SOURCE_SHA='+$result.source_commit)
          Write-Host 'PRIVATE_GUI_TASK_RESULT_FULL_ACCEPTANCE=PASS'
          Write-Host 'PRIVATE_GUI_TASK_COLD_INDEPENDENT_IMPORT=PASS'
          Write-Host 'PRIVATE_MODEL_RESULT_TRANSPORT_VERIFIED=PASS'
          if($expectedProductVersion -ceq '0.5.0'){Write-Host 'PRIVATE_REAL_04_TO_05_UPGRADE=PASS'}
          Write-Host ('PRIVATE_PRODUCT_VERSION='+$expectedProductVersion)
          # Never upload private files, archives, windows screenshots, or logs.
      # Publish only after complete native installed acceptance, never as a public artifact.
      - name: Publish verified 0.4.0 Setup only to private Agent release
        if: ${{ contains(github.event.head_commit.message, ' private-release') && !contains(github.event.head_commit.message, ' private-release-v0.5') && !contains(github.event.head_commit.message, ' node-only') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IWXA_PRIVATE_RELEASE_TOKEN }}
          PRIVATE_SOURCE_SHA: ${{ steps.private-pin.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Faust-S/iwxa-personal-agent'
          $tag='v0.4.0'
          $fixed='2a2fdebf905b96ef88211692cc02f2a14069445b'
          if ($env:PRIVATE_SOURCE_SHA -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_NOT_FROZEN_0_4' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'PRIVATE_RELEASE_WRITE_TOKEN_NOT_CONFIGURED' }
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-product'
          if ((& git -C $root rev-parse HEAD).Trim() -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_MISMATCH' }
          $out=Join-Path $env:RUNNER_TEMP 'private-product-qualification'
          $receiptPath=Join-Path $out 'result.json'
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if (!(Test-Path -LiteralPath $receiptPath -PathType Leaf) -or !(Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_QUALIFIED_SETUP_MISSING'
          }
          $r=Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($r.status -cne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or $r.source_commit -cne $fixed -or
              $r.product_version -cne '0.4.0' -or $r.gui_task_result_full_acceptance -cne 'PASS' -or
              $r.gui_task_cold_independent_import -cne 'PASS' -or $r.model_result_transport_verified -cne 'PASS') {
            throw 'PRIVATE_RELEASE_WINDOWS_ACCEPTANCE_UNVERIFIED'
          }
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item -LiteralPath $setup).Length
          if ($bytes -lt 1000000 -or $digest -cnotmatch '^[0-9a-f]{64}$') { throw 'PRIVATE_RELEASE_BINARY_INVALID' }
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) { throw 'PRIVATE_RELEASE_GH_CLI_MISSING' }
          $privateLog=Join-Path $env:RUNNER_TEMP 'private-gh-release.log'
          & gh release view $tag --repo $repo --json tagName *> $privateLog
          if ($LASTEXITCODE -eq 0) { throw 'PRIVATE_RELEASE_TAG_EXISTS_NO_OVERWRITE' }
          $assetName='IWXA-Personal-Agent-0.4.0-Setup.exe'
          $sums=Join-Path $env:RUNNER_TEMP 'agent04-release-SHA256SUMS.txt'
          ($digest+'  '+$assetName) | Set-Content -LiteralPath $sums -Encoding ascii
          $notes=Join-Path $env:RUNNER_TEMP 'agent04-release-notes.md'
          @(
            'IWXA Personal Agent 0.4.0 for Windows. Full installed acceptance PASS.'
            ('Exact source SHA: '+$fixed)
            ('Installer SHA-256: '+$digest)
            ('Center Windows acceptance run: '+$env:GITHUB_RUN_ID)
            'Verified: local model transport, Task, Human Review, Result, cold independent .iwxa import.'
            'Model choice and reasoning effort remain user preferences; no subjective answer-quality gate.'
            'Private release asset only; public Center artifacts remain empty.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag ($setup+'#'+$assetName) ($sums+'#SHA256SUMS.txt') --repo $repo --target $fixed --title 'IWXA Personal Agent 0.4.0' --notes-file $notes --draft *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_DRAFT_UPLOAD_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft,targetCommitish,assets 2>$privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_READBACK_FAILED' }
          $published=$raw | ConvertFrom-Json
          $installer=@($published.assets | Where-Object { $_.name -ceq $assetName })
          $checksums=@($published.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
          if ($published.tagName -cne $tag -or !$published.isDraft -or $published.targetCommitish -cne $fixed -or
              $installer.Count -ne 1 -or [int64]$installer[0].size -ne $bytes -or $checksums.Count -ne 1) {
            throw 'PRIVATE_RELEASE_ASSET_READBACK_MISMATCH'
          }
          & gh release edit $tag --repo $repo --draft=false *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_PUBLISH_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft 2>$privateLog
          if ($LASTEXITCODE -ne 0 -or ($raw | ConvertFrom-Json).isDraft -ne $false) {
            throw 'PRIVATE_RELEASE_FINAL_READBACK_MISSING'
          }
          Write-Host 'PRIVATE_RELEASE_PRIVATE_REPO_UPLOAD=PASS'
          Write-Host ('PRIVATE_RELEASE_SETUP_SHA256='+$digest)
          Write-Host 'PRIVATE_RELEASE_ASSET_COUNT=2'
          Write-Host 'PRIVATE_RELEASE_VISIBILITY=PRIVATE'
      - name: Publish verified 0.5.0 Setup to private Agent release
        if: ${{ contains(github.event.head_commit.message, ' private-release-v0.5') && contains(github.event.head_commit.message, ' agent05-full') && !contains(github.event.head_commit.message, ' node-only') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.IWXA_PRIVATE_RELEASE_TOKEN }}
          PRIVATE_SOURCE_SHA: ${{ steps.private-pin.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $repo='Faust-S/iwxa-personal-agent'
          $tag='v0.5.0'
          # Release is fail-closed: publish only after same-run native 0.5
          # first-launch, real 0.4 upgrade, Task/Review/Result and .iwxa PASS.
          $fixed='dd0d1c8bb7015e94ef109400fdfddc5f8d589b33'
          if ($env:PRIVATE_SOURCE_SHA -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_NOT_FROZEN_0_5' }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'PRIVATE_RELEASE_WRITE_TOKEN_NOT_CONFIGURED' }
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-product'
          if ((& git -C $root rev-parse HEAD).Trim() -cne $fixed) { throw 'PRIVATE_RELEASE_SOURCE_MISMATCH' }
          $out=Join-Path $env:RUNNER_TEMP 'private-product-qualification'
          $receiptPath=Join-Path $out 'result.json'
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if (!(Test-Path -LiteralPath $receiptPath -PathType Leaf) -or !(Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_QUALIFIED_SETUP_MISSING'
          }
          $r=Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $installedPath=Join-Path $out 'native-candidate/temporary-installed-fixture/installed-witness.json'
          if(!(Test-Path -LiteralPath $installedPath -PathType Leaf)) {
            throw 'PRIVATE_RELEASE_INSTALLED_WITNESS_MISSING'
          }
          $installed=Get-Content -LiteralPath $installedPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if($installed.installed_native_cold_launch_verified -ne $true -or
             $installed.installed_start_menu_shortcut_verified -ne $true -or
             $installed.installed_real_qwen_task_review_verified -ne $true -or
             $installed.installed_k03_real_source_task_result_restart_verified -ne $true){
            throw 'PRIVATE_RELEASE_NATIVE_ACCEPTANCE_INCOMPLETE'
          }
          if ($r.status -cne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or $r.source_commit -cne $fixed -or
              $r.product_version -cne '0.5.0' -or
              $r.native_real_upgrade_04_to_05_accepted -ne $true -or
              $r.gui_task_result_full_acceptance -cne 'PASS' -or
              $r.gui_task_cold_independent_import -cne 'PASS' -or $r.model_result_transport_verified -cne 'PASS') {
            throw 'PRIVATE_RELEASE_WINDOWS_ACCEPTANCE_UNVERIFIED'
          }
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes=(Get-Item -LiteralPath $setup).Length
          if ($bytes -lt 1000000 -or $digest -cnotmatch '^[0-9a-f]{64}$') { throw 'PRIVATE_RELEASE_BINARY_INVALID' }
          if (!(Get-Command gh -ErrorAction SilentlyContinue)) { throw 'PRIVATE_RELEASE_GH_CLI_MISSING' }
          $privateLog=Join-Path $env:RUNNER_TEMP 'private-gh-release.log'
          & gh release view $tag --repo $repo --json tagName *> $privateLog
          if ($LASTEXITCODE -eq 0) { throw 'PRIVATE_RELEASE_TAG_EXISTS_NO_OVERWRITE' }
          $assetName='IWXA-Personal-Agent-0.5.0-Setup.exe'
          $sums=Join-Path $env:RUNNER_TEMP 'agent05-release-SHA256SUMS.txt'
          ($digest+'  '+$assetName) | Set-Content -LiteralPath $sums -Encoding ascii
          $notes=Join-Path $env:RUNNER_TEMP 'agent05-release-notes.md'
          @(
            'IWXA Personal Agent 0.5.0 for Windows. Full installed acceptance PASS.'
            ('Exact source SHA: '+$fixed)
            ('Installer SHA-256: '+$digest)
            ('Center Windows acceptance run: '+$env:GITHUB_RUN_ID)
            'Verified: actual upgrade from published 0.4.0 to 0.5.0 preserving data and shortcuts; native cold start; local model Task, Human Review, Result, K03, independent .iwxa import.'
            'Model choice and reasoning effort remain user preferences; no subjective answer-quality gate.'
            'Private release asset only; public Center artifacts remain empty.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          & gh release create $tag ($setup+'#'+$assetName) ($sums+'#SHA256SUMS.txt') --repo $repo --target $fixed --title 'IWXA Personal Agent 0.5.0' --notes-file $notes --draft *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_DRAFT_UPLOAD_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft,targetCommitish,assets 2>$privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_READBACK_FAILED' }
          $published=$raw | ConvertFrom-Json
          $installer=@($published.assets | Where-Object { $_.name -ceq $assetName })
          $checksums=@($published.assets | Where-Object { $_.name -ceq 'SHA256SUMS.txt' })
          if ($published.tagName -cne $tag -or !$published.isDraft -or $published.targetCommitish -cne $fixed -or
              $installer.Count -ne 1 -or [int64]$installer[0].size -ne $bytes -or $checksums.Count -ne 1) {
            throw 'PRIVATE_RELEASE_ASSET_READBACK_MISMATCH'
          }
          # Re-download both private release assets and compare actual bytes
          # with the verified local Windows product before publishing.
          $readbackDir=Join-Path $env:RUNNER_TEMP 'agent05-private-release-readback'
          New-Item -Path $readbackDir -ItemType Directory -Force | Out-Null
          & gh release download $tag --repo $repo --pattern $assetName --dir $readbackDir --clobber *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_BINARY_REDOWNLOAD_FAILED' }
          $readbackExe=Join-Path $readbackDir $assetName
          if (!(Test-Path -LiteralPath $readbackExe -PathType Leaf) -or
              (Get-Item -LiteralPath $readbackExe).Length -ne $bytes -or
              (Get-FileHash -LiteralPath $readbackExe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest) {
            throw 'PRIVATE_RELEASE_BINARY_REDOWNLOAD_MISMATCH'
          }
          & gh release download $tag --repo $repo --pattern SHA256SUMS.txt --dir $readbackDir --clobber *> $privateLog
          if ($LASTEXITCODE -ne 0 -or
              !(Test-Path -LiteralPath (Join-Path $readbackDir 'SHA256SUMS.txt') -PathType Leaf) -or
              [IO.File]::ReadAllText((Join-Path $readbackDir 'SHA256SUMS.txt')).Trim() -cne ($digest+'  '+$assetName)) {
            throw 'PRIVATE_RELEASE_CHECKSUM_REDOWNLOAD_MISMATCH'
          }
          & gh release edit $tag --repo $repo --draft=false *> $privateLog
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_RELEASE_PUBLISH_FAILED' }
          $raw=& gh release view $tag --repo $repo --json tagName,isDraft 2>$privateLog
          if ($LASTEXITCODE -ne 0 -or ($raw | ConvertFrom-Json).isDraft -ne $false) {
            throw 'PRIVATE_RELEASE_FINAL_READBACK_MISSING'
          }
          Write-Host 'PRIVATE_RELEASE_PRIVATE_REPO_UPLOAD=PASS'
          Write-Host ('PRIVATE_RELEASE_SETUP_SHA256='+$digest)
          Write-Host 'PRIVATE_RELEASE_ASSET_COUNT=2'
          Write-Host 'PRIVATE_RELEASE_VISIBILITY=PRIVATE'
