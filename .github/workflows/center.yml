name: Center source and desktop
on:
  push:
    branches: ['ci/once/center/*']
    paths: ['.github/ci-requests/center.json']
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [full, ui, legacy, webview2, atlas-native]
        default: full
        required: true
      prepared_sha:
        description: Exact prepared commit SHA
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: iwxa-center-qualification
  cancel-in-progress: false
env:
  CENTER_ATLAS_PIN: 'ec2a48aecb2efe1ca3a97739977be6992d4b8a60'
  CENTER_BRTEST_PIN: '7cfb17870042cac824644140b7f0a587e244a20e'
  CENTER_SETUP_PIN: '0ef7544e2a6fd5fab5994f7f25abbb960063908c'
  CENTER_T3_PIN: '962cff41fdbfc864c4c15010b9ffa7e9bc43c29c'
  CENTER_ONE_CORE_PIN: '4e7c8a9370f302a711e52aa80adaa314f2d52f02'
jobs:
  request:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false) }}
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.admit.outputs.profile }}
      prepared_sha: ${{ steps.admit.outputs.prepared_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-shot request before builds or private access
        id: admit
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          def require(ok):
              if not ok:
                  raise SystemExit('CENTER_CI_REQUEST_REJECTED')
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          head = git('rev-parse', 'HEAD')
          require(head == os.environ['GITHUB_SHA'] and os.environ['GITHUB_REPOSITORY'] == 'Faust-S/Center')
          atlas = os.environ['CENTER_ATLAS_PIN']
          brtest = os.environ['CENTER_BRTEST_PIN']
          setup = os.environ['CENTER_SETUP_PIN']
          t3 = os.environ['CENTER_T3_PIN']
          one_core = os.environ['CENTER_ONE_CORE_PIN']
          profiles = {
              'full': {'atlas': atlas, 'brtest': brtest, 'setup_core': setup},
              'ui': {'atlas': atlas, 'brtest': brtest},
              'atlas-native': {'atlas': atlas, 'brtest': brtest, 'setup_core': setup, 't3': t3, 'one_core': one_core},
              'legacy': {'legacy_center': '2439f236cb7017135e661ee5bfd37b1d318868e1',
                         'legacy_run': '42410786028', 'accepted_run': '42486593582'},
              'webview2': {},
          }
          event_name = os.environ['GITHUB_EVENT_NAME']
          if event_name == 'push':
              require(all(event.get(k) is False for k in ('created', 'deleted', 'forced')))
              prepared = event.get('before', '')
              require(re.fullmatch('[a-f0-9]{40}', prepared) is not None and event.get('after') == head)
              require(os.environ['GITHUB_REF'] == event.get('ref') == 'refs/heads/ci/once/center/' + prepared)
              require(git('rev-list', '--parents', '-n', '1', head).split() == [head, prepared])
              path = '.github/ci-requests/center.json'
              require(git('diff', '--name-status', prepared, head) == 'A\t' + path)
              req = json.loads(Path(path).read_text(encoding='utf-8'))
              require(set(req) == {'workflow', 'prepared_sha', 'profile', 'pins', 'reason'})
              require(req['workflow'] == 'center' and req['prepared_sha'] == prepared)
              profile = req['profile']
              require(profile in profiles and req['pins'] == profiles[profile])
              require(isinstance(req['reason'], str) and 0 < len(req['reason'].strip()) <= 1000)
          elif event_name == 'workflow_dispatch':
              inputs = event.get('inputs', {})
              prepared = inputs.get('prepared_sha')
              profile = inputs.get('profile')
              require(prepared == head and profile in profiles)
          else:
              raise SystemExit('CENTER_CI_REQUEST_REJECTED')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('profile=' + profile + '\nprepared_sha=' + prepared + '\n')
          print('CENTER_CI_REQUEST_ADMITTED', profile, prepared)
          PY
  model:
    needs: request
    if: ${{ needs.request.outputs.profile == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.prepared_sha }}
          persist-credentials: false
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: ${{ env.CENTER_ATLAS_PIN }}
          path: vendor/atlas
          persist-credentials: false
      # Test CEN05 against the original, pinned public U04 bridge; never
      # vendor/copy the implementation into the Center product.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: ${{ env.CENTER_BRTEST_PIN }}
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Verify original Atlas saved WorkRef navigation
        run: node --test vendor/atlas/tests/atlas-work-navigation.test.mjs vendor/atlas/tests/atlas-organization-plan-projection.test.mjs
      # Run the new public Atlas plan/fact regression once, not three times.
      - name: Verify original Atlas Result and plan/fact projection
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: node --test vendor/atlas/tests/atlas09-t3-confirmed-readback.test.mjs vendor/atlas/tests/atlas09-signed-file-recipient.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify universal Setup Core package contract
        run: python -m unittest discover -s installer/tests -p 'test_*.py' -v
  interface:
    needs: request
    if: ${{ needs.request.outputs.profile == 'full' || needs.request.outputs.profile == 'ui' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.prepared_sha }}
          persist-credentials: false
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: ${{ env.CENTER_ATLAS_PIN }}
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: ${{ env.CENTER_BRTEST_PIN }}
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      # The full matrix already executes these identical Node tests on
      # Ubuntu. Preserve them for explicit interface-only qualification.
      - if: ${{ needs.request.outputs.profile == 'ui' }}
        run: npm test
      - run: npm run build
      # Fail at the inexpensive original Atlas TypeScript stage BEFORE
      # occupying a Windows runner to compile and install both programs.
      - name: Verify pinned original Atlas desktop source
        if: ${{ needs.request.outputs.profile == 'full' }}
        working-directory: vendor/atlas/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: npx playwright install --with-deps firefox
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-interface
          path: |
            artifacts/
            package-lock.json
            dist/
  windows-shell:
    needs: [request, model, interface]
    if: ${{ needs.request.outputs.profile == 'full' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.prepared_sha }}
          persist-credentials: false
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: ${{ env.CENTER_ATLAS_PIN }}
          path: vendor/atlas
          persist-credentials: false
      # Original U04 native module are required by Center's build.rs.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: ${{ env.CENTER_BRTEST_PIN }}
          path: vendor/brtest
          persist-credentials: false
      # Build pinned original Atlas with its own Setup Core recipe. No copied
      # native Store, no unqualified version override or third-party installer.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: ${{ env.CENTER_SETUP_PIN }}
          path: vendor/atlas/setup-core-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - name: Build native Center with original Atlas storage
        run: npx tauri build --no-bundle
      - name: Qualify IWXA Setup Core native package and GUI (Center 0.5)
        shell: pwsh
        timeout-minutes: 5
        run: ./installer/windows/test-native-package.ps1
      - name: Verify two-file Admin Center Setup Core transport in PUBLIC Center CI
        shell: pwsh
        timeout-minutes: 5
        run: |
          # The public Admin Center EXE is an opaque second-file fixture.
          # This verifies packaging only: no private T3 source, signing or seats.
          ./installer/windows/test-external-component-transport.ps1 -ConsumerComponentPath 'src-tauri/target/release/iwxa-admin-center.exe'
          $report = Get-Content 'artifacts/center-component-transport/result.json' -Raw | ConvertFrom-Json
          if($report.status -ne 'CENTER_TWO_FILE_TRANSPORT_ONLY_PASS' -or
             $report.fileCount -ne 2 -or $report.signedLicenseVerified -ne $false -or
             $report.productionActivation -ne $false -or $report.licensedSeats -ne 0){
            throw 'CENTER_PUBLIC_EXTERNAL_COMPONENT_TRANSPORT_GATE_FAILED'
          }
          Write-Host 'CENTER_TWO_FILE_PUBLIC_SETUP_CORE_PASS_NO_PRIVATE_T3'
      - name: Native Atlas storage tests, including two separate processes
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin iwxa-admin-center -- --nocapture
      - name: Verify IWXA Setup Core Windows distribution and record hashes
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath 'artifacts/IWXA-Admin-Center-0.5.0-dev.1-Setup.exe' -ErrorAction Stop
          $sha = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          "$($installer.Name) SHA256=$($sha.Hash) SIZE=$($installer.Length)" | Set-Content 'artifacts/installer-sha256.txt'
          Write-Host "IWXA_SETUP_CORE_BUNDLE_READY: $($installer.Name), size=$($installer.Length), SHA256=$($sha.Hash)"
      - name: Qualify installed Windows GUI Atlas and manager draft persistence
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-center.ps1
      # U05: both real installed Windows products on the SAME hosted profile.
      # Reuse Atlas's own GUI acceptance driver and native persistence.
      - name: Upgrade installed Center and verify manager data after restart
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-setup-upgrade.ps1
      # Both public programs are compiled and installed on the SAME Windows
      # profile. Source=pinned Atlas integration SHA; Setup=its original IWXA
      # Setup Core; employee/private T3 sources never enter this public CI.
      - name: Build and install the pinned Atlas source with Setup Core
        shell: pwsh
        timeout-minutes: 27
        run: |
          $ErrorActionPreference='Stop'
          $expectedSource=$env:CENTER_ATLAS_PIN
          $checked=(& git -C vendor/atlas rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $checked -ne $expectedSource){
            throw 'CEN05_ATLAS_SOURCE_PIN_MISMATCH'
          }
          Push-Location 'vendor/atlas/desktop'
          try {
            npm ci --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'CEN05_ATLAS_NPM_CI_FAILED'}
            npm run desktop:build -- --no-bundle
            if($LASTEXITCODE -ne 0){throw 'CEN05_ATLAS_NATIVE_BUILD_FAILED'}
          } finally { Pop-Location }
          Push-Location 'vendor/atlas'
          try {
            ./desktop/installer/build-setup-core.ps1 -InstallForQualification
            if($LASTEXITCODE -ne 0){throw 'CEN05_ATLAS_ORIGINAL_SETUP_FAILED'}
          } finally { Pop-Location }
          $profile=Get-Content 'vendor/atlas/desktop/installer/atlas.json' -Raw | ConvertFrom-Json
          $name='IWXA-Atlas-'+$profile.version+'-Setup.exe'
          $installer=Join-Path 'vendor/atlas/artifacts' $name
          $expectedSum=Get-Content -LiteralPath ($installer+'.sha256') -Raw
          $actualSum=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if($expectedSum.Trim() -ne ($actualSum+' *'+$name)){
            throw 'CEN05_ATLAS_SETUP_DIGEST_MISMATCH'
          }
          $registered=Get-ItemProperty -LiteralPath 'HKCU:\Software\IWXA\SetupCore\Products\iwxa.atlas' -ErrorAction Stop
          # This verifies the test fixture we just installed, not a runtime
          # supported-version list. Center itself never gates by product version.
          if($registered.Version -ne $profile.version){
            throw 'CEN05_ATLAS_FIXTURE_INSTALL_IDENTITY_MISMATCH'
          }
          $exe=Join-Path ([string]$registered.InstallLocation) 'iwxa-atlas-desktop.exe'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf)){
            throw 'CEN05_ATLAS_INSTALLED_EXE_MISSING'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "ATLAS_INSTALLED_EXE=$exe"
          Write-Host "CEN05_ORIGINAL_ATLAS_INSTALLED source=$expectedSource sha256=$actualSum path=$exe"
      - name: Verify the pinned Atlas native Store before Center integration
        shell: pwsh
        timeout-minutes: 5
        run: |
          cargo test --release --locked --manifest-path vendor/atlas/desktop/src-tauri/Cargo.toml --lib
          if($LASTEXITCODE -ne 0){throw 'CEN05_ATLAS_ORIGINAL_STORE_FAILED'}
      - name: Create actual Atlas Desktop project and works with installed GUI
        shell: pwsh
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop/test-artifacts'|Out-Null
          ./tests/installed-atlas-u05-seed.ps1
      - name: Make Atlas .iwxa from exact installed native owner project blocks
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'ru.iwxa.atlas/atlas-store-v1'
          $destination=Join-Path $env:RUNNER_TEMP 'atlas05-center-installed.iwxa'
          node tests/installed-u05-atlas-iwxa.mjs $root $destination
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $destination)){
            throw 'U05_INSTALLED_ATLAS_IWXA_CREATION_FAILED'
          }
      - name: Installed Center reads Atlas Desktop canonical work and saves exact ref
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-u05-cross-owner.ps1
      - name: Installed Atlas GUI advances original owner revision
        shell: pwsh
        timeout-minutes: 5
        env:
          ATLAS_U05_APPEND_PROJECT: '1'
        run: ./tests/installed-atlas-u05-seed.ps1
      - name: Installed Center refuses stale work reference after owner GUI edit
        shell: pwsh
        timeout-minutes: 5
        env:
          U05_VERIFY_STALE_AFTER_OWNER_CHANGE: '1'
        run: ./tests/installed-windows-u05-cross-owner.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-windows-preparation-shell
          path: |
            src-tauri/target/release/iwxa-admin-center.exe
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/iwxa-setup-core-*.exe
            artifacts/setup-core-*.json
            artifacts/center-component-transport/result.json
            artifacts/installer-sha256.txt
            artifacts/installed-gui-result.json
            artifacts/installed-gui-failure.png
            artifacts/u05-two-installed-result.json
            artifacts/atlas05-center-iwxa-result.json
            vendor/atlas/artifacts/IWXA-Atlas-*-Setup.exe.sha256
            src-tauri/Cargo.lock
            package-lock.json

  # Opt-in only: exact stable 0.2 Windows NSIS acceptance, no new workflow.
  # Qualify exact, already accepted Windows binaries without changing
  # the runner profile by repeating installer self-tests before legacy setup.
  windows-legacy-preview:
    needs: request
    if: ${{ needs.request.outputs.profile == 'legacy' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.prepared_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 2439f236cb7017135e661ee5bfd37b1d318868e1
          path: legacy
          persist-credentials: false
      - name: Get exact stable 0.2 NSIS from its successful full Windows CI
        uses: actions/download-artifact@v4
        with:
          name: center-windows-preparation-shell
          repository: Faust-S/Center
          run-id: 42410786028
          github-token: ${{ github.token }}
          path: legacy
      - name: Get accepted 0.3 Setup Core from its successful full Windows CI
        uses: actions/download-artifact@v4
        with:
          name: center-windows-preparation-shell
          repository: Faust-S/Center
          run-id: 42486593582
          github-token: ${{ github.token }}
          path: accepted
      - name: Verify pinned installers and isolate user profile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis=@(Get-ChildItem 'legacy/src-tauri/target/release/bundle/nsis/*.exe')
          if($nsis.Count -ne 1) {throw 'LEGACY_PINNED_NSIS_INSTALLER_NOT_FOUND'}
          $native='accepted/artifacts/iwxa-setup-core-center-0.3-preview.exe'
          if(!(Test-Path -LiteralPath $native)) {throw 'LEGACY_ACCEPTED_NATIVE_SETUP_NOT_FOUND'}
          New-Item -ItemType Directory -Force 'artifacts'|Out-Null
          $payloadExe='accepted/src-tauri/target/release/iwxa-admin-center.exe'
          if(!(Test-Path -LiteralPath $payloadExe)){throw 'LEGACY_ACCEPTED_03_EXE_NOT_FOUND'}
          if(Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'ru.iwxa.admin-center')) {
            throw 'LEGACY_PROFILE_NOT_CLEAN_BEFORE_STABLE_INSTALL'
          }
          Write-Host "LEGACY_SOURCE_INSTALLER_0_2_SHA256=$((Get-FileHash -LiteralPath $nsis[0].FullName -Algorithm SHA256).Hash)"
          Write-Host "ACCEPTED_SETUP_CORE_0_3_SHA256=$((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash)"
          Write-Host "ACCEPTED_CENTER_03_PAYLOAD_SHA256=$((Get-FileHash -LiteralPath $payloadExe -Algorithm SHA256).Hash)"
      - name: Build updated Setup Core GUI around accepted 0.3 payload
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $artifact=Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $stub=Join-Path $artifact 'iwxa-setup-core-stub.exe'
          $bundle=Join-Path $artifact 'iwxa-setup-core-center-0.3-preview.exe'
          $profile='installer/products/center.json'
          $payload=Join-Path $artifact 'legacy-gui-payload'
          New-Item -ItemType Directory -Force -Path $payload|Out-Null
          Copy-Item -LiteralPath 'accepted/src-tauri/target/release/iwxa-admin-center.exe' -Destination (Join-Path $payload 'iwxa-admin-center.exe')
          ./installer/windows/build-stub.ps1 -Output $stub
          $sourceHead=[string](& git rev-parse HEAD).Trim()
          $sourceTree=[string](& git rev-parse 'HEAD^{tree}').Trim()
          $args=@('-m','installer.build_bundle','build',
            '--product',$profile,'--payload',$payload,
            '--stub',$stub,'--output',$bundle,
            '--source-commit',$sourceHead,'--source-tree',$sourceTree)
          $null=& python @args
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $bundle)){
            throw 'LEGACY_GUI_NEW_BUNDLE_FAILED'
          }
          Write-Host "LEGACY_GUI_UPDATED_SETUP_BUILD_PASS_SHA256=$((Get-FileHash $bundle -Algorithm SHA256).Hash)"
      - name: Install exact NSIS 0.2 independently of legacy GUI driver
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis=@(Get-ChildItem 'legacy/src-tauri/target/release/bundle/nsis/*.exe')
          if($nsis.Count -ne 1){throw 'LEGACY_NSIS_INSTALLER_AMBIGUOUS'}
          $p=Start-Process -FilePath $nsis[0].FullName -ArgumentList '/S' -PassThru
          if(!$p.WaitForExit(120000)){Stop-Process -Id $p.Id -Force;throw 'LEGACY_NSIS_INSTALL_TIMEOUT'}
          if($p.ExitCode -ne 0){throw "LEGACY_NSIS_INSTALL_EXIT_$($p.ExitCode)"}
          $root=Join-Path $env:LOCALAPPDATA 'IWXA Admin Center'
          if(!(Test-Path -LiteralPath (Join-Path $root 'iwxa-admin-center.exe')) -or
             !(Test-Path -LiteralPath (Join-Path $root 'uninstall.exe'))){
            throw 'LEGACY_NSIS_REAL_BINARIES_MISSING'
          }
          Write-Host "LEGACY_REAL_NSIS_02_INSTALLED_SHA256=$((Get-FileHash (Join-Path $root 'iwxa-admin-center.exe') -Algorithm SHA256).Hash)"
      - name: Create two real organizations through installed stable 0.2 GUI
        shell: pwsh
        timeout-minutes: 4
        run: ./tests/installed-windows-legacy-real-organizations.ps1
      - name: Preview native 0.3 beside real 0.2 and cancel preserving old program
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-legacy-preview.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-legacy-nsis-to-native-preview
          path: |
            artifacts/legacy-nsis-preview-*.json
            artifacts/legacy-real-organizations-result.json
            artifacts/installed-gui-result.json
            artifacts/installed-gui-failure.png

  # Targeted Windows verification of official signed bootstrapper. Does
  # not install or remove WebView2 on the hosted runner.
  windows-webview2-probe:
    needs: request
    if: ${{ needs.request.outputs.profile == 'webview2' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.prepared_sha }}
          persist-credentials: false
      - name: Compile Setup Core signature verifier without rebuilding Center
        shell: pwsh
        timeout-minutes: 2
        run: ./installer/windows/build-stub.ps1 -Output artifacts/webview2-signature-probe.exe
      - name: Fetch Microsoft WebView2 bootstrapper and verify signed binary
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          $official=Join-Path $env:GITHUB_WORKSPACE 'artifacts/MicrosoftEdgeWebview2Setup.exe'
          $stub=Join-Path $env:GITHUB_WORKSPACE 'artifacts/webview2-signature-probe.exe'
          $report=Join-Path $env:GITHUB_WORKSPACE 'artifacts/webview2-official-verification.json'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $official -MaximumRedirection 6 -TimeoutSec 60
          if(!(Test-Path -LiteralPath $official)){throw 'WEBVIEW2_REAL_BOOTSTRAPPER_MISSING'}
          $p=Start-Process -FilePath $stub -ArgumentList ('--verify-webview2-installer-file "{0}" "{1}"' -f $official,$report) -PassThru
          try {
            if(!$p.WaitForExit(55000)){Stop-Process -Id $p.Id -Force; throw 'WEBVIEW2_MICROSOFT_VERIFY_TIMEOUT'}
            if($p.ExitCode -ne 0){throw "WEBVIEW2_MICROSOFT_SIGNED_VALIDATION_EXIT_$($p.ExitCode)"}
          } finally {$p.Dispose()}
          $result=Get-Content -LiteralPath $report -Raw|ConvertFrom-Json
          if($result.status -ne 'WEBVIEW2_MICROSOFT_INSTALLER_VERIFIED'){
            throw "WEBVIEW2_MICROSOFT_BOOTSTRAPPER_INVALID_$($result.status)"
          }
          Write-Host "WEBVIEW2_OFFICIAL_BOOTSTRAPPER_AUTHENTICODE_PASS size=$((Get-Item $official).Length) sha256=$((Get-FileHash $official -Algorithm SHA256).Hash)"
          $tampered=Join-Path $env:GITHUB_WORKSPACE 'artifacts/MicrosoftEdgeWebview2Setup-tampered.exe'
          Copy-Item -LiteralPath $official -Destination $tampered
          $file=[System.IO.File]::Open($tampered,[System.IO.FileMode]::Open,[System.IO.FileAccess]::ReadWrite,[System.IO.FileShare]::None)
          try {
            $null=$file.Seek(4096,[System.IO.SeekOrigin]::Begin)
            $b=$file.ReadByte()
            if($b -lt 0){throw 'WEBVIEW2_TAMPER_POSITION_INVALID'}
            $null=$file.Seek(4096,[System.IO.SeekOrigin]::Begin)
            $file.WriteByte([byte]($b -bxor 1))
          } finally {$file.Dispose()}
          $tamperReport=Join-Path $env:GITHUB_WORKSPACE 'artifacts/webview2-tamper-rejected.json'
          $bad=Start-Process -FilePath $stub -ArgumentList ('--verify-webview2-installer-file "{0}" "{1}"' -f $tampered,$tamperReport) -PassThru
          try {
            if(!$bad.WaitForExit(55000)){Stop-Process -Id $bad.Id -Force; throw 'WEBVIEW2_TAMPER_VERIFY_TIMEOUT'}
            if($bad.ExitCode -ne 2){throw "WEBVIEW2_TAMPER_WAS_ACCEPTED_$($bad.ExitCode)"}
          } finally {$bad.Dispose()}
          $result=Get-Content -LiteralPath $tamperReport -Raw|ConvertFrom-Json
          if($result.status -ne 'ERROR'){throw 'WEBVIEW2_TAMPER_REPORT_MISSING_ERROR'}
          Write-Host 'WEBVIEW2_TAMPERED_MICROSOFT_BOOTSTRAPPER_REJECTED_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-webview2-verification
          path: |
            artifacts/webview2-*.json

  # Owner-authorized disposable private original component qualification.
  # Reuse the successful public qualification; do not repeat its matrix.
  # No private build logs, sources, binaries, installers or data are uploaded.
  atlas-original-native:
    needs: request
    if: ${{ needs.request.outputs.profile == 'atlas-native' }}
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.request.outputs.prepared_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: ${{ env.CENTER_ATLAS_PIN }}
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: ${{ env.CENTER_SETUP_PIN }}
          path: vendor/atlas/setup-core-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: ${{ env.CENTER_BRTEST_PIN }}
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: ${{ env.CENTER_ONE_CORE_PIN }}
          path: vendor/one-core
          persist-credentials: false
          sparse-checkout: |
            packages/t3-core/src/t3/company-workspace-readback.mjs
            packages/t3-core/tests/t3-company-workspace-readback.test.mjs
          sparse-checkout-cone-mode: false
      - name: Verify changed public Center and Atlas source before private build
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          & node --test vendor/atlas/tests/atlas09-signed-file-recipient.test.mjs vendor/atlas/tests/atlas09-t3-confirmed-readback.test.mjs vendor/atlas/tests/atlas-organization-plan-projection.test.mjs
          if($LASTEXITCODE -ne 0){throw 'ATLAS_PUBLIC_RESULT_REGRESSION_FAILED'}
          # Center's original archive writer imports the existing fflate
          # dependency. Install it BEFORE exercising the export regression.
          & npm.cmd install --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'CENTER_PUBLIC_NPM_FAILED'}
          & node --test tests/atlas-native.test.mjs tests/atlas-result-context.test.mjs tests/cen03-corporate-seats.test.mjs
          if($LASTEXITCODE -ne 0){throw 'CENTER_PUBLIC_RESULT_REGRESSION_FAILED'}
          & npm.cmd run build
          if($LASTEXITCODE -ne 0){throw 'CENTER_PUBLIC_INTERFACE_BUILD_FAILED'}
          # Install public Atlas dependencies once, before private checkout
          # and native compilation. A TypeScript contract error must not
          # consume another expensive original Consumer / Rust build.
          & npm.cmd ci --prefix vendor/atlas/desktop --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'ATLAS_ORIGINAL_NATIVE_DEPENDENCIES_FAILED'}
          Push-Location vendor/atlas/desktop
          try {
            & ./node_modules/.bin/tsc.cmd --noEmit
            if($LASTEXITCODE -ne 0){throw 'ATLAS_PUBLIC_INTERFACE_TYPECHECK_FAILED'}
          } finally { Pop-Location }
          & node --test vendor/one-core/packages/t3-core/tests/t3-company-workspace-readback.test.mjs
          if($LASTEXITCODE -ne 0){throw 'ONE_CORE_COMPANY_RESULT_REGRESSION_FAILED'}
          Write-Host 'ATLAS_CENTER_PUBLIC_RESULT_AND_BUILD_PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: ${{ env.CENTER_T3_PIN }}
          path: private-t3
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify original corporate carrier before native build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # Syntax-check the changed original owner route without publishing its source or output.
          $syntaxLog=Join-Path $env:RUNNER_TEMP 'atlas-private-owner-syntax.log'
          & node --check private-t3/interop/native-admin-d3.mjs *> $syntaxLog
          if($LASTEXITCODE -ne 0){throw 'CENTER_ORIGINAL_ATLAS_OWNER_SYNTAX_FAILED'}
          & node --check private-t3/interop/runtime.mjs *> $syntaxLog
          if($LASTEXITCODE -ne 0){throw 'CENTER_ORIGINAL_ATLAS_RUNTIME_SYNTAX_FAILED'}
          Write-Host 'CENTER_ORIGINAL_ATLAS_WORKSPACE_OWNER_SYNTAX_PASS'
          $env:IWXA_ATLAS_QUALIFIED_COMPANY_READBACK=(Resolve-Path 'vendor/one-core/packages/t3-core/src/t3/company-workspace-readback.mjs').Path
          "IWXA_ATLAS_QUALIFIED_COMPANY_READBACK=$env:IWXA_ATLAS_QUALIFIED_COMPANY_READBACK"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $log=Join-Path $env:RUNNER_TEMP 'atlas-private-disclosure.log'
          & node --test --test-name-pattern 'original corporate disclosure' private-t3/tests/original-admin-atlas-native-recipient.test.mjs *> $log
          $exit=$LASTEXITCODE
          $raw=Get-Content -LiteralPath $log -Raw
          if($exit -ne 0){
            $codes=@([regex]::Matches($raw,'\b(?:T3_ADMIN_ATLAS_|T3_ATLAS_|RECONCILIATION_|T3_COMPANY_|INTEROP_)[A-Z0-9_]+\b')|ForEach-Object {$_.Value}|Select-Object -Unique)
            Write-Host ('ATLAS_SOURCE_QUALIFICATION_CODES='+($codes -join ','))
            throw 'ATLAS_ORIGINAL_CORPORATE_DISCLOSURE_FAILED'
          }
          if(!$raw.Contains('ATLAS_WORKSPACE_ORIGINAL_SIGNER_LEDGER_PASS')){throw 'ATLAS_WORKSPACE_SOURCE_WITNESS_NOT_OBSERVED'}
          Write-Host 'ATLAS_WORKSPACE_ORIGINAL_SIGNER_LEDGER_PASS'
          Write-Host 'ATLAS_ORIGINAL_CORPORATE_DISCLOSURE_PASS'
      - name: Check changed Center native adapter
        timeout-minutes: 12
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Compile original native Consumer and Atlas Setup Core
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'atlas-private-build.log'
          $exe=Join-Path $env:RUNNER_TEMP 'iwxa-t3-product-consumer.exe'
          & bun build --compile --target=bun-windows-x64 --windows-hide-console private-t3/scripts/product-license-windows-consumer-cli.mjs --outfile $exe *> $log
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $exe)){throw 'ATLAS_ORIGINAL_CONSUMER_BUILD_FAILED'}
          Write-Host 'ATLAS_ORIGINAL_CONSUMER_COMPILED'
          # The already checked public Atlas dependencies are reused.
          # Keep the private Consumer compilation log separate.
          $atlasLog=Join-Path $env:RUNNER_TEMP 'atlas-private-public-atlas-build.log'
          try {
            & ./vendor/atlas/desktop/installer/build-setup-core.ps1 -OriginalT3ConsumerPath $exe -InstallForQualification -Output (Join-Path $env:RUNNER_TEMP 'atlas-private-setup.exe') *> $atlasLog
            if(!$?){throw 'ATLAS_ORIGINAL_NATIVE_SETUP_FAILED'}
          } catch {
            # The invoked script compiles only PUBLIC Atlas and Setup Core;
            # the private Consumer is an already compiled opaque input.
            # Keep the private compiler/test logs separate and unpublished.
            if(Test-Path -LiteralPath $atlasLog){
              Get-Content -LiteralPath $atlasLog -Tail 160 | ForEach-Object { Write-Host $_ }
            }
            throw
          }
          $registered=Get-ItemProperty -LiteralPath 'HKCU:\Software\IWXA\SetupCore\Products\iwxa.atlas'
          $installed=Join-Path ([string]$registered.InstallLocation) 't3/iwxa-t3-product-consumer.exe'
          if(!(Test-Path -LiteralPath $installed) -or (Get-FileHash $installed).Hash -ne (Get-FileHash $exe).Hash){
            throw 'ATLAS_ORIGINAL_INSTALLED_CONSUMER_MISMATCH'
          }
          "IWXA_ATLAS_QUALIFIED_CONSUMER_EXE=$installed"|Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'ATLAS_ORIGINAL_NATIVE_SETUP_AND_INSTALLED_CONSUMER_PASS'
      - name: Create the actual saved work in the installed Atlas GUI
        shell: pwsh
        timeout-minutes: 8
        run: ./tests/installed-atlas-u05-seed.ps1
      - name: Original installed Consumer signature, historical work receipt, cold readback and revocation
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'atlas-private-recipient.log'
          if(!(Test-Path -LiteralPath $env:IWXA_ATLAS_QUALIFIED_CONSUMER_EXE)){throw 'ATLAS_ORIGINAL_INSTALLED_CONSUMER_REQUIRED'}
          $registered=Get-ItemProperty -LiteralPath 'HKCU:\Software\IWXA\SetupCore\Products\iwxa.atlas'
          $env:IWXA_ATLAS_QUALIFIED_DATA_ROOT=[string]$registered.DataLocation
          $env:IWXA_ATLAS_QUALIFIED_GUI_DRIVER=(Resolve-Path 'tests/installed-atlas-u05-seed.ps1').Path
          & node --test --test-name-pattern 'native Windows Atlas recipient' private-t3/tests/original-admin-atlas-native-recipient.test.mjs *> $log
          $exit=$LASTEXITCODE
          $raw=Get-Content -LiteralPath $log -Raw
          if($exit -ne 0){
            # Only public diagnostic codes, never private test output or source.
            $codes=@([regex]::Matches($raw,'\b(?:ATLAS_U05_SIGNED_|ATLAS_INSTALLED_SIGNED_|T3_ATLAS_|U05_INSTALLED_ATLAS_|U05_OWNER_|U05_ATLAS_|ATLAS_HISTORY_)[A-Z0-9_]+\b')|ForEach-Object {$_.Value}|Select-Object -Unique)
            Write-Host ('ATLAS_NATIVE_RECIPIENT_CODES='+($codes -join ','))
            throw 'ATLAS_ORIGINAL_NATIVE_RECIPIENT_FAILED'
          }
          if(!$raw.Contains('ATLAS_INSTALLED_SIGNED_HISTORICAL_WORK_READY') -or
             !$raw.Contains('ATLAS_INSTALLED_SIGNED_RESULT_GUI_PASS')){throw 'ATLAS_INSTALLED_SIGNED_GUI_NOT_OBSERVED'}
          Write-Host 'ATLAS_INSTALLED_SIGNED_HISTORICAL_WORK_READY'
          Write-Host 'ATLAS_ORIGINAL_NATIVE_SIGNED_RECIPIENT_COLD_READBACK_REVOCATION_PASS'
          Write-Host 'ATLAS_INSTALLED_SIGNED_RESULT_GUI_PASS'
          Write-Host 'ATLAS_WORKSPACE_SOURCE_FIXTURE_ONLY_FULL_INSTALLED_CENTER_AGENT_RETURN_NOT_RUN'
      - name: Discard disposable private qualification files
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath 'private-t3' -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'atlas-private-*' | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'iwxa-t3-product-consumer.exe') -Force -ErrorAction SilentlyContinue
