name: Center source and desktop
on:
  push:
    branches: ['work/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: center-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'ci(ui):') && 'ui' || 'full' }}
  cancel-in-progress: true
jobs:
  model:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(ui):') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      # Test CEN05 against the original, pinned public U04 bridge; never
      # vendor/copy the implementation into the Center product.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: 07df66ab6bd3e1b87036c33b90e49d228d5ab820
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
  interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/checkout@v4
        if: ${{ (startsWith(github.ref, 'refs/heads/work/2026-11-08-publisher-0.2') || startsWith(github.ref, 'refs/heads/work/2026-11-09-publisher-0.3')) }}
        with:
          repository: Faust-S/Center
          ref: 2e35c1cfc1770ed85f619a4a22ccdbf4d5b708e8
          path: vendor/setupcore
          persist-credentials: false
      - run: npm run publisher:build
      - run: node --test publisher/tests/setup-contract.test.mjs
      - run: node --test publisher/tests/preparation.test.mjs publisher/tests/offline-license-plan.test.mjs publisher/tests/tariff-drafts.test.mjs publisher/tests/test-license-request.test.mjs publisher/tests/issuer-simulation.test.mjs publisher/tests/center-publisher-preview.test.mjs publisher/tests/two-process-handoff.test.mjs publisher/tests/release-origin.test.mjs
      - name: Verify Publisher product against original IWXA Setup Core
        if: ${{ (startsWith(github.ref, 'refs/heads/work/2026-11-08-publisher-0.2') || startsWith(github.ref, 'refs/heads/work/2026-11-09-publisher-0.3')) }}
        shell: bash
        run: |
          python -c "import json,runpy; validator=runpy.run_path('vendor/setupcore/installer/build_bundle.py')['validate_product']; validator(json.load(open('publisher/setup/product.json',encoding='utf-8'))); print('PUBLISHER_SETUP_CORE_ORIGINAL_MANIFEST_PASS')"
      - run: npx playwright install --with-deps firefox
      - run: npm run test:ui
      - run: npm run publisher:test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-interface
          path: |
            artifacts/
            package-lock.json
            dist/
  windows-shell:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(ui):') && !(startsWith(github.ref, 'refs/heads/work/2026-11-08-publisher-0.2') || startsWith(github.ref, 'refs/heads/work/2026-11-09-publisher-0.3')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      # Original U01/U04 native modules are required by Center's build.rs.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: 07df66ab6bd3e1b87036c33b90e49d228d5ab820
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - name: Build native Center with original Atlas storage
        run: npm run desktop:build -- --no-bundle
      - name: Native Atlas storage tests, including two separate processes
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin iwxa-admin-center -- --nocapture
      - name: Bundle offline Windows installer (NSIS with embedded WebView2)
        run: npm run desktop:build
      - name: Verify installer bundle and record hashes
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer produced" }
          $sha = Get-FileHash $installer.FullName -Algorithm SHA256
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          "$($installer.Name) SHA256=$($sha.Hash) SIZE=$($installer.Length)" | Set-Content "artifacts/installer-sha256.txt"
          Write-Host "OFFLINE_NSIS_BUNDLE_READY: $($installer.Name), size=$($installer.Length), SHA256=$($sha.Hash)"
      - name: Qualify installed Windows GUI Atlas and manager draft persistence
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-center.ps1
      # U05: both real installed Windows products on the SAME hosted profile.
      # Reuse Atlas's own GUI acceptance driver and native persistence.
      - name: Build exact canonical Atlas Desktop installer
        shell: pwsh
        timeout-minutes: 25
        working-directory: vendor/atlas/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run desktop:build
      - name: Install canonical Atlas and create real projects in its GUI
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem 'vendor/atlas/desktop/src-tauri/target/release/bundle/nsis/*.exe'|Select-Object -First 1
          if(!$installer){throw 'U05_ATLAS_INSTALLER_MISSING'}
          $process=Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          if(!$process.WaitForExit(120000)){Stop-Process -Id $process.Id -Force;throw 'U05_ATLAS_INSTALL_TIMEOUT'}
          if($process.ExitCode -ne 0){throw "U05_ATLAS_INSTALL_ERROR $($process.ExitCode)"}
          $exe=Join-Path $env:LOCALAPPDATA 'IWXA Atlas/iwxa-atlas-desktop.exe'
          if(!(Test-Path -LiteralPath $exe)){throw 'U05_ATLAS_INSTALLED_EXE_MISSING'}
          "ATLAS_INSTALLED_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "U05_ATLAS_INSTALLED_PASS SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
      - name: Create actual Atlas Desktop project and works with installed GUI
        shell: pwsh
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop/test-artifacts'|Out-Null
          ./vendor/atlas/desktop/tests/installed-windows-keyboard.ps1
      - name: Installed Center reads Atlas Desktop canonical work and saves exact ref
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-u05-cross-owner.ps1
      - name: Installed Atlas GUI advances original owner revision
        shell: pwsh
        timeout-minutes: 5
        env:
          ATLAS_U05_APPEND_PROJECT: '1'
        run: ./vendor/atlas/desktop/tests/installed-windows-keyboard.ps1
      - name: Installed Center refuses stale work reference after owner GUI edit
        shell: pwsh
        timeout-minutes: 5
        env:
          U05_VERIFY_STALE_AFTER_OWNER_CHANGE: '1'
        run: ./tests/installed-windows-u05-cross-owner.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-windows-preparation-shell
          path: |
            src-tauri/target/release/iwxa-admin-center.exe
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/installer-sha256.txt
            artifacts/installed-gui-result.json
            artifacts/installed-gui-failure.png
            artifacts/u05-two-installed-result.json
            src-tauri/Cargo.lock
            package-lock.json

  publisher-windows:
    if: ${{ (startsWith(github.ref, 'refs/heads/work/2026-11-08-publisher-0.2') || startsWith(github.ref, 'refs/heads/work/2026-11-09-publisher-0.3')) && !startsWith(github.event.head_commit.message, 'ci(ui):') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 2e35c1cfc1770ed85f619a4a22ccdbf4d5b708e8
          path: vendor/setupcore
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run publisher:build
      - name: Publisher native preparation and TEST request tests
        run: cargo test --release --manifest-path publisher/src-tauri/Cargo.toml -- --nocapture
      - name: Build actual Publisher EXE with Tauri CLI (no duplicate installer)
        run: npm run publisher:desktop:exe
      - name: Build/install/launch/uninstall Publisher with original IWXA Setup Core
        shell: pwsh
        run: ./publisher/tests/installed-setupcore-publisher.ps1
      - name: Validate Center-owned Windows dual-desktop acceptance driver syntax
        shell: pwsh
        run: |
          $path=(Resolve-Path 'tests/installed-publisher-center-license.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){
            $errors|ForEach-Object {Write-Host $_.Message}
            throw 'CENTER_PUBLIC_NATIVE_LICENSE_GUI_TEST_PARSE_FAILED'
          }
          Write-Host 'CENTER_PUBLIC_NATIVE_LICENSE_GUI_TEST_SYNTAX_PASS'
      - name: Validate Publisher two-file Setup Core payload in PUBLIC CI only
        shell: pwsh
        run: |
          # Transport-only: an already public EXE is an opaque second-file
          # fixture, NOT a signer. No T3 source/credentials or issuer in CI.
          ./publisher/tests/installed-setupcore-publisher.ps1 -OwnerComponentPath 'publisher/src-tauri/target/release/iwxa-publisher.exe' -TransportOnly
          $receipt = Get-Content 'artifacts/publisher-setupcore-transport/result.json' -Raw | ConvertFrom-Json
          if($receipt.status -ne 'PUBLISHER_TWO_FILE_TRANSPORT_ONLY_PASS' -or
             $receipt.fileCount -ne 2 -or $receipt.signedLicenseIssued -ne $false -or
             $receipt.productionActivation -ne $false -or $receipt.activeSeats -ne 0){
            throw 'PUBLISHER_PUBLIC_TWO_FILE_TRANSPORT_GATE_FAILED'
          }
          Write-Host 'PUBLISHER_CENTER_PUBLIC_TWO_FILE_SETUP_CORE_TRANSPORT_PASS_NO_PRIVATE_T3'
      - name: Preserve Publisher Setup Core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-windows-setupcore
          path: |
            artifacts/publisher-setupcore/*.json
            artifacts/publisher-setupcore/*.png
            artifacts/publisher-setupcore-transport/result.json
            artifacts/publisher-setupcore/*.exe
            publisher/src-tauri/target/release/iwxa-publisher.exe
            publisher/src-tauri/Cargo.lock
            package-lock.json
