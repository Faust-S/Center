name: Center source and desktop
on:
  push:
    branches: ['work/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: center-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'ci(ui):') && 'ui' || 'full' }}
  cancel-in-progress: true
jobs:
  model:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(ui):') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
  interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps firefox
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-interface
          path: |
            artifacts/
            package-lock.json
            dist/
  windows-shell:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(ui):') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm run desktop:build -- --no-bundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-windows-preparation-shell
          path: |
            src-tauri/target/release/iwxa-admin-center.exe
            src-tauri/Cargo.lock
            package-lock.json
