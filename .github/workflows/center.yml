name: Center source and desktop
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: center-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'ci(ui):') && 'ui' || 'full' }}
  cancel-in-progress: true
jobs:
  model:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(ui):') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      # Test CEN05 against the original, pinned public U04 bridge; never
      # vendor/copy the implementation into the Center product.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: 07df66ab6bd3e1b87036c33b90e49d228d5ab820
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm test
  interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/checkout@v4
        if: ${{ (startsWith(github.ref, 'refs/heads/work/2026-11-08-publisher-0.2') || (startsWith(github.ref, 'refs/heads/work/2026-11-09-publisher-0.3') || startsWith(github.ref, 'refs/heads/work/2026-11-10-publisher-0.4') || startsWith(github.ref, 'refs/heads/work/2026-11-10-publisher-0.5'))) }}
        with:
          repository: Faust-S/Center
          ref: 6603a11764ff86853e5abf4d209d55f79fddd8b1
          path: vendor/setupcore
          persist-credentials: false
      - run: npm run publisher:build
      - run: node --test publisher/tests/setup-contract.test.mjs
      - run: node --test publisher/tests/preparation.test.mjs publisher/tests/offline-license-plan.test.mjs publisher/tests/tariff-drafts.test.mjs publisher/tests/test-license-request.test.mjs publisher/tests/person-license-request.test.mjs publisher/tests/corporate-offer-review.test.mjs publisher/tests/corporate-license-request.test.mjs publisher/tests/corporate-owner-readback.test.mjs publisher/tests/corporate-delivery-handoff.test.mjs publisher/tests/issuer-simulation.test.mjs publisher/tests/center-publisher-preview.test.mjs publisher/tests/two-process-handoff.test.mjs publisher/tests/release-origin.test.mjs
      - name: Verify Publisher product against original IWXA Setup Core
        if: ${{ (startsWith(github.ref, 'refs/heads/work/2026-11-08-publisher-0.2') || (startsWith(github.ref, 'refs/heads/work/2026-11-09-publisher-0.3') || startsWith(github.ref, 'refs/heads/work/2026-11-10-publisher-0.4') || startsWith(github.ref, 'refs/heads/work/2026-11-10-publisher-0.5'))) }}
        shell: bash
        run: |
          python -c "import json,runpy; validator=runpy.run_path('vendor/setupcore/installer/build_bundle.py')['validate_product']; validator(json.load(open('publisher/setup/product.json',encoding='utf-8'))); print('PUBLISHER_SETUP_CORE_ORIGINAL_MANIFEST_PASS')"
      - run: npx playwright install --with-deps firefox
      - run: npm run test:ui
      - run: npm run publisher:test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-interface
          path: |
            artifacts/
            package-lock.json
            dist/
  windows-shell:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(ui):') && !(startsWith(github.ref, 'refs/heads/work/2026-11-08-publisher-0.2') || (startsWith(github.ref, 'refs/heads/work/2026-11-09-publisher-0.3') || startsWith(github.ref, 'refs/heads/work/2026-11-10-publisher-0.4') || startsWith(github.ref, 'refs/heads/work/2026-11-10-publisher-0.5'))) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      # Original U01/U04 native modules are required by Center's build.rs.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: 07df66ab6bd3e1b87036c33b90e49d228d5ab820
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - name: Build native Center with original Atlas storage
        run: npm run desktop:build -- --no-bundle
      - name: Native Atlas storage tests, including two separate processes
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin iwxa-admin-center -- --nocapture
      - name: Bundle offline Windows installer (NSIS with embedded WebView2)
        run: npm run desktop:build
      - name: Verify installer bundle and record hashes
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer produced" }
          $sha = Get-FileHash $installer.FullName -Algorithm SHA256
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          "$($installer.Name) SHA256=$($sha.Hash) SIZE=$($installer.Length)" | Set-Content "artifacts/installer-sha256.txt"
          Write-Host "OFFLINE_NSIS_BUNDLE_READY: $($installer.Name), size=$($installer.Length), SHA256=$($sha.Hash)"
      - name: Qualify installed Windows GUI Atlas and manager draft persistence
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-center.ps1
      # U05: both real installed Windows products on the SAME hosted profile.
      # Reuse Atlas's own GUI acceptance driver and native persistence.
      - name: Build exact canonical Atlas Desktop installer
        shell: pwsh
        timeout-minutes: 25
        working-directory: vendor/atlas/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run desktop:build
      - name: Install canonical Atlas and create real projects in its GUI
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem 'vendor/atlas/desktop/src-tauri/target/release/bundle/nsis/*.exe'|Select-Object -First 1
          if(!$installer){throw 'U05_ATLAS_INSTALLER_MISSING'}
          $process=Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          if(!$process.WaitForExit(120000)){Stop-Process -Id $process.Id -Force;throw 'U05_ATLAS_INSTALL_TIMEOUT'}
          if($process.ExitCode -ne 0){throw "U05_ATLAS_INSTALL_ERROR $($process.ExitCode)"}
          $exe=Join-Path $env:LOCALAPPDATA 'IWXA Atlas/iwxa-atlas-desktop.exe'
          if(!(Test-Path -LiteralPath $exe)){throw 'U05_ATLAS_INSTALLED_EXE_MISSING'}
          "ATLAS_INSTALLED_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "U05_ATLAS_INSTALLED_PASS SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
      - name: Create actual Atlas Desktop project and works with installed GUI
        shell: pwsh
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop/test-artifacts'|Out-Null
          ./vendor/atlas/desktop/tests/installed-windows-keyboard.ps1
      - name: Installed Center reads Atlas Desktop canonical work and saves exact ref
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-u05-cross-owner.ps1
      - name: Installed Atlas GUI advances original owner revision
        shell: pwsh
        timeout-minutes: 5
        env:
          ATLAS_U05_APPEND_PROJECT: '1'
        run: ./vendor/atlas/desktop/tests/installed-windows-keyboard.ps1
      - name: Installed Center refuses stale work reference after owner GUI edit
        shell: pwsh
        timeout-minutes: 5
        env:
          U05_VERIFY_STALE_AFTER_OWNER_CHANGE: '1'
        run: ./tests/installed-windows-u05-cross-owner.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-windows-preparation-shell
          path: |
            src-tauri/target/release/iwxa-admin-center.exe
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/installer-sha256.txt
            artifacts/installed-gui-result.json
            artifacts/installed-gui-failure.png
            artifacts/u05-two-installed-result.json
            src-tauri/Cargo.lock
            package-lock.json

  publisher-windows:
    if: ${{ (startsWith(github.ref, 'refs/heads/work/2026-11-08-publisher-0.2') || (startsWith(github.ref, 'refs/heads/work/2026-11-09-publisher-0.3') || startsWith(github.ref, 'refs/heads/work/2026-11-10-publisher-0.4') || startsWith(github.ref, 'refs/heads/work/2026-11-10-publisher-0.5') || github.ref == 'refs/heads/work/2026-11-24-publisher05-corporate-handoff-copy')) && !startsWith(github.event.head_commit.message, 'ci(ui):') }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 6603a11764ff86853e5abf4d209d55f79fddd8b1
          path: vendor/setupcore
          persist-credentials: false
      # CEN04 Admin and Publisher use the SAME public native T3 adapter.
      # Compile both installed products against their original pinned public
      # owners; never fetch private T3 or signing keys in Actions.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: 07df66ab6bd3e1b87036c33b90e49d228d5ab820
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run publisher:build
      - name: Publisher native preparation and TEST request tests
        run: cargo test --release --manifest-path publisher/src-tauri/Cargo.toml -- --nocapture
      - name: Build actual Publisher EXE with Tauri CLI (no duplicate installer)
        run: npm run publisher:desktop:exe
      - name: Compile Admin Center original T3 Consumer + pinned Atlas/U01/U04 integration
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --bin iwxa-admin-center -- --nocapture
      - name: Build native Admin Center EXE with original T3 Consumer commands
        run: npm run desktop:build -- --no-bundle
      - name: Build/install/launch/uninstall Publisher with original IWXA Setup Core
        shell: pwsh
        run: ./publisher/tests/installed-setupcore-publisher.ps1
      - name: Validate Center-owned Windows dual-desktop acceptance driver syntax
        shell: pwsh
        run: |
          $path=(Resolve-Path 'tests/installed-publisher-center-license.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){
            $errors|ForEach-Object {Write-Host $_.Message}
            throw 'CENTER_PUBLIC_NATIVE_LICENSE_GUI_TEST_PARSE_FAILED'
          }
          Write-Host 'CENTER_PUBLIC_NATIVE_LICENSE_GUI_TEST_SYNTAX_PASS'
      - name: Parse local two-installed corporate qualification driver (no private execution)
        shell: pwsh
        run: |
          $path=(Resolve-Path 'tests/installed-publisher-center-corporate.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0){
            $errors|ForEach-Object {Write-Host $_.Message}
            throw 'CORPORATE_INSTALLED_GUI_DRIVER_SYNTAX_INVALID'
          }
          Write-Host 'CORPORATE_INSTALLED_LOCAL_GUI_DRIVER_SYNTAX_PASS_NOT_RUN'
      - name: Verify Publisher private-person witness entrypoint is CI-denied
        shell: pwsh
        run: |
          # Parse the full PUBLIC Setup Core driver before asserting that no
          # private signer can be invoked from a public GitHub Actions runner.
          $path=(Resolve-Path 'publisher/tests/installed-setupcore-publisher.ps1').Path
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -ne 0){throw 'PUBLISHER_INSTALLED_SETUP_DRIVER_SYNTAX_INVALID'}
          $rejected=$false
          try {
            ./publisher/tests/installed-setupcore-publisher.ps1 `
              -OwnerComponentPath 'publisher/src-tauri/target/release/iwxa-publisher.exe' `
              -InstalledPersonWitnessScript 'publisher/tests/installed-windows-publisher.ps1'
          }catch{
            if($_.Exception.Message -eq 'PUBLISHER_PRIVATE_INSTALLED_WITNESS_NOT_ALLOWED_IN_PUBLIC_CI'){
              $rejected=$true
            }else{throw}
          }
          if(-not $rejected){throw 'PUBLISHER_PRIVATE_WITNESS_CI_ACCESS_NOT_DENIED'}
          Write-Host 'PUBLISHER_PRIVATE_INSTALLED_WITNESS_CI_DENY_PASS'
      - name: Validate Publisher two-file Setup Core payload in PUBLIC CI only
        shell: pwsh
        run: |
          # Transport-only: an already public EXE is an opaque second-file
          # fixture, NOT a signer. No T3 source/credentials or issuer in CI.
          ./publisher/tests/installed-setupcore-publisher.ps1 -OwnerComponentPath 'publisher/src-tauri/target/release/iwxa-publisher.exe' -TransportOnly
          $receipt = Get-Content 'artifacts/publisher-setupcore-transport/result.json' -Raw | ConvertFrom-Json
          if($receipt.status -ne 'PUBLISHER_TWO_FILE_TRANSPORT_ONLY_PASS' -or
             $receipt.fileCount -ne 2 -or $receipt.signedLicenseIssued -ne $false -or
             $receipt.productionActivation -ne $false -or $receipt.activeSeats -ne 0){
            throw 'PUBLISHER_PUBLIC_TWO_FILE_TRANSPORT_GATE_FAILED'
          }
          Write-Host 'PUBLISHER_CENTER_PUBLIC_TWO_FILE_SETUP_CORE_TRANSPORT_PASS_NO_PRIVATE_T3'
      - name: Verify six-file original age Setup Core transport without private T3
        shell: pwsh
        run: |
          # Official FiloSottile/age v1.3.1 release, exact GitHub asset SHA.
          # Native Owner and age-desktop EXE remain PUBLIC dummy resource
          # fixtures: this only proves real standard age X25519 in Setup Core.
          Copy-Item -LiteralPath 'artifacts/publisher-setupcore-transport/result.json' -Destination 'artifacts/publisher-two-file-transport.json'
          Remove-Item -LiteralPath 'artifacts/publisher-setupcore-transport' -Recurse -Force
          $opaque=(Resolve-Path 'publisher/src-tauri/target/release/iwxa-publisher.exe').Path
          $digest=(Get-FileHash -LiteralPath $opaque -Algorithm SHA256).Hash.ToLowerInvariant()
          $fixture=(Join-Path (Resolve-Path 'artifacts').Path 'publisher-age-transport-opaque')
          New-Item -Path $fixture -ItemType Directory -Force|Out-Null
          $archive=Join-Path $fixture 'age-v1.3.1-windows-amd64.zip'
          $officialSha='c56e8ce22f7e80cb85ad946cc82d198767b056366201d3e1a2b93d865be38154'
          $officialUrl='https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-windows-amd64.zip'
          Invoke-WebRequest -Uri $officialUrl -OutFile $archive
          if((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne
             $officialSha){throw 'PUBLISHER_PUBLIC_OFFICIAL_AGE_1_3_1_ARCHIVE_PIN_INVALID'}
          Expand-Archive -LiteralPath $archive -DestinationPath $fixture
          $ageExe=Join-Path $fixture 'age\age.exe'
          $keygenExe=Join-Path $fixture 'age\age-keygen.exe'
          foreach($exe in @($ageExe,$keygenExe)){
            if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){
              throw 'PUBLISHER_PUBLIC_OFFICIAL_AGE_WINDOWS_BINARY_MISSING'
            }
          }
          $ageSha=(Get-FileHash -LiteralPath $ageExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $keygenSha=(Get-FileHash -LiteralPath $keygenExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestPath=Join-Path $fixture 'age-toolchain.json'
          [ordered]@{
            schema='IWXA_T3_AGE_PINNED_TOOLCHAIN/1'
            ageSha256=$ageSha
            ageKeygenSha256=$keygenSha
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $manifestPath -Encoding utf8 -NoNewline
          $manifestDigest=(Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $ageSetupParams=@{
            TransportOnly=$true
            AgeStandardRoundtrip=$true
            OwnerComponentPath=$opaque
            AgeComponentPath=$opaque
            AgeBinaryPath=$ageExe
            AgeKeygenPath=$keygenExe
            AgeToolchainManifestPath=$manifestPath
            ExpectedAgeComponentSha256=$digest
            ExpectedAgeBinarySha256=$ageSha
            ExpectedAgeKeygenSha256=$keygenSha
            ExpectedAgeToolchainManifestSha256=$manifestDigest
          }
          ./publisher/tests/installed-setupcore-publisher.ps1 @ageSetupParams
          $receipt=Get-Content 'artifacts/publisher-setupcore-transport/result.json' -Raw|ConvertFrom-Json
          if($receipt.status -ne 'PUBLISHER_SIX_FILE_TRANSPORT_ONLY_PASS' -or
             $receipt.fileCount -ne 6 -or $receipt.pinnedAgeFiles -ne 4 -or
             $receipt.pinnedAgeManifestSha256 -ine $manifestDigest -or
             $receipt.ageRuntimeQualified -ne $false -or
             $receipt.upstreamAgeStandardRoundtripVerified -ne $true -or
             $receipt.privateSignerVerified -ne $false -or
             $receipt.signedLicenseIssued -ne $false -or
             $receipt.productionActivation -ne $false -or
             $receipt.activeSeats -ne 0){
            throw 'PUBLISHER_PUBLIC_SIX_FILE_ORIGINAL_AGE_TRANSPORT_GATE_FAILED'
          }
          Write-Host 'PUBLISHER_SETUP_CORE_SIX_FILE_UPSTREAM_AGE_1_3_1_X25519_INSTALL_REPAIR_UNINSTALL_PASS_NO_T3_RUNTIME'
      - name: Preserve Publisher Setup Core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-windows-setupcore
          path: |
            artifacts/publisher-setupcore/*.json
            artifacts/publisher-setupcore/*.png
            artifacts/publisher-setupcore-transport/result.json
            artifacts/publisher-two-file-transport.json
            artifacts/publisher-setupcore/*.exe
            publisher/src-tauri/target/release/iwxa-publisher.exe
            src-tauri/target/release/iwxa-admin-center.exe
            publisher/src-tauri/Cargo.lock
            package-lock.json
