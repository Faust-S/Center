name: Center source and desktop
on:
  push:
    branches: ['work/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: center-${{ github.ref }}-${{ startsWith(github.event.head_commit.message, 'ci(ui):') && 'ui' || 'full' }}
  cancel-in-progress: true
jobs:
  model:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(ui):') && !startsWith(github.event.head_commit.message, 'ci(legacy):') && !startsWith(github.event.head_commit.message, 'ci(webview2):') && !startsWith(github.event.head_commit.message, 'ci(bench):') && !startsWith(github.event.head_commit.message, 'ci(private):') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      # Test CEN05 against the original, pinned public U04 bridge; never
      # vendor/copy the implementation into the Center product.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: 07df66ab6bd3e1b87036c33b90e49d228d5ab820
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Compile IWXA Setup Core early (Windows model gate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/windows/build-stub.ps1 -Output artifacts/iwxa-setup-core-early.exe
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify universal Setup Core package contract
        run: python -m unittest discover -s installer/tests -p 'test_*.py' -v
      - name: Fast native Windows uninstall and shortcut ownership fixture
        if: runner.os == 'Windows'
        # Setup Core uses .NET Framework System.Web.Extensions: exercise its
        # real managed readback via Windows PowerShell 5.1, not PowerShell 7.
        shell: powershell
        timeout-minutes: 4
        run: ./installer/windows/qualify-uninstall-and-shortcut-fast.ps1 -Stub artifacts/iwxa-setup-core-early.exe
      - name: Qualify native Setup window layout at 100-250 percent scaling
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 3
        run: ./installer/windows/qualify-gui-layout-fast.ps1 -Stub artifacts/iwxa-setup-core-early.exe
      - name: Qualify two independent native packages without external assets
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 7
        run: ./installer/windows/qualify-product-neutral.ps1 -Stub artifacts/iwxa-setup-core-early.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: setup-core-native-options-visuals
          path: artifacts/setup-core-visual-options-*.png
          if-no-files-found: error
  interface:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(legacy):') && !startsWith(github.event.head_commit.message, 'ci(webview2):') && !startsWith(github.event.head_commit.message, 'ci(bench):') && !startsWith(github.event.head_commit.message, 'ci(private):') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps firefox
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-interface
          path: |
            artifacts/
            package-lock.json
            dist/
  windows-shell:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(ui):') && !startsWith(github.event.head_commit.message, 'ci(legacy):') && !startsWith(github.event.head_commit.message, 'ci(webview2):') && !startsWith(github.event.head_commit.message, 'ci(bench):') && !startsWith(github.event.head_commit.message, 'ci(private):') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Atlas is ONE canonical public model, pinned and included in the native bundle.
      # Never fetch it at runtime or copy its project storage into Center.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: 7a0a2c8a458617a011a3db78b72c3dd1adbc12c2
          path: vendor/atlas
          persist-credentials: false
      # Original U01/U04 native modules are required by Center's build.rs.
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: 07df66ab6bd3e1b87036c33b90e49d228d5ab820
          path: vendor/brtest
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - name: Build native Center with original Atlas storage
        run: npx tauri build --no-bundle
      - name: Qualify IWXA Setup Core native package and GUI (Center 0.3)
        shell: pwsh
        timeout-minutes: 5
        run: ./installer/windows/test-native-package.ps1
      - name: Model both first-install data choices on real native Windows
        shell: powershell
        timeout-minutes: 7
        run: ./installer/windows/qualify-first-install-data-transfer.ps1 -Bundle artifacts/iwxa-setup-core-center-0.3-preview.exe
      - name: Qualify signed V2 Setup Core installation lifecycle (test certificate only)
        shell: pwsh
        timeout-minutes: 6
        run: ./installer/windows/qualify-signed-resource-install.ps1
      - name: Native Atlas storage tests, including two separate processes
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin iwxa-admin-center -- --nocapture
      - name: Verify IWXA Setup Core Windows distribution and record hashes
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath 'artifacts/iwxa-setup-core-center-0.3-preview.exe' -ErrorAction Stop
          $sha = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256
          $identityPath=Join-Path 'artifacts' 'setup-core-dist-v2-identity.json'
          $native=Start-Process -FilePath $installer.FullName -ArgumentList ('--inspect-file "{0}"' -f (Join-Path $env:GITHUB_WORKSPACE $identityPath)) -PassThru
          try {
            if(!$native.WaitForExit(60000)){Stop-Process -Id $native.Id -Force;throw 'SETUP_DIST_NATIVE_INSPECT_TIMEOUT'}
            if($native.ExitCode -ne 0){throw 'SETUP_DIST_NATIVE_REJECTED'}
          } finally {$native.Dispose()}
          $identity=Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json
          if($identity.status -ne 'VERIFIED' -or
             $identity.packageFormat -ne 'PE_RESOURCE_V2' -or
             $identity.product -ne 'iwxa.admin-center' -or
             $identity.sourceCommit -ne $env:GITHUB_SHA){
            throw 'SETUP_DIST_UNSIGNED_V1_OR_PROVENANCE_INVALID'
          }
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          "$($installer.Name) SHA256=$($sha.Hash) SIZE=$($installer.Length)" | Set-Content 'artifacts/installer-sha256.txt'
          Write-Host "IWXA_SETUP_CORE_V2_DISTRIBUTION_VERIFIED: $($installer.Name), size=$($installer.Length), SHA256=$($sha.Hash)"
      - name: Qualify installed Windows GUI Atlas and manager draft persistence
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-center.ps1
      # U05: both real installed Windows products on the SAME hosted profile.
      # Reuse Atlas's own GUI acceptance driver and native persistence.
      - name: Upgrade installed Center and verify manager data after restart
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-setup-upgrade.ps1
      - name: Build exact canonical Atlas Desktop installer
        shell: pwsh
        timeout-minutes: 25
        working-directory: vendor/atlas/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run desktop:build
      - name: Install canonical Atlas and create real projects in its GUI
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference='Stop'
          $installer=Get-ChildItem 'vendor/atlas/desktop/src-tauri/target/release/bundle/nsis/*.exe'|Select-Object -First 1
          if(!$installer){throw 'U05_ATLAS_INSTALLER_MISSING'}
          $process=Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru
          if(!$process.WaitForExit(120000)){Stop-Process -Id $process.Id -Force;throw 'U05_ATLAS_INSTALL_TIMEOUT'}
          if($process.ExitCode -ne 0){throw "U05_ATLAS_INSTALL_ERROR $($process.ExitCode)"}
          $exe=Join-Path $env:LOCALAPPDATA 'IWXA Atlas/iwxa-atlas-desktop.exe'
          if(!(Test-Path -LiteralPath $exe)){throw 'U05_ATLAS_INSTALLED_EXE_MISSING'}
          "ATLAS_INSTALLED_EXE=$exe"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "U05_ATLAS_INSTALLED_PASS SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"
      - name: Create actual Atlas Desktop project and works with installed GUI
        shell: pwsh
        timeout-minutes: 8
        run: |
          New-Item -ItemType Directory -Force -Path 'desktop/test-artifacts'|Out-Null
          ./vendor/atlas/desktop/tests/installed-windows-keyboard.ps1
      - name: Installed Center reads Atlas Desktop canonical work and saves exact ref
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-u05-cross-owner.ps1
      - name: Installed Atlas GUI advances original owner revision
        shell: pwsh
        timeout-minutes: 5
        env:
          ATLAS_U05_APPEND_PROJECT: '1'
        run: ./vendor/atlas/desktop/tests/installed-windows-keyboard.ps1
      - name: Installed Center refuses stale work reference after owner GUI edit
        shell: pwsh
        timeout-minutes: 5
        env:
          U05_VERIFY_STALE_AFTER_OWNER_CHANGE: '1'
        run: ./tests/installed-windows-u05-cross-owner.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-windows-preparation-shell
          path: |
            src-tauri/target/release/iwxa-admin-center.exe
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/iwxa-setup-core-*.exe
            artifacts/setup-core-*.json
            artifacts/setup-core-visual-*.png
            artifacts/installer-sha256.txt
            artifacts/installed-gui-result.json
            artifacts/installed-gui-failure.png
            artifacts/u05-two-installed-result.json
            src-tauri/Cargo.lock
            package-lock.json

  # Opt-in only: exact stable 0.2 Windows NSIS acceptance, no new workflow.
  # Qualify exact, already accepted Windows binaries without changing
  # the runner profile by repeating installer self-tests before legacy setup.
  windows-legacy-preview:
    if: ${{ startsWith(github.event.head_commit.message, 'ci(legacy):') }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 2439f236cb7017135e661ee5bfd37b1d318868e1
          path: legacy
          persist-credentials: false
      - name: Get exact stable 0.2 NSIS from its successful full Windows CI
        uses: actions/download-artifact@v4
        with:
          name: center-windows-preparation-shell
          repository: Faust-S/Center
          run-id: 42410786028
          github-token: ${{ github.token }}
          path: legacy
      - name: Get accepted 0.3 Setup Core from its successful full Windows CI
        uses: actions/download-artifact@v4
        with:
          name: center-windows-preparation-shell
          repository: Faust-S/Center
          run-id: 42486593582
          github-token: ${{ github.token }}
          path: accepted
      - name: Verify pinned installers and isolate user profile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $nsis=@(Get-ChildItem 'legacy/src-tauri/target/release/bundle/nsis/*.exe')
          if($nsis.Count -ne 1) {throw 'LEGACY_PINNED_NSIS_INSTALLER_NOT_FOUND'}
          $native='accepted/artifacts/iwxa-setup-core-center-0.3-preview.exe'
          if(!(Test-Path -LiteralPath $native)) {throw 'LEGACY_ACCEPTED_NATIVE_SETUP_NOT_FOUND'}
          New-Item -ItemType Directory -Force 'artifacts'|Out-Null
          $payloadExe='accepted/src-tauri/target/release/iwxa-admin-center.exe'
          if(!(Test-Path -LiteralPath $payloadExe)){throw 'LEGACY_ACCEPTED_03_EXE_NOT_FOUND'}
          if(Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA 'ru.iwxa.admin-center')) {
            throw 'LEGACY_PROFILE_NOT_CLEAN_BEFORE_STABLE_INSTALL'
          }
          Write-Host "LEGACY_SOURCE_INSTALLER_0_2_SHA256=$((Get-FileHash -LiteralPath $nsis[0].FullName -Algorithm SHA256).Hash)"
          Write-Host "ACCEPTED_SETUP_CORE_0_3_SHA256=$((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash)"
          Write-Host "ACCEPTED_CENTER_03_PAYLOAD_SHA256=$((Get-FileHash -LiteralPath $payloadExe -Algorithm SHA256).Hash)"
      - name: Build updated Setup Core GUI around accepted 0.3 payload
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $artifact=Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $stub=Join-Path $artifact 'iwxa-setup-core-stub.exe'
          $bundle=Join-Path $artifact 'iwxa-setup-core-center-0.3-preview.exe'
          $profile='installer/products/center.json'
          $payload=Join-Path $artifact 'legacy-gui-payload'
          New-Item -ItemType Directory -Force -Path $payload|Out-Null
          Copy-Item -LiteralPath 'accepted/src-tauri/target/release/iwxa-admin-center.exe' -Destination (Join-Path $payload 'iwxa-admin-center.exe')
          ./installer/windows/build-stub.ps1 -Output $stub
          $sourceHead=[string]$env:GITHUB_SHA
          $sourceTree=[string](& git rev-parse 'HEAD^{tree}').Trim()
          $args=@('-m','installer.build_bundle','build-resource',
            '--product',$profile,'--payload',$payload,
            '--stub',$stub,'--output',$bundle,
            '--source-commit',$sourceHead,'--source-tree',$sourceTree)
          $null=& python @args
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $bundle)){
            throw 'LEGACY_GUI_NEW_BUNDLE_FAILED'
          }
          $receipt=Join-Path $artifact 'legacy-v2-package-identity.json'
          $verify=Start-Process -FilePath $bundle -ArgumentList ('--inspect-file "{0}"' -f $receipt) -PassThru
          try {
            if(!$verify.WaitForExit(60000)){Stop-Process -Id $verify.Id -Force;throw 'LEGACY_V2_INSPECT_TIMEOUT'}
            if($verify.ExitCode -ne 0){throw 'LEGACY_V2_INSPECT_FAILED'}
          } finally {$verify.Dispose()}
          $identity=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
          if($identity.packageFormat -ne 'PE_RESOURCE_V2' -or
             $identity.product -ne 'iwxa.admin-center'){
            throw 'LEGACY_PREVIEW_NOT_V2'
          }
          Write-Host "LEGACY_GUI_UPDATED_SETUP_V2_BUILD_PASS_SHA256=$((Get-FileHash $bundle -Algorithm SHA256).Hash)"
      - name: Install exact NSIS 0.2 independently of legacy GUI driver
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis=@(Get-ChildItem 'legacy/src-tauri/target/release/bundle/nsis/*.exe')
          if($nsis.Count -ne 1){throw 'LEGACY_NSIS_INSTALLER_AMBIGUOUS'}
          $p=Start-Process -FilePath $nsis[0].FullName -ArgumentList '/S' -PassThru
          if(!$p.WaitForExit(120000)){Stop-Process -Id $p.Id -Force;throw 'LEGACY_NSIS_INSTALL_TIMEOUT'}
          if($p.ExitCode -ne 0){throw "LEGACY_NSIS_INSTALL_EXIT_$($p.ExitCode)"}
          $root=Join-Path $env:LOCALAPPDATA 'IWXA Admin Center'
          if(!(Test-Path -LiteralPath (Join-Path $root 'iwxa-admin-center.exe')) -or
             !(Test-Path -LiteralPath (Join-Path $root 'uninstall.exe'))){
            throw 'LEGACY_NSIS_REAL_BINARIES_MISSING'
          }
          Write-Host "LEGACY_REAL_NSIS_02_INSTALLED_SHA256=$((Get-FileHash (Join-Path $root 'iwxa-admin-center.exe') -Algorithm SHA256).Hash)"
      - name: Create two real organizations through installed stable 0.2 GUI
        shell: pwsh
        timeout-minutes: 4
        run: ./tests/installed-windows-legacy-real-organizations.ps1
      - name: Preview native 0.3 beside real 0.2 and cancel preserving old program
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/installed-windows-legacy-preview.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-legacy-nsis-to-native-preview
          path: |
            artifacts/legacy-nsis-preview-*.json
            artifacts/legacy-real-organizations-result.json
            artifacts/setup-core-visual-*.png
            artifacts/installed-gui-result.json
            artifacts/installed-gui-failure.png

  # Targeted Windows verification of official signed bootstrapper. Does
  # not install or remove WebView2 on the hosted runner.
  windows-webview2-probe:
    if: ${{ startsWith(github.event.head_commit.message, 'ci(webview2):') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile Setup Core signature verifier without rebuilding Center
        shell: pwsh
        timeout-minutes: 2
        run: ./installer/windows/build-stub.ps1 -Output artifacts/webview2-signature-probe.exe
      - name: Validate offline WebView2 witness parses and rejects connected runner
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference='Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'installer/windows/qualify-webview2-clean-windows.ps1'
          $tokens=$null
          $errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors)
          if($errors.Count -ne 0){throw 'WEBVIEW2_CLEAN_VM_POWERSHELL_PARSE_FAILED'}
          $functions=@($ast.FindAll({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Assert-OfflineNetworkIsolation'
          },$true))
          if($functions.Count -ne 1){throw 'WEBVIEW2_CLEAN_VM_NETWORK_ASSERT_MISSING'}
          . ([scriptblock]::Create($functions[0].Extent.Text))
          $rejected=$false
          try {
            $null=Assert-OfflineNetworkIsolation
          } catch {
            if($_.Exception.Message -notlike 'WEBVIEW2_CLEAN_VM_OFFLINE_*'){throw}
            $rejected=$true
          }
          if(!$rejected){throw 'WEBVIEW2_CONNECTED_RUNNER_ACCEPTED_AS_OFFLINE'}
          Write-Host 'IWXA_WEBVIEW2_CONNECTED_WINDOWS_OFFLINE_REJECTION_PASS'
      - name: Fetch Microsoft WebView2 bootstrapper and verify signed binary
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference='Stop'
          $official=Join-Path $env:GITHUB_WORKSPACE 'artifacts/MicrosoftEdgeWebview2Setup.exe'
          $stub=Join-Path $env:GITHUB_WORKSPACE 'artifacts/webview2-signature-probe.exe'
          $report=Join-Path $env:GITHUB_WORKSPACE 'artifacts/webview2-official-verification.json'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $official -MaximumRedirection 6 -TimeoutSec 60
          if(!(Test-Path -LiteralPath $official)){throw 'WEBVIEW2_REAL_BOOTSTRAPPER_MISSING'}
          $p=Start-Process -FilePath $stub -ArgumentList ('--verify-webview2-installer-file "{0}" "{1}"' -f $official,$report) -PassThru
          try {
            if(!$p.WaitForExit(55000)){Stop-Process -Id $p.Id -Force; throw 'WEBVIEW2_MICROSOFT_VERIFY_TIMEOUT'}
            if($p.ExitCode -ne 0){throw "WEBVIEW2_MICROSOFT_SIGNED_VALIDATION_EXIT_$($p.ExitCode)"}
          } finally {$p.Dispose()}
          $result=Get-Content -LiteralPath $report -Raw|ConvertFrom-Json
          if($result.status -ne 'WEBVIEW2_MICROSOFT_INSTALLER_VERIFIED'){
            throw "WEBVIEW2_MICROSOFT_BOOTSTRAPPER_INVALID_$($result.status)"
          }
          Write-Host "WEBVIEW2_OFFICIAL_BOOTSTRAPPER_AUTHENTICODE_PASS size=$((Get-Item $official).Length) sha256=$((Get-FileHash $official -Algorithm SHA256).Hash)"
          # The genuine ~2 MB Microsoft bootstrapper is not a full offline
          # installer. Catch incorrect offline selection before running it.
          $offlineReport=Join-Path $env:GITHUB_WORKSPACE 'artifacts/webview2-bootstraper-offline-rejected.json'
          $offline=Start-Process -FilePath $stub -ArgumentList ('--verify-webview2-standalone-file "{0}" "{1}"' -f $official,$offlineReport) -PassThru
          try {
            if(!$offline.WaitForExit(55000)){Stop-Process -Id $offline.Id -Force;throw 'WEBVIEW2_STANDALONE_PROBE_TIMEOUT'}
            if($offline.ExitCode -ne 2){throw 'WEBVIEW2_BOOTSTRAPPER_ACCEPTED_AS_OFFLINE'}
          } finally {$offline.Dispose()}
          $offlineState=Get-Content -LiteralPath $offlineReport -Raw|ConvertFrom-Json
          if($offlineState.status -ne 'ERROR' -or
             $offlineState.reason -ne 'SETUP_WEBVIEW2_OFFLINE_STANDALONE_REQUIRED'){
            throw 'WEBVIEW2_BOOTSTRAPPER_OFFLINE_REJECTION_INVALID'
          }
          Write-Host 'WEBVIEW2_BOOTSTRAPPER_REJECTED_AS_OFFLINE_PASS'
          $tampered=Join-Path $env:GITHUB_WORKSPACE 'artifacts/MicrosoftEdgeWebview2Setup-tampered.exe'
          Copy-Item -LiteralPath $official -Destination $tampered
          $file=[System.IO.File]::Open($tampered,[System.IO.FileMode]::Open,[System.IO.FileAccess]::ReadWrite,[System.IO.FileShare]::None)
          try {
            $null=$file.Seek(4096,[System.IO.SeekOrigin]::Begin)
            $b=$file.ReadByte()
            if($b -lt 0){throw 'WEBVIEW2_TAMPER_POSITION_INVALID'}
            $null=$file.Seek(4096,[System.IO.SeekOrigin]::Begin)
            $file.WriteByte([byte]($b -bxor 1))
          } finally {$file.Dispose()}
          $tamperReport=Join-Path $env:GITHUB_WORKSPACE 'artifacts/webview2-tamper-rejected.json'
          $bad=Start-Process -FilePath $stub -ArgumentList ('--verify-webview2-installer-file "{0}" "{1}"' -f $tampered,$tamperReport) -PassThru
          try {
            if(!$bad.WaitForExit(55000)){Stop-Process -Id $bad.Id -Force; throw 'WEBVIEW2_TAMPER_VERIFY_TIMEOUT'}
            if($bad.ExitCode -ne 2){throw "WEBVIEW2_TAMPER_WAS_ACCEPTED_$($bad.ExitCode)"}
          } finally {$bad.Dispose()}
          $result=Get-Content -LiteralPath $tamperReport -Raw|ConvertFrom-Json
          if($result.status -ne 'ERROR'){throw 'WEBVIEW2_TAMPER_REPORT_MISSING_ERROR'}
          Write-Host 'WEBVIEW2_TAMPERED_MICROSOFT_BOOTSTRAPPER_REJECTED_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-webview2-verification
          path: |
            artifacts/webview2-*.json
  # One optional benchmark job in the EXISTING public CI workflow.
  resource-benchmark:
    if: ${{ startsWith(github.event.head_commit.message, 'ci(bench):') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile unchanged native Setup Core stub
        shell: pwsh
        run: ./installer/windows/build-stub.ps1 -Output artifacts/iwxa-setup-benchmark-stub.exe
      - name: Materialize pinned pre-optimization baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $old=@(& git show '7173fb54bad2ff67eb77f2603117f85e6e63cb73:installer/build_bundle.py')
          if($LASTEXITCODE -ne 0 -or $old.Count -lt 300){throw 'SETUP_BENCHMARK_BASELINE_MISSING'}
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'setup-v2-baseline.py'),
            ($old -join [Environment]::NewLine) + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false))
      - name: Compare memory and time on 25 and 250 MiB V2 packages
        shell: powershell
        timeout-minutes: 35
        run: ./installer/windows/benchmark-resource-v2.ps1 -Stub artifacts/iwxa-setup-benchmark-stub.exe -BaselineSource (Join-Path $env:RUNNER_TEMP 'setup-v2-baseline.py') -SizesMiB 25,250 -Repeats 2 -Output artifacts/iwxa-v2-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iwxa-setup-v2-resource-benchmark
          path: artifacts/iwxa-v2-benchmark.json
# Explicit opt-in. Private checkout and outputs stay on this ephemeral runner.
  # No private executable, source, dump, or report is uploaded as a public artifact.
  private-windows-qualification:
    if: ${{ github.ref == 'refs/heads/work/2026-11-10-setup-core-product-neutral-qualification' && startsWith(github.event.head_commit.message, 'ci(private):') }}
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Require separately provisioned private repository read permission
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)) {
            throw 'PRIVATE_QUALIFICATION_READ_TOKEN_NOT_CONFIGURED'
          }
      - name: Bind explicit private source revision to this CI trigger
        id: private-pin
        shell: pwsh
        env:
          SOURCE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if ([string]$env:SOURCE_COMMIT_MESSAGE -cnotmatch '^ci\(private\):([0-9a-f]{40})(\s|$)') {
            throw 'PRIVATE_QUALIFICATION_PIN_MISSING_OR_INVALID'
          }
          "sha=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Checkout exact unchanged Setup Core source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: c7b84cfbbc1d41d24239bfd90fca76d517a6cb69
          path: public-owner
          persist-credentials: false
      - name: Checkout exact private source into ephemeral worker
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ steps.private-pin.outputs.sha }}
          path: private-product
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        if: ${{ !contains(github.event.head_commit.message, ' node-only') }}
        with:
          python-version: '3.13.15'
      - name: Verify both exact source identities
        shell: pwsh
        env:
          PRIVATE_SOURCE_SHA: ${{ steps.private-pin.outputs.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $center=Join-Path $env:GITHUB_WORKSPACE 'public-owner'
          $private=Join-Path $env:GITHUB_WORKSPACE 'private-product'
          if ((& git -C $center rev-parse HEAD).Trim() -cne 'c7b84cfbbc1d41d24239bfd90fca76d517a6cb69') {
            throw 'PUBLIC_OWNER_IDENTITY_MISMATCH'
          }
          if ((& git -C $private rev-parse HEAD).Trim() -cne $env:PRIVATE_SOURCE_SHA) {
            throw 'PRIVATE_PRODUCT_IDENTITY_MISMATCH'
          }
          foreach($checkout in @($center,$private)){
            if (& git -C $checkout status --porcelain --untracked-files=all) {
              throw 'SOURCE_CHECKOUT_NOT_CLEAN'
            }
          }
          Write-Host 'ISOLATED_SOURCE_IDENTITIES_PASS'
      - name: Isolated desktop Node regression without source output
        if: ${{ contains(github.event.head_commit.message, ' node-only') }}
        timeout-minutes: 30
        shell: pwsh
        working-directory: private-product/desktop
        run: |
          $ErrorActionPreference='Stop'
          $npm=(Get-Command npm.cmd -ErrorAction Stop).Source
          $stdout=Join-Path $env:RUNNER_TEMP 'private-node-qa.stdout.log'
          $stderr=Join-Path $env:RUNNER_TEMP 'private-node-qa.stderr.log'
          $deps=Join-Path $env:RUNNER_TEMP 'private-node-qa-deps.log'
          & $npm ci --no-audit --no-fund *> $deps
          if($LASTEXITCODE -ne 0){throw 'PRIVATE_NODE_DEPENDENCIES_FAILED'}
          & $npm test -- --test-reporter=tap 1>$stdout 2>$stderr
          $exit=$LASTEXITCODE
          if(!(Test-Path -LiteralPath $stdout -PathType Leaf)){
            throw 'PRIVATE_NODE_RESULT_MISSING'
          }
          $pass=-1; $fail=-1; $ids=0
          foreach($line in [IO.File]::ReadLines($stdout)){
            if($line -match '^# pass (\d{1,7})\s*$'){$pass=[int]$Matches[1]}
            if($line -match '^# fail (\d{1,7})\s*$'){$fail=[int]$Matches[1]}
            if($line -match '^not ok \d+ - (.{1,350})$' -and $ids -lt 16){
              $bytes=[Text.Encoding]::UTF8.GetBytes($Matches[1].Trim())
              $digest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
              Write-Host ('PRIVATE_NODE_FAILED_ID_SHA256='+$digest)
              $ids++
            }
          }
          Write-Host ('PRIVATE_NODE_PASSED_COUNT='+$pass)
          Write-Host ('PRIVATE_NODE_FAILED_COUNT='+$fail)
          Write-Host ('PRIVATE_NODE_FAILED_ID_COUNT='+$ids)
          if($null -eq $exit -or $exit -ne 0){
            throw 'PRIVATE_NODE_TESTS_FAILED'
          }
          if($pass -lt 1 -or $fail -ne 0){throw 'PRIVATE_NODE_RESULT_INCOMPLETE'}
          Write-Host 'PRIVATE_NODE_REGRESSION_PASS'
      - name: Verify synthetic pinned public wheel transport on Windows
        if: ${{ contains(github.event.head_commit.message, ' native-only') }}
        timeout-minutes: 4
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://files.pythonhosted.org/packages/64/b4/17d4b0b2a2dc85a6df63d1157e028ed19f90d4cd97c36717afef2bc2f395/attrs-26.1.0-py3-none-any.whl'
          $sha='c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309'
          $dest=Join-Path $env:RUNNER_TEMP 'iwxa-public-wheel-test.whl'
          $script=Join-Path $env:RUNNER_TEMP 'public-wheel-transport.ps1'
          @'
          param([string]$Url,[string]$Target)
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          try {
            Invoke-WebRequest -UseBasicParsing $Url -OutFile $Target -TimeoutSec 30
            Write-Host 'PUBLIC_WHEEL_IWR=SUCCESS'
          } catch {
            Write-Host ('PUBLIC_WHEEL_IWR_ERROR_TYPE='+$_.Exception.GetType().Name)
            exit 1
          }
          '@ | Set-Content -LiteralPath $script -Encoding UTF8
          $ps=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $ps -NoLogo -NoProfile -NonInteractive -File $script -Url $url -Target $dest
          $iwrExit=$LASTEXITCODE
          if($iwrExit -eq 0 -and (Test-Path -LiteralPath $dest -PathType Leaf)){
            $digest=(Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host ('PUBLIC_WHEEL_IWR_SHA='+ $(if($digest -eq $sha){'PASS'}else{'MISMATCH'}))
          }else{
            Write-Host 'PUBLIC_WHEEL_IWR=FAIL'
            & curl.exe -L --fail --retry 1 --connect-timeout 10 --max-time 40 --output $dest $url 1>$null 2>$null
            $curlExit=$LASTEXITCODE
            if($curlExit -eq 0 -and (Test-Path -LiteralPath $dest -PathType Leaf)){
              $digest=(Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ('PUBLIC_WHEEL_CURL_SHA='+ $(if($digest -eq $sha){'PASS'}else{'MISMATCH'}))
            }else{
              Write-Host 'PUBLIC_WHEEL_CURL=FAIL'
            }
          }
          Remove-Item -LiteralPath $dest,$script -Force -ErrorAction SilentlyContinue
      - name: Install private source qualification dependencies
        if: ${{ !contains(github.event.head_commit.message, ' node-only') && !contains(github.event.head_commit.message, ' native-only') }}
        timeout-minutes: 22
        shell: pwsh
        working-directory: private-product
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements.txt -r requirements-ci.txt 1>$null
          if($LASTEXITCODE -ne 0){throw 'PRIVATE_SOURCE_REQUIREMENTS_INSTALL_FAILED'}
          python -m pip check 1>$null
          if($LASTEXITCODE -ne 0){throw 'PRIVATE_SOURCE_REQUIREMENTS_CONFLICT'}
          Write-Host 'PRIVATE_SOURCE_REQUIREMENTS_PASS'
      - name: Qualify private source and native installed Windows lifecycle
        if: ${{ !contains(github.event.head_commit.message, ' node-only') }}
        timeout-minutes: 150
        shell: pwsh
        env:
          PRIVATE_SOURCE_SHA: ${{ steps.private-pin.outputs.sha }}
          PRIVATE_QA_TRIGGER: ${{ github.event.head_commit.message }}
        working-directory: private-product
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-product'
          $center=Join-Path $env:GITHUB_WORKSPACE 'public-owner'
          $out=Join-Path $env:RUNNER_TEMP 'private-product-qualification'
          $cache=Join-Path $env:RUNNER_TEMP 'private-product-cache'
          $log=Join-Path $env:RUNNER_TEMP 'private-qualifier.stdout.log'
          $err=Join-Path $env:RUNNER_TEMP 'private-qualifier.stderr.log'
          $script=Join-Path $root 'tools/qualify_setup_core_full_product.ps1'
          $args=@('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$script,'-CenterRoot',$center,'-CenterCommit','c7b84cfbbc1d41d24239bfd90fca76d517a6cb69','-OutputRoot',$out,'-ReleaseCacheRoot',$cache)
          # Only this immutable source revision previously passed 4,575
          # Python tests and 757 Node tests in the same Windows run.
          if($env:PRIVATE_QA_TRIGGER -match ' native-only(?:\s|$)'){
            if($env:PRIVATE_SOURCE_SHA -cne '955af2fc11d6e78e36833497b003440c45ee084b'){
              throw 'PRIVATE_NATIVE_ONLY_UNQUALIFIED_SOURCE'
            }
            $args+=('-SkipSourceSuites')
            Write-Host 'PRIVATE_NATIVE_DIAGNOSTIC_ONLY_SOURCE_SUITES_PREVIOUSLY_VERIFIED'
          }
          $powershell=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          # PowerShell 7 module paths inherited through intermediate processes
          # can make Windows PowerShell 5.1 resolve Microsoft.PowerShell.Utility
          # version 7 instead of its native module. Removing the inherited
          # variable lets Windows PowerShell construct its own trusted defaults.
          # See Microsoft's about_PSModulePath guidance for grandchild processes.
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          & $powershell -NoLogo -NoProfile -NonInteractive -Command "if (Get-Command Get-FileHash -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }" 1>$null 2>$null
          if($LASTEXITCODE -ne 0){
            throw 'PUBLIC_WINDOWS_POWERSHELL_FILE_HASH_UNAVAILABLE'
          }
          Write-Host 'PUBLIC_WINDOWS_POWERSHELL_FILE_HASH_READY'
          # Preserve the native process handle before redirected execution completes.
          $p=Start-Process -FilePath $powershell -ArgumentList $args -WorkingDirectory $root -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          try {
            $handle=$p.Handle
            if($null -eq $handle -or $handle -eq [IntPtr]::Zero){
              throw 'PRIVATE_QUALIFICATION_PROCESS_HANDLE_MISSING'
            }
            if(!$p.WaitForExit(8700000)){
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              throw 'PRIVATE_QUALIFICATION_TIMEOUT'
            }
            $p.Refresh()
            $exit=$p.ExitCode
            if($null -eq $exit -or $exit -isnot [int]){
              throw 'PRIVATE_QUALIFICATION_PROCESS_EXIT_UNKNOWN'
            }
          } finally {
            $p.Dispose()
          }
          if($exit -ne 0){
            $raw=if(Test-Path -LiteralPath $err){Get-Content -LiteralPath $err -Raw}else{''}
            $code=[regex]::Match($raw,'(full_qualification_[a-z0-9_-]+|PRIVATE_SETUP_CORE_BUILD_FAIL|private_setup_[a-z0-9_-]+)')
            if($code.Success){Write-Host ('PRIVATE_QUALIFICATION_STAGE='+$code.Value)}
            else{Write-Host 'PRIVATE_QUALIFICATION_STAGE=UNCLASSIFIED'}
            if($raw -match 'full_qualification_step_failed_native-install-and-function'){
              $nativeLogs=Join-Path $out 'native-candidate/logs'
              $stages=[ordered]@{
                native_stub='native-setup-build.json'
                managed_python='test-python-bootstrap.log'
                desktop_icon='native-desktop-icon.json'
                u04_fetch='u04-source-preparation.json'
                u04_stage='u04-stage.json'
                node_dependencies='native-desktop-dependencies.log'
                tauri_build='native-desktop-build.log'
                payload='package-build-only.json'
                setup_resource='private-setup-core-build.json'
                installed_acceptance='public-test-local-result.txt'
              }
              foreach($stage in $stages.Keys){
                if(Test-Path -LiteralPath (Join-Path $nativeLogs $stages[$stage]) -PathType Leaf){
                  Write-Host ('PRIVATE_NATIVE_ATTEMPTED_STAGE='+$stage)
                }
              }
              $logPaths=@(
                (Join-Path $out 'evidence/native-install-and-function.stderr.log'),
                (Join-Path $out 'evidence/native-install-and-function.stdout.log'),
                (Join-Path $nativeLogs 'test-python-bootstrap.log'),
                (Join-Path $nativeLogs 'native-desktop-build.log'),
                (Join-Path $nativeLogs 'native-desktop-build.log.stderr'),
                (Join-Path $nativeLogs 'native-desktop-build.log.stderr'),
                (Join-Path $nativeLogs 'native-desktop-dependencies.log.stderr'),
                (Join-Path $nativeLogs 'package-build-only.json'),
                (Join-Path $nativeLogs 'private-setup-core-build.json'),
                (Join-Path $nativeLogs 'public-test-local-result.txt')
              )
              $codes=New-Object 'System.Collections.Generic.HashSet[string]'
              $classes=New-Object 'System.Collections.Generic.HashSet[string]'
              foreach($lp in $logPaths){
                if(!(Test-Path -LiteralPath $lp -PathType Leaf)){continue}
                $scanned=0
                foreach($line in [IO.File]::ReadLines($lp)){
                  if(++$scanned -gt 30000){break}
                  if($line -match '\b((?:native_candidate|private_setup|agent_setup|full_qualification|windows_python|windows_runtime|windows_release)_[a-z0-9_]{3,90}|SETUP_LOCAL_[A-Z0-9_]{3,90})\b'){
                    $null=$codes.Add($Matches[1])
                  }
                  if($line -match 'error\[E\d{4}\]'){$null=$classes.Add('RUST_COMPILER')}
                  if($line -match 'error TS(\d{4})'){
                    $null=$classes.Add('TYPESCRIPT')
                    Write-Host ('PRIVATE_NATIVE_TS_CODE=TS'+$Matches[1])
                  }
                  if($line -match 'error\[E(\d{4})\]'){
                    $null=$classes.Add('RUST_COMPILER')
                    Write-Host ('PRIVATE_NATIVE_RUST_CODE=E'+$Matches[1])
                  }
                  if($line -match 'Cannot find module|module not found'){$null=$classes.Add('MODULE_NOT_FOUND')}
                  if($line -match 'linker|link\.exe'){$null=$classes.Add('LINKER')}
                  if($line -match 'failed to load|failed to resolve'){$null=$classes.Add('RESOURCE_RESOLUTION')}
                  if($line -match 'not recognized as the name|command not found'){$null=$classes.Add('MISSING_TOOL')}
                  if($line -match 'failed to parse|invalid config'){$null=$classes.Add('CONFIG_PARSE')}
                  if($line -match 'unresolved import'){$null=$classes.Add('UNRESOLVED_IMPORT')}
                  if($line -match 'npm ERR!|npm error'){$null=$classes.Add('NPM')}
                  if($line -match 'failed to compile|could not compile'){$null=$classes.Add('RUST_BUILD')}
                  if($line -match 'ECONNRESET|ETIMEDOUT|Could not resolve host'){$null=$classes.Add('NETWORK')}
                  if($line -match 'windows_runtime_wheel_fetch_failed'){$null=$classes.Add('WHEEL_FETCH')}
                  if($line -match 'windows_runtime_wheel_(?:requirements_mismatch|identity_invalid|platform_or_python_mismatch)'){$null=$classes.Add('WHEEL_CONTRACT')}
                  if($line -match 'windows_python_release_digest_mismatch'){$null=$classes.Add('PYTHON_ARCHIVE_SHA')}
                  if($line -match 'windows_python_release_post_provision_verification_failed'){$null=$classes.Add('PYTHON_EXECUTABLE')}
                  if($line -match 'Invoke-WebRequest|curl: \('){$null=$classes.Add('HTTP_DOWNLOAD')}
                  if($line -match 'windows_runtime_wheel_fetch_failed:([A-Za-z0-9._-]{1,48})'){
                    Write-Host ('PRIVATE_NATIVE_WHEEL_NAME='+$Matches[1])
                  }
                  # This exception concerns a public pinned PyPI wheel, not
                  # user data. Redact locations, links and digests before
                  # emitting one bounded diagnostic to the public CI log.
                  if($line -match 'windows_runtime_wheel_fetch_failed:attrs:([^\r\n]{1,320})'){
                    $cause=$Matches[1]
                    $cause=[regex]::Replace($cause,'(?i)(?:https?://|[a-z]:\\|\\\\)[^\s,;]+','[location]')
                    $cause=[regex]::Replace($cause,'(?i)\b[0-9a-f]{40,64}\b','[digest]')
                    $cause=[regex]::Replace($cause,'[^\x20-\x7e]','?')
                    if($cause.Length -gt 160){$cause=$cause.Substring(0,160)}
                    Write-Host ('PRIVATE_PUBLIC_WHEEL_ERROR_SUMMARY='+$cause)
                  }
                  if($line -match 'HTTP (403|404|429|500|502|503|504)|returned error: (403|404|429|500|502|503|504)'){
                    $null=$classes.Add('HTTP_STATUS')
                  }
                  if($line -match 'No such host|Could not resolve|Name or service not known'){
                    $null=$classes.Add('DNS')
                  }
                  if($line -match 'timed out|timeout|ETIMEDOUT'){
                    $null=$classes.Add('TIMEOUT')
                  }
                  if($line -match 'certificate|SSL|TLS'){
                    $null=$classes.Add('CERTIFICATE_OR_TLS')
                  }
                  if($line -match 'digest_mismatch'){
                    $null=$classes.Add('DIGEST_MISMATCH')
                  }
                }
              }
              foreach($item in @($codes) | Sort-Object | Select-Object -First 16){
                Write-Host ('PRIVATE_NATIVE_ERROR_CODE='+$item)
              }
              foreach($item in @($classes) | Sort-Object){
                Write-Host ('PRIVATE_NATIVE_ERROR_CLASS='+$item)
              }
              Write-Host ('PRIVATE_NATIVE_ERROR_CODES_OBSERVED='+$codes.Count)
            }
            if($raw -match 'full_qualification_step_failed_python-(targeted|full)_exit_([0-9]{1,3})'){
              Write-Host ('PRIVATE_PYTHON_EXIT_CODE='+$Matches[2])
            }
            # The Node TAP log stays private; output only counts and hashes.
            $nodeStdout=Join-Path $out 'evidence/desktop-node-tests.stdout.log'
            if(Test-Path -LiteralPath $nodeStdout -PathType Leaf){
              $nodePass=-1; $nodeFail=-1; $nodeIds=0
              foreach($line in [IO.File]::ReadLines($nodeStdout)){
                if($line -match '^# pass (\d{1,7})\s*$'){$nodePass=[int]$Matches[1]}
                if($line -match '^# fail (\d{1,7})\s*$'){$nodeFail=[int]$Matches[1]}
                if($line -match '^not ok \d+ - (.{1,350})$' -and $nodeIds -lt 12){
                  $bytes=[Text.Encoding]::UTF8.GetBytes($Matches[1].Trim())
                  $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
                  Write-Host ('PRIVATE_NODE_FAILED_ID_SHA256='+$hash)
                  $nodeIds++
                }
              }
              Write-Host ('PRIVATE_NODE_PASSED_COUNT='+$nodePass)
              Write-Host ('PRIVATE_NODE_FAILED_COUNT='+$nodeFail)
              Write-Host ('PRIVATE_NODE_FAILED_ID_COUNT='+$nodeIds)
            }
            # The pytest log remains private on the ephemeral worker. Public
            # output contains only bounded test identifiers, never captured
            # tracebacks, assertion values, task content, or provider data.
            $testStage=if($raw -match 'full_qualification_step_(?:failed|exit_unknown)_python-targeted'){'python-targeted'}else{'python-full'}
            $pytestLog=Join-Path $out ('evidence/'+$testStage+'.stdout.log')
            $pytestErr=Join-Path $out ('evidence/'+$testStage+'.stderr.log')
            if($raw -match 'full_qualification_step_exit_unknown_python-(targeted|full)'){
              Write-Host 'PRIVATE_PYTHON_EXIT_OBSERVATION=UNAVAILABLE'
            }
            if(Test-Path -LiteralPath $pytestLog -PathType Leaf){
              $outputText=Get-Content -LiteralPath $pytestLog -Raw -Encoding UTF8
              if($null -eq $outputText){$outputText=''}
              if($outputText -match '(\d{1,6})\s+passed'){Write-Host ('PRIVATE_PYTHON_PASSED_COUNT='+$Matches[1])}
              if($outputText -match '(\d{1,6})\s+failed'){Write-Host ('PRIVATE_PYTHON_FAILED_COUNT='+$Matches[1])}
              if($outputText -match 'INTERNALERROR'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=INTERNAL'}
              if($outputText -match 'ERROR collecting '){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=COLLECTION'}
              if($outputText -match 'unrecognized arguments|pytest: error:'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=ARGUMENTS'}
              if($outputText -match 'no tests ran'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=NO_TESTS'}
              if($outputText -match 'Traceback \(most recent call last\)'){Write-Host 'PRIVATE_PYTHON_RUNNER_ERROR=TRACEBACK_REDACTED'}
              Write-Host ('PRIVATE_PYTHON_STDOUT_BYTES='+([Text.Encoding]::UTF8.GetByteCount($outputText)))
            }else{Write-Host 'PRIVATE_PYTHON_STDOUT=NOT_FOUND'}
            if(Test-Path -LiteralPath $pytestErr -PathType Leaf){
              $errText=Get-Content -LiteralPath $pytestErr -Raw -Encoding UTF8
              if($null -eq $errText){$errText=''}
              if($errText -match 'unrecognized arguments|pytest: error:'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=ARGUMENTS'}
              if($errText -match 'Fatal Python error|INTERNALERROR'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=INTERNAL'}
              if($errText -match 'No module named pytest'){Write-Host 'PRIVATE_PYTHON_STDERR_CLASS=PYTEST_MISSING'}
              Write-Host ('PRIVATE_PYTHON_STDERR_BYTES='+([Text.Encoding]::UTF8.GetByteCount($errText)))
            }else{Write-Host 'PRIVATE_PYTHON_STDERR=NOT_FOUND'}
            if(Test-Path -LiteralPath $pytestLog -PathType Leaf){
              $count=0
              $collections=0
              $locations=0
              $errors=0
              foreach($line in [IO.File]::ReadLines($pytestLog)){
                if($line -match '^(FAILED|ERROR)\s+(tests[/\\][A-Za-z0-9_/.\\:-]{1,220})\b'){
                  Write-Host ('PRIVATE_PYTHON_FAILED_TEST='+$Matches[2])
                  $count++
                }elseif($line -match '^ERROR collecting (tests[/\\][A-Za-z0-9_./\\-]{1,180}\.py)' -and $collections -lt 12){
                  Write-Host ('PRIVATE_PYTHON_COLLECTION_ERROR='+$Matches[1])
                  $collections++
                }elseif($line -match '^tests[/\\]([A-Za-z0-9_./\\-]{1,180}\.py):(\d{1,5}):' -and $locations -lt 12){
                  Write-Host ('PRIVATE_PYTHON_FAILURE_LOCATION='+$Matches[1]+':'+$Matches[2])
                  $locations++
                }elseif($line -match '^E\s+([A-Za-z][A-Za-z0-9_]*Error)\b' -and $errors -lt 12){
                  Write-Host ('PRIVATE_PYTHON_EXCEPTION_CLASS='+$Matches[1])
                  if($line -match '\[WinError (\d{1,4})\]'){
                    Write-Host ('PRIVATE_PYTHON_WINERROR='+$Matches[1])
                  }
                  if($line -match '^E\s+[A-Za-z][A-Za-z0-9_]*Error:\s+([a-z][a-z0-9_]{2,80})\s*$'){
                    Write-Host ('PRIVATE_PYTHON_ERROR_CODE='+$Matches[1])
                  }
                  $errors++
                }
                if($count -ge 20 -and $locations -ge 12 -and $errors -ge 12){break}
              }
              Write-Host ('PRIVATE_PYTHON_FAILURE_IDENTIFIERS_SHOWN='+$count)
              Write-Host ('PRIVATE_PYTHON_COLLECTION_IDENTIFIERS_SHOWN='+$collections)
            }
            throw 'PRIVATE_QUALIFICATION_NOT_ACCEPTED'
          }
          $resultPath=Join-Path $out 'result.json'
          if(!(Test-Path -LiteralPath $resultPath -PathType Leaf)){
            throw 'PRIVATE_QUALIFICATION_RESULT_MISSING'
          }
          $result=Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if($result.status -ne 'SOURCE_AND_INSTALLED_SMOKE_PASS' -or $result.source_commit -cne $env:PRIVATE_SOURCE_SHA){
            throw 'PRIVATE_QUALIFICATION_RESULT_UNVERIFIED'
          }
          $setup=Join-Path $out 'native-candidate/IWXA-Private-SetupCore-Candidate.exe'
          if(!(Test-Path -LiteralPath $setup -PathType Leaf)){
            throw 'PRIVATE_QUALIFICATION_INSTALLER_MISSING'
          }
          $hash=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host 'PRIVATE_WINDOWS_SOURCE_AND_INSTALLED_SMOKE_PASS'
          Write-Host ('PRIVATE_SETUP_SHA256='+$hash)
          Write-Host ('PRIVATE_SOURCE_SHA='+$result.source_commit)
          Write-Host 'PRIVATE_GUI_TASK_RESULT_FULL_ACCEPTANCE=NOT_RUN'
          # Never upload private files, archives, windows screenshots, or logs.

