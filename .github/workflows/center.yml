name: Setup Core full native journeys (fast qualification)
on:
  push:
    branches: ['work/2026-11-09-setup-core-fast-qualification']
permissions:
  contents: read
  actions: read
concurrency:
  group: setup-core-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse accepted native Center executable (no recompilation)
        uses: actions/download-artifact@v4
        with:
          name: center-windows-preparation-shell
          repository: Faust-S/Center
          run-id: 42631324997
          github-token: ${{ github.token }}
          path: accepted
      - name: Compile current native Setup and prepare real Center payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:GITHUB_WORKSPACE 'src-tauri/target/release'
          New-Item -ItemType Directory -Force -Path $target|Out-Null
          $source=Join-Path $env:GITHUB_WORKSPACE 'accepted/src-tauri/target/release/iwxa-admin-center.exe'
          if(!(Test-Path -LiteralPath $source -PathType Leaf)){throw 'SETUP_PINNED_CENTER_PAYLOAD_MISSING'}
          Copy-Item -LiteralPath $source -Destination (Join-Path $target 'iwxa-admin-center.exe')
          ./installer/windows/build-stub.ps1 -Output artifacts/iwxa-setup-core-early.exe
      - name: Source model package contracts
        shell: pwsh
        run: python -m unittest discover -s installer/tests -p 'test_*.py' -v
      - name: Unified WinForms model and first-install preflight
        shell: powershell
        run: ./installer/windows/qualify-gui-layout-fast.ps1 -Stub artifacts/iwxa-setup-core-early.exe
      - name: Real first-install, upgrade, rollback and storage migration
        shell: pwsh
        timeout-minutes: 7
        run: ./installer/windows/test-native-package.ps1
      - name: Real two-choice first-install existing-data transfer
        shell: powershell
        timeout-minutes: 7
        run: ./installer/windows/qualify-first-install-data-transfer.ps1 -Bundle artifacts/iwxa-setup-core-center-0.3-preview.exe
      - name: Signed native V2 lifecycle, test certificate
        shell: pwsh
        timeout-minutes: 6
        run: ./installer/windows/qualify-signed-resource-install.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iwxa-setup-core-qualification-evidence
          path: |
            artifacts/
            src-tauri/target/release/iwxa-admin-center.exe
          if-no-files-found: warn
