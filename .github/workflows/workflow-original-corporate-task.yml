# Public authorized qualification only. Never publish private source or raw logs.
name: Original corporate Workflow Task qualification
on:
  push:
    branches: ['ci/once/workflow-original-corporate-task/**']
    paths: ['.github/ci-requests/workflow-original-corporate-task.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-corporate-workflow-task
  cancel-in-progress: false
jobs:
  original-task:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate exact deliberate one-shot request before protected checkout
        if: github.event_name == 'push'
        run: node qualification/validate-workflow-task-request.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 9ff1332694ff0637badce3c44640d3aeef2e81f8
          path: knowledge
          persist-credentials: false
      - name: Original public employee grant owner qualification
        run: |
          test "$(git -C knowledge rev-parse HEAD)" = "9ff1332694ff0637badce3c44640d3aeef2e81f8"
          node --test knowledge/packages/t3-core/tests/t3-d3-independent-employee-original-enrollment.test.mjs > "$RUNNER_TEMP/workflow-public-grants.log" 2>&1 || { cat "$RUNNER_TEMP/workflow-public-grants.log"; exit 1; }
          cat "$RUNNER_TEMP/workflow-public-grants.log"
          grep -q "^# tests 27$" "$RUNNER_TEMP/workflow-public-grants.log"
          grep -q "^# pass 27$" "$RUNNER_TEMP/workflow-public-grants.log"
          echo ORIGINAL_WORKFLOW_EMPLOYEE_GRANTS_PASS
      - name: Original company persistence and Workflow stage result regression
        run: |
          node --test knowledge/packages/t3-core/tests/t3-original-company-workspace-persistence.test.mjs knowledge/packages/t3-core/tests/c3-workspace-method-stage-results.test.mjs > "$RUNNER_TEMP/workflow-public-result.log" 2>&1 || { cat "$RUNNER_TEMP/workflow-public-result.log"; exit 1; }
          cat "$RUNNER_TEMP/workflow-public-result.log"
          grep -q "^# tests 81$" "$RUNNER_TEMP/workflow-public-result.log"
          grep -q "^# pass 81$" "$RUNNER_TEMP/workflow-public-result.log"
      - name: Require authorized private read-only checkout
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo ORIGINAL_T3_SOURCE_ACCESS_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        id: private_t3
        with:
          repository: Faust-S/T3
          ref: f604c61cec6af11c65f437caa333ebad9f81e96e
          path: private-t3
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: a45e206291068147d4460acfa1ae91615accfcdf
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Original Agent private dependencies
        run: |
          test "$(git -C private-agent rev-parse HEAD)" = "a45e206291068147d4460acfa1ae91615accfcdf"
          python -m pip install -r private-agent/requirements-ci.txt > "$RUNNER_TEMP/workflow-agent-deps-private.log" 2>&1 || { echo ORIGINAL_AGENT_DEPENDENCIES_FAIL; exit 1; }
      - name: Original signed Workflow Task profile and roundtrip
        run: |
          test "$(git -C private-t3 rev-parse HEAD)" = "f604c61cec6af11c65f437caa333ebad9f81e96e"
          test "$(git -C knowledge rev-parse HEAD)" = "9ff1332694ff0637badce3c44640d3aeef2e81f8"
          export IWXA_WORKFLOW_PUBLIC_SOURCE="$(node -p 'require("node:path").resolve("knowledge")')"
          export IWXA_WORKFLOW_AGENT_SOURCE="$(node -p 'require("node:path").resolve("private-agent")')"
          export IWXA_WORKFLOW_AGENT_FIXTURE="$(node -p 'require("node:path").resolve("qualification/workflow-original-task.py")')"
          cd private-t3
          rc=0
          node --test tests/workflow-task-reference.test.mjs > "$RUNNER_TEMP/workflow-task-private.log" 2>&1 || rc=$?
          node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const k of ["tests","pass","fail","cancelled","skipped","todo"]){const m=s.match(new RegExp("^# "+k+" ([0-9]+)","m"));if(m)console.log("WORKFLOW_"+k.toUpperCase()+"="+m[1]);}for(const m of s.matchAll(/^not ok ([0-9]+) - /gm))console.log("WORKFLOW_FAILED_CASE="+m[1]);' "$RUNNER_TEMP/workflow-task-private.log"
          if [ "$rc" != 0 ]; then
            node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const b of s.split(/(?=^not ok [0-9]+ - )/m).filter(b=>b.startsWith("not ok "))){const n=b.match(/^not ok ([0-9]+)/)[1];console.log("CASE="+n);const codes=[...new Set([...b.matchAll(/\b(?:INTEROP|ACCESS|RECONCILIATION|IWXA|METHOD|T3|ERR)_[A-Z0-9_]+\b/g)].map(m=>m[0]))].slice(0,12);console.log("CODES="+codes.join(","));for(const m of [...b.matchAll(/(?:workflow-task-reference\.test|runtime|task-contract|task-revisions|organization-roles|core|registry|project-process-method-stage-input)\.mjs:([0-9]+):([0-9]+)/g)].slice(0,8))console.log("LOCATION="+m[0]);}' "$RUNNER_TEMP/workflow-task-private.log"
            echo ORIGINAL_WORKFLOW_TASK_REFERENCE_FAIL
            exit 1
          fi
          grep -q "^# tests 17$" "$RUNNER_TEMP/workflow-task-private.log"
          grep -q "^# pass 17$" "$RUNNER_TEMP/workflow-task-private.log"
          echo ORIGINAL_WORKFLOW_TASK_REFERENCE_PASS
          grep -q "ORIGINAL_AGENT_DURABLE_WORKFLOW_INPUT_FIXTURE_PASS" "$RUNNER_TEMP/workflow-task-private.log"
          echo ORIGINAL_PUBLIC_SOURCE_CORPORATE_SIGNED_ROUNDTRIP_PASS
          echo ORIGINAL_AGENT_DURABLE_WORKFLOW_INPUT_FIXTURE_PASS
          grep -q "ORIGINAL_AGENT_ACCEPTED_CONTENT_SIGNED_RESULT_FIXTURE_PASS" "$RUNNER_TEMP/workflow-task-private.log"
          echo ORIGINAL_AGENT_ACCEPTED_CONTENT_SIGNED_RESULT_FIXTURE_PASS
          grep -q "ORIGINAL_CORPORATE_THREE_WORK_ACCEPTED_CHAIN_FIXTURE_PASS" "$RUNNER_TEMP/workflow-task-private.log"
          echo ORIGINAL_CORPORATE_THREE_WORK_ACCEPTED_CHAIN_FIXTURE_PASS
          grep -q "ORIGINAL_INDEPENDENT_WORKFLOW_TASK_PROFILE_ROUNDTRIP_PASS" "$RUNNER_TEMP/workflow-task-private.log"
          echo ORIGINAL_INDEPENDENT_WORKFLOW_TASK_PROFILE_ROUNDTRIP_PASS
          grep -q "ORIGINAL_INDEPENDENT_WORKFLOW_SIGNED_WORKSPACE_INPUTS_PASS" "$RUNNER_TEMP/workflow-task-private.log"
          echo ORIGINAL_INDEPENDENT_WORKFLOW_SIGNED_WORKSPACE_INPUTS_PASS
          grep -q "ORIGINAL_TWO_INDEPENDENT_EMPLOYEE_ACCEPTED_WORKSPACE_CHAIN_PASS" "$RUNNER_TEMP/workflow-task-private.log"
          echo ORIGINAL_TWO_INDEPENDENT_EMPLOYEE_ACCEPTED_WORKSPACE_CHAIN_PASS
      - name: Original native Admin Host regression
        if: always() && steps.private_t3.outcome == 'success'
        run: |
          cd private-t3
          rc=0
          node --test tests/admin-original-host-port.test.mjs > "$RUNNER_TEMP/workflow-admin-host-private.log" 2>&1 || rc=$?
          node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const k of ["tests","pass","fail","cancelled","skipped","todo"]){const m=s.match(new RegExp("^# "+k+" ([0-9]+)","m"));if(m)console.log("ADMIN_HOST_"+k.toUpperCase()+"="+m[1]);}for(const m of s.matchAll(/^not ok ([0-9]+) - /gm))console.log("ADMIN_HOST_FAILED_CASE="+m[1]);' "$RUNNER_TEMP/workflow-admin-host-private.log"
          if [ "$rc" != 0 ]; then echo ORIGINAL_ADMIN_HOST_REGRESSION_FAIL; exit 1; fi
          echo ORIGINAL_ADMIN_HOST_REGRESSION_PASS
      - name: Original corporate interop accumulation
        if: always() && steps.private_t3.outcome == 'success'
        run: |
          cd private-t3
          rc=0
          npm run test:interop > "$RUNNER_TEMP/interop-regression-private.log" 2>&1 || rc=$?
          node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const k of ["tests","pass","fail","cancelled","skipped","todo"]){const m=s.match(new RegExp("^# "+k+" ([0-9]+)","m"));if(m)console.log("INTEROP_"+k.toUpperCase()+"="+m[1]);}for(const m of s.matchAll(/^not ok ([0-9]+) - /gm))console.log("INTEROP_FAILED_CASE="+m[1]);' "$RUNNER_TEMP/interop-regression-private.log"
          if [ "$rc" != 0 ]; then
            node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const b of s.split(/(?=^not ok [0-9]+ - )/m).filter(b=>b.startsWith("not ok "))){const n=b.match(/^not ok ([0-9]+)/)[1];console.log("INTEROP_CASE="+n);const codes=[...new Set([...b.matchAll(/\b(?:INTEROP|ACCESS|RECONCILIATION|IWXA|METHOD|T3|ERR)_[A-Z0-9_]+\b/g)].map(m=>m[0]))].slice(0,12);console.log("INTEROP_CODES="+codes.join(","));for(const m of [...b.matchAll(/(?:control-admin-interop\.test|multiuser-interop\.test|multi-organization-control\.test|multi-employee-provisioning\.test|multi-employee-admin\.test|multitask-interop\.test|signed-task-revisions\.test|runtime|task-contract|task-revisions|organization-roles|core|registry|provision-multi-employee)\.mjs:([0-9]+):([0-9]+)/g)].slice(0,8))console.log("INTEROP_LOCATION="+m[0]);}' "$RUNNER_TEMP/interop-regression-private.log"
            echo ORIGINAL_INTEROP_REGRESSION_FAIL
            exit 1
          fi
          grep -q "^# tests 83$" "$RUNNER_TEMP/interop-regression-private.log"
          grep -q "^# pass 83$" "$RUNNER_TEMP/interop-regression-private.log"
          echo ORIGINAL_INTEROP_REGRESSION_PASS
      - name: Remove private working copy and logs
        if: always()
        run: |
          rm -rf private-t3 private-agent
          rm -f "$RUNNER_TEMP/workflow-task-private.log" "$RUNNER_TEMP/interop-regression-private.log" "$RUNNER_TEMP/workflow-agent-deps-private.log" "$RUNNER_TEMP/workflow-admin-host-private.log"

  professional-programs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate exact deliberate one-shot request before protected checkout
        if: github.event_name == 'push'
        run: node qualification/validate-workflow-task-request.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require authorized private read-only checkout
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo PROFESSIONAL_SOURCE_ACCESS_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        id: professional_source
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: da6b66fb794d69a064168e4e4ddbc572a2167095
          path: professional-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Install isolated exact solver qualification dependencies
        run: |
          test "$(git -C professional-agent rev-parse HEAD)" = "da6b66fb794d69a064168e4e4ddbc572a2167095"
          python -m pip install -r professional-agent/requirements-ci.txt ortools==9.14.6206 mesa==3.5.2 simpy==4.1.2 > "$RUNNER_TEMP/professional-deps-private.log" 2>&1 || { echo PROFESSIONAL_DEPENDENCIES_FAIL; exit 1; }
          python -c "from importlib.metadata import version; from ortools.sat.python import cp_model; assert version('ortools')=='9.14.6206'; print('ORIGINAL_ORTOOLS_9_14_6206_PRESENT')"
      - name: Original OR-Tools solver and U01 connection qualification
        working-directory: professional-agent
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_ortools_allocation.py --junitxml="$RUNNER_TEMP/professional-target.xml" > "$RUNNER_TEMP/professional-target-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-target.xml" ORTOOLS 20 strict || exit 1
          test "$rc" = 0
      - name: Existing program and modeling regression
        if: always() && steps.professional_source.outcome == 'success'
        working-directory: professional-agent
        run: |
          rc=0
          python -m pytest -q tests/test_public_program_composition.py tests/test_agent065_modeling_experiment.py tests/test_agent065_modeling_cold_readback.py tests/test_agent065_modeling_result_artifacts.py --junitxml="$RUNNER_TEMP/professional-regression.xml" > "$RUNNER_TEMP/professional-regression-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-regression.xml" PROGRAM_REGRESSION 1 relaxed || exit 1
          test "$rc" = 0
      - name: Original desktop input and result projection tests
        if: always() && steps.professional_source.outcome == 'success'
        working-directory: professional-agent/desktop
        run: |
          rc=0
          node --test tests/ortools-allocation-form.test.mjs > "$RUNNER_TEMP/professional-desktop-private.log" 2>&1 || rc=$?
          node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const k of ["tests","pass","fail","skipped"]){const m=s.match(new RegExp("^# "+k+" ([0-9]+)","m"));if(m)console.log("DESKTOP_ALLOCATION_"+k.toUpperCase()+"="+m[1]);}' "$RUNNER_TEMP/professional-desktop-private.log"
          test "$rc" = 0
      - name: Original desktop TypeScript and Vite
        if: always() && steps.professional_source.outcome == 'success'
        working-directory: professional-agent/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/professional-npm-private.log" 2>&1 || { echo PROFESSIONAL_NPM_FAIL; exit 1; }
          npm run build:core > "$RUNNER_TEMP/professional-build-private.log" 2>&1 || { node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const m of s.matchAll(/(?:error )?(TS[0-9]{4})/g))console.log("DESKTOP_BUILD_CODE="+m[1]);' "$RUNNER_TEMP/professional-build-private.log"; echo PROFESSIONAL_DESKTOP_BUILD_FAIL; exit 1; }
          echo PROFESSIONAL_DESKTOP_BUILD_PASS
      - name: Remove private source and diagnostics
        if: always()
        run: |
          rm -rf professional-agent
          rm -f "$RUNNER_TEMP"/professional-*.xml "$RUNNER_TEMP"/professional-*-private.log
