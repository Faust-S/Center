name: Agent 0.6 exact personal Setup Core and real Qwen qualification
on:
  push:
    branches:
      - work/2026-11-21-agent06-personal-setup-qualification
    paths:
      - .github/workflows/agent06-personal-setup-core.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-personal-setup-${{ github.ref }}
  cancel-in-progress: false
jobs:
  personal-native-setup:
    runs-on: windows-2022
    timeout-minutes: 100
    env:
      AGENT_PIN: 267fc7ce2e6e4dbe46b81b11398d257d94c853ca
      SETUP_PIN: c10e193846a0ea4c73cabe3744aa7db82439d54e
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT_PIN }}
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          path: private-agent
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: ${{ env.SETUP_PIN }}
          path: setup-owner
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify exact private Agent and existing public Setup Core owners
        shell: pwsh
        run: |
          $actual=(& git -C private-agent rev-parse HEAD).Trim()
          $setup=(& git -C setup-owner rev-parse HEAD).Trim()
          if($actual -cne $env:AGENT_PIN){throw 'AGENT06_PERSONAL_AGENT_SOURCE_MISMATCH'}
          if($setup -cne $env:SETUP_PIN){throw 'AGENT06_PERSONAL_SETUP_OWNER_SOURCE_MISMATCH'}
          if((& git -C private-agent status --porcelain)){throw 'AGENT06_PERSONAL_AGENT_DIRTY'}
          if((& git -C setup-owner status --porcelain)){throw 'AGENT06_PERSONAL_SETUP_OWNER_DIRTY'}
          Write-Host 'AGENT06_PERSONAL_EXACT_OWNERS_PASS'
      - name: Parse original Agent Setup Core scripts with real Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $content=@'
          param([string]$Root)
          $scripts=@(
            'tools/build_setup_core_windows_candidate.ps1',
            'qualification/phase1/build_native_windows_setup_candidate.ps1',
            'tools/build_iwxa_windows_setup_exe.ps1',
            'tools/qualify_setup_core_runtime.ps1'
          )
          $failed=0
          foreach($relative in $scripts){
            $target=Join-Path $Root $relative
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($target,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0){
              $failed++
              foreach($e in @($errors | Select-Object -First 4)){
                Write-Output ('AGENT06_PS51_PARSER_ERROR_ID='+[string]$e.ErrorId)
                Write-Output ('AGENT06_PS51_PARSER_LINE='+[int]$e.Extent.StartLineNumber)
              }
            }
          }
          if($failed -gt 0){exit 21}
          Write-Output 'AGENT06_PS51_SETUP_SCRIPTS_PARSE_PASS'
          '@
          $file=Join-Path $env:RUNNER_TEMP 'agent06-ps51-parse-only.ps1'
          Set-Content -LiteralPath $file -Encoding UTF8 -Value $content
          $ps=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $ps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $file -Root (Resolve-Path 'private-agent').Path
          if($LASTEXITCODE -ne 0){throw 'AGENT06_PERSONAL_PS51_SYNTAX_INVALID'}
      - name: Regression test for optional PowerShell native argument handling
        shell: pwsh
        run: |
          Push-Location private-agent/desktop
          try {
            & node.exe --test tests/native-setup-optional-args.test.mjs tests/native-gui-qa-labels.test.mjs tests/native-acl-manifest.test.mjs *> (Join-Path $env:RUNNER_TEMP 'agent06-option-test-private.txt')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_OPTIONAL_POWERSHELL_ARG_TEST_FAIL'}
            Write-Host 'AGENT06_OPTIONAL_POWERSHELL_ARG_TEST_PASS'
          } finally {Pop-Location}
      - name: Build original Setup Core release and qualify real Qwen, Review, Repair and Rollback
        shell: pwsh
        timeout-minutes: 85
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'agent06-personal-setup-private.txt'
          $out=Join-Path $env:RUNNER_TEMP 'agent06-personal-setup-output'
          $cache=Join-Path $env:RUNNER_TEMP 'agent06-personal-setup-cache'
          $ps=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $agent=(Resolve-Path -LiteralPath 'private-agent').Path
          $center=(Resolve-Path -LiteralPath 'setup-owner').Path
          & $ps -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $agent 'tools/build_setup_core_windows_candidate.ps1') -CenterRoot $center -CenterCommit $env:SETUP_PIN -ReleaseCacheRoot $cache -OutputRoot $out *> $log
          $code=$LASTEXITCODE
          if($code -ne 0){
            $private=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            if($null -eq $private){$private=''}
            $safe=@(
              'private_setup_native_product_package_build_failed',
              'private_setup_core_package_build_failed',
              'private_setup_core_local_acceptance_failed',
              'private_setup_core_installed_runtime_not_verified',
              'private_setup_core_rollback_failed',
              'private_setup_core_rollback_proof_invalid',
              'private_setup_core_native_package_identity_invalid',
              'native_candidate_tauri_build_failed',
              'native_candidate_test_python_failed',
              'native_candidate_frontend_dependencies_failed',
              'native_candidate_rust_test_compile_failed'
            )
            # Identify exactly which original native Windows build phase failed.
            # Read private files only locally and report finite error CODES.
            $diagnosis=@(
              @('MissingArgument','NATIVE_ARGUMENT_MISSING'),
              @('Missing an argument for parameter','NATIVE_PARAMETER_ARGUMENT_OMITTED'),
              @('ParameterBindingException','PS_PARAMETER_BINDING'),
              @('CommandNotFoundException','PS_COMMAND_UNAVAILABLE'),
              @('Cannot bind argument','PS_NULL_OR_EMPTY_ARGUMENT'),
              @('ParserError','PS_PARSER_RUNTIME'),
              @('native_candidate_powershell_missing','PS51_BINARY_MISSING'),
              @('Join-Path','PS_JOIN_PATH_MENTIONED'),
              @('PublicObscuraCandidate','OPTIONAL_OBSCURA_PARAMETER_MENTIONED'),
              @('Cannot find path','PS_PATH_MISSING'),
              @('The term','PS_COMMAND_NOT_RECOGNIZED'),
              @('PSModulePath','PS_MODULE_PATH_MENTIONED')
            )
            foreach($item in $diagnosis){
              if($private.Contains([string]$item[0])){
                Write-Host ('AGENT06_SETUP_ERROR_SHAPE='+[string]$item[1])
              }
            }
            # Original Setup Core writes a finite installation witness under
            # the isolated fixture even when its exit code is nonzero.
            # Report ONLY strictly enumerated phases/codes, not raw private log.
            $acceptLog=Join-Path $out 'logs/public-test-local-result.txt'
            $accept=Get-Content -LiteralPath $acceptLog -Raw -ErrorAction SilentlyContinue
            if($accept){
              $markers=@('IWXA_SETUP_LOCAL_RUNTIME_WITNESS_PASS',
                'IWXA_SETUP_LOCAL_NATIVE_INSTALL_AND_PRESERVE_PASS',
                'IWXA_SETUP_LOCAL_REPAIR_AND_CONFIRM_PASS')
              foreach($marker in $markers){
                if($accept.Contains($marker)){Write-Host ('AGENT06_SETUP_ACCEPT_STAGE='+$marker)}
              }
            }
            $witnessPath=Join-Path $out 'temporary-installed-fixture/installed-witness.json'
            Write-Host ('AGENT06_SETUP_WITNESS_PRESENT='+[int](Test-Path -LiteralPath $witnessPath -PathType Leaf))
            if(Test-Path -LiteralPath $witnessPath -PathType Leaf){
              try {
                $receipt=Get-Content -LiteralPath $witnessPath -Raw -Encoding UTF8|ConvertFrom-Json -ErrorAction Stop
                $allowedPhases=@('SHORTCUT_READBACK','COLD_GUI_BOOT','FIRST_CORE','CORE_QUERIES',
                  'DRAFT_CREATE','GUI_DRAFT_EDIT','GUI_DRAFT_READBACK','QWEN_EXECUTE',
                  'COLD_RESTART','COLD_CORE_QUERIES','GUI_DRAFT_REOPEN','QWEN_COLD_IMPORT',
                  'GUI_RESULT','GUI_TASK_SUBMIT','GUI_TASK_RESULT','GUI_TASK_REVIEW',
                  'GUI_TASK_REVIEW_READBACK','GUI_COLD_RESTART','GUI_COLD_IMPORT',
                  'K03_TASK_EXECUTE','K03_TASK_COLD_RESTART','K03_TASK_COLD_READBACK',
                  'CLEAN_STOP','WITNESS_RECEIPT')
                if([string]$receipt.status -in @('PASS','FAIL')){
                  Write-Host ('AGENT06_SETUP_WITNESS_STATUS='+[string]$receipt.status)
                }
                if([string]$receipt.phase -cin $allowedPhases){
                  Write-Host ('AGENT06_SETUP_WITNESS_PHASE='+[string]$receipt.phase)
                }
                # The private owner restricts failure_code to a finite enum.
                # Only programmatic enum tokens may be published.
                foreach($field in @('failure_code','last_operation','last_checkpoint',
                    'background_state','background_error_class')){
                  $value=[string]$receipt.$field
                  if($value -cmatch '^[A-Z][A-Z0-9_]{2,95}              STUB_EXE=(Join-Path $out 'build/IWXA Personal Setup.stub.exe')
              NATIVE_STAGE_LOG=(Join-Path $out 'logs/native-setup-build.json')
              PYTHON_STAGE_LOG=(Join-Path $out 'logs/test-python-bootstrap.log')
              NATIVE_STAGE_RESULT=(Join-Path $out 'logs/private-build-result.json')
              MANAGED_PYTHON=(Join-Path $out 'build/test-python/current-python.txt')
            }
            foreach($key in @('STUB_EXE','NATIVE_STAGE_LOG','PYTHON_STAGE_LOG','NATIVE_STAGE_RESULT','MANAGED_PYTHON')){
              Write-Host ('AGENT06_SETUP_STAGE_'+$key+'='+([int](Test-Path -LiteralPath $stages[$key] -PathType Leaf)))
            }
            $nativeCodes=@(
              'native_setup_source_root_missing','native_setup_sources_incomplete',
              'native_setup_csc_missing','native_setup_icon_missing',
              'native_setup_reference_missing','native_setup_compile_failed',
              'native_candidate_stub_compile_failed','native_candidate_test_python_failed',
              'native_candidate_test_python_missing','native_candidate_npm_missing',
              'native_candidate_rust_toolchain_missing','native_candidate_frontend_dependencies_failed',
              'native_candidate_tauri_build_failed','native_candidate_rust_test_compile_failed',
              'native_candidate_powershell_missing','private_setup_git_identity_failed',
              'private_setup_native_product_package_build_failed'
            )
            $scan=@($log,$stages['NATIVE_STAGE_LOG'],$stages['PYTHON_STAGE_LOG'],$stages['NATIVE_STAGE_RESULT'])
            foreach($file in $scan){
              $raw=Get-Content -LiteralPath $file -Raw -ErrorAction SilentlyContinue
              if([string]::IsNullOrEmpty($raw)){continue}
              foreach($code in $nativeCodes){
                if($raw.Contains($code)){
                  Write-Host ('AGENT06_SETUP_NATIVE_CODE='+$code.ToUpperInvariant())
                }
              }
              foreach($errorId in @([regex]::Matches($raw,'(?i)(?<![A-Z0-9])(?:error CS|error TS)\d{4}(?!\d)') |
                  Select-Object -First 6)){
                Write-Host ('AGENT06_SETUP_COMPILER_CODE='+$errorId.Value.Replace(' ','_').ToUpperInvariant())
              }
            }
            $observed=0
            foreach($key in $safe){
              if($private.Contains($key)){
                Write-Host ('AGENT06_PERSONAL_SETUP_FAILURE_CLASS='+$key.ToUpperInvariant())
                $observed++
              }
            }
            if($observed -eq 0){Write-Host 'AGENT06_PERSONAL_SETUP_FAILURE_CLASS=OTHER'}
            throw 'AGENT06_PERSONAL_SETUP_FULL_ACCEPTANCE_FAIL'
          }
          $setupExe=Join-Path $out 'IWXA-Private-SetupCore-Candidate.exe'
          if(!(Test-Path -LiteralPath $setupExe -PathType Leaf)){throw 'AGENT06_PERSONAL_SETUP_EXE_NOT_BUILT'}
          Write-Host 'AGENT06_PERSONAL_SETUP_REAL_QWEN_REVIEW_COLD_REPAIR_ROLLBACK_PASS'
      # Exact private sources, user data, model logs, executable and Qwen results
      # stay on the disposable Windows runner. Do not upload artifacts.
){
                    Write-Host ('AGENT06_SETUP_WITNESS_'+$field.ToUpperInvariant()+'='+$value)
                  }
                }
              } catch {
                Write-Host 'AGENT06_SETUP_WITNESS_UNREADABLE'
              }
            }
            $knownAcceptCodes=@('SETUP_LOCAL_WITNESS_EXIT_FAILED',
                'SETUP_LOCAL_WITNESS_TIMEOUT','SETUP_LOCAL_WITNESS_RECEIPT_MISSING',
                'SETUP_LOCAL_WITNESS_READBACK_INVALID',
                'SETUP_LOCAL_ACTIVATION_INVALID','SETUP_LOCAL_ON_DISK_IDENTITY_INVALID',
                'SETUP_LOCAL_NATIVE_FAILED_INSTALL','SETUP_LOCAL_NATIVE_FAILED_REPAIR',
                'SETUP_LOCAL_REPAIR_NOT_ACTIVATED','SETUP_LOCAL_REPAIR_READBACK_INVALID',
                'SETUP_LOCAL_REPAIR_CONFIRM_OR_USER_DATA_LOST',
                'SETUP_LOCAL_UNINSTALL_OR_DATA_LOSS')
            foreach($code in $knownAcceptCodes){
              if($private.Contains($code)){
                Write-Host ('AGENT06_SETUP_ACCEPT_FAILURE_CLASS='+$code)
              }
            }
            $stages=@{
              STUB_EXE=(Join-Path $out 'build/IWXA Personal Setup.stub.exe')
              NATIVE_STAGE_LOG=(Join-Path $out 'logs/native-setup-build.json')
              PYTHON_STAGE_LOG=(Join-Path $out 'logs/test-python-bootstrap.log')
              NATIVE_STAGE_RESULT=(Join-Path $out 'logs/private-build-result.json')
              MANAGED_PYTHON=(Join-Path $out 'build/test-python/current-python.txt')
            }
            foreach($key in @('STUB_EXE','NATIVE_STAGE_LOG','PYTHON_STAGE_LOG','NATIVE_STAGE_RESULT','MANAGED_PYTHON')){
              Write-Host ('AGENT06_SETUP_STAGE_'+$key+'='+([int](Test-Path -LiteralPath $stages[$key] -PathType Leaf)))
            }
            $nativeCodes=@(
              'native_setup_source_root_missing','native_setup_sources_incomplete',
              'native_setup_csc_missing','native_setup_icon_missing',
              'native_setup_reference_missing','native_setup_compile_failed',
              'native_candidate_stub_compile_failed','native_candidate_test_python_failed',
              'native_candidate_test_python_missing','native_candidate_npm_missing',
              'native_candidate_rust_toolchain_missing','native_candidate_frontend_dependencies_failed',
              'native_candidate_tauri_build_failed','native_candidate_rust_test_compile_failed',
              'native_candidate_powershell_missing','private_setup_git_identity_failed',
              'private_setup_native_product_package_build_failed'
            )
            $scan=@($log,$stages['NATIVE_STAGE_LOG'],$stages['PYTHON_STAGE_LOG'],$stages['NATIVE_STAGE_RESULT'])
            foreach($file in $scan){
              $raw=Get-Content -LiteralPath $file -Raw -ErrorAction SilentlyContinue
              if([string]::IsNullOrEmpty($raw)){continue}
              foreach($code in $nativeCodes){
                if($raw.Contains($code)){
                  Write-Host ('AGENT06_SETUP_NATIVE_CODE='+$code.ToUpperInvariant())
                }
              }
              foreach($errorId in @([regex]::Matches($raw,'(?i)(?<![A-Z0-9])(?:error CS|error TS)\d{4}(?!\d)') |
                  Select-Object -First 6)){
                Write-Host ('AGENT06_SETUP_COMPILER_CODE='+$errorId.Value.Replace(' ','_').ToUpperInvariant())
              }
            }
            $observed=0
            foreach($key in $safe){
              if($private.Contains($key)){
                Write-Host ('AGENT06_PERSONAL_SETUP_FAILURE_CLASS='+$key.ToUpperInvariant())
                $observed++
              }
            }
            if($observed -eq 0){Write-Host 'AGENT06_PERSONAL_SETUP_FAILURE_CLASS=OTHER'}
            throw 'AGENT06_PERSONAL_SETUP_FULL_ACCEPTANCE_FAIL'
          }
          $setupExe=Join-Path $out 'IWXA-Private-SetupCore-Candidate.exe'
          if(!(Test-Path -LiteralPath $setupExe -PathType Leaf)){throw 'AGENT06_PERSONAL_SETUP_EXE_NOT_BUILT'}
          Write-Host 'AGENT06_PERSONAL_SETUP_REAL_QWEN_REVIEW_COLD_REPAIR_ROLLBACK_PASS'
      # Exact private sources, user data, model logs, executable and Qwen results
      # stay on the disposable Windows runner. Do not upload artifacts.
