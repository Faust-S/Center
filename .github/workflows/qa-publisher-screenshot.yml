name: Verified current Publisher screenshot for IWXA site
on:
  push:
    branches:
      - qa/2026-11-19-site-verified-publisher
    paths:
      - .github/workflows/qa-publisher-screenshot.yml
permissions:
  contents: write
  actions: read
jobs:
  native-publisher-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          repository: Faust-S/Center
          run-id: 44613831781
          name: publisher-windows-setupcore
          path: ${{ runner.temp }}/windows
          github-token: ${{ github.token }}
      - name: Check genuine installed Publisher and produce compressed evidence
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from PIL import Image
          folder=Path(os.environ['RUNNER_TEMP'])/'windows'/'artifacts/publisher-setupcore'
          src=folder/'publisher-desktop-first-launch.png'
          expected='173223b0372541e6f02e751777e933dbff86ecfff6ff836f1319680ebca59491'
          assert hashlib.sha256(src.read_bytes()).hexdigest()==expected, 'PUBLISHER_CURRENT_CAPTURE_CHANGED'
          result=json.loads((folder/'result.json').read_text(encoding='utf-8-sig'))
          assert result['status']=='PUBLISHER_SETUP_CORE_INSTALLED_GUI_PASS' and result['sourceHead']=='5d5595b7cc13b79685aee5c3a06cc7d1826abbf9', 'PUBLISHER_GUI_RECEIPT_CHANGED'
          assert not result['productionActivation'] and not result['signedLicenseIssued'], 'PUBLISHER_RELEASE_MISLABELLED'
          im=Image.open(src).convert('RGB')
          assert im.size==(1024,719), 'PUBLISHER_SCREEN_SIZE_CHANGED'
          im=im.crop((8,0,1024,671))
          target=Path('qa-verified-software-screens/publisher05-current-verified.webp')
          target.parent.mkdir(parents=True,exist_ok=True)
          im.save(target,format='WEBP',quality=79,method=6)
          Path(str(target)+'.b64.txt').write_text(base64.b64encode(target.read_bytes()).decode('ascii')+'\n',encoding='ascii')
          manifest={'status':'NATIVE_GUI_PASS_TEST_ONLY','release':'NOT_PRODUCTION','owner':"3397d4d7e599760a07662e766ed3e4cf6ecc2a23",'ciHead':'5d5595b7cc13b79685aee5c3a06cc7d1826abbf9','run':44613831781,'original_png_sha256':expected,'webp_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'dimensions':list(im.size)}
          Path('qa-verified-software-screens/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print('IWXA_PUBLISHER_CURRENT_NATIVE_SCREEN_PASS',manifest['webp_sha256'])
          PY
      - name: Store current screenshot and proof without production source
        run: |
          git config user.name 'IWXA QA'
          git config user.email 'iwxa-qa@users.noreply.github.com'
          git add qa-verified-software-screens/
          git commit -m 'evidence: current Publisher native TEST GUI [skip ci]'
          git push origin HEAD:qa/2026-11-19-site-verified-publisher
