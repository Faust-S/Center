name: D11 Case001 canonical qualification
on:
  push:
    branches:
      - work/2026-11-13-d11-case001-qualification
  workflow_dispatch:
jobs:
  node-model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Canonical D11 subject and T2 contract tests
        run: |
          node --version
          node --experimental-strip-types --test tests/*.test.mjs
      - name: Canonical and browser project modules are identical
        run: |
          set -eu
          for module in engine warehouse case001 execution inventory project-import proposal; do
            cmp "model/logistics/$module.ts" "src/lib/logistics/$module.ts"
          done
      - name: Parse browser route TSX
        run: npx --yes esbuild@0.25.5 src/routes/tools.delivery-network-planner.tsx --format=esm --outfile=/tmp/d11-route.js --log-level=error
