name: Agent062 V8 source and UI regression Windows
on:
  push:
    branches:
      - work/2026-11-23-agent-062-v8-source-check
    paths:
      - .github/workflows/agent062-v8-source-check.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-2022
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 5ebf25c85ba50ebb863f26bab28ba2d3db769693
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse native Windows UI Automation witness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path=Join-Path $env:GITHUB_WORKSPACE 'qualification/agent062/qualify_dashboard_installed.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,[ref]$tokens,[ref]$errors) | Out-Null
          if(@($errors).Count -ne 0){
            Write-Host ('AGENT062_V8_WINDOWS_POWERSHELL_PARSE_ERRORS='+@($errors).Count)
            foreach($entry in @($errors)|Select-Object -First 12){
              # Publish only parser IDs and line numbers; private source
              # excerpts, installed data and credentials stay in the runner.
              Write-Host ('AGENT062_V8_PARSE_ID='+[string]$entry.ErrorId+
                ';LINE='+[int]$entry.Extent.StartLineNumber+
                ';COLUMN='+[int]$entry.Extent.StartColumnNumber)
            }
            throw 'AGENT062_V8_WINDOWS_POWERSHELL_PARSE_FAILED'
          }
          Write-Host 'AGENT062_V8_WINDOWS_POWERSHELL_PARSE_PASS'
      - name: Run the original desktop tests and V8 shell checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location desktop
          npm ci --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'AGENT062_V8_NPM_INSTALL_FAILED'}
          node --test tests/agent062-v8-shell.test.mjs tests/agent062-v8-progressive-ux.test.mjs tests/agent06-sidebar-collapse.test.mjs tests/conversation-groups-062.test.mjs
          if($LASTEXITCODE -ne 0){throw 'AGENT062_V8_UI_TESTS_FAILED'}
          npm run build
          if($LASTEXITCODE -ne 0){throw 'AGENT062_V8_TYPESCRIPT_BUILD_FAILED'}
          Write-Host 'AGENT062_V8_TS_BUILD_AND_UI_REGRESSION_PASS'
