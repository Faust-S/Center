# Authorized read-only qualification on disposable public runners.
# No private artifacts, source, screenshots, unredacted test output or credentials are uploaded.
name: Agent 0.6.3 exact source qualification
on:
  push:
    branches:
      - work/2026-11-24-agent-v8-regression-diagnostics
    paths:
      - .github/workflows/agent-v8-regression-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: agent063-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PRIVATE_PIN: 'dcac9748851d330ab3f005f874759c8cd98d902b'
      PRIVATE_TREE: 'cc26c356187718d0010817a48bcda61bb9aa8a2f'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.PRIVATE_PIN }}
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned source and run original tests without publishing logs
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          if((& git rev-parse HEAD).Trim() -cne $env:PRIVATE_PIN -or
             (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:PRIVATE_TREE){
            throw 'SOURCE_PIN_MISMATCH'
          }
          $out=Join-Path $env:RUNNER_TEMP 'agent063-private'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $npm=if($IsWindows){'npm.cmd'}else{'npm'}
          Push-Location desktop
          & $npm ci --no-audit --no-fund *> (Join-Path $out 'npm.log')
          $install=$LASTEXITCODE
          Write-Host ('NPM_CI_EXIT='+$install)
          $test=99;$build=99
          if($install -eq 0){
            # Only fixed numeric coordinates are public: file ordinal in the
            # sorted private test inventory and test declaration line. Never
            # emit a path, test name, assertion, message or stack trace.
            $nodeLog=Join-Path $out 'node.log'
            & node --test --test-reporter=tap *> $nodeLog
            $test=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $nodeLog -Raw -ErrorAction SilentlyContinue
            # TAP location is processed locally on both platforms. Never echo
            # any test name, location path, assertion or source excerpt.
            $files=[string[]]@(Get-ChildItem -LiteralPath 'tests' -File -Filter '*.test.mjs'|ForEach-Object {$_.Name})
            [Array]::Sort($files,[StringComparer]::Ordinal)
            $locations=[regex]::Matches([string]$raw,'(?m)^\s*location:\s+''?(?:[^\r\n]*[/\\])?([^/\\:\r\n]+\.test\.mjs):([0-9]{1,6}):[0-9]{1,6}''?\s*$')
            foreach($loc in $locations){
              $ordinal=[Array]::IndexOf($files,$loc.Groups[1].Value)+1
              $line=[int]$loc.Groups[2].Value
              if($ordinal -gt 0 -and $line -gt 0){
                Write-Host ('NODE_FAILURE_CODE=N'+$ordinal.ToString('D3')+'_L'+$line.ToString('D6'))
              }
            }
            foreach($k in @('tests','pass','fail','cancelled','skipped','todo')){
              if($raw -match ('(?m)^# '+$k+' ([0-9]+)\s*$')){
                Write-Host ('NODE_'+$k.ToUpperInvariant()+'='+$Matches[1])
              }
            }
            & $npm run build *> (Join-Path $out 'build.log')
            $build=$LASTEXITCODE
            $raw=Get-Content -LiteralPath (Join-Path $out 'build.log') -Raw
            $codes=[regex]::Matches([string]$raw,'error TS[0-9]{4}:')
            $codes|ForEach-Object {$_.Value}|Group-Object|ForEach-Object {Write-Host ('TS_ERROR_CODE='+$_.Name+' COUNT='+$_.Count)}
          }
          Pop-Location
          & python -m pip install --disable-pip-version-check -r requirements-ci.txt *> (Join-Path $out 'pip.log')
          $pip=$LASTEXITCODE
          Write-Host ('PIP_EXIT='+$pip)
          $py=99
          if($pip -eq 0){
            $junit=Join-Path $out 'pytest.xml'
            & python -m pytest -q tests/test_work_areas_interaction.py -o junit_family=xunit1 "--junitxml=$junit" *> (Join-Path $out 'pytest.log')
            $py=$LASTEXITCODE
            # JUnit stays on the disposable runner. Only the numeric line of
            # a failed case in this already specified module is emitted.
            if(Test-Path -LiteralPath $junit){
              try{
                [xml]$report=Get-Content -LiteralPath $junit -Raw
                foreach($case in $report.SelectNodes('//testcase[failure or error]')){
                  $line=[string]$case.GetAttribute('line')
                  if($line -cmatch '^[0-9]{1,6}$'){
                    Write-Host ('PYTEST_FAILURE_CODE=P_L'+(([int]$line+1).ToString('D6')))
                  }else{Write-Host 'PYTEST_FAILURE_CODE=P_L000000'}
                }
              }catch{Write-Host 'PYTEST_FAILURE_CODE=P_L000000'}
            }
            $raw=Get-Content -LiteralPath (Join-Path $out 'pytest.log') -Raw
            # Only fixed-format numeric coordinates, never traceback text.
            $witness=[regex]::Matches([string]$raw,'(?m)^\s*tests[/\\]test_work_areas_interaction\.py:([0-9]{1,6}):')
            @($witness|ForEach-Object {$_.Groups[1].Value}|Sort-Object -Unique)|ForEach-Object {
              Write-Host ('PYTEST_WITNESS_LINE=P_L'+([int]$_).ToString('D6'))
            }
            foreach($k in @('passed','failed','errors','skipped','deselected')){
              $match=[regex]::Match([string]$raw,'(?m)([0-9]+) '+$k+'\b')
              if($match.Success){Write-Host ('PYTEST_'+$k.ToUpperInvariant()+'='+$match.Groups[1].Value)}
            }
          }
          Write-Host ('NODE_EXIT='+$test)
          Write-Host ('BUILD_EXIT='+$build)
          Write-Host ('PYTEST_EXIT='+$py)
          Write-Host 'PRIVATE_ARTIFACT_UPLOADS=0'
          if($install -ne 0 -or $test -ne 0 -or $build -ne 0 -or $pip -ne 0 -or $py -ne 0){throw 'AGENT063_SOURCE_QUALIFICATION_FAILED'}
