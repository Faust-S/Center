# Address the four differential failures on the original owner contracts.
# Private source and unredacted test output stay inside a disposable runner.
name: Agent 0.6.3 differential regression correction
on:
  push:
    branches:
      - work/2026-11-24-agent-v8-baseline-comparison
    paths:
      - .github/workflows/agent-v8-regression-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: agent063-differential-correction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PRIVATE_PIN: 'c47ca92d746e9e65535e4cea882ba7e2e4820008'
      PRIVATE_TREE: '4caaf7f39cb0c0d8fb6b43123230cfa46c169dcb'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.PRIVATE_PIN }}
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify corrected source and run owner contract regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          if((& git rev-parse HEAD).Trim() -cne $env:PRIVATE_PIN -or
             (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:PRIVATE_TREE){throw 'SOURCE_PIN_MISMATCH'}
          $manifest=Get-Content -LiteralPath 'qualification/agent063/source-regression.json' -Raw -Encoding UTF8|ConvertFrom-Json
          $suites=[string[]]@('tests/cells/test_memory_context_human_knowledge.py','tests/test_programs_center_execution.py','tests/test_current_model_readiness.py','tests/test_ollama_user_readiness.py','tests/test_p01_obsidian_toolruntime.py')
          foreach($p in $suites){
            if($p -cnotin $manifest.python -or !(Test-Path -LiteralPath $p -PathType Leaf)){throw 'CORRECTION_SUITE_MISSING'}
          }
          $out=Join-Path $env:RUNNER_TEMP 'agent063-correction-private'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          & python -m pip install --disable-pip-version-check -r requirements-ci.txt *> (Join-Path $out 'pip.log')
          if($LASTEXITCODE -ne 0){throw 'CORRECTION_DEPENDENCIES_FAILED'}
          $junit=Join-Path $out 'corrected.xml'
          & python -m pytest -q @suites -o junit_family=xunit1 "--junitxml=$junit" *> (Join-Path $out 'pytest.log')
          $exitCode=$LASTEXITCODE
          if(!(Test-Path -LiteralPath $junit -PathType Leaf)){throw 'CORRECTION_XML_MISSING'}
          [xml]$doc=Get-Content -LiteralPath $junit -Raw -Encoding UTF8
          $cases=@($doc.SelectNodes('//testcase'))
          $fail=@($cases|Where-Object {$_.SelectSingleNode('failure|error')})
          $skip=@($cases|Where-Object {$_.SelectSingleNode('skipped')})
          Write-Host ('CORRECTION_MODULES='+$suites.Count)
          Write-Host ('CORRECTION_PASS='+($cases.Count-$fail.Count-$skip.Count))
          Write-Host ('CORRECTION_FAIL='+$fail.Count)
          Write-Host ('CORRECTION_SKIP='+$skip.Count)
          Write-Host ('CORRECTION_EXIT='+$exitCode)
          foreach($case in $fail){
            $relative=([string]$case.file).Replace('\','/')
            $idx=[array]::IndexOf($suites,$relative)+1
            $line=0
            if([string]$case.line -match '^[0-9]{1,6}$'){$line=[int]$case.line+1}
            Write-Host ('CORRECTION_FAILURE=P'+$idx.ToString('D3')+'_L'+$line.ToString('D6'))
          }
          Write-Host 'PRIVATE_ARTIFACT_UPLOADS=0'
          if($cases.Count -eq 0 -or $fail.Count -ne 0 -or $exitCode -ne 0){throw 'CORRECTION_REQUIRES_REVIEW'}
