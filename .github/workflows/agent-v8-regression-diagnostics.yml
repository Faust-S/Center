# Authorized read-only qualification on disposable public runners.
# No private artifacts, source, screenshots, unredacted test output or credentials are uploaded.
name: Agent 0.6.3 complete Python catalogue regression
on:
  push:
    branches:
      - work/2026-11-24-agent-v8-complete-python-regression
    paths:
      - .github/workflows/agent-v8-regression-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: agent063-full-python-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
        shard: [0, 1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      TEST_SHARD: ${{ matrix.shard }}
      PRIVATE_PIN: '12433fa69a5451f4819403144e5fd7961be102f7'
      PRIVATE_TREE: '6e45c33057fa51607bd2abefb2c7d518f8758114'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.PRIVATE_PIN }}
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run existing Python test catalogue in its isolated pytest profile
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          if((& git rev-parse HEAD).Trim() -cne $env:PRIVATE_PIN -or
             (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:PRIVATE_TREE){
            throw 'SOURCE_PIN_MISMATCH'
          }
          $all=[string[]]@(& git ls-files -- tests/ | Where-Object {$_ -cmatch '^tests/(?:[a-zA-Z0-9_]+/)*test_[a-zA-Z0-9_]+\.py$'})
          [Array]::Sort($all,[StringComparer]::Ordinal)
          if($all.Count -lt 400 -or @($all|Sort-Object -Unique).Count -ne $all.Count){throw 'PYTHON_CATALOGUE_INVALID'}
          $suites=[string[]]@($all | Where-Object { ([Array]::IndexOf($all,$_ ) % 2) -eq [int]$env:TEST_SHARD })
          foreach($path in $suites){if(!(Test-Path -LiteralPath $path -PathType Leaf)){throw 'PYTHON_CATALOGUE_MISSING'}}
          Write-Host ('PYTHON_CATALOGUE_MODULES='+$all.Count)
          Write-Host ('PYTHON_SHARD_MODULES='+$suites.Count)
          Write-Host ('PYTHON_SHARD='+$env:TEST_SHARD)
          $out=Join-Path $env:RUNNER_TEMP 'agent063-full-private'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          & python -m pip install --disable-pip-version-check -r requirements-ci.txt *> (Join-Path $out 'pip.log')
          $pip=$LASTEXITCODE
          Write-Host ('PIP_EXIT='+$pip)
          if($pip -ne 0){throw 'PYTHON_DEPENDENCIES_FAILED'}
          $junit=Join-Path $out 'pytest.xml'
          & python -m pytest -q @suites -o junit_family=xunit1 "--junitxml=$junit" *> (Join-Path $out 'pytest.log')
          $py=$LASTEXITCODE
          if(Test-Path -LiteralPath $junit){
            try{
              [xml]$report=Get-Content -LiteralPath $junit -Raw
              foreach($case in $report.SelectNodes('//testcase[failure or error]')){
                $line=[string]$case.GetAttribute('line')
                $file=([string]$case.GetAttribute('file')).Replace('\','/')
                $ordinal=[Array]::IndexOf($all,$file)+1
                if($ordinal -gt 0 -and $line -cmatch '^[0-9]{1,6}$'){
                  Write-Host ('PYTEST_FAILURE_CODE=P'+$ordinal.ToString('D3')+'_L'+(([int]$line+1).ToString('D6')))
                }else{Write-Host 'PYTEST_FAILURE_CODE=P000_L000000'}
              }
            }catch{Write-Host 'PYTEST_FAILURE_CODE=P000_L000000'}
          }
          $raw=Get-Content -LiteralPath (Join-Path $out 'pytest.log') -Raw
          $witness=[regex]::Matches([string]$raw,'(?m)^\s*(tests[/\\](?:[a-zA-Z0-9_]+[/\\])*test_[a-zA-Z0-9_]+\.py):([0-9]{1,6}):')
          foreach($item in $witness){
            $file=$item.Groups[1].Value.Replace('\','/')
            $ordinal=[Array]::IndexOf($all,$file)+1
            if($ordinal -gt 0){Write-Host ('PYTEST_WITNESS_LINE=P'+$ordinal.ToString('D3')+'_L'+([int]$item.Groups[2].Value).ToString('D6'))}
          }
          foreach($k in @('passed','failed','errors','skipped','deselected')){
            $match=[regex]::Match([string]$raw,'(?m)([0-9]+) '+$k+'\b')
            if($match.Success){Write-Host ('PYTEST_'+$k.ToUpperInvariant()+'='+$match.Groups[1].Value)}
          }
          Write-Host ('PYTEST_EXIT='+$py)
          Write-Host 'PRIVATE_ARTIFACT_UPLOADS=0'
          if($py -ne 0){throw 'AGENT063_COMPLETE_PYTHON_REGRESSION_FAILED'}
