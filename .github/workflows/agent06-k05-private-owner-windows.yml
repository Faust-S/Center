# Authorized public Center Windows runner only. Final source qualification of K05 native UIA diagnostic receipts.
# Private checkout is transient, read-only, SHA pinned, with no published artifacts.
name: Agent 0.6 K05 original approval and execution readback Windows qualification
on:
  push:
    branches:
      - work/2026-11-15-agent06-k05-executor-comparison
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-k05-original-owner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  k05-private-owner:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      AGENT_K05_EXACT_SHA: '6b9be4704c5e3d7a79fc0561cb7df830ce71576e'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require authorized temporary private source read
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_K05_PRIVATE_SOURCE_PERMISSION_MISSING'
          }
          Write-Host 'AGENT06_K05_PRIVATE_SOURCE_ACCESS_PRESENT'
      - name: Read exact private Agent SHA without saving credentials
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT_K05_EXACT_SHA }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Read exact public K05 adapter source without copying into Agent
        uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: b2de1d6cd8dd1e660183c16febd18da9ac3b94a7
          path: public-k05
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and install Python CI dependencies privately
        shell: pwsh
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne $env:AGENT_K05_EXACT_SHA){
            throw 'AGENT06_K05_SOURCE_REVISION_MISMATCH'
          }
          $deps=Join-Path $env:RUNNER_TEMP 'k05-private-deps.log'
          & python -m pip install -r private-agent/requirements-ci.txt *> $deps
          if($LASTEXITCODE -ne 0){
            throw 'AGENT06_K05_PRIVATE_DEPENDENCIES_FAIL'
          }
          $k05=(& git -C public-k05 rev-parse HEAD).Trim()
          if($k05 -cne 'b2de1d6cd8dd1e660183c16febd18da9ac3b94a7'){
            throw 'AGENT06_K05_PUBLIC_ADAPTER_REVISION_MISMATCH'
          }
          Write-Host ('AGENT06_K05_PINNED_AGENT_SHA='+$sha)
          Write-Host ('AGENT06_K05_PINNED_PUBLIC_K05_SHA='+$k05)
          Write-Host 'AGENT06_K05_DEPENDENCIES_PASS'
      - name: Parse native UIA K05 witness with Windows PowerShell parser
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          foreach($relative in @(
            'tools/qualify_setup_core_native_gui.ps1',
            'tools/qualify_setup_core_runtime.ps1',
            'tools/build_setup_core_windows_candidate.ps1',
            'qualification/phase1/build_native_windows_setup_candidate.ps1'
          )){
            $tokens=$null;$errors=$null
            $script=Join-Path (Join-Path $env:GITHUB_WORKSPACE 'private-agent') $relative
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -ne 0){throw 'AGENT06_K05_NATIVE_UIA_SYNTAX_FAIL'}
          }
          Write-Host 'AGENT06_K05_NATIVE_UIA_SYNTAX_PASS'
      - name: Execute original Approval, ToolRuntime and K05 source tests privately
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $groups=@(
            @('K05_HISTORY','tests/test_k05_historical_approval_readback.py'),
            @('K05_COLD_REOPEN','tests/test_k05_original_owner_cold_readback.py'),
            @('K05_ORIGINAL_TASK','tests/test_k05_original_task_accepted_readback.py'),
            @('K05_EXECUTOR_COMPARISON','tests/test_k05_agent06_executor_comparison.py'),
            @('APPROVAL_OWNER','tests/cells/test_approval_execution_reconciliation.py'),
            @('APPROVAL_ADMISSION','tests/test_approval_admission_serialization.py'),
            @('TOOL_EXECUTION_INTENT','tests/test_tool_execution_intent_claim_recovery.py'),
            @('INTERACTIVE_SCHEDULER','tests/test_interactive_task_retry_claim.py')
          )
          $failed=$false
          $all=0
          $env:PYTHONPATH=(Join-Path $env:GITHUB_WORKSPACE 'public-k05\research\cross-lab')
          Push-Location private-agent
          try{
            foreach($group in $groups){
              $label=$group[0]
              $testPath=$group[1]
              $log=Join-Path $env:RUNNER_TEMP ('k05-private-'+$label+'.txt')
              $xml=Join-Path $env:RUNNER_TEMP ('k05-private-'+$label+'.xml')
              if($label -eq 'K05_EXECUTOR_COMPARISON'){
                & python -B -m pytest -s -q -p no:cacheprovider ('--junitxml='+$xml) $testPath *> $log
              }else{
                & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$xml) $testPath *> $log
              }
              $exit=$LASTEXITCODE
              if($label -eq 'K05_EXECUTOR_COMPARISON'){
                Get-Content $log | Where-Object {
                  $_ -match '^K05_(EXECUTOR_COMPARE|EXECUTOR_PAIR|EXECUTOR_EQUIVALENCE|EXECUTOR_DEFINITION|EXECUTOR_SOURCE|EXECUTOR_PROMPT|EXECUTOR_SYSTEM|DIFFERENT_TASK|SAME_EXECUTOR)_[A-Z_]+=[A-Za-z0-9_,]*$'
                } | ForEach-Object { Write-Host $_ }
              }
              if(Test-Path $xml){
                [xml]$doc=Get-Content -Raw $xml
                $suite=$doc.testsuites.testsuite
                if($null -eq $suite){$suite=$doc.testsuite}
                $number=[int]$suite.tests
                $errors=[int]$suite.errors+[int]$suite.failures
                $all+=$number
                Write-Host ('AGENT06_K05_'+$label+'_TESTS='+$number)
                Write-Host ('AGENT06_K05_'+$label+'_ERRORS='+$errors)
                if($exit -ne 0){
                  foreach($case in $doc.SelectNodes('//testcase')){
                    $failure=$case.SelectSingleNode('failure')
                    if($null -eq $failure){$failure=$case.SelectSingleNode('error')}
                    if($null -eq $failure){continue}
                    $id=[string]$case.name
                    $digest=[System.Security.Cryptography.SHA256]::HashData(
                      [Text.Encoding]::UTF8.GetBytes($id))
                    $anon=[Convert]::ToHexString($digest).Substring(0,12)
                    Write-Host ('AGENT06_K05_'+$label+'_FAILED_TEST_SHA='+$anon)
                    $exception=[string]$failure.Attributes['type'].Value
                    if($exception.Contains('.')){
                      $exception=$exception.Split('.')[-1]
                    }
                    if($exception -match '^[A-Za-z_][A-Za-z0-9_]{0,80}$'){
                      Write-Host ('AGENT06_K05_'+$label+'_EXCEPTION_TYPE='+$exception)
                    }
                    $allowed=@(
                      'AssertionError','ToolDenied','ApprovalError',
                      'AttributeError','TypeError','ValueError','KeyError',
                      'IndexError','RuntimeError','ImportError',
                      'ModuleNotFoundError','AgentK05ComparisonHold',
                      'NameError','UnboundLocalError','StopIteration',
                      'FileNotFoundError','NotADirectoryError','OSError',
                      'PermissionError','JSONDecodeError','UnicodeDecodeError'
                    )
                    if($exception -notin $allowed){$exception='OTHER'}
                    Write-Host ('AGENT06_K05_'+$label+'_FAIL_CLASS='+$exception)
                    $safeCodes=[regex]::Matches([string]$failure.InnerText,
                      '(?<![A-Za-z0-9_])(?:AGENT_K05|K05|MODEL_RUN|PROVIDER|TASK|SOURCE|HUMAN_REVIEW)_[A-Z0-9_]+')
                    foreach($code in $safeCodes){
                      Write-Host ('AGENT06_K05_'+$label+'_SAFE_CODE='+$code.Value)
                    }
                    $locations=[regex]::Matches([string]$failure.InnerText,
                      'test_k05_agent06_executor_comparison\.py:(\d+)')
                    if($locations.Count -gt 0){
                      Write-Host ('AGENT06_K05_'+$label+'_SOURCE_LINE='+$locations[$locations.Count-1].Groups[1].Value)
                    }
                  }
                }
              }else{
                Write-Host ('AGENT06_K05_'+$label+'_TEST_COUNT_UNKNOWN')
              }
              if($exit -ne 0){
                $failed=$true
                Write-Host ('AGENT06_K05_'+$label+'_FAIL')
              }else{
                Write-Host ('AGENT06_K05_'+$label+'_PASS')
              }
            }
          }finally{
            Pop-Location
          }
          Write-Host ('AGENT06_K05_TOTAL_TESTS='+$all)
          if($failed){throw 'AGENT06_K05_OWNER_TESTS_FAILED'}
          Write-Host 'AGENT06_K05_ORIGINAL_OWNER_SOURCE_QUALIFIED'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualify source-only K05 UI and TypeScript without publishing private logs
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Push-Location private-agent/desktop
          try{
            $log=Join-Path $env:RUNNER_TEMP 'k05-private-desktop-install.log'
            & npm ci --no-audit --no-fund *> $log
            if($LASTEXITCODE -ne 0){throw 'AGENT06_K05_DESKTOP_NPM_CI_FAIL'}
            Write-Host 'AGENT06_K05_DESKTOP_NPM_CI_PASS'
            $testLog=Join-Path $env:RUNNER_TEMP 'k05-private-desktop-test.log'
            & node --test tests/k05-executor-comparison-ui.test.mjs *> $testLog
            if($LASTEXITCODE -ne 0){throw 'AGENT06_K05_DESKTOP_UI_TEST_FAIL'}
            Write-Host 'AGENT06_K05_DESKTOP_UI_TEST_PASS'
            $buildLog=Join-Path $env:RUNNER_TEMP 'k05-private-desktop-build.log'
            & npm run build *> $buildLog
            if($LASTEXITCODE -ne 0){throw 'AGENT06_K05_DESKTOP_TYPESCRIPT_BUILD_FAIL'}
            Write-Host 'AGENT06_K05_DESKTOP_TYPESCRIPT_BUILD_PASS'
          }finally{Pop-Location}
      - name: Qualify build-time K05 source delivery
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'k05-public-source-preparation.log'
          Push-Location private-agent
          try{
            & node scripts/prepare-public-modules.mjs --qualification --fetch *> $log
            if($LASTEXITCODE -ne 0){throw 'AGENT06_K05_QUALIFICATION_SOURCE_PREP_FAIL'}
            Write-Host 'AGENT06_K05_QUALIFICATION_SOURCE_PREP_PASS'
          }finally{Pop-Location}
      - name: Verify real K05 build-time source and package manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Push-Location private-agent
          try{
            $sourceLog=Join-Path $env:RUNNER_TEMP 'k05-real-source-preparation.log'
            & node scripts/prepare-public-modules.mjs --only-k05 --fetch *> $sourceLog
            if($LASTEXITCODE -ne 0){throw 'AGENT06_K05_PRODUCT_SOURCE_PREP_FAIL'}
            & node scripts/prepare-public-modules.mjs --only-k05 --check *> $sourceLog
            if($LASTEXITCODE -ne 0){throw 'AGENT06_K05_PRODUCT_SOURCE_RECEIPT_FAIL'}
            Write-Host 'AGENT06_K05_PRODUCT_SOURCE_RECEIPT_PASS'
            $dirty=@(& git status --porcelain --untracked-files=all)
            if($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0){
              throw 'AGENT06_K05_GENERATED_SOURCE_CHECKOUT_NOT_CLEAN'
            }
            Write-Host 'AGENT06_K05_PRODUCT_CHECKOUT_CLEAN_PASS'
            $testLog=Join-Path $env:RUNNER_TEMP 'k05-private-product-test.log'
            $testXml=Join-Path $env:RUNNER_TEMP 'k05-private-product-test.xml'
            & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$testXml) tests/test_agent06_k05_package_delivery.py *> $testLog
            if(Test-Path $testXml){
              [xml]$doc=Get-Content -Raw $testXml
              $suite=$doc.testsuites.testsuite
              if($null -eq $suite){$suite=$doc.testsuite}
              Write-Host ('AGENT06_K05_PRODUCT_PACKAGE_TESTS='+[int]$suite.tests)
              Write-Host ('AGENT06_K05_PRODUCT_PACKAGE_ERRORS='+([int]$suite.errors+[int]$suite.failures))
            }
            if($LASTEXITCODE -ne 0){
              if(Test-Path $testXml){
                foreach($case in $doc.SelectNodes('//testcase')){
                  $failure=$case.SelectSingleNode('failure')
                  if($null -eq $failure){$failure=$case.SelectSingleNode('error')}
                  if($null -eq $failure){continue}
                  $sha=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                    [Text.Encoding]::UTF8.GetBytes([string]$case.name))).Substring(0,12)
                  Write-Host ('AGENT06_K05_PRODUCT_FAILED_TEST_SHA='+$sha)
                  $category='OTHER'
                  foreach($code in @('release_worktree_not_clean','file_identity_changed',
                    'required_files_missing','receipt_mismatch','owner_pin_changed',
                    'undeclared_files','file_size_changed','file_set_invalid',
                    'file_unavailable','source_blob_unavailable')){
                    if([string]$failure.InnerText -match [regex]::Escape($code)){$category=$code;break}
                  }
                  Write-Host ('AGENT06_K05_PRODUCT_FAIL_CATEGORY='+$category)
                }
              }
              throw 'AGENT06_K05_PRODUCT_PACKAGE_TEST_FAIL'
            }
            Write-Host 'AGENT06_K05_PRODUCT_PACKAGE_TEST_PASS'
            $coldLog=Join-Path $env:RUNNER_TEMP 'k05-private-cold-product-test.log'
            $coldXml=Join-Path $env:RUNNER_TEMP 'k05-private-cold-product-test.xml'
            & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$coldXml) tests/test_agent06_k05_packaged_cold_core.py *> $coldLog
            $coldExit=$LASTEXITCODE
            if(Test-Path $coldXml){
              [xml]$doc=Get-Content -Raw $coldXml
              $suite=$doc.testsuites.testsuite
              if($null -eq $suite){$suite=$doc.testsuite}
              Write-Host ('AGENT06_K05_PACKAGED_COLD_TESTS='+[int]$suite.tests)
              Write-Host ('AGENT06_K05_PACKAGED_COLD_ERRORS='+([int]$suite.errors+[int]$suite.failures))
              Write-Host ('AGENT06_K05_PACKAGED_COLD_SKIPPED='+[int]$suite.skipped)
              if([int]$suite.skipped -gt 0){throw 'AGENT06_K05_PACKAGED_COLD_NOT_EXECUTED'}
            }
            if($coldExit -ne 0){throw 'AGENT06_K05_PACKAGED_COLD_CORE_FAIL'}
            Write-Host 'AGENT06_K05_PACKAGED_COLD_CORE_PASS'
          }finally{Pop-Location}
      # Deliberately no cache, upload-artifact, installer or private log publication.
