name: IWXA Mobile Agent ARM64 encrypted owner candidate
on:
  push:
    branches:
      - 'ci/once/agent-mobile-owner-delivery/*'
    paths:
      - '.github/ci-requests/agent-mobile-owner-delivery.json'
permissions:
  contents: read
concurrency:
  group: iwxa-agent-mobile-android-qualification
  cancel-in-progress: false
jobs:
  delivery:
    if: ${{ github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PRIVATE_PIN: '68042c7974503c234dc5bd938925520d1a82780c'
      PRIVATE_TREE: 'ce7e14670d0b9c2f79ca0215baef0fbf7a3600f3'
      T3_PIN: '1e5d54bba065f0e82cc506a5443b96079d070608'
      T3_TREE: '80f724d21d2acca0394e3694ae4a9a7fd65317bc'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact public delivery request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact encrypted owner candidate before private access
        run: python3 .ci/agent-mobile-owner-delivery/delivery_admit.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Prepare public native and encryption tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ninja-build
          fi
          command -v kotlinc >/dev/null
          command -v readelf >/dev/null
          command -v clang >/dev/null
          command -v ld.lld >/dev/null
          command -v cmake >/dev/null
          python3 -m venv "${RUNNER_TEMP}/iwxa-owner-crypto"
          "${RUNNER_TEMP}/iwxa-owner-crypto/bin/python" -m pip install --disable-pip-version-check --no-cache-dir cryptography==46.0.4
          "${RUNNER_TEMP}/iwxa-owner-crypto/bin/python" .ci/agent-mobile-owner-delivery/test_delivery.py
      - name: Build and encrypt exact ARM64 owner candidate
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          "${RUNNER_TEMP}/iwxa-owner-crypto/bin/python" .ci/agent-mobile-owner-delivery/delivery_runner.py
      - name: Upload only encrypted APK
        uses: actions/upload-artifact@v4
        with:
          name: IWXA-Mobile-Agent-ARM64-owner-68042c79-encrypted
          path: ${{ runner.temp }}/iwxa-mobile-owner-cipher/IWXA-Mobile-Agent-ARM64-owner-68042c79.apk.iwxae
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
