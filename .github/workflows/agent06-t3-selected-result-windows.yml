# Public Center runner, temporary read-only private source permission only.
# No private files, executable, model output, test details, logs or artifacts exported.
name: Agent 0.6 ERP Windows source qualification
on:
  push:
    branches: ['work/2026-11-15-agent06-erp-source-qualification']
permissions:
  contents: read
concurrency:
  group: agent06-erp-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-erp:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing scoped read-only private source grant
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_ERP_PRIVATE_READ_GRANT_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 8764a79e56eb490a3b38f699f7d985ac1254e4fc
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin source and resolve private Python dependencies without logs
        shell: pwsh
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne '8764a79e56eb490a3b38f699f7d985ac1254e4fc'){
            throw 'AGENT06_ERP_PRIVATE_SOURCE_REVISION_MISMATCH'
          }
          & python -m pip install -r private-agent/requirements-ci.txt *> (Join-Path $env:RUNNER_TEMP 'a06-erp-pip-private.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_ERP_PYTHON_DEPENDENCIES_FAIL'}
          Write-Host 'AGENT06_ERP_SOURCE_PIN_PASS'
      - name: Check individual private ERP regression groups without exposing test output
        shell: pwsh
        run: |
          Push-Location private-agent
          try {
            $groups=@(
              @('HTTP','tests/test_erp_order_readonly_v1.py -k not_toolruntime'),
              @('READ_PATH','tests/test_erp_order_readonly_v1.py -k test_toolruntime'),
              @('BINDINGS','tests/test_provider_registry_erp_slot.py'),
              @('SETUP','tests/test_user_setup_connections.py'),
              @('TOOLRUNTIME','tests/test_tool_provider_layer.py'),
              @('PROVIDER_SETTINGS','tests/test_user_provider_settings.py'),
              @('T3_LOCAL_RESULT','tests/test_t3_mode.py'),
              @('T3_CORE_PROJECTION','tests/test_t3_result_projection.py')
            )
            $anyFail=$false
            foreach($pair in $groups){
              $kind=$pair[0];$test=$pair[1]
              $out=Join-Path $env:RUNNER_TEMP ('a06-erp-'+$kind.ToLower()+'-private.log')
              if($kind -eq 'HTTP'){
                & python -B -m pytest -q -p no:cacheprovider tests/test_erp_order_readonly_v1.py -k 'not toolruntime' *> $out
              }elseif($kind -eq 'READ_PATH'){
                & python -B -m pytest -q -p no:cacheprovider tests/test_erp_order_readonly_v1.py -k 'toolruntime' *> $out
              }else{
                & python -B -m pytest -q -p no:cacheprovider $test *> $out
              }
              $code=$LASTEXITCODE
              if($kind -eq 'READ_PATH' -and $code -ne 0){
                $privateLog=Get-Content -LiteralPath $out -Raw
                $hits=[regex]::Matches($privateLog, 'test_erp_order_readonly_v1\.py:(\d+)')
                $sourceLine=-1
                foreach($hit in $hits){
                  $lineNumber=[int]$hit.Groups[1].Value
                  if($lineNumber -ge 170 -and $lineNumber -lt 220){$sourceLine=$lineNumber}
                }
                if($sourceLine -lt 0){
                  Write-Host 'AGENT06_ERP_READ_PATH_STAGE_UNKNOWN'
                }elseif($sourceLine -le 178){
                  Write-Host 'AGENT06_ERP_READ_PATH_STAGE_CONFIG'
                }elseif($sourceLine -eq 179){
                  Write-Host 'AGENT06_ERP_READ_PATH_STAGE_SWITCH'
                }elseif($sourceLine -le 182){
                  Write-Host 'AGENT06_ERP_READ_PATH_STAGE_POLICY_ASSERT'
                }elseif($sourceLine -eq 183){
                  Write-Host 'AGENT06_ERP_READ_PATH_STAGE_TOOL_READ'
                }elseif($sourceLine -le 188){
                  Write-Host 'AGENT06_ERP_READ_PATH_STAGE_OUTPUT_ASSERT'
                }else{
                  Write-Host 'AGENT06_ERP_READ_PATH_STAGE_RECEIPT_FILE'
                }
                $safeErrorClasses=@(
                  'ToolDenied','ToolPolicyError','ToolProviderPortError',
                  'ERPOrderReadError','HTTPProviderError','ProviderError',
                  'ProviderRoutingError','ValueError','TypeError',
                  'KeyError','AssertionError','RuntimeError','OSError'
                )
                foreach($class in $safeErrorClasses){
                  if($privateLog.Contains($class)){
                    Write-Host ('AGENT06_ERP_READ_PATH_ERROR_CLASS_'+$class.ToUpperInvariant())
                  }
                }
                $knownCodes=@(
                  'POLICY_UNCLASSIFIED','TOOL_DISABLED','DESCRIPTOR_INVALID',
                  'tool_provider_not_ready','tool_provider_slot_disabled',
                  'provider_not_ready','provider_missing_capabilities',
                  'secret_material_forbidden_in_tool_arguments',
                  'tool_arguments_schema_invalid','unknown_tool',
                  'binding_document_invalid','binding_slot_set_mismatch',
                  'erp_source_account_required','erp_source_identity_mismatch',
                  'erp_http_network_error','erp_http_http_401','erp_http_http_403',
                  'PORT_PROTOCOL_ERROR','PORT_UNAVAILABLE'
                )
                foreach($code in $knownCodes){
                  if($privateLog.Contains($code)){
                    $label=($code -replace '[^A-Za-z0-9]','_').ToUpperInvariant()
                    Write-Host ('AGENT06_ERP_READ_PATH_MATCH_'+$label)
                  }
                }
                # No traceback, private path, user content, runtime response or credentials on stdout.
              }
              if($code -ne 0){
                Write-Host ('AGENT06_ERP_'+$kind+'_FAIL')
                $anyFail=$true
              }else{
                Write-Host ('AGENT06_ERP_'+$kind+'_PASS')
              }
            }
            if($anyFail){Add-Content -Path $env:GITHUB_ENV -Value 'AGENT06_ERP_PYTHON_FAILED=1'}
          } finally {Pop-Location}
      - name: Independently compile and test exact private desktop
        shell: pwsh
        run: |
          Push-Location private-agent/desktop
          try {
            & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'a06-erp-npm-private.log')
            if($LASTEXITCODE -ne 0){
              Write-Host 'AGENT06_ERP_DESKTOP_DEPENDENCIES_FAIL'
              Add-Content -Path $env:GITHUB_ENV -Value 'AGENT06_ERP_DESKTOP_FAILED=1'
            }else{
              & node --test tests/erp-order-connection.test.mjs tests/pe04-provider-connection-status.test.mjs tests/t3-sidebar-layout.test.mjs *> (Join-Path $env:RUNNER_TEMP 'a06-erp-ui-private.log')
              if($LASTEXITCODE -ne 0){
                Write-Host 'AGENT06_ERP_DESKTOP_SOURCE_TEST_FAIL'
                Add-Content -Path $env:GITHUB_ENV -Value 'AGENT06_ERP_DESKTOP_FAILED=1'
              }else{
                Write-Host 'AGENT06_ERP_DESKTOP_SOURCE_TEST_PASS'
              }
              & npm.cmd run build *> (Join-Path $env:RUNNER_TEMP 'a06-erp-build-private.log')
              if($LASTEXITCODE -ne 0){
                Write-Host 'AGENT06_ERP_DESKTOP_TYPESCRIPT_VITE_FAIL'
                Add-Content -Path $env:GITHUB_ENV -Value 'AGENT06_ERP_DESKTOP_FAILED=1'
              }else{
                Write-Host 'AGENT06_ERP_DESKTOP_TYPESCRIPT_VITE_PASS'
              }
            }
          } finally {Pop-Location}
      - name: Reject incomplete private source qualification
        shell: pwsh
        run: |
          if($env:AGENT06_ERP_PYTHON_FAILED -eq '1' -or $env:AGENT06_ERP_DESKTOP_FAILED -eq '1'){
            throw 'AGENT06_ERP_SOURCE_QUALIFICATION_NOT_ACCEPTED'
          }
          Write-Host 'AGENT06_ERP_PRIVATE_WINDOWS_SOURCE_PASS'
      # No cache, artifact, test-detail, private source, EXE or credential upload.
