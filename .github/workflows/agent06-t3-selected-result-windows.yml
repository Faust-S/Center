# Public Center runner, temporary read-only private source permission only.
# No private files, executable, model output, test details, logs or artifacts exported.
name: Agent 0.6 ERP Windows source qualification
on:
  push:
    branches: ['work/2026-11-15-agent06-erp-source-qualification']
permissions:
  contents: read
concurrency:
  group: agent06-erp-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-erp:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing scoped read-only private source grant
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_ERP_PRIVATE_READ_GRANT_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: d433d3a93b1fb5bb1dfdf77f663d6e4985afe474
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin source and resolve private Python dependencies without logs
        shell: pwsh
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne 'd433d3a93b1fb5bb1dfdf77f663d6e4985afe474'){
            throw 'AGENT06_ERP_PRIVATE_SOURCE_REVISION_MISMATCH'
          }
          & python -m pip install -r private-agent/requirements-ci.txt *> (Join-Path $env:RUNNER_TEMP 'a06-erp-pip-private.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_ERP_PYTHON_DEPENDENCIES_FAIL'}
          Write-Host 'AGENT06_ERP_SOURCE_PIN_PASS'
      - name: Check ERP ToolRuntime, account migration, and existing connections
        shell: pwsh
        run: |
          Push-Location private-agent
          try {
            & python -B -m pytest -q -p no:cacheprovider tests/test_erp_order_readonly_v1.py tests/test_provider_registry_erp_slot.py tests/test_user_setup_connections.py tests/test_tool_provider_layer.py tests/test_user_provider_settings.py *> (Join-Path $env:RUNNER_TEMP 'a06-erp-python-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ERP_TOOL_ACCOUNT_REGRESSION_FAIL'}
            Write-Host 'AGENT06_ERP_TOOL_ACCOUNT_REGRESSION_PASS'
          } finally {Pop-Location}
      - name: Compile complete desktop and ERP order screen
        shell: pwsh
        run: |
          Push-Location private-agent/desktop
          try {
            & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'a06-erp-npm-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ERP_NPM_DEPENDENCIES_FAIL'}
            & node --test tests/erp-order-connection.test.mjs tests/pe04-provider-connection-status.test.mjs *> (Join-Path $env:RUNNER_TEMP 'a06-erp-ui-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ERP_DESKTOP_SOURCE_TEST_FAIL'}
            & npm.cmd run build *> (Join-Path $env:RUNNER_TEMP 'a06-erp-build-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ERP_DESKTOP_BUILD_FAIL'}
            Write-Host 'AGENT06_ERP_DESKTOP_TYPESCRIPT_VITE_PASS'
          } finally {Pop-Location}
      # No cache, artifact, test-detail, private source, EXE or credential upload.
