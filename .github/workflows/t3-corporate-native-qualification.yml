# Public disposable qualification only. Existing owner-authorized read-only
# private source grant. No artifact, cache, release, private logs or binaries.
name: Original T3 corporate Consumer Ed25519 and Windows DPAPI
on:
  push:
    branches: ['work/2026-11-24-t3-corporate-native-qualification']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: t3-corporate-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      IWXA_EXPECTED_T3: 'f08586ef4d7e2e9a71ff69a01a2d751c5047ba3b'
      IWXA_EXPECTED_ONE_CORE: '5fc1f2a09b4e91b8230d148241d3806049d7dbfb'
    steps:
      - name: Require the previously authorized private source grant
        shell: pwsh
        env:
          SOURCE_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)){
            throw 'T3_CORPORATE_PRIVATE_READ_GRANT_UNAVAILABLE'
          }
          Write-Host 'T3_CORPORATE_READ_GRANT_PRESENT'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 5fc1f2a09b4e91b8230d148241d3806049d7dbfb
          path: public-one-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: f08586ef4d7e2e9a71ff69a01a2d751c5047ba3b
          path: private-t3
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact original sources
        shell: pwsh
        run: |
          $actualT3=(& git -C private-t3 rev-parse HEAD).Trim()
          $actualCore=(& git -C public-one-core rev-parse HEAD).Trim()
          if($actualT3 -cne $env:IWXA_EXPECTED_T3 -or $actualCore -cne $env:IWXA_EXPECTED_ONE_CORE){
            throw 'T3_CORPORATE_SOURCE_PIN_MISMATCH'
          }
          Write-Host 'T3_CORPORATE_ORIGINAL_SOURCE_PINS_VERIFIED'
      - name: Source regression and native Windows credential tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 't3-corporate-tests-private.log'
          Push-Location private-t3
          try {
            $files=@(Get-ChildItem -LiteralPath tests -Filter 'access-product-license*.test.mjs' -File |
              Sort-Object Name | ForEach-Object {$_.FullName})
            if($files.Count -lt 15){throw 'T3_CORPORATE_REGRESSION_SOURCE_MISSING'}
            & node --test @files *> $log
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $log -Raw
            # Fixed numeric TAP counters only, never raw private output.
            foreach($n in @('tests','pass','fail','cancelled','skipped')){
              $m=[regex]::Matches($raw,"(?m)^# $n (\d+)\s*$")
              if($m.Count -gt 0){Write-Host ("T3_CORPORATE_TEST_"+$n.ToUpperInvariant()+"="+$m[$m.Count-1].Groups[1].Value)}
            }
            if($exit -ne 0){
              $indices=@([regex]::Matches($raw,'(?m)^not ok (\d+)') | ForEach-Object {$_.Groups[1].Value} | Select-Object -First 20)
              Write-Host ("T3_CORPORATE_FAILED_TEST_ORDINALS="+($indices -join ','))
              throw 'T3_CORPORATE_PRIVATE_REGRESSION_FAILED'
            }
            Write-Host 'T3_CORPORATE_PRIVATE_REGRESSION_PASS'
          } finally {Pop-Location}
      - name: Real One Core Ed25519 and original encrypted Store qualification
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 't3-corporate-onecore-private.log'
          $out=Join-Path $env:RUNNER_TEMP 't3-corporate-onecore-private.json'
          $core=(Resolve-Path public-one-core).Path
          & node private-t3/scripts/qualify-corporate-product-consumer-one-core.mjs $core 1>$out 2>$log
          if($LASTEXITCODE -ne 0){
            $raw=Get-Content -LiteralPath $log -Raw
            $m=[regex]::Matches($raw,'qualify-corporate-product-consumer-one-core\.mjs:(\d+):(\d+)')
            if($m.Count -gt 0){Write-Host ("T3_CORPORATE_QUALIFIER_LINE="+$m[0].Groups[1].Value)}
            throw 'T3_CORPORATE_REAL_ONE_CORE_FAILED'
          }
          $r=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if($r.result -ne 'PASS' -or [int]$r.checks -lt 9 -or
             $r.productionActivation -ne $false -or $r.nativeQualification -ne 'NOT_RUN'){
            throw 'T3_CORPORATE_REAL_ONE_CORE_RECEIPT_INVALID'
          }
          Write-Host ("T3_CORPORATE_REAL_ONE_CORE_PASS="+[int]$r.checks)
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'Windows'
        with:
          bun-version: '1.3.4'
      - name: Compile exact release Consumer entry and qualify real Windows DPAPI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 't3-corporate-compiled-private.log'
          $out=Join-Path $env:RUNNER_TEMP 't3-corporate-compiled-private.json'
          $core=(Resolve-Path public-one-core).Path
          & node private-t3/scripts/qualify-corporate-product-consumer-compiled.mjs $core 1>$out 2>$log
          if($LASTEXITCODE -ne 0){
            $raw=Get-Content -LiteralPath $log -Raw
            foreach($name in @('qualify-corporate-product-consumer-compiled','qualify-corporate-product-consumer-one-core')){
              $m=[regex]::Matches($raw,([regex]::Escape($name)+'\.mjs:(\d+):(\d+)'))
              if($m.Count -gt 0){Write-Host ("T3_CORPORATE_PRIVATE_LINE_"+$name+"="+$m[0].Groups[1].Value)}
            }
            throw 'T3_CORPORATE_COMPILED_NATIVE_QUALIFICATION_FAILED'
          }
          $r=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if($r.result -ne 'PASS' -or [int]$r.sourceChecks -lt 9 -or
            [int]$r.nativeChecks -lt 10 -or $r.exeSha256 -cnotmatch '^[a-f0-9]{64}$' -or
            $r.productionActivation -ne $false -or $r.assignablePersonalAgentSeats -ne 0){
            throw 'T3_CORPORATE_COMPILED_NATIVE_RECEIPT_INVALID'
          }
          Write-Host ("T3_CORPORATE_COMPILED_DPAPI_ED25519_PASS="+[int]$r.nativeChecks)
          Write-Host ("T3_CORPORATE_QUALIFIED_EXE_SHA256="+$r.exeSha256)
      - name: Discard private sources and all transient test logs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath private-t3 -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 't3-corporate-*-private.*' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'iwxa-corporate-compiled-*' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'iwxa-t3-corporate-*' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'T3_CORPORATE_PRIVATE_CLEANUP_FINISHED'
# No upload-artifact, cache, release or publication step is allowed.
