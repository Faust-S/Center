      - name: Seal the qualified candidate for private owner delivery
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'agent06-installed-private'
          $setup=Join-Path $root 'IWXA-Private-Online-SetupCore.exe'
          $meta=Get-Content -LiteralPath (Join-Path $root 'logs/private-setup-core.json') -Raw -Encoding UTF8|ConvertFrom-Json
          $out=Join-Path $env:RUNNER_TEMP 'agent063-encrypted-delivery'
          New-Item -ItemType Directory -Path $out|Out-Null
          $script=Join-Path $env:RUNNER_TEMP 'agent063-encrypt.cjs'
          $js=@'
          "use strict";
          const fs=require("node:fs"),crypto=require("node:crypto");
          const [source,cipherFile,metaFile,sourceSha,treeSha,centerSha,sourceRun,qualificationRun,expectedSha,expectedBytes,publicKeyDer]=process.argv.slice(2);
          const hash=b=>crypto.createHash("sha256").update(b).digest("hex");
          const requireOk=(condition,code)=>{if(!condition)throw Error(code)};
          requireOk([sourceSha,treeSha,centerSha].every(v=>/^[0-9a-f]{40}$/.test(v)),"IDENTITY_INVALID");
          requireOk([sourceRun,qualificationRun].every(v=>/^[1-9][0-9]{0,19}$/.test(v)),"RUN_INVALID");
          requireOk(/^[0-9a-f]{64}$/.test(expectedSha)&&/^[1-9][0-9]{5,11}$/.test(expectedBytes),"RECEIPT_INVALID");
          const payload=fs.readFileSync(source);
          requireOk(payload.length===Number(expectedBytes)&&hash(payload)===expectedSha&&payload.length>=100000&&payload.subarray(0,2).toString("ascii")==="MZ","QUALIFIED_INSTALLER_CHANGED");
          const der=Buffer.from(publicKeyDer,"base64"),publicKey=crypto.createPublicKey({key:der,format:"der",type:"spki"});
          requireOk(publicKey.asymmetricKeyType==="rsa"&&publicKey.asymmetricKeyDetails.modulusLength===3072,"DELIVERY_KEY_INVALID");
          const identity={schema:"IWXA_ENCRYPTED_INSTALLER/2",algorithm:"AES-256-GCM+RSA-3072-OAEP-SHA256",version:"0.6.3",source_sha:sourceSha,source_tree_sha:treeSha,center_sha:centerSha,source_run_id:sourceRun,qualification_run_id:qualificationRun,filename:"IWXA-Personal-Agent-0.6.3-V8-Setup.exe",plaintext_sha256:expectedSha,plaintext_bytes:payload.length,recipient_key_sha256:hash(der),status:"CANDIDATE_QUALIFIED",independent_acceptance:"PENDING"};
          const aesKey=crypto.randomBytes(32),nonce=crypto.randomBytes(12),cipher=crypto.createCipheriv("aes-256-gcm",aesKey,nonce);
          cipher.setAAD(Buffer.from(JSON.stringify(identity),"utf8"));
          const data=Buffer.concat([cipher.update(payload),cipher.final()]);
          const wrapped=crypto.publicEncrypt({key:publicKey,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha256"},aesKey);
          fs.writeFileSync(cipherFile,data,{flag:"wx"});
          fs.writeFileSync(metaFile,JSON.stringify({...identity,ciphertext_sha256:hash(data),ciphertext_bytes:data.length,nonce:nonce.toString("base64"),tag:cipher.getAuthTag().toString("base64"),wrapped_key:wrapped.toString("base64")},null,2)+"\n",{flag:"wx"});
          aesKey.fill(0);
          console.log("AGENT063_ENCRYPTED_CANDIDATE_CREATED");
          '@
          $normalized=($js.Replace([string]([char]13)+[char]10,[string][char]10)).TrimEnd([char[]]@([char]13,[char]10))+[char]10
          [IO.File]::WriteAllText($script,$normalized,(New-Object Text.UTF8Encoding($false)))
          if((Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'aa6bde1de6e728bdb0e6b1349445f219e4dee2bc2c44af6e8dadb85379986f06'){throw 'DELIVERY_SCRIPT_IDENTITY_MISMATCH'}
          $cipher=Join-Path $out 'agent-0.6.3-v8-installer.enc'
          $envelope=Join-Path $out 'envelope.json'
          & node $script $setup $cipher $envelope $env:PRIVATE_SOURCE_PIN $env:PRIVATE_TREE_PIN $env:CENTER_OWNER_PIN $env:SOURCE_RUN_ID $env:GITHUB_RUN_ID $env:AGENT063_FINAL_SETUP_SHA ([string]$meta.setup_bytes) $env:DELIVERY_PUBLIC_KEY_DER
          if($LASTEXITCODE -ne 0){throw 'AGENT063_ENCRYPTION_FAILED'}
          $sealed=Get-Content -LiteralPath $envelope -Raw -Encoding UTF8|ConvertFrom-Json
          if($sealed.schema -cne 'IWXA_ENCRYPTED_INSTALLER/2' -or
             $sealed.source_sha -cne $env:PRIVATE_SOURCE_PIN -or $sealed.source_tree_sha -cne $env:PRIVATE_TREE_PIN -or
             $sealed.plaintext_sha256 -cne $env:AGENT063_FINAL_SETUP_SHA -or
             $sealed.recipient_key_sha256 -cne $env:DELIVERY_PUBLIC_KEY_SHA256 -or
             $sealed.status -cne 'CANDIDATE_QUALIFIED' -or $sealed.independent_acceptance -cne 'PENDING' -or
             $sealed.ciphertext_bytes -ne $sealed.plaintext_bytes){throw 'AGENT063_SEALED_CANDIDATE_INVALID'}
          Write-Host ('AGENT063_FINAL_INSTALLER_SHA256='+$sealed.plaintext_sha256)
          Write-Host ('AGENT063_FINAL_INSTALLER_BYTES='+$sealed.plaintext_bytes)
          Write-Host 'AGENT063_SAME_INSTALLER_NATIVE_AND_REAL_MODEL_PASS'
          Write-Host 'AGENT063_INDEPENDENT_ACCEPTANCE_PENDING'
      - name: Deliver encrypted candidate only
        uses: actions/upload-artifact@v4
        with:
          name: IWXA-Agent063-V8-encrypted-candidate
          path: |
            ${{ runner.temp }}/agent063-encrypted-delivery/agent-0.6.3-v8-installer.enc
            ${{ runner.temp }}/agent063-encrypted-delivery/envelope.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
