# Public qualification code ONLY. Private Agent is checked out read-only
# at one fixed SHA onto a disposable GitHub-hosted Windows runner.
# Do not publish source, logs, binaries, credentials, screenshots or receipts.
name: Agent 0.6.3 installed first-run real local model qualification
on:
  push:
    branches:
      - work/2026-11-24-agent-v8-model-first-run
permissions:
  contents: read
concurrency:
  group: agent063-real-model-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-model-installed-gui:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PRIVATE_SOURCE_PIN: '4b50990cad2c93c1e97fca6f6b8465251b653e58'
      PRIVATE_TREE_PIN: '8aaa49eadee72b27bc95652b12045a5514eed76b'
      CENTER_OWNER_PIN: 'c10e193846a0ea4c73cabe3744aa7db82439d54e'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: ${{ env.CENTER_OWNER_PIN }}
          path: center-owner
          persist-credentials: false
          show-progress: false
      - name: Verify pre-authorized read-only private source access
        shell: pwsh
        env:
          PRIVATE_SOURCE_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_READ_TOKEN)){
            throw 'AGENT06_ONLINE_PRIVATE_CHECKOUT_PERMISSION_MISSING'
          }
          Write-Host 'AGENT06_ONLINE_PRIVATE_READ_ONLY_PERMISSION_PRESENT'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.PRIVATE_SOURCE_PIN }}
          path: private-agent
          persist-credentials: false
          show-progress: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin private Agent, original public Setup Core and parse witness scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=Join-Path $env:GITHUB_WORKSPACE 'private-agent'
          $center=Join-Path $env:GITHUB_WORKSPACE 'center-owner'
          $head=(& git -C $repo rev-parse HEAD).Trim()
          $tree=(& git -C $repo rev-parse 'HEAD^{tree}').Trim()
          $centerSha=(& git -C $center rev-parse HEAD).Trim()
          if($head -cne $env:PRIVATE_SOURCE_PIN -or
             $tree -cne $env:PRIVATE_TREE_PIN -or
             $centerSha -cne $env:CENTER_OWNER_PIN){
            throw 'AGENT06_ONLINE_INSTALLED_SOURCE_PIN_MISMATCH'
          }
          foreach($dir in @($repo,$center)){
            $dirty=@(& git -C $dir status --porcelain --untracked-files=all)
            if($LASTEXITCODE -ne 0 -or @($dirty|Where-Object {$_}).Count -ne 0){
              throw 'AGENT06_ONLINE_INSTALLED_SOURCE_NOT_CLEAN'
            }
          }
          $script=Join-Path $repo 'qualification/agent062/qualify_dashboard_installed.ps1'
          $python=Join-Path $repo 'qualification/agent061/qualify_online_services_installed.py'
          $installer=Join-Path $repo 'qualification/phase1/build_native_windows_setup_candidate.ps1'
          $builder=Join-Path $repo 'tools/build_setup_core_release.py'
          if(!(Test-Path -LiteralPath $script -PathType Leaf) -or
             !(Test-Path -LiteralPath $python -PathType Leaf) -or
             !(Test-Path -LiteralPath $installer -PathType Leaf) -or
             !(Test-Path -LiteralPath $builder -PathType Leaf)){
             throw 'AGENT06_ONLINE_INSTALLED_TEST_OWNER_FILE_MISSING'
          }
          $parsedTokens=$null;$parseErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($script,
              [ref]$parsedTokens,[ref]$parseErrors) | Out-Null
          if(@($parseErrors).Count -ne 0){
            Write-Host ('AGENT06_ONLINE_PS_PARSE_ERRORS='+@($parseErrors).Count)
            throw 'AGENT06_ONLINE_PS_PARSE_FAIL'
          }
          & python -B -c 'import ast,pathlib,sys;ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))' $python *> (Join-Path $env:RUNNER_TEMP 'agent06-private-parse.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_ONLINE_PY_PARSE_FAIL'}
          $modelScript=Join-Path $repo 'qualification/agent063/guided_model_ui_witness.ps1'
          $modelProbe=Join-Path $repo 'qualification/agent063/qualify_guided_model_installed.py'
          $modelTokens=$null;$modelErrors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($modelScript,[ref]$modelTokens,[ref]$modelErrors)|Out-Null
          if(@($modelErrors).Count -ne 0){throw 'AGENT063_REAL_MODEL_PS_PARSE_FAIL'}
          & python -B -c 'import ast,pathlib,sys;ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))' $modelProbe *> (Join-Path $env:RUNNER_TEMP 'agent063-model-private-parse.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT063_REAL_MODEL_PY_PARSE_FAIL'}
          Write-Host 'AGENT063_REAL_MODEL_WITNESS_PARSE_PASS'
          Write-Host ('AGENT06_ONLINE_PRIVATE_PIN='+$head)
          Write-Host 'AGENT06_ONLINE_INSTALLED_WITNESS_PARSE_PASS'
      - name: Verify pre-release Agent dashboard and conversation groups in pinned private source
        shell: pwsh
        run: |
          $repo=Join-Path $env:GITHUB_WORKSPACE 'private-agent'
          foreach($path in @('desktop/src/home-dashboard.tsx',
            'desktop/src/home-dashboard-live.ts',
            'desktop/src/home-dashboard-model.ts',
            'tests/cells/test_conversation_groups_062.py')){
            if(!(Test-Path -LiteralPath (Join-Path $repo $path) -PathType Leaf)){
              throw 'AGENT062_REQUIRED_UX_SOURCE_MISSING'
            }
          }
          $package=Get-Content -LiteralPath (Join-Path $repo 'desktop/package.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if($package.version -cne '0.6.3'){
            throw 'AGENT063_RELEASE_VERSION_MISMATCH'
          }
          Write-Host 'AGENT063_RELEASE_METADATA_AND_UX_SOURCE_PRESENT'
      - name: Build pre-release Agent candidate using original product pipeline
        shell: pwsh
        timeout-minutes: 47
        run: |
          $ErrorActionPreference='Continue'
          $repo=Join-Path $env:GITHUB_WORKSPACE 'private-agent'
          $privateRoot=Join-Path $env:RUNNER_TEMP 'agent06-installed-private'
          $build=Join-Path $privateRoot 'build'
          $logs=Join-Path $privateRoot 'logs'
          $cache=Join-Path $privateRoot 'release-cache'
          New-Item -ItemType Directory -Path $build,$logs,$cache -Force | Out-Null
          $builder=Join-Path $repo 'qualification/phase1/build_native_windows_setup_candidate.ps1'
          $nativeLog=Join-Path $logs 'native-private-build.log'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $builder -RepoRoot $repo -BuildRoot $build -LogsRoot $logs -ReleaseCache $cache -SourceCommit $env:PRIVATE_SOURCE_PIN -SourceTree $env:PRIVATE_TREE_PIN *> $nativeLog
          if($LASTEXITCODE -ne 0){
            $raw=Get-Content -LiteralPath $nativeLog -Raw -ErrorAction SilentlyContinue
            $allow=@(
              'native_candidate_rust_toolchain_missing',
              'native_candidate_tauri_build_failed',
              'native_candidate_frontend_dependencies_failed',
              'native_candidate_u04_sources_failed',
              'native_candidate_test_python_failed',
              'native_candidate_stub_compile_failed',
              'native_candidate_rc_icon_conversion_failed',
              'native_candidate_product_package_build_failed',
              'phase1_package_release_manifest_invalid',
              'K03 pinned owner source preparation failed',
              'U01 pinned owner source preparation failed'
            )
            foreach($code in $allow){
              if(([string]$raw).Contains($code)){
                Write-Host ('AGENT06_ONLINE_BUILD_SAFE_REASON='+$code)
              }
            }
            throw 'AGENT06_ONLINE_ORIGINAL_NATIVE_BUILD_FAILED'
          }
          $pythonPathFile=Join-Path $build 'test-python/current-python.txt'
          $package=Join-Path $build 'package/IWXA-Personal-Agent-Windows-Explorer-Prototype.zip'
          if(!(Test-Path -LiteralPath $pythonPathFile -PathType Leaf) -or
             !(Test-Path -LiteralPath $package -PathType Leaf)){
            throw 'AGENT06_ONLINE_NATIVE_PACKAGE_MISSING'
          }
          $python=(Get-Content -LiteralPath $pythonPathFile -Raw).Trim()
          if(!(Test-Path -LiteralPath $python -PathType Leaf)){
            throw 'AGENT06_ONLINE_MANAGED_PYTHON_MISSING'
          }
          $setup=Join-Path $privateRoot 'IWXA-Private-Online-SetupCore.exe'
          $buildReceipt=Join-Path $logs 'private-setup-core.json'
          & $python -B (Join-Path $repo 'tools/build_setup_core_release.py') --product-package $package --center-root (Join-Path $env:GITHUB_WORKSPACE 'center-owner') --center-commit $env:CENTER_OWNER_PIN --output $setup --python $python *> $buildReceipt
          if($LASTEXITCODE -ne 0){
            throw 'AGENT06_ONLINE_ORIGINAL_SETUP_CORE_BUILD_FAILED'
          }
          try{$manifest=Get-Content -LiteralPath $buildReceipt -Raw -Encoding UTF8|ConvertFrom-Json}
          catch{throw 'AGENT06_ONLINE_ORIGINAL_SETUP_CORE_RECEIPT_INVALID'}
          if($manifest.status -ne 'BUILT_UNQUALIFIED' -or
             $manifest.version -cne '0.6.3' -or
             $manifest.private_source_commit -cne $env:PRIVATE_SOURCE_PIN -or
             $manifest.private_source_tree -cne $env:PRIVATE_TREE_PIN -or
             $manifest.public_setup_core_commit -cne $env:CENTER_OWNER_PIN -or
             !(Test-Path -LiteralPath $setup -PathType Leaf) -or
             (Get-Item -LiteralPath $setup).Length -lt 100000){
             throw 'AGENT06_ONLINE_ORIGINAL_SETUP_CORE_IDENTITY_INVALID'
          }
          Write-Host 'AGENT06_ONLINE_ORIGINAL_NATIVE_SETUP_BUILT'
      - name: Install actual product and qualify fresh real model through native UI
        shell: pwsh
        timeout-minutes: 55
        env:
          AGENT063_REAL_MODEL_WITNESS: '1'
        run: |
          $ErrorActionPreference='Continue'
          $privateRoot=Join-Path $env:RUNNER_TEMP 'agent06-installed-private'
          $repo=Join-Path $env:GITHUB_WORKSPACE 'private-agent'
          $center=Join-Path $env:GITHUB_WORKSPACE 'center-owner'
          $setup=Join-Path $privateRoot 'IWXA-Private-Online-SetupCore.exe'
          $test=Join-Path $center 'installer/windows/qualify-local-bundle.ps1'
          $witness=Join-Path $repo 'qualification/agent062/qualify_dashboard_installed.ps1'
          $sandbox=Join-Path $privateRoot 'temporary-real-model-installed'
          $log=Join-Path $privateRoot 'real-model-installed.private.log'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $test -Setup $setup -ProductId 'iwxa.personal-agent' -SandboxRoot $sandbox -SourceCommit $env:PRIVATE_SOURCE_PIN -WitnessScript $witness -WitnessTimeoutSeconds 2700 *> $log
          $exit=$LASTEXITCODE
          $receipt=Join-Path $sandbox 'installed-witness.json'
          $verified=$false
          if(Test-Path -LiteralPath $receipt -PathType Leaf){
            try{
              $w=Get-Content -LiteralPath $receipt -Raw -Encoding UTF8|ConvertFrom-Json
              if($w.schema -ceq 'IWXA_AGENT063_GUIDED_MODEL_WITNESS/1' -and $w.status -ceq 'PASS' -and $w.public_artifacts_uploaded -eq $false){
                $required=@('fresh_profile_verified','explicit_network_consent_via_gui','automatic_real_model_preparation_via_gui','real_local_inference_receipt_verified','offline_restored_via_gui','original_draft_preserved','real_task_submitted_via_gui','visible_review_decisions_via_gui','review_selection_did_not_submit','human_review_saved_via_gui','accepted_task_restored_after_cold_restart','no_duplicate_task_verified','no_external_task_effects_verified')
                $verified=$true
                foreach($key in $required){
                  if($w.$key -ne $true){$verified=$false;break}
                }
              }elseif($w.status -ceq 'FAIL'){
                $phases=@('VALIDATE','NATIVE_FIRST','V8_RENDER','MODEL_INITIAL','MODEL_DRAFT','MODEL_NETWORK','MODEL_PREPARING','MODEL_OFFLINE','MODEL_TASK','MODEL_REVIEW','MODEL_COLD')
                if([string]$w.phase -cin $phases){Write-Host ('AGENT063_REAL_MODEL_PHASE='+[string]$w.phase)}
                $reasons=@('other','agent063_native_graceful_close_unverified','agent063_real_model_probe_missing','agent063_real_model_probe_failed','agent063_real_model_probe_receipt_invalid','agent063_real_model_editor_missing','agent063_real_model_prepare_missing','agent063_real_model_network_choice_missing','agent063_real_model_network_confirm_missing','agent063_real_model_automatic_missing','agent063_real_model_preparation_unconfirmed','agent063_real_model_offline_missing','agent063_real_model_continue_missing','agent063_real_model_return_editor_missing','agent063_real_model_return_draft_changed','agent063_real_model_send_missing','agent063_real_model_review_missing','agent063_real_model_decision_missing','agent063_real_model_accept_missing','agent063_real_model_accepted_ui_missing','agent063_real_model_core_stop_failed','agent063_real_model_cold_ui_missing')
                if([string]$w.failure_code -cin $reasons){Write-Host ('AGENT063_REAL_MODEL_REASON='+[string]$w.failure_code)}
                $probe=@('other','projection_invalid','workspace_changed','workspace_tasks_invalid','route_unverified','t3_mode_mismatch','draft_not_preserved','draft_context_invalid','local_route_not_active','model_not_verified','inference_receipt_invalid','duplicate_task','task_id_invalid','task_identity_mismatch','task_execution_failed','task_result_not_ready','task_result_unverified','job_identity_invalid','premature_acceptance','human_review_unverified','phase_invalid','existing_witness','not_fresh_route','not_fresh_model','unexpected_task','proof_missing','phase_order_invalid','draft_digest_changed','premature_model_selection','premature_runtime_install','model_changed','task_changed_during_review','cold_task_changed','windows_required','owner_not_installed','owner_session_missing','owner_readback_invalid','unclassified')
                if([string]$w.model_probe_failure -cin $probe){Write-Host ('AGENT063_REAL_MODEL_PROBE_REASON='+[string]$w.model_probe_failure)}
                $stages=@('other','plan','mode','install','download','select','connect','start','activate','test','check-runtime','adopt-runtime','launch-runtime')
                $prepCodes=@('INTERRUPTED','PLAN_CHANGED','ROUTE_CHANGED','READ_TIMEOUT','SESSION_UNAVAILABLE','OUTCOME_UNKNOWN','NETWORK_REQUIRED','DOWNLOAD_TRANSPORT','DOWNLOAD_INTEGRITY','STORAGE','INFERENCE_FAILED','READBACK_UNVERIFIED','PENDING','OTHER')
                if([string]$w.model_preparation_stage -cin $stages){Write-Host ('AGENT063_MODEL_PREPARATION_STAGE='+[string]$w.model_preparation_stage)}
                if([string]$w.model_preparation_failure -cin $prepCodes){Write-Host ('AGENT063_MODEL_PREPARATION_REASON='+[string]$w.model_preparation_failure)}
                $line=0
                if([int]::TryParse([string]$w.exception_line,[ref]$line) -and $line -ge 1 -and $line -le 2000){Write-Host ('AGENT063_REAL_MODEL_WITNESS_LINE='+$line)}
              }
            }catch{Write-Host 'AGENT063_REAL_MODEL_RECEIPT_UNREADABLE'}
          }else{Write-Host 'AGENT063_REAL_MODEL_RECEIPT_MISSING'}
          $raw=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
          if($exit -ne 0){
            foreach($reason in @('SETUP_LOCAL_WITNESS_TIMEOUT','SETUP_LOCAL_WITNESS_EXIT_FAILED','SETUP_LOCAL_WITNESS_READBACK_INVALID','SETUP_LOCAL_SOURCE_IDENTITY_INVALID','SETUP_LOCAL_REPAIR_READBACK_INVALID','SETUP_LOCAL_UNINSTALL_OR_DATA_LOSS')){
              if(([string]$raw).Contains($reason)){Write-Host ('AGENT063_REAL_MODEL_SETUP_REASON='+$reason)}
            }
            throw 'AGENT063_REAL_MODEL_INSTALLED_FAIL'
          }
          if(!$verified){throw 'AGENT063_REAL_MODEL_RECEIPT_INCOMPLETE'}
          foreach($marker in @('IWXA_SETUP_LOCAL_NATIVE_INSTALL_AND_PRESERVE_PASS','IWXA_SETUP_LOCAL_REPAIR_AND_CONFIRM_PASS','IWXA_SETUP_LOCAL_RUNTIME_WITNESS_PASS')){
            if(-not ([string]$raw).Contains($marker)){throw 'AGENT063_REAL_MODEL_SETUP_PROOF_MISSING'}
          }
          Write-Host 'AGENT063_REAL_MODEL_INSTALLED_PASS'
          Write-Host 'AGENT063_PRIVATE_ARTIFACTS_UPLOADED=0'
