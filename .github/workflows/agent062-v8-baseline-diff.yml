name: Agent062 V8 compare complete Node suite with release baseline
on:
  push:
    branches:
      - work/2026-11-23-agent-062-v8-baseline-diff
    paths:
      - .github/workflows/agent062-v8-baseline-diff.yml
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 39a4f49ed9a5c0781c4a4769e9603ca8fb1e8d23
          path: baseline
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: d15d9bdad1b7948fcfedffc50e634676ad44ed15
          path: candidate
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare entire original Node suite without publishing private failures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cases=@(
            @{name='BASE';repo='baseline';sha='39a4f49ed9a5c0781c4a4769e9603ca8fb1e8d23'},
            @{name='V8';repo='candidate';sha='d15d9bdad1b7948fcfedffc50e634676ad44ed15'}
          )
          $result=@{}
          foreach($c in $cases){
            $path=Join-Path $env:GITHUB_WORKSPACE $c.repo
            $actual=(& git -C $path rev-parse HEAD).Trim()
            if($actual -cne $c.sha){throw 'AGENT062_BASELINE_SOURCE_MISMATCH'}
            Push-Location (Join-Path $path 'desktop')
            try{
              $installLog=Join-Path $env:RUNNER_TEMP ($c.name+'-install.private.log')
              $testLog=Join-Path $env:RUNNER_TEMP ($c.name+'-tests.private.log')
              $before=$ErrorActionPreference
              $ErrorActionPreference='Continue'
              & npm ci --no-audit --no-fund *> $installLog
              $installExit=$LASTEXITCODE
              if($installExit -ne 0){throw 'AGENT062_BASELINE_INSTALL_FAILED'}
              & npm run test *> $testLog
              $testExit=$LASTEXITCODE
              $ErrorActionPreference=$before
              $raw=Get-Content -LiteralPath $testLog -Raw -Encoding UTF8
              $counts=@{}
              foreach($key in @('tests','pass','fail')){
                $matched=[regex]::Matches($raw,'(?m)^# '+$key+' ([0-9]+)\s*$')
                if($matched.Count -ne 1){throw 'AGENT062_BASELINE_TEST_SUMMARY_MISSING'}
                $counts[$key]=[int]$matched[0].Groups[1].Value
              }
              if($counts.tests -ne ($counts.pass+$counts.fail) -or
                 (($counts.fail -eq 0) -ne ($testExit -eq 0))){
                throw 'AGENT062_BASELINE_TEST_STATUS_MISMATCH'
              }
              $failNames=@([regex]::Matches($raw,'(?m)^not ok [0-9]+ - (.*)$')|ForEach-Object {$_.Groups[1].Value.Trim()})
              if($failNames.Count -ne $counts.fail){throw 'AGENT062_BASELINE_FAILURE_COUNT_MISMATCH'}
              $result[$c.name]=@{tests=$counts.tests;pass=$counts.pass;fail=$counts.fail;failed=$failNames}
              Write-Host ('AGENT062_'+$c.name+'_TOTAL='+$counts.tests)
              Write-Host ('AGENT062_'+$c.name+'_PASS='+$counts.pass)
              Write-Host ('AGENT062_'+$c.name+'_FAIL='+$counts.fail)
            } finally {
              Pop-Location
            }
          }
          $old=@($result.BASE.failed)
          $new=@($result.V8.failed)
          $extra=@($new|Where-Object {$_ -cnotin $old})
          Write-Host ('AGENT062_V8_NEW_REGRESSIONS='+$extra.Count)
          # Show only a bounded test filename and line for each new failure.
          # The actual TAP and failure text remain private inside this runner.
          if($extra.Count -ne 0){
            $seen=0
            foreach($title in $extra){
              $pattern='(?m)^not ok (?<idx>[0-9]+) - '+[regex]::Escape([string]$title)+'\s*$'
              $match=[regex]::Match($raw,$pattern)
              if(!$match.Success){continue}
              $idx=[int]$match.Groups['idx'].Value
              $offset=$match.Index+$match.Length
              $part=$raw.Substring($offset,[Math]::Min(3200,$raw.Length-$offset))
              $loc=[regex]::Match($part,"(?m)^\s*location:\s*'(?<path>[^'\r\n]+)'")
              if($loc.Success){
                $parts=[regex]::Split($loc.Groups['path'].Value,'[\\/]')
                $leaf=$parts[$parts.Length-1]
                $file=[regex]::Match($leaf,'^(?<name>[A-Za-z0-9_.-]+):(?<line>[0-9]+):[0-9]+$')
                if($file.Success){
                  $seen++
                  Write-Host ('AGENT062_V8_REGRESSION_'+$seen+'_TEST='+$idx+';FILE='+$file.Groups['name'].Value+';LINE='+$file.Groups['line'].Value)
                }
              }
            }
            Write-Host ('AGENT062_V8_NEW_FAILURE_LOCATIONS='+$seen)
            throw 'AGENT062_V8_NEW_REGRESSIONS_FOUND'
          }
          if($result.V8.tests -le $result.BASE.tests){throw 'AGENT062_V8_TEST_COVERAGE_MISSING'}
          Write-Host 'AGENT062_V8_BASELINE_COMPARISON_PASS'
          exit 0
      # Logs and source are never uploaded or echoed; only safe counts.
