                  'gui_draft_lost_before_close','gui_draft_not_restored_after_restart',
                  'gui_core_draft_changed_after_restart','gui_native_close_unconfirmed',
                  'gui_first_launch_blank_recovered_but_qualification_failed'
                )
                $found=$false
                foreach($code in $allowed){
                  if($text.Contains($code)){
                    $found=$true
                    Write-Host ('AGENT06_OFFICE_INSTALLED_GUI_FAILURE_CODE='+$code)
                  }
                }
                if(!$found){Write-Host 'AGENT06_OFFICE_INSTALLED_GUI_FAILURE_CODE=OTHER'}
                if($text.Contains('control_unavailable:')){
                  Write-Host 'AGENT06_OFFICE_INSTALLED_GUI_FAILURE_CLASS=CONTROL_UNAVAILABLE'
                }
                if($text.Contains('gui_package_install_failed')){
                  # The installed script captures the private installer's
                  # error JSON. Emit only an explicit fixed-code allowlist,
                  # never paths, exception messages, stdout, or stderr.
                  $installCodes=@(
                    'package_unreadable','archive_manifest_invalid','archive_manifest_mismatch',
                    'managed_runtime_capsule_mismatch','managed_runtime_capsule_invalid',
                    'managed_runtime_descriptor_capsule_identity_mismatch',
                    'managed_runtime_expanded_size_mismatch','payload_digest_mismatch',
                    'source_digest_mismatch','host_blocked','insufficient_disk_space',
                    'install_disk_probe_failed','fresh_install_root_not_empty',
                    'install_writer_busy_or_stale','install_destination_symlink_forbidden',
                    'install_destination_parent_not_directory','install_destination_not_file',
                    'example_config_missing','installed_payload_verification_failed',
                    'managed_runtime_qualification_inputs_missing',
                    'managed_runtime_dependency_check_failed',
                    'managed_runtime_dependency_check_invalid',
                    'managed_runtime_dependency_check_not_ready',
                    'managed_runtime_core_import_not_verified',
                    'managed_runtime_root_not_directory','managed_runtime_undeclared_dependency_cleanup_failed',
                    'managed_cpython_not_staged','managed_runtime_dependency_manifest_missing',
                    'product_managed_runtime_not_staged','package_missing',
                    'managed_runtime_python_missing','python_executable_unavailable'
                  )
                  $diagnosed=$false
                  foreach($code in $installCodes){
                    if($text.Contains(('"error": "'+$code))){
                      $diagnosed=$true
                      Write-Host ('AGENT06_OFFICE_INSTALLER_ERROR_CODE='+$code)
                    }
                  }
                  if(!$diagnosed){Write-Host 'AGENT06_OFFICE_INSTALLER_ERROR_CODE=OTHER'}
                  # Only public, predeclared error taxonomy is revealed.
                  # No trace, Python path, dynamic exception text or identity.
                  $inner=@(
                    'runtime_requirements_missing','runtime_requirement_must_be_exact',
                    'runtime_requirement_manifest_mismatch','runtime_dependencies_not_ready',
                    'runtime_core_import_source_missing','runtime_core_import_source_mismatch',
                    'runtime_core_import_failed','runtime_core_import_api_incomplete',
                    'runtime_dependency_manifest_missing','runtime_dependency_manifest_invalid',
                    'runtime_dependency_manifest_duplicate','schema_registry_unreadable',
                    'jsonschema-specifications','ModuleNotFoundError','ImportError',
                    'OSError','FileNotFoundError','PermissionError','WinError 206'
                  )
                  foreach($code in $inner){
                    if($text.Contains($code)){
                      $codeName=switch($code){
                        'jsonschema-specifications' {'JSONSCHEMA_SPECIFICATIONS'}
                        'WinError 206' {'WIN32_NAME_TOO_LONG'}
                        default {($code -replace '[^A-Za-z0-9_]','_').ToUpperInvariant()}
                      }
                      Write-Host ('AGENT06_OFFICE_INSTALL_INNER_CLASS='+$codeName)
                    }
                  }
                  $qa=Join-Path $shortQa ('agent02-installed-gui-'+$env:GITHUB_RUN_ID)
                  $receipt=Join-Path $qa 'install/explorer-install-receipt.json'
                  if(Test-Path -LiteralPath $receipt -PathType Leaf){
                    Write-Host 'AGENT06_OFFICE_INSTALL_RECEIPT_PRESENT=YES'
                  }else{Write-Host 'AGENT06_OFFICE_INSTALL_RECEIPT_PRESENT=NO'}
                }
              }
              throw 'AGENT06_OFFICE_INSTALLED_NATIVE_GUI_HOLD'
            }
            Write-Host 'AGENT06_OFFICE_INSTALLED_NATIVE_GUI_PASS'
          }finally{Pop-Location}
      - name: Installed Agent real Core Task to React U04 panel qualification
        if: env.AGENT_OFFICE_DIAGNOSTICS_ONLY != 'true'
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference='Stop'
          Push-Location private-agent
          try{
            # This is NOT the original U04 host probe. It uses the exact
            # installed EXE and authenticated installed Core. Only disposable
            # data created under the former short QA installation are used.
            $qaScript='qualification/agent06/office/installed_office_gui_acceptance.ps1'
            $qaPython='qualification/agent06/office/installed_office_ui_fixture.py'
            if(!(Test-Path -LiteralPath $qaScript -PathType Leaf) -or
               !(Test-Path -LiteralPath $qaPython -PathType Leaf)){
              throw 'AGENT06_OFFICE_INSTALLED_U04_QA_SOURCE_MISSING'
            }
            $tokens=$null;$parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              [IO.Path]::GetFullPath($qaScript),[ref]$tokens,[ref]$parseErrors)
            if(@($parseErrors).Count -ne 0){throw 'AGENT06_OFFICE_INSTALLED_U04_QA_PARSER_FAIL'}
            & python -B -c "import ast,pathlib; ast.parse(pathlib.Path('$qaPython').read_text(encoding='utf-8'))"
            if($LASTEXITCODE -ne 0){throw 'AGENT06_OFFICE_INSTALLED_U04_QA_PYTHON_SYNTAX_FAIL'}
            Write-Host 'AGENT06_OFFICE_INSTALLED_U04_QA_PARSE_PASS'
            $log=Join-Path $env:RUNNER_TEMP 'agent06-office-installed-u04-qa-private.txt'
            $originalRunnerTemp=$env:RUNNER_TEMP
            try{
              $env:RUNNER_TEMP='C:\i6'
              & pwsh -NoProfile -NonInteractive -File $qaScript *> $log
              $qaExit=$LASTEXITCODE
            }finally{$env:RUNNER_TEMP=$originalRunnerTemp}
            $private=Get-Content -LiteralPath $log -Raw
            foreach($stage in @(
              'REAL_INSTALLED_CORE_TASK_PASS','REAL_REACT_TASK_PAGE_PASS',
              'REAL_TASK_ROW_INVOKED','REAL_U04_PANEL_VISIBLE_PASS',
              'REAL_CORE_TASK_AND_UI_PANEL_PASS')){
              if($private.Contains('INSTALLED_OFFICE_QA_'+$stage)){
                Write-Host ('AGENT06_OFFICE_INSTALLED_U04_'+$stage)
              }
            }
            if($qaExit -ne 0){
              $categories=@(
                'baseline_install_missing','executable_missing','fixture_missing',
                'profile_not_fresh','root_mismatch','install_not_disposable',
                'native_exited','native_window_missing','uia_root_missing',
                'native_close_denied','native_close_timeout','native_close_unconfirmed',
                'core_not_ready','source_changed','files_connection_failed',
                'files_stat_unverified','source_task_missing','source_not_accepted',
                'revision_missing','draft_not_verified','reviewed_candidate_unverified',
                'unapproved_copy_created','saved_task_identity_missing',
                'uia_action_unavailable','textbox_unavailable',
                'input_not_accepted','task_not_durable','provider_binding_changed')
              $found=$false
              foreach($category in $categories){
                if($private.Contains('installed_office_qa_'+$category)){
                  Write-Host ('AGENT06_OFFICE_INSTALLED_U04_FAILURE_CLASS='+$category.ToUpper())
                  $found=$true
                }
              }
              foreach($cat in @('TASK','OFFICE','OTHER')){
                if($private.Contains('installed_office_qa_control_not_visible:'+$cat)){
                  Write-Host ('AGENT06_OFFICE_INSTALLED_U04_FAILURE_CLASS=CONTROL_'+$cat)
                  $found=$true
                }
              }
              if($private.Contains('installed_office_qa_fixture_seed_failed')){
                Write-Host 'AGENT06_OFFICE_INSTALLED_U04_FAILURE_CLASS=FIXTURE_SEED'
                $found=$true
              }
              if(!$found){Write-Host 'AGENT06_OFFICE_INSTALLED_U04_FAILURE_CLASS=OTHER'}
              throw 'AGENT06_OFFICE_INSTALLED_U04_GUI_ACCEPTANCE_HOLD'
            }
            if(-not $private.Contains('INSTALLED_OFFICE_QA_REAL_CORE_TASK_AND_UI_PANEL_PASS')){
              throw 'AGENT06_OFFICE_INSTALLED_U04_GUI_EVIDENCE_MISSING'
            }
            Write-Host 'AGENT06_OFFICE_INSTALLED_U04_CORE_TASK_REACT_PANEL_PASS'
          }finally{Pop-Location}
      # There is intentionally no upload-artifact, upload-pages-artifact,
      # cache, commit, log upload, EXE publication or secret persistence.
