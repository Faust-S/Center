# Public temporary Windows runner, with read-only private Agent source pinned to SHA.
# Synthetic DOCX stays in RUNNER_TEMP; no source, documents, screenshots or logs uploaded.
name: Agent 0.6 Office real U04 LibreOffice Windows qualification
on:
  push:
    branches: ['work/2026-11-15-agent06-office-source-qualification']
    paths: ['.github/workflows/agent06-office-real-u04-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-office-real-u04-win-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-office-selected-docx:
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      AGENT_OFFICE_SHA: '2571ceb8015643e7dcc5d5f7db398cc9d226321e'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require scoped private read-only source
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_U04_PRIVATE_SOURCE_UNAVAILABLE'
          }
          Write-Host 'AGENT06_U04_PRIVATE_SOURCE_READ_ONLY_AVAILABLE'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT_OFFICE_SHA }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Parse QA PowerShell syntax before expensive setup
        shell: pwsh
        run: |
          $source='private-agent/qualification/agent06/office/real_u04_office_gui.ps1'
          $tokens=$null
          $parseErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            [IO.Path]::GetFullPath($source),[ref]$tokens,[ref]$parseErrors)
          if(@($parseErrors).Count -ne 0){
            foreach($item in @($parseErrors)){
              $line=[int]$item.Extent.StartLineNumber
              if($line -gt 0 -and $line -lt 500){
                Write-Host ('AGENT06_U04_QA_PWSH_PARSER_LINE='+$line)
              }
            }
            throw 'AGENT06_U04_QA_PWSH_PARSER_FAIL'
          }
          Write-Host 'AGENT06_U04_QA_PWSH_PARSER_PASS'
      - name: Verify private exact source and prepare original dependencies
        shell: pwsh
        timeout-minutes: 12
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne $env:AGENT_OFFICE_SHA){throw 'AGENT06_U04_PRIVATE_SOURCE_SHA_MISMATCH'}
          & python -m pip install -r private-agent/requirements.txt python-docx pytest *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-python-private.txt')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_PYTHON_DEPENDENCIES_FAIL'}
          Push-Location private-agent/desktop
          try{
            & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-npm-private.txt')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_NODE_DEPENDENCIES_FAIL'}
            & node.exe --test tests/office-docx-launch.test.mjs tests/u04-native-host.test.mjs *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-source-tests-private.txt')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_NATIVE_OWNER_SOURCE_TESTS_FAIL'}
            & npm.cmd run build *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-desktop-build-private.txt')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_DESKTOP_BUILD_FAIL'}
          }finally{Pop-Location}
          Push-Location private-agent
          try{
            & node.exe scripts/prepare-public-modules.mjs --only-u04 --fetch *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-public-owner-private.txt')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_ORIGINAL_OWNER_PREPARE_FAIL'}
            & node.exe scripts/stage-u04-desktop.mjs build/u04-owner-sources desktop/dist/u04 *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-stage-private.txt')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_ORIGINAL_OWNER_STAGE_FAIL'}
            foreach($module in @('bridge.mjs','id.mjs','surface.mjs')){
              if(!(Test-Path -LiteralPath (Join-Path 'desktop/dist/u04/u04-presentation' $module) -PathType Leaf)){
                throw 'AGENT06_U04_ORIGINAL_OWNER_MODULE_MISSING'
              }
            }
          }finally{Pop-Location}
          Write-Host 'AGENT06_U04_PINNED_SOURCE_AND_OWNER_PASS'
      - name: Create reviewed Task and read-only original Personal Files witnesses
        shell: pwsh
        run: |
          $qa=Join-Path $env:RUNNER_TEMP ('agent06-u04-selected-docx-'+$env:GITHUB_RUN_ID)
          $qaAbsolute=[IO.Path]::GetFullPath($qa)
          Push-Location private-agent
          try{
            & python -B -m qualification.agent06.office.real_u04_selected_docx prepare $qaAbsolute *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-fixture-private.txt')
            if($LASTEXITCODE -ne 0){
              $private=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'agent06-u04-fixture-private.txt') -Raw
              foreach($code in @('U04_REAL_TASK_NOT_ACCEPTED','U04_REAL_ACCEPTED_DIGEST_MISSING',
                  'U04_REAL_TASK_FILE_STAT_PREPARED','AssertionError','ValueError',
                  'FileExistsError','FileNotFoundError','ModuleNotFoundError',
                  'ImportError','KeyError','AttributeError','TypeError',
                  'OSError','PermissionError','LocalFileError','ProviderBindingError')){
                if($private.Contains($code)){Write-Host ('AGENT06_U04_FIXTURE_FAILURE_CLASS='+$code)}
              }
              throw 'AGENT06_U04_REAL_CORE_FILE_RECEIPT_PREPARE_FAIL'
            }
          }finally{Pop-Location}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('AGENT06_U04_QA_ROOT='+$qaAbsolute)
          Write-Host 'AGENT06_U04_REAL_REVIEWED_TASK_FILE_WITNESS_PASS'
      - name: Compile exact original Windows U04 native host in disposable QA crate
        shell: pwsh
        timeout-minutes: 15
        run: |
          $probe=Join-Path $env:RUNNER_TEMP 'iwxa-u04-real-native'
          New-Item -ItemType Directory -Path (Join-Path $probe 'src') -Force | Out-Null
          @(
            '[package]','name = "agent06_u04_native_qa"','version = "0.0.1"',
            'edition = "2021"','[dependencies]','serde_json = "1"','sha2 = "0.10.9"'
          ) | Set-Content -LiteralPath (Join-Path $probe 'Cargo.toml') -Encoding UTF8
          Copy-Item -LiteralPath 'private-agent/desktop/src-tauri/src/u04_windows_host.rs' -Destination (Join-Path $probe 'src/u04_windows_host.rs')
          Copy-Item -LiteralPath 'private-agent/qualification/agent06/office/real_u04_native_probe.rs' -Destination (Join-Path $probe 'src/main.rs')
          & cargo.exe test --manifest-path (Join-Path $probe 'Cargo.toml') --quiet *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-cargo-tests-private.txt')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_ORIGINAL_NATIVE_TESTS_FAIL'}
          & cargo.exe build --manifest-path (Join-Path $probe 'Cargo.toml') --release --quiet *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-cargo-build-private.txt')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_ORIGINAL_NATIVE_BUILD_FAIL'}
          Write-Host 'AGENT06_U04_ORIGINAL_NATIVE_MSCV_PASS'
      - name: Install real LibreOffice Writer on disposable Windows runner
        shell: pwsh
        timeout-minutes: 28
        run: |
          & choco.exe install libreoffice-fresh --yes --no-progress *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-libreoffice-install-private.txt')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_LIBREOFFICE_INSTALL_FAIL'}
          if(!(Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'LibreOffice/program/soffice.exe') -PathType Leaf)){
            throw 'AGENT06_U04_LIBREOFFICE_EXECUTABLE_MISSING'
          }
          Write-Host 'AGENT06_U04_REAL_LIBREOFFICE_INSTALLED_PASS'
      - name: Invoke original U04 owner through compiled native host and require Office window
        shell: pwsh
        timeout-minutes: 6
        run: |
          $qa=Join-Path $env:AGENT06_U04_QA_ROOT 'evidence-private.json'
          $native=Join-Path $env:RUNNER_TEMP 'iwxa-u04-real-native/target/release/agent06_u04_native_qa.exe'
          $owner=[IO.Path]::GetFullPath('private-agent/desktop/dist/u04/u04-presentation/bridge.mjs')
          $desktop=[IO.Path]::GetFullPath('private-agent/desktop')
          & node.exe private-agent/qualification/agent06/office/real_u04_owner_bridge.mjs $qa $native $owner $desktop *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-owner-window-private.txt')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_ORIGINAL_OWNER_REAL_WINDOW_HOLD'}
          Write-Host 'AGENT06_U04_ORIGINAL_OWNER_REAL_WINDOW_PASS'
      - name: Verify selected DOCX title and save a real edit in LibreOffice Writer
        shell: pwsh
        timeout-minutes: 6
        run: |
          & pwsh -NoProfile -NonInteractive -File private-agent/qualification/agent06/office/real_u04_office_gui.ps1 $env:AGENT06_U04_QA_ROOT *> (Join-Path $env:RUNNER_TEMP 'agent06-u04-window-save-private.txt')
          if($LASTEXITCODE -ne 0){
            $private=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'agent06-u04-window-save-private.txt') -Raw
            foreach($code in @('U04_QA_ARGUMENTS_PASS','U04_QA_PRIVATE_CONTEXT_PASS',
                'U04_QA_SOURCE_PRELAUNCH_WITNESS_PASS','U04_QA_UI_AUTOMATION_READY_PASS',
                'U04_QA_SELECTED_DOCX_WINDOW_VISIBLE_PASS','U04_QA_LIBREOFFICE_FOREGROUND_PASS',
                'U04_QA_FOREGROUND_OWNER=WRITER_OTHER_WINDOW','U04_QA_FOREGROUND_OWNER=NONE',
                'U04_QA_FOREGROUND_OWNER=FOREIGN_PROCESS',
                'U04_QA_GUI_SAVE_COMMAND_SENT','U04_QA_EDITOR_CLICK_SELECTED_DOCUMENT_PASS',
                'U04_QA_EDITOR_MARKER_UIA_VISIBLE','U04_QA_EDITOR_MARKER_UIA_NOT_VISIBLE',
                'U04_QA_EDITOR_MARKER_UIA_UNAVAILABLE',
                'U04_QA_SAVE_FORMAT_BUTTON_INVOKED',
                'U04_QA_SAVE_FORMAT_BUTTON_NOT_OBSERVED',
                'U04_QA_EXACT_DOCUMENT_WINDOW_CLOSE_INVOKED',
                'U04_QA_EDITOR_CLICK_OUTSIDE_SELECTED_WINDOW',
                'U04_QA_EDITOR_FOCUS_LOST_BEFORE_CLICK','U04_QA_EDITOR_FOCUS_LOST_AFTER_CLICK',
                'U04_QA_SAVED_DOCX_FILE_LOCKED','U04_QA_WRITER_MODAL_DISMISS_ATTEMPTED',
                'U04_QA_WRITER_KNOWN_STARTUP_TIP_DISMISS_ATTEMPTED',
                'U04_QA_WRITER_EXACT_WINDOW_RESTORE_ATTEMPTED',
                'U04_QA_WRITER_EXACT_OWNED_OVERLAY_ESCAPE_ATTEMPTED',
                'U04_QA_FOREGROUND_RELATION=SELECTED_DOC_ROOTOWNER',
                'U04_QA_FOREGROUND_RELATION=SAME_PROCESS_OTHER',
                'U04_QA_DOCUMENT_CLOSE_REQUESTED',
                'U04_QA_ORIGINAL_RECEIPT_INVALID','U04_QA_DIRECTORY_REQUIRED',
                'U04_QA_SELECTED_DOCX_MISSING','U04_QA_SELECTED_DOCX_WINDOW_NOT_VISIBLE',
                'U04_QA_LIBREOFFICE_FOCUS_ROOT_UNAVAILABLE','U04_QA_LIBREOFFICE_CLICK_OUTSIDE_VIEWPORT',
                'U04_QA_LIBREOFFICE_FOCUS_DENIED',
                'U04_QA_LIBREOFFICE_NOT_FOREGROUND','U04_QA_GUI_EDIT_NOT_SAVED','U04_QA_FOCUS_LOST_BEFORE_SAVE',
                'U04_QA_CANVAS_TARGET_LOST_FOREGROUND',
                'U04_QA_CANVAS_TARGET_NOT_SELECTED_DOC',
                'U04_QA_CANVAS_INPUT_ATTACH_DENIED',
                'U04_QA_CANVAS_FOCUS_NOT_CONFIRMED',
                'U04_QA_CANVAS_FOCUS_LOST_FOREGROUND',
                'U04_QA_CANVAS_WIN32_FOCUS_CONFIRMED',
                'U04_QA_FOCUS_LOST_BEFORE_CANVAS_SHORTCUT','U04_QA_FOCUS_LOST_AFTER_CANVAS_SHORTCUT',
                'U04_QA_SOURCE_REVISION_CHANGED')){
              if($private.Contains($code)){Write-Host ('AGENT06_U04_GUI_FAILURE_CLASS='+$code)}
            }
            foreach($phase in @('BEFORE_EDIT','AFTER_CANVAS_SHORTCUT','AFTER_TARGET','AFTER_EDIT')){
              foreach($focus in @('DOCUMENT','EDIT','PANE','WRITER_OTHER',
                  'WRITER_CUSTOM','WRITER_WINDOW','WRITER_BUTTON',
                  'WRITER_MENU','WRITER_MENUITEM','WRITER_TOOLBAR',
                  'WRITER_TEXT','WRITER_GROUP','WRITER_LIST',
                  'WRITER_LISTITEM','WRITER_SCROLLBAR','WRITER_TABITEM',
                  'WRITER_TAB','WRITER_COMBOBOX','WRITER_TITLEBAR',
                  'WRITER_TREEITEM','WRITER_STATUSBAR',
                  'FOREIGN_PROCESS','UNAVAILABLE')){
                if($private.Contains('U04_QA_FOCUS_'+$phase+'='+$focus)){
                  Write-Host ('AGENT06_U04_FOCUS_'+$phase+'='+$focus)
                }
              }
            }
            foreach($phase in @('BEFORE_EDIT','AFTER_CANVAS_SHORTCUT','AFTER_TARGET','AFTER_EDIT')){
              foreach($focus in @('ROOT_SAL','ROOT_EDIT','ROOT_OTHER',
                  'CHILD_SAL','CHILD_EDIT','CHILD_OTHER',
                  'OWNED_SAL','OWNED_EDIT','OWNED_OTHER',
                  'OTHER_SAL','OTHER_EDIT','OTHER_OTHER',
                  'NONE','FOREIGN','UNAVAILABLE','NO_THREAD',
                  'PID_MISMATCH','NO_INFO','EXCEPTION','EXCEPTION_METHOD',
                  'EXCEPTION_ARGUMENT','EXCEPTION_INVOKE','EXCEPTION_OTHER')){
                if($private.Contains('U04_QA_WIN32_FOCUS_'+$phase+'='+$focus)){
                  Write-Host ('AGENT06_U04_WIN32_FOCUS_'+$phase+'='+$focus)
                }
              }
            }
            foreach($element in @('FOUND','MISSING')){
              if($private.Contains('U04_QA_DOCUMENT_UIA_ELEMENT='+$element)){
                Write-Host ('AGENT06_U04_DOCUMENT_UIA_ELEMENT='+$element)
              }
            }
            foreach($copy in @('SOURCE_AND_MARKER','SOURCE_ONLY',
                'MARKER_ONLY','NO_DOCUMENT_TEXT','UNAVAILABLE')){
              if($private.Contains('U04_QA_EDITOR_CLIPBOARD_READBACK='+$copy)){
                Write-Host ('AGENT06_U04_EDITOR_CLIPBOARD_READBACK='+$copy)
              }
            }
            foreach($readback in @('CHANGED','UNCHANGED','UNAVAILABLE')){
              if($private.Contains('U04_QA_SAVE_IMMEDIATE_READBACK='+$readback)){
                Write-Host ('AGENT06_U04_SAVE_IMMEDIATE_READBACK='+$readback)
              }
            }
            foreach($errorClass in @('ParserError','MethodInvocationException','MethodException',
                'ParameterBindingException','RuntimeException','InvalidOperationException',
                'TypeNotFound','FileNotFoundException','ArgumentException',
                'NullReferenceException','TypeInitializationException')){
              if($private.Contains($errorClass)){Write-Host ('AGENT06_U04_GUI_EXCEPTION_CLASS='+$errorClass)}
            }
            throw 'AGENT06_U04_REAL_DOCX_GUI_SAVE_HOLD'
          }
          Write-Host 'AGENT06_U04_REAL_SELECTED_DOCX_GUI_SAVE_PASS'
      - name: Two new Core processes verify selected DOCX content and exact Files revision
        shell: pwsh
        timeout-minutes: 4
        run: |
          Push-Location private-agent
          try{
            foreach($i in @(1,2)){
              & python -B -m qualification.agent06.office.real_u04_selected_docx verify $env:AGENT06_U04_QA_ROOT *> (Join-Path $env:RUNNER_TEMP ('agent06-u04-cold-'+$i+'-private.txt'))
              if($LASTEXITCODE -ne 0){throw 'AGENT06_U04_SELECTED_DOCX_COLD_CORE_READBACK_FAIL'}
            }
          }finally{Pop-Location}
          Write-Host 'AGENT06_U04_REAL_SELECTED_DOCX_TWO_COLD_CORES_PASS'
      # No upload-artifact, source, EXE, cache, logs, screenshots or test documents.
