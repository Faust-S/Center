name: Agent 0.5 private Windows native installed qualification

on:
  push:
    branches:
      - work/2026-11-13-agent05-native-qualification
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent05-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This public-only preflight prevents a 5-minute private Tauri build from
  # running when the public acceptance script itself is syntactically invalid.
  native-qa-script-preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse the public real-GGUF PowerShell acceptance step
        shell: pwsh
        run: |
          $lines = @(Get-Content -LiteralPath '.github/workflows/agent05-native-windows.yml')
          $label = '      - name: Real installed GGUF Task Review, cold result, independent import and native readback'
          $first = -1
          for ($i=0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -ceq $label) { $first=$i; break }
          }
          if ($first -lt 0) { throw 'AGENT05_PUBLIC_GGUF_SCRIPT_NOT_FOUND' }
          $begin = -1
          for ($i=$first+1; $i -lt [Math]::Min($first+8,$lines.Count); $i++) {
            if ($lines[$i].Trim() -ceq 'run: |') { $begin=$i+1; break }
          }
          if ($begin -lt 0) { throw 'AGENT05_PUBLIC_GGUF_SCRIPT_BODY_MISSING' }
          $end = -1
          for ($i=$begin; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -ceq '      # The public job prints only fixed stage/category identifiers; the') {
              $end=$i;break
            }
          }
          if ($end -le $begin) { throw 'AGENT05_PUBLIC_GGUF_SCRIPT_END_MISSING' }
          $body = @()
          for ($i=$begin; $i -lt $end; $i++) {
            $line = [string]$lines[$i]
            if (-not $line.StartsWith('          ')) { throw 'AGENT05_PUBLIC_GGUF_SCRIPT_INDENTATION' }
            $body += $line.Substring(10)
          }
          $powerShellCode = $body -join [Environment]::NewLine
          $tokens = $null; $issues = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($powerShellCode,[ref]$tokens,[ref]$issues)
          if (@($issues).Count -gt 0) { throw 'AGENT05_PUBLIC_GGUF_POWERSHELL_SYNTAX_FAILED' }
          Write-Host 'AGENT05_PUBLIC_GGUF_POWERSHELL_SYNTAX_PASS'
  native-windows:
    needs: native-qa-script-preflight
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Require private read-only source credential
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)) { throw 'AGENT05_NATIVE_PRIVATE_SOURCE_READ_MISSING' }
      - name: Checkout pinned private Agent without credential persistence
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 39b28b9deb85bbed8edb4c45b66c432aad46cac5
          path: private-product
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Verify exact private source and product version
        shell: pwsh
        run: |
          $actual = (& git -C private-product rev-parse HEAD).Trim()
          if ($actual -cne '39b28b9deb85bbed8edb4c45b66c432aad46cac5') { throw 'AGENT05_NATIVE_SOURCE_MISMATCH' }
          $cargo = Get-Content -LiteralPath private-product/desktop/src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version = "0.5.0"$') { throw 'AGENT05_NATIVE_VERSION_MISMATCH' }
          Write-Host 'AGENT05_NATIVE_SOURCE_AND_VERSION_PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Python dependencies for isolated installed package
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-native-python-deps.log'
          & python -m pip install -r requirements.txt *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_NATIVE_PYTHON_DEPS_FAILED' }
          Write-Host 'AGENT05_NATIVE_PYTHON_DEPS_PASS'
      - name: Install private desktop dependencies
        working-directory: private-product/desktop
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-native-node-deps.log'
          & npm.cmd ci --no-audit --no-fund *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_NATIVE_NODE_DEPS_FAILED' }
          Write-Host 'AGENT05_NATIVE_NODE_DEPS_PASS'
      - name: Stage verified pinned public U04 sources for installed WebView
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-native-u04-source.log'
          & node scripts/prepare-public-modules.mjs --only-u04 --fetch *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_NATIVE_U04_PREPARE_FAILED' }
          & node scripts/stage-u04-desktop.mjs build/u04-owner-sources desktop/public/u04 *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_NATIVE_U04_STAGE_FAILED' }
          Write-Host 'AGENT05_NATIVE_U04_STAGE_PASS'
      - name: Validate private real-GGUF Graph witness Python syntax
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-private-graph-python-syntax.log'
          & python -c "from pathlib import Path; p=Path('tools/qualify_setup_core_real_qwen.py'); compile(p.read_text(encoding='utf-8'),str(p),'exec')" *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_PRIVATE_GRAPH_WITNESS_SYNTAX_FAILED' }
          Write-Host 'AGENT05_PRIVATE_GRAPH_WITNESS_SYNTAX_PASS'
      - name: Validate private Windows UIA Graph witness PowerShell syntax
        working-directory: private-product
        shell: pwsh
        run: |
          $text = Get-Content -LiteralPath 'tools/qualify_setup_core_native_gui.ps1' -Raw
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseInput($text,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { throw 'AGENT05_PRIVATE_GUI_GRAPH_SCRIPT_SYNTAX_FAILED' }
          Write-Host 'AGENT05_PRIVATE_GUI_GRAPH_SCRIPT_SYNTAX_PASS'
      - name: Compile real Tauri Windows executable
        working-directory: private-product/desktop
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-native-tauri-build.log'
          & npm.cmd run tauri:build *> $log
          if ($LASTEXITCODE -ne 0) { throw 'AGENT05_NATIVE_TAURI_BUILD_FAILED' }
          $exe = 'src-tauri/target/release/iwxa-personal.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'AGENT05_NATIVE_EXE_MISSING' }
          # Staged owner sources are build inputs; keep the source checkout
          # pristine for manifest-bound native packaging, while dist retains
          # the verified U04 ESM closure.
          Remove-Item -LiteralPath public/u04 -Force -Recurse
          Write-Host 'AGENT05_NATIVE_TAURI_EXE_PASS'
      - name: Qualify isolated installed native window, draft and cold reopen
        working-directory: private-product
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'agent05-native-installed-gui.log'
          try {
            & pwsh -NoProfile -NonInteractive -File qualification/phase1/agent02_installed_gui_acceptance.ps1 *> $log
            if ($LASTEXITCODE -ne 0) { throw 'INSTALLED_GUI' }
            Write-Host 'AGENT05_NATIVE_INSTALLED_UIA_COLD_REOPEN_PASS'
          } catch {
            # A bounded stage/category is needed to distinguish a product
            # regression from UIAutomation failing in the hosted session.
            # NEVER emit raw private smoke logs, UI text, screenshots, paths,
            # process arguments, tokens, drafts or installed binaries.
            $smoke = Join-Path $env:RUNNER_TEMP ('agent02-installed-gui-' + $env:GITHUB_RUN_ID)
            $report = Join-Path $smoke 'logs/smoke-result.json'
            if (Test-Path -LiteralPath $report -PathType Leaf) {
              try {
                $observed = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
                foreach ($field in @('install','button_invoked','react_page_changed','task_input_visible','task_input_editable','draft_restore','core_draft_before_close','core_draft_after_reopen','first_window_retry')) {
                  $value = [string]$observed.$field
                  if ($value -in @('PASS','NOT_TESTED','NOT_NEEDED','ATTEMPTED','RECOVERED')) {
                    Write-Host ('AGENT05_NATIVE_STAGE_' + $field.ToUpperInvariant() + '=' + $value)
                  }
                }
                $failure = [string]$observed.error
                $category = 'UNCLASSIFIED_INSTALLED_FAILURE'
                if ($failure -match 'gui_native_process_exited_before_window|gui_native_window_missing|gui_window_in_other_session') { $category='NATIVE_WINDOW_UNAVAILABLE' }
                elseif ($failure -match 'control_unavailable|react_page_not_visible|ui_automation_root_missing|draft_value_pattern_unavailable') { $category='UI_AUTOMATION_CONTROL_UNAVAILABLE' }
                elseif ($failure -match 'gui_native_close_unconfirmed|GUI_NATIVE_CLOSE_TIMEOUT') { $category='NATIVE_CLOSE_UNCONFIRMED' }
                elseif ($failure -match 'gui_draft|draft_http|gui_core_draft|draft_value_change') { $category='DRAFT_READBACK_OR_EDIT_FAILURE' }
                elseif ($failure -match 'gui_native_package_failed|gui_package_install_failed|gui_storage_authority_failed|gui_native_executable_not_installed') { $category='INSTALL_OR_STORAGE_FAILURE' }
                Write-Host ('AGENT05_NATIVE_FAILURE_CATEGORY=' + $category)
              } catch {
                Write-Host 'AGENT05_NATIVE_FAILURE_CATEGORY=REPORT_UNAVAILABLE'
              }
            } else {
              Write-Host 'AGENT05_NATIVE_FAILURE_CATEGORY=REPORT_MISSING'
              # The private product script failed before its GUI metrics were
              # initialized. Inspect only fixed error tokens; do not print
              # any original log line or file contents to the public run.
              $precheck='UNCLASSIFIED_PRECHECK_FAILURE'
              if (Test-Path -LiteralPath $log -PathType Leaf) {
                $known=@(
                  @('gui_managed_python_capsule_failed','MANAGED_PYTHON_CAPSULE'),
                  @('gui_native_package_failed','NATIVE_PACKAGE'),
                  @('gui_package_install_failed','PACKAGE_INSTALL'),
                  @('gui_storage_authority_failed','STORAGE_AUTHORITY'),
                  @('gui_native_executable_not_installed','INSTALLED_EXE_MISSING'),
                  @('gui_native_process_exited_before_window','NATIVE_PROCESS_EARLY_EXIT'),
                  @('gui_native_window_missing','NATIVE_WINDOW_MISSING')
                )
                foreach ($pair in $known) {
                  if (Select-String -LiteralPath $log -Pattern $pair[0] -SimpleMatch -Quiet -ErrorAction SilentlyContinue) {
                    $precheck=[string]$pair[1]
                    break
                  }
                }
              }
              Write-Host ('AGENT05_NATIVE_PRECHECK_FAILURE_CATEGORY=' + $precheck)
              # Only fixed, whitelisted error identifiers. No original
              # private output, paths, source, credentials or diagnostics.
              if ($precheck -eq 'NATIVE_PACKAGE') {
                $reason = 'UNKNOWN'
                $safeMatch = @(
                  @('release_worktree_not_clean','SOURCE_TREE_DIRTY'),
                  @('release_payload_not_tracked','UNTRACKED_SOURCE'),
                  @('desktop_frontend_not_built','FRONTEND_BUILD_MISSING'),
                  @('desktop_asset_path_invalid','FRONTEND_ASSET_PATH'),
                  @('desktop_u04_owner_modules_incomplete','U04_ASSET_SET'),
                  @('desktop_frontend_assets_missing_or_excessive','FRONTEND_ASSET_SET'),
                  @('desktop_artifact_conflicts_with_source','PAYLOAD_COLLISION'),
                  @('managed_runtime_capsule_invalid','MANAGED_RUNTIME_INCOMPATIBLE'),
                  @('managed_runtime_platform_unsupported','MANAGED_RUNTIME_PLATFORM'),
                  @('desktop_native_executable_missing','TAURI_BINARY_MISSING'),
                  @('forbidden_payload_path','PAYLOAD_PATH_INVALID'),
                  @('git_command_failed','GIT_SOURCE_ERROR')
                )
                if (Test-Path -LiteralPath $log -PathType Leaf) {
                  foreach ($pair in $safeMatch) {
                    if (Select-String -LiteralPath $log -Pattern $pair[0] -SimpleMatch -Quiet -ErrorAction SilentlyContinue) {
                      $reason = [string]$pair[1]
                      break
                    }
                  }
                }
                Write-Host ('AGENT05_NATIVE_PACKAGE_FAILURE_CATEGORY=' + $reason)
              }
            }
            throw 'AGENT05_NATIVE_INSTALLED_UIA_GATE_FAILED'
          }
      - name: Real installed GGUF Task Review, cold result, independent import and native readback
        working-directory: private-product
        shell: pwsh
        run: |
          # Reuse the exact disposable profile and installed package from
          # the successful UIA smoke; never touch a normal user installation.
          $qa = Join-Path $env:RUNNER_TEMP ('agent02-installed-gui-' + $env:GITHUB_RUN_ID)
          $install = Join-Path $qa 'install'
          $exe = Join-Path $install 'desktop/bin/IWXA Personal.exe'
          $logs = Join-Path $qa 'logs'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'AGENT05_GGUF_NATIVE_INSTALL_MISSING' }
          $env:USERPROFILE = Join-Path $qa 'profile'
          $env:HOME = $env:USERPROFILE
          $env:APPDATA = Join-Path $env:USERPROFILE 'AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $env:USERPROFILE 'AppData/Local'
          $env:TEMP = Join-Path $qa 'temp'
          $env:TMP = $env:TEMP
          $env:TMPDIR = $env:TEMP
          $env:IWXA_STORAGE_AUTHORITY = Join-Path $env:LOCALAPPDATA 'IWXA/storage-authority.json'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Agent05QAClose {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h,uint m,IntPtr w,IntPtr l);
          }
          '@
          function Start-AgentNative {
            $p = Start-Process -FilePath $exe -ArgumentList @('--port','18789') -PassThru
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Milliseconds 500
              $p.Refresh()
              if ($p.HasExited) { throw 'AGENT05_GGUF_NATIVE_PROCESS_EXITED' }
              if ($p.MainWindowHandle -ne [IntPtr]::Zero) { return $p }
            }
            throw 'AGENT05_GGUF_NATIVE_WINDOW_MISSING'
          }
          function Wait-AgentCore {
            for ($i=0; $i -lt 100; $i++) {
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:18789/desktop/' -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            throw 'AGENT05_GGUF_NATIVE_CORE_NOT_READY'
          }
          function Stop-AgentNative([System.Diagnostics.Process]$p) {
            if ($null -eq $p) { return }
            $p.Refresh()
            if ($p.HasExited) { return }
            if ($p.MainWindowHandle -ne [IntPtr]::Zero) {
              [void][Agent05QAClose]::PostMessage($p.MainWindowHandle,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)
            }
            if (-not $p.WaitForExit(45000)) { throw 'AGENT05_GGUF_NATIVE_CLOSE_TIMEOUT' }
          }
          $p = $null
          $proof = Join-Path $logs 'agent05-real-qwen-proof.json'
          $executionLog = Join-Path $logs 'agent05-real-qwen-execute.log'
          $readbackLog = Join-Path $logs 'agent05-real-qwen-readback.log'
          $failCode = Join-Path $logs 'agent05-real-qwen-failure-code.txt'
          $operationCode = Join-Path $logs 'agent05-real-qwen-last-operation.txt'
          try {
            $p = Start-AgentNative
            Wait-AgentCore
            & python -B tools/qualify_setup_core_real_qwen.py --install-root $install --port 18789 --proof $proof --phase execute --failure-code-path $failCode --last-operation-path $operationCode *> $executionLog
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $proof -PathType Leaf)) {
              $code = 'UNKNOWN'
              if (Test-Path -LiteralPath $failCode -PathType Leaf) {
                $candidate = (Get-Content -LiteralPath $failCode -Raw).Trim()
                $allowedCodes = @(
                  'PROOF_EXISTS','DOWNLOAD_MODE','CORE_NOT_READY','PREFS_READBACK',
                  'PREFS_NOT_CONFIRMED','RUNTIME_PLAN','MODEL_PLAN','MODEL_DOWNLOAD',
                  'MODEL_NOT_READY','INFERENCE','TASK_SUBMIT','TASK_STOPPED',
                  'TASK_TIMEOUT','RESULT_READBACK','REVIEW_READBACK','EXCHANGE_EXPORT',
                  'MODEL_PROCESS_FAILED','MODEL_FINAL_OUTPUT_UNAVAILABLE',
                  'MODEL_TIMED_OUT','MODEL_ALREADY_BUSY','MODEL_EFFORT_INVALID',
                  'MODEL_START_FAILED','MODEL_TOKEN_LIMIT_INVALID','MODEL_BINARY_CHANGED',
                  'MODEL_PROMPT_INVALID','OTHER','OTHER_RUNTIME','OTHER_HTTP',
                  'OTHER_NETWORK','OTHER_TIMEOUT','OTHER_VALUE','OTHER_KEY',
                  'OTHER_TYPE','OTHER_OS','HTTP_400','HTTP_401','HTTP_403',
                  'HTTP_404','HTTP_409','HTTP_422','HTTP_429','HTTP_500',
                  'HTTP_502','HTTP_503','HTTP_504'
                )
                if ($candidate -in $allowedCodes) { $code = $candidate }
              }
              Write-Host ('AGENT05_INSTALLED_GGUF_FAILURE_CODE=' + $code)
              throw 'AGENT05_INSTALLED_GGUF_TASK_REVIEW_FAILED'
            }
            if (-not (Select-String -LiteralPath $executionLog -Pattern 'AGENT_INSTALLED_REAL_QWEN_TASK_REVIEW_PASS' -SimpleMatch -Quiet)) {
              throw 'AGENT05_INSTALLED_GGUF_RESULT_PROOF_MISSING'
            }
            Write-Host 'AGENT05_INSTALLED_REAL_GGUF_TASK_REVIEW_PASS'
            $graphProof = Join-Path $logs 'agent05-real-gguf-graph-proof.json'
            $graphExecuteLog = Join-Path $logs 'agent05-real-gguf-graph-execute.log'
            Remove-Item -LiteralPath $failCode -Force -ErrorAction SilentlyContinue
            & python -B tools/qualify_setup_core_real_qwen.py --install-root $install --port 18789 --proof $proof --graph-proof $graphProof --phase graph-execute --failure-code-path $failCode *> $graphExecuteLog
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $graphProof -PathType Leaf)) {
              $category = 'UNKNOWN'
              if (Test-Path -LiteralPath $failCode -PathType Leaf) {
                $candidate = (Get-Content -LiteralPath $failCode -Raw).Trim()
                if ($candidate -match '^GRAPH_[A-Z_]+$') { $category = $candidate }
              }
              Write-Host ('AGENT05_INSTALLED_GGUF_GRAPH_FAILURE_CODE=' + $category)
              throw 'AGENT05_INSTALLED_GGUF_GRAPH_EXECUTION_FAILED'
            }
            if (-not (Select-String -LiteralPath $graphExecuteLog -Pattern 'AGENT_INSTALLED_REAL_GGUF_GRAPH_EXECUTION_REVIEW_PASS' -SimpleMatch -Quiet)) {
              throw 'AGENT05_INSTALLED_GGUF_GRAPH_EXECUTION_PROOF_MISSING'
            }
            Write-Host 'AGENT05_INSTALLED_REAL_GGUF_GRAPH_EXECUTION_REVIEW_PASS'
            Stop-AgentNative $p
            $p = $null
            $p = Start-AgentNative
            Wait-AgentCore
            & python -B tools/qualify_setup_core_real_qwen.py --install-root $install --port 18789 --proof $proof --phase readback *> $readbackLog
            if ($LASTEXITCODE -ne 0 -or
                -not (Select-String -LiteralPath $readbackLog -Pattern 'AGENT_INSTALLED_REAL_QWEN_RESULT_RESTART_PASS' -SimpleMatch -Quiet) -or
                -not (Select-String -LiteralPath $readbackLog -Pattern 'AGENT_INSTALLED_REAL_QWEN_INDEPENDENT_IMPORT_PASS' -SimpleMatch -Quiet)) {
              throw 'AGENT05_INSTALLED_GGUF_COLD_READBACK_FAILED'
            }
            Write-Host 'AGENT05_INSTALLED_REAL_GGUF_COLD_IMPORT_PASS'
            $graphReadbackLog = Join-Path $logs 'agent05-real-gguf-graph-readback.log'
            Remove-Item -LiteralPath $failCode -Force -ErrorAction SilentlyContinue
            & python -B tools/qualify_setup_core_real_qwen.py --install-root $install --port 18789 --proof $proof --graph-proof $graphProof --phase graph-readback --failure-code-path $failCode *> $graphReadbackLog
            if ($LASTEXITCODE -ne 0 -or
                -not (Select-String -LiteralPath $graphReadbackLog -Pattern 'AGENT_INSTALLED_REAL_GGUF_GRAPH_COLD_READBACK_PASS' -SimpleMatch -Quiet)) {
              $category = 'UNKNOWN'
              if (Test-Path -LiteralPath $failCode -PathType Leaf) {
                $candidate = (Get-Content -LiteralPath $failCode -Raw).Trim()
                if ($candidate -match '^GRAPH_[A-Z_]+$') { $category = $candidate }
              }
              Write-Host ('AGENT05_INSTALLED_GGUF_GRAPH_COLD_FAILURE_CODE=' + $category)
              throw 'AGENT05_INSTALLED_GGUF_GRAPH_COLD_READBACK_FAILED'
            }
            Write-Host 'AGENT05_INSTALLED_REAL_GGUF_GRAPH_COLD_READBACK_PASS'
            $saved = Get-Content -LiteralPath $proof -Raw | ConvertFrom-Json
            $guiReceipt = Join-Path $logs 'agent05-native-gui-result.json'
            $guiLog = Join-Path $logs 'agent05-native-gui-result.log'
            & pwsh -NoProfile -NonInteractive -File tools/qualify_setup_core_native_gui.ps1 -WindowProcessId $p.Id -Mode result -TaskId ([string]$saved.task_id) -ExpectedTitleSha256 ([string]$saved.task_title_sha256) -ReceiptPath $guiReceipt *> $guiLog
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $guiReceipt -PathType Leaf)) {
              throw 'AGENT05_INSTALLED_GGUF_GUI_RESULT_FAILED'
            }
            $view = Get-Content -LiteralPath $guiReceipt -Raw | ConvertFrom-Json
            if ($view.status -cne 'PASS' -or $view.input -cne 'NATIVE_WINDOWS_UI_AUTOMATION' -or
                $view.source_task_selected -ne $true -or $view.title_digest_matched -ne $true -or
                $view.accepted_result_visible -ne $true) {
              throw 'AGENT05_INSTALLED_GGUF_GUI_RESULT_READBACK_INVALID'
            }
            Write-Host 'AGENT05_INSTALLED_REAL_GGUF_GUI_RESULT_PASS'
            # Verify the FULL saved Graph Result through the user's normal
            # Chains page, not a direct API-only readback.
            $graphSaved = Get-Content -LiteralPath $graphProof -Raw | ConvertFrom-Json
            $graphGuiReceipt = Join-Path $logs 'agent05-native-graph-gui-result.json'
            $graphGuiLog = Join-Path $logs 'agent05-native-graph-gui-result.log'
            & pwsh -NoProfile -NonInteractive -File tools/qualify_setup_core_native_gui.ps1 -WindowProcessId $p.Id -Mode graph-result -GraphId ([string]$graphSaved.graph_id) -ExpectedSha256 ([string]$graphSaved.result_sha256) -ReceiptPath $graphGuiReceipt *> $graphGuiLog
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $graphGuiReceipt -PathType Leaf)) {
              throw 'AGENT05_INSTALLED_GGUF_GRAPH_GUI_NOT_ACCEPTED'
            }
            $graphGui = Get-Content -LiteralPath $graphGuiReceipt -Raw | ConvertFrom-Json
            if ($graphGui.status -cne 'PASS' -or
                $graphGui.input -cne 'NATIVE_WINDOWS_UI_AUTOMATION' -or
                $graphGui.workflow_selected -ne $true -or
                $graphGui.full_saved_result_visible -ne $true -or
                $graphGui.result_digest_matched -ne $true -or
                $graphGui.read_only -ne $true) {
              throw 'AGENT05_INSTALLED_GGUF_GRAPH_GUI_RECEIPT_INVALID'
            }
            Write-Host 'AGENT05_INSTALLED_REAL_GGUF_GRAPH_GUI_FULL_RESULT_PASS'
            # The accepted UI Task has no linked Goal yet. Verify its full Result
            # reaches a fresh Graph draft before the in-process K02/K04 check.
            $k02GuiReceipt = Join-Path $logs 'agent05-native-k02-graph-preview.json'
            $k02GuiLog = Join-Path $logs 'agent05-native-k02-graph-preview.log'
            $k02GuiFailure = Join-Path $logs 'agent05-native-k02-graph-failure-stage.txt'
            $k02GuiFailureReason = Join-Path $logs 'agent05-native-k02-graph-failure-reason.txt'
            & pwsh -NoProfile -NonInteractive -File tools/qualify_setup_core_native_gui.ps1 -WindowProcessId $p.Id -Mode graph-k02 -TaskId ([string]$saved.task_id) -ExpectedTitleSha256 ([string]$saved.task_title_sha256) -ExpectedModelName ([string]$graphSaved.model_name) -ExpectedResultSha256 ([string]$saved.summary_sha256) -ReceiptPath $k02GuiReceipt -FailureStagePath $k02GuiFailure -FailureReasonPath $k02GuiFailureReason *> $k02GuiLog
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $k02GuiReceipt -PathType Leaf)) {
              $stage = 'UNKNOWN'
              if (Test-Path -LiteralPath $k02GuiFailure -PathType Leaf) {
                $candidate = (Get-Content -LiteralPath $k02GuiFailure -Raw).Trim()
                if ($candidate -in @('NOT_STARTED','TASK_NAVIGATION','TASK_SELECTION','RESULT_HANDOFF','RESULT_HANDOFF_READBACK','DETAILS_PANEL','MODEL_CHECK_BUTTON','PREVIEW_READBACK','RECEIPT_WRITE')) {
                  $stage = $candidate
                }
              }
              Write-Host ('AGENT05_K02_GUI_FAILURE_STAGE=' + $stage)
              $reason = 'UNKNOWN'
              if (Test-Path -LiteralPath $k02GuiFailureReason -PathType Leaf) {
                $candidate = (Get-Content -LiteralPath $k02GuiFailureReason -Raw).Trim()
                if ($candidate -in @(
                  'PREVIEW_LABEL_MODEL_MISSING','PREVIEW_NOT_RENDERED',
                  'TASK_NOT_ACCEPTED','SKILL_UNAVAILABLE','BINDING_UNAVAILABLE',
                  'BINDING_CHANGED','MODEL_OBSERVATION_MISSING','MODEL_NOT_ACTIVE',
                  'MODEL_SOURCE_NOT_READY','MODEL_PIN_INVALID','MODEL_SELECTION_CHANGED',
                  'PREVIEW_SCOPE_CHANGED','K02_UNSUPPORTED','K04_UNSUPPORTED',
                  'OWNER_PLANS_DISAGREE'
                )) { $reason = $candidate }
              }
              Write-Host ('AGENT05_K02_GUI_FAILURE_REASON=' + $reason)
              throw 'AGENT05_INSTALLED_K02_K04_GUI_NOT_ACCEPTED'
            }
            $k02View = Get-Content -LiteralPath $k02GuiReceipt -Raw | ConvertFrom-Json
            if ($k02View.status -cne 'PASS' -or
                $k02View.input -cne 'NATIVE_WINDOWS_UI_AUTOMATION' -or
                $k02View.accepted_task_selected -ne $true -or
                $k02View.accepted_result_handoff_opened -ne $true -or
                $k02View.accepted_result_input_sha256_matched -ne $true -or
                $k02View.k02_k04_check_button_invoked -ne $true -or
                $k02View.selected_model_visible -ne $true -or
                $k02View.preview_only -ne $true) {
              throw 'AGENT05_INSTALLED_K02_K04_GUI_RECEIPT_INVALID'
            }
            Write-Host 'AGENT05_INSTALLED_K02_K04_INPROCESS_GUI_PREVIEW_PASS'
          } finally {
            if ($null -ne $p) {
              try { Stop-AgentNative $p } catch {
                Write-Host 'AGENT05_GGUF_NATIVE_CLOSE_NOT_CONFIRMED'
                # Only the process created by this QA step can be stopped.
                try { Stop-Process -Id $p.Id -Force -ErrorAction Stop } catch {}
              }
            }
          }
