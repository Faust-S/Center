# Authorized exact qualification. No private source or raw logs uploaded.
name: Original QGIS Windows installation and professional runtime qualification
on:
  push:
    branches: ['ci/once/workflow-professional-ortools/**']
    paths: ['.github/ci-requests/workflow-professional-ortools.json']
permissions:
  contents: read
concurrency:
  group: original-professional-qgis-and-runtime
  cancel-in-progress: false
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            profile: optional-programs
          - os: windows-latest
            profile: qgis-native
          - os: ubuntu-24.04
            profile: linux-regression
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.profile }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require authorized private read-only checkout
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo PROFESSIONAL_SOURCE_ACCESS_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        id: professional_source
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 7073a902c5622c26597ac1b05537570ad3422888
          path: professional-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Exact private qualification dependencies
        run: |
          test "$(git -C professional-agent rev-parse HEAD)" = "7073a902c5622c26597ac1b05537570ad3422888"
          python -m pip install -r professional-agent/requirements-ci.txt ortools==9.14.6206 mesa==3.5.2 simpy==4.1.2 > "$RUNNER_TEMP/professional-deps-private.log" 2>&1 || { echo PROFESSIONAL_DEPENDENCIES_FAIL; exit 1; }
      - name: Original desktop TypeScript and Vite
        if: matrix.profile == 'optional-programs'
        working-directory: professional-agent/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/professional-npm-private.log" 2>&1 || { echo PROFESSIONAL_NPM_FAIL; exit 1; }
          npm run build:core > "$RUNNER_TEMP/professional-build-private.log" 2>&1 || { node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const m of s.matchAll(/(?:error )?(TS[0-9]{4})/g))console.log("DESKTOP_BUILD_CODE="+m[1]);' "$RUNNER_TEMP/professional-build-private.log"; echo PROFESSIONAL_DESKTOP_BUILD_FAIL; exit 1; }
          echo PROFESSIONAL_DESKTOP_BUILD_PASS
      - name: Professional install and QGIS contracts
        if: always() && steps.professional_source.outcome == 'success' && matrix.profile != 'qgis-native'
        working-directory: professional-agent
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_professional_install.py tests/test_agent067_modeling_executable.py tests/test_existing_software_discovery.py tests/test_programs_center_task_use.py tests/test_agent067_qgis_points.py -k 'not native_windows and not native_core' --junitxml="$RUNNER_TEMP/professional-contract.xml" > "$RUNNER_TEMP/professional-contract-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-contract.xml" PROFESSIONAL_CONTRACT 65 strict || exit 1
          test "$rc" = 0
      - name: Install original five engines on normal user software paths
        if: always() && steps.professional_source.outcome == 'success' && matrix.profile == 'optional-programs'
        working-directory: professional-agent
        env:
          IWXA_PROFESSIONAL_NATIVE_INSTALL: '1'
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_professional_install.py -k native_windows_managed_install_and_cold_u01 --basetemp="$RUNNER_TEMP/iwxaprof" --junitxml="$RUNNER_TEMP/professional-native.xml" > "$RUNNER_TEMP/professional-native-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-native.xml" PROFESSIONAL_NATIVE 5 strict || exit 1
          test "$rc" = 0
      - name: Original previously failing engines on nested test profile path
        if: always() && steps.professional_source.outcome == 'success' && matrix.profile == 'optional-programs'
        working-directory: professional-agent
        env:
          IWXA_PROFESSIONAL_NATIVE_INSTALL: '1'
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_professional_install.py -k 'native_windows_managed_install_and_cold_u01 and (ORTOOLS_ALLOCATION_V1 or VALHALLA_ROUTING_V1)' --junitxml="$RUNNER_TEMP/professional-nested.xml" > "$RUNNER_TEMP/professional-nested-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-nested.xml" PROFESSIONAL_NESTED 2 strict || exit 1
          test "$rc" = 0
      - name: Original QGIS 3.34.4 MSI managed extraction, connection and approved Task
        if: matrix.profile == 'qgis-native'
        working-directory: professional-agent
        env:
          IWXA_PROFESSIONAL_NATIVE_QGIS: '1'
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_professional_install.py -k native_windows_qgis_install_and_core --basetemp="$RUNNER_TEMP/iwxaq" --junitxml="$RUNNER_TEMP/professional-qgis-native.xml" > "$RUNNER_TEMP/professional-qgis-native-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-qgis-native.xml" QGIS_WINDOWS_NATIVE 1 strict || exit 1
          test "$rc" = 0
      - name: Original system QGIS exact Linux runtime
        if: matrix.profile == 'linux-regression'
        run: |
          sudo apt-get update -qq > "$RUNNER_TEMP/professional-qgis-apt-private.log" 2>&1
          sudo apt-get install -y --no-install-recommends python3-qgis qgis-providers qgis-common >> "$RUNNER_TEMP/professional-qgis-apt-private.log" 2>&1
          env -u LD_LIBRARY_PATH /usr/bin/python3 -I -c "from qgis.core import Qgis; assert Qgis.QGIS_VERSION_INT==33404; print('ORIGINAL_QGIS_3_34_4_PRESENT')"
      - name: Original native Linux QGIS approved Task and cold readback
        if: matrix.profile == 'linux-regression'
        working-directory: professional-agent
        run: |
          rc=0
          export IWXA_QGIS_PYTHON=/usr/bin/python3
          unset LD_LIBRARY_PATH
          python -m pytest -q tests/test_agent067_qgis_points.py --junitxml="$RUNNER_TEMP/professional-qgis-linux.xml" > "$RUNNER_TEMP/professional-qgis-linux-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-qgis-linux.xml" QGIS_LINUX_NATIVE 23 strict || exit 1
          test "$rc" = 0
      - name: Existing program and modeling regression
        if: always() && steps.professional_source.outcome == 'success' && matrix.profile == 'linux-regression'
        working-directory: professional-agent
        run: |
          rc=0
          python -m pytest -q tests/test_public_program_composition.py tests/test_agent065_modeling_experiment.py tests/test_agent065_modeling_cold_readback.py tests/test_agent065_modeling_result_artifacts.py tests/test_agent065_modeling_large_results.py --junitxml="$RUNNER_TEMP/professional-regression.xml" > "$RUNNER_TEMP/professional-regression-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-regression.xml" PROGRAM_REGRESSION 95 strict || exit 1
          test "$rc" = 0
      - name: Remove private source and diagnostics
        if: always()
        run: |
          rm -rf professional-agent
          rm -f "$RUNNER_TEMP"/professional-*.xml "$RUNNER_TEMP"/professional-*-private.log
