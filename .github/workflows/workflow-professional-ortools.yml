name: Workspace original alternative lifecycle
on:
  push:
    branches: ['ci/once/workflow-professional-ortools/**']
    paths: ['.github/ci-requests/workflow-professional-ortools.json']
permissions:
  contents: read
concurrency:
  group: original-workspace-alternative-lifecycle
  cancel-in-progress: false
jobs:
  workspace-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: c1c074104abd661081bdb8a20f5f78d24a6ea6ca
          path: workspace-source
          persist-credentials: false
      - name: Original alternative creation recovery and trusted Host regressions
        working-directory: workspace-source/packages/t3-core
        run: |
          test "$(git rev-parse HEAD)" = "c1c074104abd661081bdb8a20f5f78d24a6ea6ca"
          node --test tests/c3-workspace-method-comparison.test.mjs tests/c3-workspace-method-stage-results.test.mjs tests/c3-workspace-method-source-lifecycle.test.mjs tests/c3-workspace-method-revision-apply.test.mjs
      - name: Locked Workspace dependencies
        working-directory: workspace-source/packages/t3-core
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original Workspace TypeScript
        working-directory: workspace-source/packages/t3-core
        run: npm run typecheck
      - name: Original Workspace presentation tests
        working-directory: workspace-source/packages/t3-core
        run: npm run test:product:workspace -- tests/rich-workspace-read-model.dom.test.tsx
