name: Original QGIS dependent Valhalla Workflow Work
on:
  push:
    branches: ['ci/once/workflow-professional-ortools/**']
    paths: ['.github/ci-requests/workflow-professional-ortools.json']
permissions:
  contents: read
concurrency:
  group: original-qgis-valhalla-workflow-dependency
  cancel-in-progress: false
jobs:
  workspace-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: cdaa57644fc60e294bf0c27ef30cb4685b0f56d5
          path: workspace-source
          persist-credentials: false
      - name: Exact original source and dependency reader
        working-directory: workspace-source/packages/t3-core
        run: |
          test "$(git rev-parse HEAD)" = "cdaa57644fc60e294bf0c27ef30cb4685b0f56d5"
          node --test tests/c3-workspace-method-stage-results.test.mjs
      - name: Workspace TypeScript
        working-directory: workspace-source/packages/t3-core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: cdaa57644fc60e294bf0c27ef30cb4685b0f56d5
          path: workspace-source
          persist-credentials: false
      - name: Require authorized private read-only checkout
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo PROFESSIONAL_SOURCE_ACCESS_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: b808bac49a5d354d26688581f58c02f7ead94662
          path: professional-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Exact native dependencies
        run: |
          test "$(git -C professional-agent rev-parse HEAD)" = "b808bac49a5d354d26688581f58c02f7ead94662"
          python -m pip install -r professional-agent/requirements-ci.txt ortools==9.14.6206 > "$RUNNER_TEMP/professional-deps-private.log" 2>&1 || { echo PROFESSIONAL_DEPENDENCIES_FAIL; exit 1; }
      - name: Focused dependency and existing QGIS handoff contracts
        working-directory: professional-agent
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_workflow_program_dependency.py tests/test_agent067_qgis_road_input.py --junitxml="$RUNNER_TEMP/professional-dependency.xml" > "$RUNNER_TEMP/professional-dependency-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-dependency.xml" WORKFLOW_DEPENDENCY 29 strict || exit 1
          test "$rc" = 0
      - name: Existing root Work native regression
        run: |
          rc=0
          python qualification/workflow-program-input.py professional-agent workspace-source > "$RUNNER_TEMP/professional-workflow-private.log" 2>&1 || rc=$?
          python -c 'import re,sys; from pathlib import Path; t=Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace"); print("\n".join(re.findall(r"^WORKFLOW_[A-Z_]+_PASS$",t,re.M))); print("\n".join(sorted(set(re.findall(r"(?:AssertionError|ValueError|KeyError|AttributeError|WitnessError|InteractionSurfaceError|CalledProcessError): (?:[A-Z_]+|[a-z_]+)",t)))))' "$RUNNER_TEMP/professional-workflow-private.log"
          test "$rc" = 0
      - name: Remove private source and diagnostics
        if: always()
        run: |
          rm -rf professional-agent
          rm -f "$RUNNER_TEMP"/professional-*.xml "$RUNNER_TEMP"/professional-*-private.log
  public-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - name: Build public controlled OSM map
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          mkdir public-map
          python3 -c 'import sys;from pathlib import Path;sys.path.insert(0,"qualification/professional-geospatial");from topology_fixture import write;write(Path("public-map/map.osm"))'
          osmium cat public-map/map.osm -o public-map/map.osm.pbf
          (cd public-map && sha256sum map.osm.pbf > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: public-controlled-map
          path: |
            public-map/map.osm.pbf
            public-map/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
  native-dependent:
    needs: [workspace-source,native-source,public-map]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/download-artifact@v4
        with:
          name: public-controlled-map
          path: public-map
      - run: (cd public-map && sha256sum -c SHA256SUMS)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: cdaa57644fc60e294bf0c27ef30cb4685b0f56d5
          path: workspace-source
          persist-credentials: false
      - name: Require authorized private read-only checkout
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo PROFESSIONAL_SOURCE_ACCESS_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: b808bac49a5d354d26688581f58c02f7ead94662
          path: professional-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Exact native dependencies
        run: |
          test "$(git -C professional-agent rev-parse HEAD)" = "b808bac49a5d354d26688581f58c02f7ead94662"
          test "$(git -C workspace-source rev-parse HEAD)" = "cdaa57644fc60e294bf0c27ef30cb4685b0f56d5"
          python -m pip install -r professional-agent/requirements-ci.txt > "$RUNNER_TEMP/professional-deps-private.log" 2>&1 || { echo PROFESSIONAL_DEPENDENCIES_FAIL; exit 1; }
      - name: Actual original QGIS and dependent Valhalla Work execution and cold readback
        run: |
          rc=0
          python qualification/workflow-program-dependency.py professional-agent workspace-source public-map/map.osm.pbf > "$RUNNER_TEMP/professional-workflow-private.log" 2>&1 || rc=$?
          python -c 'import re,sys; from pathlib import Path; t=Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace"); print("\n".join(re.findall(r"^WORKFLOW_[A-Z_]+_PASS$",t,re.M))); print("\n".join(sorted(set(re.findall(r"(?:AssertionError|ValueError|KeyError|AttributeError|WitnessError|InteractionSurfaceError|CalledProcessError): (?:[A-Z_]+|[a-z_]+)",t)))))' "$RUNNER_TEMP/professional-workflow-private.log"
          test "$rc" = 0
      - name: Remove private source and diagnostics
        if: always()
        run: |
          rm -rf professional-agent
          rm -f "$RUNNER_TEMP"/professional-*-private.log
