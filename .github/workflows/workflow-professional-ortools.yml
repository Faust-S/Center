name: Workspace saved alternative panel
on:
  push:
    branches: ['ci/once/workflow-professional-ortools/**']
    paths: ['.github/ci-requests/workflow-professional-ortools.json']
permissions:
  contents: read
concurrency:
  group: original-workspace-saved-alternative-panel
  cancel-in-progress: false
jobs:
  workspace-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: bc4b6b2e5dba6de350d9fd07623736d9d6ab66a9
          path: workspace-source
          persist-credentials: false
      - name: Locked Workspace dependencies
        working-directory: workspace-source/packages/t3-core
        run: |
          test "$(git rev-parse HEAD)" = "bc4b6b2e5dba6de350d9fd07623736d9d6ab66a9"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Original Workspace TypeScript
        working-directory: workspace-source/packages/t3-core
        run: npm run typecheck
      - name: Original Workspace saved-alternative presentation tests
        working-directory: workspace-source/packages/t3-core
        run: npm run test:product:workspace -- tests/rich-workspace-read-model.dom.test.tsx
