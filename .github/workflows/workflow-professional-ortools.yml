# Deliberate exact qualification. Only the synthetic public map is uploaded.
name: Original professional Windows managed programs
on:
  push:
    branches: ['ci/once/workflow-professional-ortools/**']
    paths: ['.github/ci-requests/workflow-professional-ortools.json']
permissions:
  contents: read
concurrency:
  group: original-professional-windows-managed-road
  cancel-in-progress: false
jobs:
  public-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - name: Build only the public controlled OSM fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          mkdir public-map
          python3 -c 'import sys;from pathlib import Path;sys.path.insert(0,"qualification/professional-geospatial");from topology_fixture import write;write(Path("public-map/map.osm"))'
          osmium cat public-map/map.osm -o public-map/map.osm.pbf
          (cd public-map && sha256sum map.osm.pbf > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: public-controlled-map
          path: |
            public-map/map.osm.pbf
            public-map/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
  windows-managed:
    needs: public-map
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/download-artifact@v4
        with:
          name: public-controlled-map
          path: public-map
      - run: (cd public-map && sha256sum -c SHA256SUMS)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require authorized private read-only checkout
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo PROFESSIONAL_SOURCE_ACCESS_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        id: professional_source
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 9dc4128749b1102267000264508046fadbd70d8a
          path: professional-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Exact qualification dependencies
        run: |
          test "$(git -C professional-agent rev-parse HEAD)" = "9dc4128749b1102267000264508046fadbd70d8a"
          python -m pip install -r professional-agent/requirements-ci.txt ortools==9.14.6206 mesa==3.5.2 simpy==4.1.2 > "$RUNNER_TEMP/professional-deps-private.log" 2>&1 || { echo PROFESSIONAL_DEPENDENCIES_FAIL; exit 1; }
      - name: Managed install contracts and discovery
        working-directory: professional-agent
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_professional_install.py tests/test_agent067_modeling_executable.py -k 'not native_windows' --junitxml="$RUNNER_TEMP/professional-contract.xml" > "$RUNNER_TEMP/professional-contract-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-contract.xml" MANAGED_CONTRACT 24 strict || exit 1
          test "$rc" = 0
      - name: Actual original managed Windows Valhalla and OR-Tools task and cold readback
        if: always() && steps.professional_source.outcome == 'success'
        working-directory: professional-agent
        run: |
          rc=0
          export IWXA_PROFESSIONAL_NATIVE_ROAD=1
          export IWXA_PUBLIC_VALHALLA_PBF="$(cd ../public-map && pwd -W)/map.osm.pbf"
          python -m pytest -q tests/test_agent067_professional_install.py -k native_windows_managed_valhalla_to_ortools_task --basetemp="$RUNNER_TEMP/iwxaroad" --junitxml="$RUNNER_TEMP/professional-road.xml" > "$RUNNER_TEMP/professional-road-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-road.xml" MANAGED_NATIVE_ROAD 1 strict || exit 1
          test "$rc" = 0
      - name: Remove private source and diagnostics
        if: always()
        run: |
          rm -rf professional-agent
          rm -f "$RUNNER_TEMP"/professional-*.xml "$RUNNER_TEMP"/professional-*-private.log
