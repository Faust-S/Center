name: Workspace saved alternative exact archive restoration
on:
  push:
    branches: ['ci/once/workflow-professional-ortools/**']
    paths: ['.github/ci-requests/workflow-professional-ortools.json']
permissions:
  contents: read
concurrency:
  group: original-workspace-saved-alternative-restore
  cancel-in-progress: false
jobs:
  trusted-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: c2102a1d214da9190b50685d84c10c93cc02ed48
          path: workspace-source
          persist-credentials: false
      - name: Original source owner and trusted saved target regressions
        working-directory: workspace-source/packages/t3-core
        run: |
          test "$(git rev-parse HEAD)" = "c2102a1d214da9190b50685d84c10c93cc02ed48"
          node --test tests/c3-workspace-method-stage-results.test.mjs tests/c3-workspace-method-comparison.test.mjs
      - name: Locked Workspace dependencies
        working-directory: workspace-source/packages/t3-core
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original Workspace TypeScript
        working-directory: workspace-source/packages/t3-core
        run: npm run typecheck
  exact-k036-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: c2102a1d214da9190b50685d84c10c93cc02ed48
          path: workspace-source
          persist-credentials: false
      - name: Install original locked Kernel test dependencies
        working-directory: workspace-source/packages/t3-core
        run: npm ci --prefix qualified-runtime-source/k036-atomic-graph --ignore-scripts --no-audit --no-fund
      - name: Original K036 exact archive and original owner restoration
        working-directory: workspace-source/packages/t3-core
        run: |
          test "$(git rev-parse HEAD)" = "c2102a1d214da9190b50685d84c10c93cc02ed48"
          node scripts/probe-k036-c3-mapping.mjs "$RUNNER_TEMP/k036-c3-mapping.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k036-saved-alternative-restore
          path: ${{ runner.temp }}/k036-c3-mapping.json
          if-no-files-found: warn
