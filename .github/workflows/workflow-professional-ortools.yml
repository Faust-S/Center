# Exact one-shot corrective qualification. Public vendor probe is separate from protected source.
name: Professional native Windows corrective qualification
on:
  push:
    branches: ['ci/once/workflow-professional-ortools/**']
    paths: ['.github/ci-requests/workflow-professional-ortools.json']
permissions:
  contents: read
concurrency:
  group: original-professional-corrective-native
  cancel-in-progress: false
jobs:
  public-upstream:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose original public vendor binaries in exact embedded CPython
        run: python qualification/professional-geospatial/probe-public-windows-wheels.py
  qgis-release-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - name: Retrieve public archived QGIS checksum
        run: |
          python - <<'PY'
          import urllib.request,re
          url='https://ftp2.osuosl.org/pub/osgeo/download/qgis/windows/QGIS-OSGeo4W-3.34.4-1.sha256sum'
          with urllib.request.urlopen(url,timeout=45) as r: raw=r.read(512).decode('ascii').strip()
          m=re.fullmatch(r'([a-fA-F0-9]{64})\s+\*?QGIS-OSGeo4W-3\.34\.4-1\.msi',raw)
          assert m,repr(raw)
          print('QGIS_ORIGINAL_ARCHIVE_SHA256='+m[1].lower())
          PY
  product:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node qualification/validate-professional-ortools-request.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require authorized private read-only checkout
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo PROFESSIONAL_SOURCE_ACCESS_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        id: professional_source
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: b7f89810b91799f61ccde6f360578c6d40660c71
          path: professional-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Install test dependencies
        run: |
          test "$(git -C professional-agent rev-parse HEAD)" = "b7f89810b91799f61ccde6f360578c6d40660c71"
          python -m pip install -r professional-agent/requirements-ci.txt > "$RUNNER_TEMP/professional-deps-private.log" 2>&1 || { echo PROFESSIONAL_DEPENDENCIES_FAIL; exit 1; }
      - name: Original desktop TypeScript and Vite
        working-directory: professional-agent/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/professional-npm-private.log" 2>&1 || { echo PROFESSIONAL_NPM_FAIL; exit 1; }
          npm run build:core > "$RUNNER_TEMP/professional-build-private.log" 2>&1 || { node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync(process.argv[1],"utf8");for(const m of s.matchAll(/(?:^|\n)(?:.*[\\/])?(programs-center|public-programs-control|deferred-screens)\.tsx\((\d+),(\d+)\): error (TS[0-9]{4})/g))console.log("DESKTOP_BUILD_POSITION="+m[1]+":"+m[2]+":"+m[3]+":"+m[4]);for(const m of s.matchAll(/(?:error )?(TS[0-9]{4})/g))console.log("DESKTOP_BUILD_CODE="+m[1]);' "$RUNNER_TEMP/professional-build-private.log"; echo PROFESSIONAL_DESKTOP_BUILD_FAIL; exit 1; }
          echo PROFESSIONAL_DESKTOP_BUILD_PASS
      - name: Managed install contracts and discovery
        if: always() && steps.professional_source.outcome == 'success'
        working-directory: professional-agent
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_professional_install.py tests/test_agent067_modeling_executable.py tests/test_existing_software_discovery.py tests/test_programs_center_task_use.py -k 'not native_windows' --junitxml="$RUNNER_TEMP/professional-contract.xml" > "$RUNNER_TEMP/professional-contract-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-contract.xml" MANAGED_CONTRACT 55 strict || exit 1
          test "$rc" = 0
      - name: Actual five original managed Windows programs and cold U01
        if: always() && steps.professional_source.outcome == 'success'
        working-directory: professional-agent
        env:
          IWXA_PROFESSIONAL_NATIVE_INSTALL: '1'
        run: |
          rc=0
          python -m pytest -q tests/test_agent067_professional_install.py -k native_windows_managed_install_and_cold_u01 --junitxml="$RUNNER_TEMP/professional-native.xml" > "$RUNNER_TEMP/professional-native-private.log" 2>&1 || rc=$?
          python ../qualification/professional-test-summary.py "$RUNNER_TEMP/professional-native.xml" MANAGED_NATIVE 5 strict || exit 1
          test "$rc" = 0
      - name: Remove private source and diagnostics
        if: always()
        run: |
          rm -rf professional-agent
          rm -f "$RUNNER_TEMP"/professional-*.xml "$RUNNER_TEMP"/professional-*-private.log
