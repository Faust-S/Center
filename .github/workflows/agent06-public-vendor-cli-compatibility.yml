name: IWXA Agent 0.6 official public CLI compatibility
on:
  push:
    branches: ['work/2026-11-15-agent06-vendor-flags-acceptance']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-public-vendor-cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vendor-public-cli-probe:
    # Officially published programs only. This separate, public-only job
    # does not checkout private Agent, copy account tokens, or run mock LLMs.
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install official Codex CLI in temporary Windows test prefix
        shell: pwsh
        run: |
          $prefix=Join-Path $env:RUNNER_TEMP 'official-openai-codex'
          $log=Join-Path $env:RUNNER_TEMP 'official-codex-install.private.log'
          & npm.cmd install -g --prefix $prefix @openai/codex --no-audit --no-fund *> $log
          if($LASTEXITCODE -ne 0){throw 'PUBLIC_CLI_CODEX_INSTALL_BLOCKED'}
          $exe=Join-Path $prefix 'codex.cmd'
          if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw 'PUBLIC_CLI_CODEX_BINARY_MISSING'}
          & $exe --version *> $log
          if($LASTEXITCODE -ne 0){throw 'PUBLIC_CLI_CODEX_VERSION_FAIL'}
          Write-Host 'PUBLIC_CLI_CODEX_OFFICIAL_BINARY_PASS'
          & $exe exec --help *> $log
          if($LASTEXITCODE -ne 0){throw 'PUBLIC_CLI_CODEX_EXEC_HELP_FAILED'}
          $execHelp=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
          & $exe --help *> $log
          if($LASTEXITCODE -ne 0){throw 'PUBLIC_CLI_CODEX_GLOBAL_HELP_FAILED'}
          $globalHelp=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
          $missing=0
          foreach($flag in @('--ephemeral','--ignore-user-config','--ignore-rules',
              '--output-last-message','--output-schema','--json','--skip-git-repo-check')){
            if(-not ([string]$execHelp).Contains($flag)){
              Write-Host ('PUBLIC_CLI_CODEX_REQUIRED_FLAG_MISSING='+$flag)
              $missing++
            }
          }
          if(-not ([string]$globalHelp).Contains('--strict-config')){
            Write-Host 'PUBLIC_CLI_CODEX_REQUIRED_FLAG_MISSING=--strict-config'
            $missing++
          }
          if($missing -gt 0){throw 'PUBLIC_CLI_CODEX_ADAPTER_FLAGS_INCOMPATIBLE'}
          Write-Host 'PUBLIC_CLI_CODEX_ADAPTER_FLAGS_PASS'
          & $exe login status *> $log
          if($LASTEXITCODE -ne 0){
            Write-Host 'PUBLIC_CLI_CODEX_AUTH=NOT_LOGGED_IN'
          }else{
            # No authenticated profile is provisioned by this test job.
            # Do not print account identifiers or private status text.
            Write-Host 'PUBLIC_CLI_CODEX_AUTH=PROFILE_PRESENT'
          }
          exit 0
      - name: Install and inspect official Claude Code CLI
        if: always()
        shell: pwsh
        run: |
          $script=Join-Path $env:RUNNER_TEMP 'official-claude-install.ps1'
          $log=Join-Path $env:RUNNER_TEMP 'official-claude-install.private.log'
          try{
            Invoke-WebRequest -Uri 'https://claude.ai/install.ps1' -OutFile $script -UseBasicParsing
            & pwsh -NoProfile -NonInteractive -File $script *> $log
            if($LASTEXITCODE -ne 0){throw 'install'}
            $paths=@(
              (Join-Path $env:USERPROFILE '.local\bin\claude.exe'),
              (Join-Path $env:LOCALAPPDATA 'Programs\claude\claude.exe')
            )
            $bin=Get-Command claude.exe -ErrorAction SilentlyContinue
            $exe=if($null -ne $bin){$bin.Source}else{@($paths | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf})[0]}
            if([string]::IsNullOrWhiteSpace($exe)){throw 'missing'}
            & $exe --version *> $log
            if($LASTEXITCODE -ne 0){throw 'version'}
            Write-Host 'PUBLIC_CLI_CLAUDE_OFFICIAL_BINARY_PASS'
            & $exe --help *> $log
            if($LASTEXITCODE -ne 0){throw 'claude help failed'}
            $claudeHelp=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            $missing=0
            foreach($flag in @('--output-format','--permission-mode','--tools',
             '--safe-mode','--strict-mcp-config','--disallowedTools',
             '--disable-slash-commands','--no-session-persistence',
             '--no-chrome','--model','--json-schema')){
              if(-not ([string]$claudeHelp).Contains($flag)){
                Write-Host ('PUBLIC_CLI_CLAUDE_REQUIRED_FLAG_MISSING='+$flag)
                $missing++
              }
            }
            if($missing -gt 0){throw 'claude flags incompatible'}
            Write-Host 'PUBLIC_CLI_CLAUDE_ADAPTER_FLAGS_PASS'
            & $exe auth status *> $log
            if($LASTEXITCODE -ne 0){
              Write-Host 'PUBLIC_CLI_CLAUDE_AUTH=NOT_LOGGED_IN'
              # Some official Claude versions support --max-turns without
              # advertising it in --help. Probe the real binary parser only
              # when the test runner is explicitly unauthenticated. Never
              # treat this as real model inference or read user credentials.
              $psi=[System.Diagnostics.ProcessStartInfo]::new()
              $psi.FileName=$exe
              $psi.UseShellExecute=$false
              $psi.CreateNoWindow=$true
              $psi.RedirectStandardOutput=$true
              $psi.RedirectStandardError=$true
              $psi.WorkingDirectory=$env:RUNNER_TEMP
              foreach($part in @('-p','Return the word IWXA.', '--max-turns','1',
                '--permission-mode','plan','--tools','','--safe-mode',
                '--no-session-persistence')){
                [void]$psi.ArgumentList.Add($part)
              }
              $process=[System.Diagnostics.Process]::new()
              $process.StartInfo=$psi
              if(-not $process.Start()){throw 'claude parser probe start failed'}
              $outTask=$process.StandardOutput.ReadToEndAsync()
              $errTask=$process.StandardError.ReadToEndAsync()
              if(-not $process.WaitForExit(15000)){
                $process.Kill($true)
                [void]$process.WaitForExit(5000)
                Write-Host 'PUBLIC_CLI_CLAUDE_MAX_TURNS_PROBE=BLOCKED_NO_ACCOUNT_TIMEOUT'
              }else{
                $diagnostic=([string]$outTask.GetAwaiter().GetResult())+
                            ([string]$errTask.GetAwaiter().GetResult())
                if($diagnostic -match '(?i)(unknown|unrecognized|invalid)\s+(option|argument)[^|\r\n]*max-turns'){
                  throw 'claude parser rejected --max-turns'
                }
                Write-Host 'PUBLIC_CLI_CLAUDE_MAX_TURNS_PARSER_NOT_REJECTED'
                Write-Host 'PUBLIC_CLI_CLAUDE_LIVE_INFERENCE=NOT_QUALIFIED_NO_ACCOUNT'
              }
              $process.Dispose()
            }else{
              Write-Host 'PUBLIC_CLI_CLAUDE_AUTH=PROFILE_PRESENT'
            }
          }catch{
            throw 'PUBLIC_CLI_CLAUDE_INSTALL_OR_PROBE_BLOCKED'
          }
          exit 0
      - name: Install and inspect official Google Antigravity CLI
        if: always()
        shell: pwsh
        run: |
          $script=Join-Path $env:RUNNER_TEMP 'official-agy-install.ps1'
          $log=Join-Path $env:RUNNER_TEMP 'official-agy-install.private.log'
          try{
            Invoke-WebRequest -Uri 'https://antigravity.google/cli/install.ps1' -OutFile $script -UseBasicParsing
            & pwsh -NoProfile -NonInteractive -File $script *> $log
            if($LASTEXITCODE -ne 0){throw 'install'}
            $exe=Join-Path $env:LOCALAPPDATA 'agy\bin\agy.exe'
            if(-not (Test-Path -LiteralPath $exe -PathType Leaf)){throw 'missing'}
            & $exe --version *> $log
            if($LASTEXITCODE -ne 0){throw 'version'}
            & $exe --help *> $log
            if($LASTEXITCODE -ne 0){throw 'help'}
            $help=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            foreach($required in @('--mode','--model','--input-format','--output-format','--sandbox','--disable-slash-commands','--json-schema')){
              if(-not ([string]$help).Contains($required)){throw 'cli-options'}
            }
            Write-Host 'PUBLIC_CLI_ANTIGRAVITY_OFFICIAL_BINARY_AND_FLAGS_PASS'
            Write-Host 'PUBLIC_CLI_ANTIGRAVITY_STREAM_STDIN_FLAGS_PASS'
            Write-Host 'PUBLIC_CLI_ANTIGRAVITY_AUTH=NOT_TESTED_NO_APPROVED_PROFILE'
          }catch{
            throw 'PUBLIC_CLI_ANTIGRAVITY_INSTALL_OR_PROBE_BLOCKED'
          }
          exit 0
      # No account sign-up, login tokens, prompts, uploaded logs or artifacts.
      # Actual model inference requires provider-approved user authentication.
