      - name: Prepare original ACTIVE license for installed employee admission
        shell: pwsh
        timeout-minutes: 24
        env:
          IWXA_T3_SYNTHETIC_PROVISION: CORPORATE_CENTER_CI_FIXTURE_ONLY
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'corporate-installed-license-gui-private.log'
          $witness=(Resolve-Path 'publisher/tests/installed-publisher-center-corporate.ps1').Path
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($witness,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){throw 'CORPORATE_INSTALLED_LICENSE_WITNESS_PARSE_FAILED'}
          $adminPayload=(Resolve-Path 'admin/artifacts/private-t3-d3-payload').Path
          $publisherExe=Join-Path $env:CORPORATE_PUBLISHER_INSTALL 'iwxa-publisher.exe'
          $adminExe=Join-Path $env:CORPORATE_ADMIN_INSTALL 'iwxa-admin-center.exe'
          $publisherHash=(Get-FileHash -LiteralPath 'publisher/publisher/src-tauri/target/release/iwxa-publisher.exe').Hash
          $centerHash=(Get-FileHash -LiteralPath (Join-Path $adminPayload 'iwxa-admin-center.exe')).Hash
          $ownerHash=(Get-FileHash -LiteralPath (Join-Path $adminPayload 't3/iwxa-t3-product-owner.exe')).Hash
          $consumerHash=(Get-FileHash -LiteralPath (Join-Path $adminPayload 't3/iwxa-t3-product-consumer.exe')).Hash
          & pwsh.exe -NoLogo -NoProfile -STA -File $witness -PublisherExe $publisherExe -AdminCenterExe $adminExe -ExpectedPublisherSha256 $publisherHash -ExpectedCenterSha256 $centerHash -ExpectedOwnerSha256 $ownerHash -ExpectedConsumerSha256 $consumerHash -IssuerAuthorityId 'publisher:synthetic:corporate:installed' -DedicatedTestProfile -QualifySeatProjection -ResumeQualifiedCenterCI -PrepareLicensedEmployee *> $log
          $exit=$LASTEXITCODE
          $raw=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
          $checks=@([regex]::Matches($raw,'(?m)^CORPORATE_TWO_INSTALLED_CHECK=([A-Z0-9_]{3,100})\s*$')|ForEach-Object {$_.Groups[1].Value})
          foreach($check in $checks){Write-Host ('CORPORATE_TWO_INSTALLED_CHECK='+$check)}
          foreach($m in [regex]::Matches($raw,'(?m)^CORPORATE_TWO_INSTALLED_(PHASE|FAILURE_PHASE|FAILURE_STEP|FAILURE_KIND)=([A-Z0-9_]{1,80})\s*$')){
            Write-Host ('CORPORATE_TWO_INSTALLED_'+$m.Groups[1].Value+'='+$m.Groups[2].Value)
          }
          $m=[regex]::Match($raw,'(?m)^CORPORATE_LICENSED_EMPLOYEE_PREPARATION=PASS checks=(\d{1,3})\s*$')
          if($exit -ne 0 -or !$m.Success -or [int]$m.Groups[1].Value -ne 9 -or $checks.Count -ne 9){
            $safe=@([regex]::Matches($raw,'(?<![A-Z0-9_])CORPORATE_(?:GUI|NATIVE|INSTALLED|SEAT|TWO_INSTALLED)_[A-Z0-9_]{4,100}(?![A-Z0-9_])')|ForEach-Object {$_.Value}|Select-Object -Unique|Select-Object -Last 25)
            Write-Host ('CORPORATE_INSTALLED_LICENSE_CODES='+($safe -join ','))
            throw 'CORPORATE_INSTALLED_LICENSE_GUI_HOLD'
          }
          $expected=@(Get-Content -LiteralPath 'qualification/corporate-installed/publisher-center-required-receipts.json' -Raw|ConvertFrom-Json|Select-Object -First 9)
          if($expected.Count -ne 9 -or @($checks|Sort-Object -CaseSensitive -Unique).Count -ne 9 -or
             @(Compare-Object -ReferenceObject $expected -DifferenceObject $checks -CaseSensitive).Count -ne 0){
            throw 'CORPORATE_INSTALLED_LICENSE_RECEIPT_SET_MISMATCH'
          }
          if(!(Test-Path -LiteralPath (Join-Path $env:RUNNER_TEMP 'iwxa-licensed-employee-handoff/receipt.json') -PathType Leaf)){throw 'EMPLOYEE_LICENSED_HANDOFF_MISSING'}
          Write-Host 'EMPLOYEE_LICENSED_PREPARATION=PASS'
      - name: Connect genuine installed independent employee through both native applications
