          foreach($check in $checks){Write-Host ('EMPLOYEE_INSTALLED_CHECK='+$check)}
          foreach($m in [regex]::Matches($raw,'(?m)^EMPLOYEE_INSTALLED_FAILURE_(STAGE|STEP|KIND)=([A-Z0-9_]{1,80})\s*$')){
            Write-Host ('EMPLOYEE_INSTALLED_FAILURE_'+$m.Groups[1].Value+'='+$m.Groups[2].Value)
          }
          foreach($m in [regex]::Matches($raw,'(?m)^EMPLOYEE_INSTALLED_PROFILE_DIAGNOSTIC=(CREATE|READ):(T3_EMPLOYEE_WINDOWS_PARENT_NOT_TRUSTED|T3_EMPLOYEE_WINDOWS_CANDIDATE_EXISTS_READBACK|T3_EMPLOYEE_WINDOWS_CANDIDATE_NOT_FOUND|T3_EMPLOYEE_BOOTSTRAP_FINGERPRINT_MISMATCH|T3_EMPLOYEE_BOOTSTRAP_READBACK_MISMATCH|T3_EMPLOYEE_WINDOWS_CANDIDATE_BINDING_CHANGED|T3_ORIGINAL_OWNER_NOT_INSTALLED|T3_OUTCOME_UNKNOWN_RECONCILE_FIRST|T3_EMPLOYEE_EXPLICIT_ISSUER_CONFIRMATION_REQUIRED|T3_EMPLOYEE_ISSUER_PUBLIC_KEY_INVALID|T3_EMPLOYEE_WINDOWS_ROOT_REQUIRED|T3_EMPLOYEE_WINDOWS_CANDIDATE_DPAPI_REQUIRED|T3_EMPLOYEE_BOOTSTRAP_PROFILE_INVALID|UI_CANDIDATE_NOT_VERIFIED|UI_BOOTSTRAP_PROFILE_REJECTED|NO_RECOGNIZED_UI_STATUS)\s*$')){
            Write-Host ('EMPLOYEE_INSTALLED_PROFILE_DIAGNOSTIC='+$m.Groups[1].Value+':'+$m.Groups[2].Value)
          }
          foreach($m in [regex]::Matches($raw,'(?m)^EMPLOYEE_INSTALLED_PROFILE_READBACK=(FIRST_ACK|RECOVERED_EXISTING)\s*$')){
            Write-Host ('EMPLOYEE_INSTALLED_PROFILE_READBACK='+$m.Groups[1].Value)
          }
          foreach($m in [regex]::Matches($raw,'(?m)^EMPLOYEE_INSTALLED_T3_READINESS_LAST_ACTION=(WAIT|CHECK|CHECK_ACK_UNKNOWN|ENABLE|ENABLE_ACK_UNKNOWN)\s*$')){
            Write-Host ('EMPLOYEE_INSTALLED_T3_READINESS_LAST_ACTION='+$m.Groups[1].Value)
          }
          $manifest=@(Get-Content -LiteralPath 'qualification/corporate-employee-first-use/required-receipts.json' -Raw|ConvertFrom-Json)
          if($exit -ne 0 -or $raw -notmatch '(?m)^EMPLOYEE_INSTALLED_FIRST_USE=PASS checks=14\s*$' -or
             $checks.Count -ne 14 -or @(Compare-Object -ReferenceObject $manifest -DifferenceObject $checks -CaseSensitive).Count -ne 0){
            $codes=@([regex]::Matches($raw,'(?<![A-Z0-9_])(?:EMPLOYEE_INSTALLED|CORPORATE_GUI|CORPORATE_SEAT)_[A-Z0-9_]{4,95}(?![A-Z0-9_])')|ForEach-Object {$_.Value}|Select-Object -Unique|Select-Object -Last 25)
            Write-Host ('EMPLOYEE_INSTALLED_CODES='+($codes -join ','))
