# Public Center runner can temporarily read private Agent to verify the
# ORIGINAL Windows desktop. Never upload the private checkout, logs, EXE,
# Setup, screen captures, model output, credentials or caches.
name: Agent 0.6 Atlas D6 - native installed Windows GUI qualification
on:
  push:
    branches:
      - work/2026-11-17-agent06-d6-signed-receipt-source-ci
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-d6-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installed-native:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require temporary original Agent source grant
        shell: pwsh
        env:
          SOURCE_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)){
            throw 'AGENT06_NATIVE_PRIVATE_SOURCE_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 474066b0eaf4c9e92cb55a0e0d09669caf87b083
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 3f91b60c56e34a21ea919a4a2004e31bb5071c60
          path: public-one-core
          persist-credentials: false
      - name: Verify exact private owner and Windows toolchain
        shell: pwsh
        run: |
          $actual=(& git -C private-agent rev-parse HEAD).Trim()
          if($actual -cne '474066b0eaf4c9e92cb55a0e0d09669caf87b083'){
            throw 'AGENT06_NATIVE_PRIVATE_SOURCE_SHA_CHANGED'
          }
          foreach($f in @(
            'runtime/t3_original_result_owner.py',
            'runtime/t3_original_employee_worker.mjs',
            'runtime/t3_original_employee_cold_guard.mjs',
            'tests/test_agent06_original_t3_result_owner.py',
            'qualification/phase1/agent02_installed_gui_acceptance.ps1',
            'desktop/src-tauri/Cargo.toml')){
            if(!(Test-Path -LiteralPath (Join-Path 'private-agent' $f) -PathType Leaf)){
              throw 'AGENT06_NATIVE_OWNER_SOURCE_MISSING'
            }
          }
          & rustc --version *> (Join-Path $env:RUNNER_TEMP 'agent06-native-rust-private.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_RUST_TOOLCHAIN_UNAVAILABLE'}
          & cargo --version *>> (Join-Path $env:RUNNER_TEMP 'agent06-native-rust-private.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_CARGO_UNAVAILABLE'}
          Write-Host 'AGENT06_NATIVE_EXACT_SOURCE_AND_TOOLCHAIN_PASS'
      - name: Build actual private Tauri Windows executable with original U04
        shell: pwsh
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-agent'
          $prep=Join-Path $env:RUNNER_TEMP 'agent06-native-public-modules-private.log'
          Push-Location $root
          try {
            & node scripts/prepare-public-modules.mjs --only-u04 --fetch *> $prep
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_OFFICIAL_U04_PREPARE_FAILED'}
            & node scripts/stage-u04-desktop.mjs build/u04-owner-sources desktop/public/u04 *>> $prep
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_OFFICIAL_U04_STAGE_FAILED'}
            Write-Host 'AGENT06_NATIVE_ORIGINAL_U04_STAGED_PASS'
          } finally { Pop-Location }
          Push-Location (Join-Path $root 'desktop')
          try {
            & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'agent06-native-npm-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_NPM_FAILED'}
            & npm.cmd run tauri:build -- --no-bundle *> (Join-Path $env:RUNNER_TEMP 'agent06-native-build-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_TAURI_BUILD_FAILED'}
            if(!(Test-Path -LiteralPath 'src-tauri/target/release/iwxa-personal.exe' -PathType Leaf)){
              throw 'AGENT06_NATIVE_EXE_MISSING'
            }
            if(!(Test-Path -LiteralPath 'dist/index.html' -PathType Leaf)){
              throw 'AGENT06_NATIVE_REACT_ASSETS_MISSING'
            }
            # U04 is a public, immutable build-time source. Vite has copied
            # it byte-for-byte into dist; production packaging reads dist.
            # Remove ONLY its generated checkout staging files to satisfy
            # the original product's clean-tracked-HEAD packaging gate.
            foreach($module in @('bridge.mjs','id.mjs','surface.mjs')){
              if(!(Test-Path -LiteralPath (Join-Path 'dist/u04/u04-presentation' $module) -PathType Leaf)){
                throw 'AGENT06_NATIVE_DIST_ORIGINAL_U04_MISSING'
              }
            }
            $tracked=@(& git -C $root ls-files -- desktop/public/u04)
            if($LASTEXITCODE -ne 0 -or @($tracked | Where-Object {$_}).Count -ne 0){
              throw 'AGENT06_NATIVE_GENERATED_U04_STAGING_NOT_EXCLUSIVE'
            }
            $generated=Join-Path $root 'desktop/public/u04'
            if(Test-Path -LiteralPath $generated){
              Remove-Item -LiteralPath $generated -Force -Recurse -ErrorAction Stop
            }
            $dirty=@(& git -C $root status --porcelain --untracked-files=all)
            if($LASTEXITCODE -ne 0 -or @($dirty | Where-Object {$_}).Count -ne 0){
              throw 'AGENT06_NATIVE_PRIVATE_CHECKOUT_NOT_CLEAN'
            }
            Write-Host 'AGENT06_NATIVE_ORIGINAL_U04_DIST_AND_CLEAN_SOURCE_PASS'
            $binary=Get-Item -LiteralPath 'src-tauri/target/release/iwxa-personal.exe'
            if($binary.Length -lt 100000){throw 'AGENT06_NATIVE_EXE_INVALID_SIZE'}
            Write-Host 'AGENT06_NATIVE_REAL_WINDOWS_TAURI_EXE_PASS'
            Write-Host 'AGENT06_NATIVE_PRIVATE_EXE_ARTIFACTS_UPLOADED=0'
          } finally { Pop-Location }
      - name: Build actual qualified original T2 Agent product One Dist for SAME installed GUI
        shell: pwsh
        run: |
          $core=Join-Path $env:GITHUB_WORKSPACE 'public-one-core/packages/t3-core'
          $agent=Join-Path $env:GITHUB_WORKSPACE 'private-agent'
          $sha=(& git -C $core rev-parse HEAD).Trim()
          if($sha -cne '3f91b60c56e34a21ea919a4a2004e31bb5071c60'){throw 'AGENT06_G4_PUBLIC_ONE_CORE_SHA_MISMATCH'}
          $archive=Join-Path $core 'qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip'
          if(!(Test-Path -LiteralPath $archive -PathType Leaf) -or
             (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne
               '7075b8b9590ef1283e34ecb3c21dd9d1b7342697287e1aa150cd4f4a60860b68'){
            throw 'AGENT06_G4_GENUINE_QUALIFIED_T2_ARCHIVE_MISSING'
          }
          $qualified=Join-Path $env:RUNNER_TEMP 'agent06-g4-qualified-t2'
          $dist=Join-Path $env:RUNNER_TEMP 'agent06-g4-one-dist'
          $receipt=Join-Path $env:RUNNER_TEMP 'agent06-g4-original-receipt.json'
          New-Item -ItemType Directory -Force -Path $qualified | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($archive,$qualified)
          Push-Location $core
          try{
            & npm.cmd ci --ignore-scripts --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'agent06-g4-core-npm-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_G4_ONE_CORE_DEPENDENCIES_FAILED'}
            # Agent is a native desktop with its own model runtime. D5 WebGPU
            # BLI remains in the browser-domain build, not in Agent D6.
            & npm.cmd run build *> (Join-Path $env:RUNNER_TEMP 'agent06-g4-compiled-host-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_G4_COMPILED_T3_WORKSPACE_FAILED'}
          }finally{Pop-Location}
          $profile=Join-Path $agent 'config/original-t2-agent-product.json'
          if(!(Test-Path -LiteralPath $profile -PathType Leaf)){
            throw 'AGENT06_G4_OWNING_PRODUCT_PROFILE_MISSING'
          }
          & node (Join-Path $core 'scripts/build-original-agent-one-dist.mjs') --qualified-kernel-dist $qualified --agent-profile $profile --t3-build (Join-Path $core 'dist') --output $dist --receipt $receipt --desktop-agent-control *> (Join-Path $env:RUNNER_TEMP 'agent06-g4-one-dist-private.log')
          if($LASTEXITCODE -ne 0 -or
             !(Test-Path -LiteralPath $dist -PathType Container) -or
             !(Test-Path -LiteralPath $receipt -PathType Leaf)){
            throw 'AGENT06_G4_ORIGINAL_AGENT_ONE_DIST_NOT_BUILT'
          }
          $witness=Get-Content -LiteralPath $receipt -Raw -Encoding UTF8 | ConvertFrom-Json
          if($witness.original_qualified_artifact -cne
             'iwxa-kernel-k036-same-store-history-20261019-qualified.1' -or
             $witness.original_agent_d6_schema_registered -ne $true -or
             $witness.original_runtime_unchanged -ne $true -or
             $witness.workspace_service_id -cne 'iwxa.personal-agent.workspace' -or
             $witness.local_inference_registered -ne $false){
            throw 'AGENT06_G4_ORIGINAL_ONE_DIST_PRODUCT_OR_RECEIPT_INVALID'
          }
          foreach($var in @(
            ('IWXA_G4_PUBLIC_T3_CORE_ROOT='+$core),
            ('IWXA_G4_ORIGINAL_ONE_DIST_ROOT='+$dist),
            ('IWXA_G4_ORIGINAL_ONE_DIST_RECEIPT='+$receipt))){
            Add-Content -LiteralPath $env:GITHUB_ENV -Value $var -Encoding UTF8
          }
          Write-Host 'AGENT06_G4_REAL_ORIGINAL_T2_AGENT_ONE_DIST_BUILD_PASS'
      - name: Install and exercise existing Agent native UIA acceptance
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'agent06-native-installed-private.log'
          Push-Location 'private-agent'
          try {
            & python -m pip install -r requirements.txt *> (Join-Path $env:RUNNER_TEMP 'agent06-native-pip-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_PYTHON_DEPS_FAILED'}
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'qualification/phase1/agent02_installed_gui_acceptance.ps1' *> $log
            if($LASTEXITCODE -ne 0){
              $result=Join-Path $env:RUNNER_TEMP ('agent02-installed-gui-'+$env:GITHUB_RUN_ID)
              $report=Join-Path $result 'logs/smoke-result.json'
              if(Test-Path -LiteralPath $report -PathType Leaf){
                try{
                  $e=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
                  $safe=@('PASS','FAIL','NOT_TESTED','NOT_NEEDED','ATTEMPTED','RECOVERED')
                  foreach($key in @('install','button_invoked','react_page_changed',
                    'task_input_visible','task_input_editable','draft_restore',
                    'core_draft_after_reopen','first_window_retry')){
                    $v=[string]$e.$key
                    if($v -in $safe){
                      Write-Host ('AGENT06_NATIVE_'+$key.ToUpperInvariant()+'='+$v)
                    }
                  }
                  $reason=[string]$e.error
                  $group='UNCLASSIFIED'
                  if($reason -match 'gui_native_process_exited|gui_native_window_missing|gui_window_in_other_session'){$group='NATIVE_WINDOW'}
                  elseif($reason -match 'react_page_not_visible|ui_automation_root_missing|control_unavailable'){$group='UIA_UNAVAILABLE'}
                  elseif($reason -match 'install|storage_authority'){$group='INSTALLATION'}
                  elseif($reason -match 'gui_draft|draft_http|draft_value'){$group='DRAFT_READBACK'}
                  Write-Host ('AGENT06_NATIVE_FAILURE_CATEGORY='+$group)
                }catch{Write-Host 'AGENT06_NATIVE_FAILURE_CATEGORY=REPORT_UNREADABLE'}
              }else{
                # The installed witness writes its result.json only after
                # package/runtime preflight. Classify this early failure from
                # transient PRIVATE logs using fixed, non-secret reason codes.
                $preflight='UNCLASSIFIED_PREFLIGHT'
                $known=@(
                  @('gui_managed_python_capsule_failed','MANAGED_PYTHON_CAPSULE'),
                  @('gui_native_package_failed','NATIVE_PACKAGE'),
                  @('gui_original_u01_sources_failed','ORIGINAL_U01_STAGE'),
                  @('gui_original_u01_receipt_missing','ORIGINAL_U01_RECEIPT'),
                  @('u01_pinned_sources_required_for_installed_desktop','ORIGINAL_U01_PACKAGE_REQUIRED'),
                  @('gui_package_install_failed','NATIVE_PACKAGE_INSTALL'),
                  @('gui_storage_authority_failed','STORAGE_AUTHORITY'),
                  @('gui_native_executable_not_installed','NATIVE_EXE_NOT_INSTALLED'),
                  @('BLOCKED_ENVIRONMENT','WINDOWS_ENVIRONMENT'),
                  @('managed_runtime_capsule_invalid','MANAGED_CAPSULE_INVALID'),
                  @('original_t3','ORIGINAL_T3_SOURCE'),
                  @('u01_pinned_sources','U01_PACKAGE_INPUT_MISSING')
                )
                foreach($pair in $known){
                  if(Select-String -LiteralPath $log -Pattern $pair[0] -SimpleMatch -Quiet -ErrorAction SilentlyContinue){
                    $preflight=[string]$pair[1];break
                  }
                }
                Write-Host ('AGENT06_NATIVE_FAILURE_CATEGORY=REPORT_ABSENT_'+$preflight)
              }
              throw 'AGENT06_NATIVE_INSTALLED_GUI_UNVERIFIED'
            }
            Write-Host 'AGENT06_NATIVE_INSTALLED_GUI_AND_COLD_REOPEN_PASS'
          } finally { Pop-Location }
      - name: Remove all private source and native installed artifacts
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath 'private-agent' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'public-one-core' -Recurse -Force -ErrorAction SilentlyContinue
          foreach($item in @('agent06-g4-qualified-t2','agent06-g4-one-dist')){
            Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $item) -Recurse -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'agent06-g4-original-receipt.json') -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'agent06-g4-*-private.log' -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          $qa=Join-Path $env:RUNNER_TEMP ('agent02-installed-gui-'+$env:GITHUB_RUN_ID)
          Remove-Item -LiteralPath $qa -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'agent06-native-*-private.log' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host 'AGENT06_NATIVE_EPHEMERAL_PRIVATE_CLEANUP_FINISHED'
      # No actions/upload-artifact, cache or public source/binary logs.
