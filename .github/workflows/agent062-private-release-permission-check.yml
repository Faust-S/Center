name: Agent062 check existing private release permission
on:
  push:
    branches:
      - work/2026-11-22-agent-062-check-private-publish-permission
    paths:
      - .github/workflows/agent062-private-release-permission-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Inspect existing source-token permission without exposing credentials
        shell: pwsh
        env:
          IWXA_PRIVATE_SOURCE_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:IWXA_PRIVATE_SOURCE_READ_TOKEN)){
            throw 'AGENT062_PRIVATE_SOURCE_TOKEN_MISSING'
          }
          $headers=@{
            Authorization='Bearer '+$env:IWXA_PRIVATE_SOURCE_READ_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='IWXA-Agent062-Release-Permission-Check'
          }
          try {
            $data=Invoke-RestMethod -Uri 'https://api.github.com/repos/Faust-S/iwxa-personal-agent' -Headers $headers -Method Get
          } catch {
            throw 'AGENT062_PRIVATE_PERMISSION_CHECK_API_FAILED'
          }
          if($data.full_name -cne 'Faust-S/iwxa-personal-agent'){
            throw 'AGENT062_PRIVATE_PERMISSION_WRONG_REPOSITORY'
          }
          if($data.permissions.push -eq $true){
            Write-Host 'AGENT062_EXISTING_PRIVATE_TOKEN_CAN_PUBLISH=YES'
          } else {
            Write-Host 'AGENT062_EXISTING_PRIVATE_TOKEN_CAN_PUBLISH=NO'
          }
          $body=@{
            tag_name='v0.6.2'
            target_commitish='39a4f49ed9a5c0781c4a4769e9603ca8fb1e8d23'
            name='IWXA Personal Agent 0.6.2'
            body='Verified native Windows package pending release asset upload.'
            draft=$true
            prerelease=$false
          } | ConvertTo-Json -Depth 3
          try {
            $created=Invoke-RestMethod -Method Post -Uri 'https://api.github.com/repos/Faust-S/iwxa-personal-agent/releases' -Headers $headers -ContentType 'application/json' -Body $body
            if($created.draft -eq $true -and $created.tag_name -ceq 'v0.6.2'){
              Write-Host 'AGENT062_RELEASE_CREATE_DRAFT_HTTP=201'
            } else {
              Write-Host 'AGENT062_RELEASE_CREATE_DRAFT_REPLY_UNEXPECTED'
            }
          } catch {
            $status=0
            try {
              $status=[int]$_.Exception.Response.StatusCode
            } catch {}
            if($status -lt 100 -or $status -gt 599){$status=0}
            Write-Host ('AGENT062_RELEASE_CREATE_DRAFT_HTTP='+$status)
          }
