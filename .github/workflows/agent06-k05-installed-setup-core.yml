# Public Center runner, private Agent source is temporary and read-only.
# Uses original Setup Core, original Task/Core and real native UIA witness.
# K03 error code sidecar is allowlisted and never exports user/source/model text.
# No upload-artifact, cache or private output in public logs.
# This run independently probes Task-bound accepted Result visibility after K03.
name: Agent 0.6 K05 installed native Setup Core Windows acceptance
on:
  push:
    branches:
      - work/2026-11-15-agent06-k05-executor-comparison
    paths:
      - .github/workflows/agent06-k05-installed-setup-core.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-k05-installed-${{ github.ref }}
  # Preserve the preceding installed witness so K03/UIA regressions stay attributable.
  cancel-in-progress: false
jobs:
  k05-installed-windows:
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      AGENT_K05_NATIVE_EXACT_SHA: '2a914bd4e3fdec6e4414813dcc232dff503b546b'
    steps:
      - uses: actions/checkout@v4
        with:
          path: center-owner
          persist-credentials: false
      - name: Require owner-authorized private source read
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'K05_NATIVE_PRIVATE_SOURCE_READ_MISSING'
          }
          Write-Host 'K05_NATIVE_PRIVATE_READ_ACCESS_PRESENT'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT_K05_NATIVE_EXACT_SHA }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact owners and create short disposable Windows roots
        shell: pwsh
        run: |
          $agent=(& git -C private-agent rev-parse HEAD).Trim()
          $center=(& git -C center-owner rev-parse HEAD).Trim()
          if($agent -cne $env:AGENT_K05_NATIVE_EXACT_SHA -or
             $center -cne $env:GITHUB_SHA){
            throw 'K05_NATIVE_SOURCE_SHA_MISMATCH'
          }
          $short='C:\i6'
          if(Test-Path -LiteralPath $short){throw 'K05_NATIVE_SHORT_ROOT_OCCUPIED'}
          New-Item -ItemType Directory -Force -Path $short | Out-Null
          $log=Join-Path $env:RUNNER_TEMP 'k05-native-short-checkout-private.log'
          & git -c core.longpaths=true clone --no-checkout (Resolve-Path private-agent).Path 'C:\i6\a' *> $log
          if($LASTEXITCODE -ne 0){throw 'K05_NATIVE_SHORT_AGENT_CLONE_FAIL'}
          & git -C 'C:\i6\a' -c core.longpaths=true checkout --detach $agent *> $log
          if($LASTEXITCODE -ne 0){throw 'K05_NATIVE_SHORT_AGENT_SHA_FAIL'}
          & git -c core.longpaths=true clone --no-checkout (Resolve-Path center-owner).Path 'C:\i6\c' *> $log
          if($LASTEXITCODE -ne 0){throw 'K05_NATIVE_SHORT_CENTER_CLONE_FAIL'}
          & git -C 'C:\i6\c' -c core.longpaths=true checkout --detach $center *> $log
          if($LASTEXITCODE -ne 0){throw 'K05_NATIVE_SHORT_CENTER_SHA_FAIL'}
          if(((& git -C 'C:\i6\a' rev-parse HEAD).Trim() -cne $agent) -or
             ((& git -C 'C:\i6\c' rev-parse HEAD).Trim() -cne $center)){
            throw 'K05_NATIVE_SHORT_PATH_IDENTITY_FAIL'
          }
          Write-Host ('K05_NATIVE_AGENT_SHA='+$agent)
          Write-Host ('K05_NATIVE_CENTER_SHA='+$center)
          Write-Host 'K05_NATIVE_SHORT_CHECKOUT_PASS'
      - name: Build original product ZIP with K05 and one Center Setup Core
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root='C:\i6'
          $logs=Join-Path $root 'o\logs'
          $build=Join-Path $root 'o\build'
          $cache=Join-Path $root 'o\cache'
          New-Item -ItemType Directory -Force -Path $logs,$build,$cache | Out-Null
          $agent=(& git -C 'C:\i6\a' rev-parse HEAD).Trim()
          $tree=(& git -C 'C:\i6\a' rev-parse 'HEAD^{tree}').Trim()
          $center=(& git -C 'C:\i6\c' rev-parse HEAD).Trim()
          $ps=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $log=Join-Path $env:RUNNER_TEMP 'k05-native-private-build.log'
          & $ps -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'C:\i6\a\qualification\phase1\build_native_windows_setup_candidate.ps1' -RepoRoot 'C:\i6\a' -BuildRoot $build -LogsRoot $logs -ReleaseCache $cache -SourceCommit $agent -SourceTree $tree -ProductPackageOnly *> $log
          if($LASTEXITCODE -ne 0){
            Write-Host 'K05_NATIVE_BUILD_FAILURE_STAGE=PRODUCT_PACKAGE'
            throw 'K05_NATIVE_BUILD_PRODUCT_PACKAGE_FAIL'
          }
          $package=Join-Path $build 'package\IWXA-Personal-Agent-Windows-Explorer-Prototype.zip'
          $manifest=Join-Path $build 'package\bootstrap\package-manifest.json'
          if(!(Test-Path -LiteralPath $package -PathType Leaf) -or
             !(Test-Path -LiteralPath $manifest -PathType Leaf)){
            throw 'K05_NATIVE_PRODUCT_PACKAGE_MISSING'
          }
          $m=Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if($m.source_commit -cne $agent -or
             $m.source_tree -cne $tree -or
             $m.k05_pinned_sources_included -ne $true -or
             $m.desktop_native_included -ne $true){
            throw 'K05_NATIVE_PRODUCT_MANIFEST_MISMATCH'
          }
          Write-Host 'K05_NATIVE_TAURI_AND_K05_PACKAGE_PASS'
          $python=(Get-Content -LiteralPath (Join-Path $build 'test-python\current-python.txt') -Raw).Trim()
          $setup=Join-Path $root 'o\IWXA-Personal-Agent-K05-Setup.exe'
          $log=Join-Path $env:RUNNER_TEMP 'k05-native-setupcore-build-private.log'
          & $python -B 'C:\i6\a\tools\build_setup_core_release.py' --product-package $package --center-root 'C:\i6\c' --center-commit $center --output $setup --python $python *> $log
          if($LASTEXITCODE -ne 0){throw 'K05_NATIVE_ORIGINAL_SETUP_CORE_BUILD_FAIL'}
          $digest=(Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if($digest.Length -ne 64){throw 'K05_NATIVE_SETUP_CORE_SHA_INVALID'}
          Write-Host 'K05_NATIVE_ORIGINAL_SETUP_CORE_BUILT_PASS'
          Write-Host ('K05_NATIVE_SETUP_SHA256='+$digest)
      - name: Install original Setup Core and qualify native Tauri witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $setup='C:\i6\o\IWXA-Personal-Agent-K05-Setup.exe'
          if(!(Test-Path -LiteralPath $setup -PathType Leaf)){
            throw 'K05_NATIVE_SETUP_FILE_MISSING'
          }
          $log=Join-Path $env:RUNNER_TEMP 'k05-installed-acceptance-private.log'
          $ps=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $agent=(& git -C 'C:\i6\a' rev-parse HEAD).Trim()
          & $ps -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'C:\i6\c\installer\windows\qualify-local-bundle.ps1' -Setup $setup -ProductId 'iwxa.personal-agent' -SandboxRoot 'C:\i6\o\installed' -SourceCommit $agent -WitnessScript 'C:\i6\a\tools\qualify_setup_core_runtime.ps1' -WitnessTimeoutSeconds 3000 *> $log
          if($LASTEXITCODE -ne 0){
            # Entire original log remains private on the ephemeral runner.
            # Export only bounded stage/status markers and safe exception codes.
            $stage='UNKNOWN'
            $root='C:\i6\o\installed'
            $completed=@(
              @('identity.json','IDENTITY'),@('preflight.json','PREFLIGHT'),
              @('installed.json','INSTALL'),@('verified.json','VERIFY'),
              @('locations-readback.json','LOCATIONS'),@('installed-witness.json','WITNESS'),
              @('repair.json','REPAIR'),@('confirmed.json','CONFIRM'),
              @('removed.json','UNINSTALL')
            )
            foreach($step in $completed){
              $file=Join-Path $root $step[0]
              if(!(Test-Path -LiteralPath $file -PathType Leaf)){continue}
              $status='UNREADABLE'
              try{
                $receipt=Get-Content -LiteralPath $file -Raw -Encoding UTF8 | ConvertFrom-Json
                if([string]$receipt.status -match '^[A-Z0-9_]{2,65}$'){
                  $status=[string]$receipt.status
                }
                if($step[1] -eq 'WITNESS' -and
                   [string]$receipt.phase -match '^[A-Z0-9_]{2,65}$'){
                  $stage=[string]$receipt.phase
                  # These three fields are sourced from finite allowlists
                  # in the original private installed witness, not from LLM.
                  $failureCode=[string]$receipt.failure_code
                  $lastOperation=[string]$receipt.last_operation
                  $checkpoint=[string]$receipt.last_checkpoint
                  if($failureCode -match '^[A-Z0-9_]{2,75}$'){
                    Write-Host ('K05_NATIVE_QWEN_FAILURE_CODE='+$failureCode)
                  }
                  if($lastOperation -match '^[A-Z0-9_]{2,75}$'){
                    Write-Host ('K05_NATIVE_QWEN_LAST_OPERATION='+$lastOperation)
                  }
                  if($checkpoint -match '^AGENT_REAL_QWEN_[A-Z_]{3,75}$' -or
                     $checkpoint -ceq 'NONE_OBSERVED'){
                    Write-Host ('K05_NATIVE_QWEN_LAST_CHECKPOINT='+$checkpoint)
                  }
                  # GUI_RESULT is the earlier, independently installed
                  # baseline Qwen Task readback, not the later K05 comparison.
                  # Only bounded original UIA classes leave the private job.
                  if($stage -ceq 'GUI_RESULT'){
                    $origStage=[string]$receipt.gui_result_stage
                    $origReason=[string]$receipt.gui_result_reason
                    if($origStage -match '^(NOT_REPORTED|NOT_STARTED|TASK_NAVIGATION|TASK_SELECTION|ACCEPTED_READBACK|RECEIPT_WRITE)$'){
                      Write-Host ('K05_NATIVE_GUI_RESULT_STAGE='+$origStage)
                    }
                    if($origReason -match '^(NOT_REPORTED|UNKNOWN|WORK_BUTTON_UNAVAILABLE|TASK_BUTTON_UNAVAILABLE|TASK_ID_BUTTON_MISSING|TASK_TITLE_DIGEST_UNVERIFIED|RESULT_TITLE_DIGEST_UNVERIFIED|ACCEPTED_STATUS_NOT_VISIBLE|RESULT_READBACK_NOT_COINCIDENT)$'){
                      Write-Host ('K05_NATIVE_GUI_RESULT_REASON='+$origReason)
                    }
                  }
                  $k05Stage=[string]$receipt.k05_gui_stage
                  $k05Reason=[string]$receipt.k05_gui_reason
                  if($k05Stage -match '^(NOT_REPORTED|NOT_STARTED|TASK_NAVIGATION|TASK_SELECTION|ACCEPTED_RESULT|ALTERNATIVE_SELECTION|COMPARE_BUTTON|COMPARISON_READBACK|RECEIPT_WRITE)$'){
                    Write-Host ('K05_NATIVE_UIA_STAGE='+$k05Stage)
                  }
                  if($k05Reason -match '^(NOT_REPORTED|UNKNOWN|TASK_LIST_MISSING|TASK_ID_BUTTON_MISSING|TASK_BUTTON_ACTIVATION_FAILED|SELECTED_ACCEPTED_TASK_NOT_VERIFIED|ACCEPTED_STATUS_ID_MISSING|ACCEPTED_STATUS_LABEL_UNVERIFIED|ACCEPTED_STATUS_OFFSCREEN|ACCEPTED_READBACK_NOT_COINCIDENT|ALTERNATIVE_COMBO_NOT_FOUND|ALTERNATIVE_OPTION_NOT_FOUND|ALTERNATIVE_SELECTION_NOT_CONFIRMED|ALTERNATIVE_UNKNOWN|EXPECTED_COMPARISON_STATUS_NOT_VISIBLE)$'){
                    Write-Host ('K05_NATIVE_UIA_REASON='+$k05Reason)
                  }
                  $k03Code=[string]$receipt.k03_failure_code
                  $k03Checkpoint=[string]$receipt.last_k03_checkpoint
                  $k03HttpStatus=[string]$receipt.k03_http_status
                  $k03HttpReason=[string]$receipt.k03_http_reason
                  if($k03Code -match '^(k03_|k05_|setup_core_k03_)[a-z0-9_]{3,80}$' -or
                     $k03Code -match '^HTTP_(400|401|403|404|409|422|429|500|502|503|504)$' -or
                     $k03Code -cin @('OTHER','OTHER_HTTP','OTHER_TIMEOUT')){
                    Write-Host ('K05_NATIVE_K03_FAILURE_CODE='+$k03Code)
                  }
                  if($k03Checkpoint -match '^AGENT_K03_[A-Z_]{3,80}$' -or
                     $k03Checkpoint -ceq 'NONE_OBSERVED'){
                    Write-Host ('K05_NATIVE_K03_LAST_CHECKPOINT='+$k03Checkpoint)
                  }
                  if($k03HttpStatus -match '^(400|401|403|409|500|503)$'){
                    Write-Host ('K05_NATIVE_K03_HTTP_STATUS='+$k03HttpStatus)
                  }
                  if($k03HttpReason -match '^(k03_host_source_changed|k03_host_selection_input_invalid|k03_builtin_surface_required|unknown_query)$'){
                    Write-Host ('K05_NATIVE_K03_HTTP_REASON='+$k03HttpReason)
                  }
                  # Bounded scheduler diagnostic, emitted by original private Core.
                  # Values are finite and validated again before public printing.
                  $schedulerState=[string]$receipt.k03_scheduler_state
                  $schedulerTaskStatus=[string]$receipt.k03_scheduler_task_status
                  $schedulerError=[string]$receipt.k03_scheduler_error_code
                  if($schedulerState -cin @('SCHEDULED','RUNNING','PAUSED','DEAD','CANCELLED','COMPLETED','UNKNOWN','NOT_REPORTED')){
                    Write-Host ('K05_NATIVE_K03_SCHEDULER_STATE='+$schedulerState)
                  }
                  if($schedulerTaskStatus -cin @('awaiting_result','result_imported','closed','UNKNOWN','NOT_REPORTED')){
                    Write-Host ('K05_NATIVE_K03_SCHEDULER_TASK_STATUS='+$schedulerTaskStatus)
                  }
                  $schedulerCodes=@(
                    'interactive_model_binding_changed',
                    'interactive_background_attempt_still_active',
                    'interactive_submission_task_binding_changed',
                    'model_invocation_already_running',
                    'task_not_retryable','automation_claim_mismatch',
                    'automation_occurrence_identity_missing',
                    'automation_occurrence_work_area_changed',
                    'automation_occurrence_task_binding_mismatch',
                    'automation_work_area_binding_missing',
                    'local_model_requires_active_ollama',
                    'local_model_requires_active_local_provider',
                    'basic_model_binding_changed','basic_model_not_ready',
                    'basic_runtime_model_not_active',
                    'basic_runtime_component_changed',
                    'basic_runtime_model_pin_changed',
                    'basic_runtime_model_digest_changed',
                    'basic_model_unavailable','basic_model_chat_metadata_required',
                    'basic_model_binding_invalid',
                    'basic_model_binding_link_forbidden',
                    'basic_model_reparse_path_forbidden',
                    'basic_model_file_invalid',
                    'basic_model_absolute_path_required',
                    'basic_runtime_component_missing',
                    'basic_runtime_executable_changed',
                    'gguf_model_unavailable','gguf_model_not_regular',
                    'gguf_model_symlink_forbidden','gguf_model_size_invalid',
                    'gguf_magic_invalid','gguf_version_not_supported',
                    'warm_engine_not_enabled','warm_engine_executable_changed',
                    'warm_engine_output_truncated',
                    'warm_engine_finish_reason_unverified',
                    'ollama_graph_runtime_not_ready',
                    'ollama_graph_model_catalog_changed',
                    'ollama_private_endpoint_binding_changed',
                    'ollama_model_binding_changed',
                    'PORT_UNAVAILABLE',
                    'PORT_PROTOCOL_ERROR',
                    'basic_runtime_timeout',
                    'basic_runtime_busy',
                    'basic_runtime_start_failed',
                    'basic_runtime_generation_failed',
                    'basic_runtime_output_invalid',
                    'basic_runtime_prompt_required',
                    'basic_runtime_prompt_too_large',
                    'basic_runtime_token_limit_invalid',
                    'basic_runtime_timeout_invalid',
                    'basic_runtime_context_window_insufficient',
                    'basic_runtime_context_budget_too_large',
                    'warm_engine_busy',
                    'warm_engine_generation_failed',
                    'warm_engine_start_timeout',
                    'warm_engine_exited_before_ready',
                    'warm_engine_http_rejected',
                    'warm_engine_response_invalid',
                    'warm_engine_response_too_large',
                    'warm_engine_stopped',
                    'warm_engine_port_not_listening',
                    'warm_engine_output_invalid',
                    'warm_engine_prompt_invalid',
                    'warm_engine_prompt_too_large',
                    'warm_engine_token_limit_invalid',
                    'warm_engine_timeout_invalid',
                    'local_dialogue_response_empty',
                    'local_document_analysis_empty',
                    'model_output_token_budget_invalid',
                    'local_document_task_sources_missing',
                    'task_result_readback_unverified',
                    'basic_runtime_turn_prefix_unverified',
                    'basic_runtime_reasoning_malformed',
                    'basic_runtime_reasoning_unclosed',
                    'basic_runtime_visible_answer_missing',
                    'basic_runtime_transcript_missing',
                    'basic_runtime_transcript_oversize',
                    'basic_runtime_transcript_unreadable',
                    'basic_runtime_transcript_read_failed',
                    'basic_runtime_transcript_empty',
                    'basic_runtime_turn_user_header_missing',
                    'basic_runtime_turn_assistant_header_missing',
                    'basic_runtime_turn_echo_last_char_missing',
                    'basic_runtime_turn_echo_extra_lf',
                    'basic_runtime_turn_echo_changed',
                    'OTHER_REDACTED','NOT_REPORTED'
                  )
                  if($schedulerError -cin $schedulerCodes){
                    Write-Host ('K05_NATIVE_K03_SCHEDULER_ERROR='+$schedulerError)
                  }
                  $schedulerFamily=[string]$receipt.k03_scheduler_error_family
                  if($schedulerFamily -cin @('UNCLASSIFIED','MODEL_PORT',
                      'BASIC_RUNTIME','WARM_RUNTIME','MODEL_BINDING',
                      'MODEL_RESULT','MODEL_ROUTE','SCHEDULER',
                      'TASK_OR_WORKSPACE','NOT_REPORTED')){
                    Write-Host ('K05_NATIVE_K03_SCHEDULER_FAMILY='+$schedulerFamily)
                  }
                }
              }catch{}
              Write-Host ('K05_NATIVE_INSTALLED_RECEIPT_'+$step[1]+'='+$status)
            }
            Write-Host ('K05_NATIVE_INSTALLED_FAILURE_STAGE='+$stage)
            if(Test-Path -LiteralPath $log -PathType Leaf){
              $privateText=[IO.File]::ReadAllText($log)
              # Never print raw errors, paths, documents, model output or tokens.
              $regex='(?<![A-Za-z0-9_])(?:SETUP_LOCAL|agent_setup|agent_native_gui|K05_NATIVE)_[A-Za-z0-9_]{3,75}'
              $unique=[System.Collections.Generic.HashSet[string]]::new(
                [StringComparer]::OrdinalIgnoreCase)
              foreach($match in [regex]::Matches($privateText,$regex)){
                $code=[string]$match.Value
                if($unique.Add($code) -and $unique.Count -le 12){
                  Write-Host ('K05_NATIVE_INSTALLED_SAFE_ERROR_CODE='+$code)
                }
              }
              if($unique.Count -eq 0){
                Write-Host 'K05_NATIVE_INSTALLED_SAFE_ERROR_CODE=NONE_FOUND'
              }
            }
            throw 'K05_NATIVE_INSTALLED_TAURI_WITNESS_FAIL'
          }
          Write-Host 'K05_NATIVE_SETUP_CORE_INSTALLED_TAURI_WITNESS_PASS'
      # Do not cache, upload, print, email or persist any private artifacts.
