name: Agent 0.6.5 native GUI, complete regression and upgrade (I14.25)
on:
  push:
    branches:
      - 'ci/once/agent065-modeling/*'
    paths:
      - '.github/ci-requests/agent065-modeling.json'
permissions:
  contents: read
concurrency:
  group: iwxa-agent065-modeling-desktop-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: python
            os: windows-2022
          - group: core-remaining-1
            os: windows-2022
          - group: core-remaining-2
            os: windows-2022
          - group: core-remaining-3
            os: windows-2022
          - group: desktop-source
            os: windows-2022
          - group: ocr
            os: ubuntu-24.04
          - group: desktop
            os: windows-2022
          - group: upgrade
            os: windows-2022
    name: qualify / ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      PRIVATE_PIN: '68128b4c9a2c7140ec3503ff0f775e5bcb50743e'
      PRIVATE_TREE: '73c17aa7fcdbe5182f278a2fe49eb3d8c93294e2'
      QUALIFICATION_GROUP: ${{ matrix.group }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Checkout public admission only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-time request before private access
        shell: bash
        run: python .ci/agent065-modeling/admit.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ matrix.group == 'desktop' || matrix.group == 'desktop-source' || matrix.group == 'upgrade' }}
        with:
          node-version: '22.16.0'
      - uses: actions/setup-dotnet@v4
        if: ${{ matrix.group == 'desktop' || matrix.group == 'upgrade' }}
        with:
          dotnet-version: '8.0.x'
      - name: Grouped checks on private temporary checkout
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python .ci/agent065-modeling/qualify_retry.py
