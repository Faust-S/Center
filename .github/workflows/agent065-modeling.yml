name: Agent 0.6.5 addressed Python and grouped Desktop qualification (I14.9)
on:
  push:
    branches:
      - 'ci/once/agent065-modeling/*'
    paths:
      - '.github/ci-requests/agent065-modeling.json'
permissions:
  contents: read
concurrency:
  group: iwxa-agent065-modeling-desktop-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    strategy:
      fail-fast: false
      matrix:
        group: [python, desktop]
    name: qualify / ${{ matrix.group }}
    runs-on: windows-2022
    timeout-minutes: 140
    env:
      PRIVATE_PIN: 'd401f0d3971e00362a0afee2bd6eaaa830c936d0'
      PRIVATE_TREE: 'c4163e720c8c7b9eb8a63a89bfbbf1ca874216cc'
      QUALIFICATION_GROUP: ${{ matrix.group }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      CI: 'true'
    steps:
      - name: Checkout public admission only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-time request before private access
        shell: pwsh
        run: python .ci/agent065-modeling/admit.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: ${{ matrix.group == 'desktop' }}
        with:
          node-version: '22.16.0'
      - name: Resolve only public upstream npm graph (no private checkout)
        id: public_graph
        if: ${{ matrix.group == 'desktop' }}
        continue-on-error: true
        shell: pwsh
        run: python .ci/agent065-modeling/public_lock.py
      - name: Retain only independently generated public npm metadata
        if: ${{ matrix.group == 'desktop' && steps.public_graph.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: public-modeling-npm-graph
          path: ${{ runner.temp }}/iwxa-public-npm-modeling-graph/package-lock.json
          retention-days: 1
          if-no-files-found: error
      - name: Grouped checks on private temporary checkout
        shell: pwsh
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python .ci/agent065-modeling/qualify_retry.py
