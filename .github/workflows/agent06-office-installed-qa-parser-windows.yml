name: Agent 0.6 Office installed QA syntax Windows
on:
  push:
    branches: ['work/2026-11-15-agent06-office-source-qualification']
    paths: ['.github/workflows/agent06-office-installed-qa-parser-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-office-installed-parser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa-source-parser:
    runs-on: windows-2022
    timeout-minutes: 6
    env:
      AGENT_OFFICE_SHA: '1c4d542c0c5c54d93b6f1522154608b901622012'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Private source remains read-only
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_INSTALLED_QA_PRIVATE_READ_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT_OFFICE_SHA }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Parse installed GUI QA syntax without exposing source
        shell: pwsh
        run: |
          if((& git -C private-agent rev-parse HEAD).Trim() -cne $env:AGENT_OFFICE_SHA){
            throw 'AGENT06_INSTALLED_QA_PRIVATE_SOURCE_SHA_MISMATCH'
          }
          $source='private-agent/qualification/agent06/office/installed_office_gui_acceptance.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            [IO.Path]::GetFullPath($source),[ref]$tokens,[ref]$errors)
          foreach($issue in @($errors)){
            Write-Host ('AGENT06_INSTALLED_QA_PARSER_LINE='+$issue.Extent.StartLineNumber)
            Write-Host ('AGENT06_INSTALLED_QA_PARSER_ERROR_ID='+$issue.ErrorId)
          }
          if(@($errors).Count -ne 0){throw 'AGENT06_INSTALLED_QA_PWSH_PARSER_HOLD'}
          & python -B -c "import ast,pathlib; ast.parse(pathlib.Path('private-agent/qualification/agent06/office/installed_office_ui_fixture.py').read_text(encoding='utf-8'))"
          if($LASTEXITCODE -ne 0){throw 'AGENT06_INSTALLED_QA_PYTHON_SYNTAX_HOLD'}
          Write-Host 'AGENT06_INSTALLED_QA_PRIVATE_SOURCE_SYNTAX_PASS'
      - name: Verify installed Office fixture contract without publishing source
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          $privateLog=Join-Path $env:RUNNER_TEMP 'agent06-installed-fixture-private.txt'
          & python -m pip install --disable-pip-version-check --quiet pytest *> $privateLog
          if($LASTEXITCODE -ne 0){throw 'AGENT06_INSTALLED_FIXTURE_PYTEST_INSTALL_HOLD'}
          Push-Location private-agent
          try{
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_installed_office_fixture.py *> $privateLog
            if($LASTEXITCODE -ne 0){
              Write-Host 'AGENT06_INSTALLED_FIXTURE_CONTRACT_FAIL'
              throw 'AGENT06_INSTALLED_FIXTURE_CONTRACT_HOLD'
            }
            Write-Host 'AGENT06_INSTALLED_FIXTURE_CONTRACT_PASS'
          }finally{Pop-Location}
      - name: Verify operation-specific Office navigation and TypeScript build
        shell: pwsh
        timeout-minutes: 9
        run: |
          $ErrorActionPreference='Stop'
          Push-Location private-agent/desktop
          try{
            $log=Join-Path $env:RUNNER_TEMP 'agent06-office-nav-private.txt'
            & npm.cmd ci --no-audit --no-fund *> $log
            if($LASTEXITCODE -ne 0){throw 'AGENT06_OFFICE_NAV_DEPENDENCIES_HOLD'}
            & node.exe --test tests/office-task-entry.test.mjs *> $log
            if($LASTEXITCODE -ne 0){throw 'AGENT06_OFFICE_NAV_EXACT_OPERATION_TEST_HOLD'}
            Write-Host 'AGENT06_OFFICE_NAV_EXACT_OPERATION_TEST_PASS'
            & npm.cmd run build *> $log
            if($LASTEXITCODE -ne 0){throw 'AGENT06_OFFICE_NAV_TYPESCRIPT_BUILD_HOLD'}
            Write-Host 'AGENT06_OFFICE_NAV_TYPESCRIPT_BUILD_PASS'
          }finally{Pop-Location}
      # No artifacts, test documents, screenshots, EXE, source, or logs are published.
