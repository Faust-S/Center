# Public Center Windows runner, ephemeral read-only PRIVATE Agent source.
# Agent pin e45d62e8: verify reentrant original prepublication Core IPC.
# No private source, artifacts, file paths, logs, EXE or credentials uploaded.
name: Agent06 D6 original signed Exchange receipt qualification
on:
  push:
    branches:
      - work/2026-11-17-agent06-d6-signed-receipt-source-ci
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-d6-receipt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-receipt:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing authorized private Agent read access
        shell: pwsh
        env:
          SOURCE_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)){
            throw 'AGENT06_D6_PRIVATE_READ_GRANT_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: d403bdf009b21e3b62c13910be2f1d5c71dd8c7b
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      # Joint source boundary, one Windows runner, exact public owners.
      # This DOES NOT checkout private T3 or claim native signed G4 E2E.
      # Atlas sender-contract tests import ../t3-original from tests/,
      # so check out public T3 within Atlas (not as its workspace sibling).
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: dbb6606667cf0b2f6189ebb6f2fd1f70da197db6
          path: public-atlas
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 2d6079132e768437854c4663b9e452119af98dcd
          path: public-atlas/t3-original
          persist-credentials: false
      - name: Verify one real original T3 + Agent + Atlas source contract
        shell: pwsh
        run: |
          $t3=(& git -C public-atlas/t3-original rev-parse HEAD).Trim()
          $atlas=(& git -C public-atlas rev-parse HEAD).Trim()
          if($t3 -cne '2d6079132e768437854c4663b9e452119af98dcd' -or
             $atlas -cne 'dbb6606667cf0b2f6189ebb6f2fd1f70da197db6'){
            throw 'T3_ATLAS_CROSS_PRODUCT_SHA_MISMATCH'
          }
          $tests=@(
            @{code='T3_ORIGINAL_D6_SENDER'; path='public-atlas/t3-original/packages/t3-core/tests/t3-d6-native-agent-source-publisher.test.mjs'},
            @{code='ATLAS_T3_SENDER_CONTRACT'; path='public-atlas/tests/atlas09-original-t3-sender-contract.mjs'},
            @{code='ATLAS_T3_NATIVE_RECIPIENT'; path='public-atlas/tests/atlas-t3-original-d6-qualification.mjs'}
          )
          $env:ATLAS_T3_ORIGINAL_D6_MODULE=(Join-Path $env:GITHUB_WORKSPACE 'public-atlas/t3-original/packages/t3-core/src/t3/native-result-continuation.mjs')
          foreach($case in $tests){
            $log=Join-Path $env:RUNNER_TEMP ('t3-atlas-joint-'+$case.code+'-public.log')
            & node --test $case.path *> $log
            if($LASTEXITCODE -ne 0){
              Write-Host ('T3_ATLAS_'+$case.code+'_FAIL')
              throw 'T3_ATLAS_CROSS_PRODUCT_SOURCE_FAILED'
            }
            Write-Host ('T3_ATLAS_'+$case.code+'_PASS')
          }
          Write-Host 'T3_AGENT_ATLAS_QUALIFIED_PUBLIC_SOURCE_CONTRACT_PASS'
      - name: Confirm pinned owner and private file presence
        shell: pwsh
        run: |
          $actual=(& git -C private-agent rev-parse HEAD).Trim()
          if($actual -cne 'd403bdf009b21e3b62c13910be2f1d5c71dd8c7b'){
            throw 'AGENT06_D6_PRIVATE_SOURCE_SHA_CHANGED'
          }
          foreach($path in @('runtime/t3_original_result_owner.py',
            'runtime/t3_original_employee_port.py',
            'runtime/t3_original_employee_worker.mjs',
            'tests/test_agent06_original_t3_result_owner.py',
            'requirements-ci.txt')){
            if(!(Test-Path -LiteralPath (Join-Path private-agent $path) -PathType Leaf)){
              throw 'AGENT06_D6_PRIVATE_SOURCE_MISSING'
            }
          }
          Write-Host 'AGENT06_D6_PRIVATE_AGENT_SHA_VERIFIED'
      - name: Install private Agent test dependencies silently
        shell: pwsh
        run: |
          & python -m pip install -r private-agent/requirements-ci.txt *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-pip-private.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_DEPS_FAILED'}
      - name: Run complete original Agent Task Result and D6 proof regression
        shell: pwsh
        run: |
          Push-Location private-agent
          try {
            $stages=@(
              @{ code='BASE'; expr='existing_core or real_core_durable_queue or lost_ack or foreign_work_revision or changed_original_signed_task' },
              @{ code='PREPUBLICATION'; expr='prepublication or trusted_lazy_source_owner' },
              @{ code='RECOVER_PREPARED'; expr='cold_prepared_original or prepared_unverified_original or prepared_to_unissued or original_prepared_recovery' },
              @{ code='RECOVER_UNCERTAIN'; expr='unknown_employee_ack or unknown_employee_recovery' },
              @{ code='ACCEPTANCE'; expr='test_unaccepted_result_and_absent_original_kernel_owner_denied' },
              @{ code='READBACK'; expr='test_original_readback_and_exchange_are_required_twice' },
              @{ code='PROOF'; expr='test_original_exchange_cannot_confirm_weak_or_foreign_proofs' },
              @{ code='PUBLICATION'; expr='publication_uses or lost_original_export or prior_prepared or publication_requires or original_signed_denial' },
              @{ code='RECOVERY'; expr='no_original_publisher or corrupted_original_commit or no_foreign_kernel or real_agent_core_durable_job' }
            )
            $failed=$false
            foreach($stage in $stages){
              $log=Join-Path $env:RUNNER_TEMP ('agent06-d6-'+$stage.code+'-private.log')
              & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_original_t3_result_owner.py -k $stage.expr *> $log
              if($LASTEXITCODE -ne 0){
                $failed=$true
                $raw=Get-Content -LiteralPath $log -Raw
                $classes=@([regex]::Matches($raw,'(AssertionError|AttributeError|TypeError|ValueError|OSError|CorporateT3Error|KeyError|ImportError)') |
                  ForEach-Object { $_.Value } | Sort-Object -Unique)
                Write-Host ('AGENT06_D6_'+$stage.code+'_FAIL_CLASS='+($classes -join ','))
                if($stage.code -eq 'PROOF'){
                  $safe=[regex]::Match($raw,'T3_AGENT_D6_PROOF_CASE_[0-9]{2}_(WRONG_CODE|ACCEPTED)')
                  Write-Host ('AGENT06_D6_PROOF_SAFE_REASON='+$(if($safe.Success){$safe.Value}else{'NO_SAFE_CASE'}))
                }
              }else{
                Write-Host ('AGENT06_D6_'+$stage.code+'_PASS')
              }
            }
            if($failed){throw 'AGENT06_D6_RESULT_STAGE_FAILED'}
            Write-Host 'AGENT06_D6_ORIGINAL_OWNER_FULL_RESULT_TEST_PASS'
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_original_t3_denied_ipc.py *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-denied-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_DENIED_IPC_TEST_FAILED'}
            Write-Host 'AGENT06_D6_ORIGINAL_DENIED_IPC_PASS'
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_original_t3_reentrant_ipc.py *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-reentrant-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_REENTRANT_IPC_TEST_FAILED'}
            Write-Host 'AGENT06_D6_ORIGINAL_REENTRANT_CORE_IPC_PASS'
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_corporate_t3_employee.py *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-employee-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_CORPORATE_BASELINE_FAILED'}
            Write-Host 'AGENT06_D6_CORPORATE_EMPLOYEE_BASELINE_PASS'
            # Address the two newly changed, independent package owners
            # separately. Never expose private tracebacks, source paths,
            # credentials or installed artifacts in public output.
            foreach($probe in @(
              @{name='T2_ORIGINAL_PINNED_KERNEL_ORIGIN'; file='tests/test_agent06_t3_installed_kernel_origin.py'},
              @{name='T2_ORIGINAL_ONE_DIST_PACKAGE'; file='tests/test_agent06_t3_setup_payload.py'}
            )){
              $log=Join-Path $env:RUNNER_TEMP ('agent06-d6-'+$probe.name+'-private.log')
              & python -B -m pytest -q -p no:cacheprovider $probe.file *> $log
              if($LASTEXITCODE -ne 0){
                $text=Get-Content -LiteralPath $log -Raw
                # Only standard exception class, never assertion body.
                $safe=@([regex]::Matches($text,
                  '(?:AssertionError|AttributeError|TypeError|ValueError|InstalledT3PayloadError|FileNotFoundError|ModuleNotFoundError|KeyError|PermissionError)') |
                  ForEach-Object {$_.Value} | Sort-Object -Unique)
                Write-Host ('AGENT06_D6_'+$probe.name+'_FAIL_CLASS='+($safe -join ','))
                throw ('AGENT06_D6_'+$probe.name+'_FAILED')
              }
              Write-Host ('AGENT06_D6_'+$probe.name+'_PASS')
            }
            & node --check runtime/t3_original_employee_worker.mjs *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-worker-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_ORIGINAL_WORKER_SYNTAX_FAILED'}
            Write-Host 'AGENT06_D6_ORIGINAL_WORKER_SYNTAX_PASS'
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_t3_atlas_publication_surface.py *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-atlas-surface-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_ATLAS_PUBLICATION_SURFACE_FAILED'}
            Write-Host 'AGENT06_D6_ATLAS_PUBLICATION_SURFACE_PASS'
          } finally { Pop-Location }
      - name: Parse existing Agent Setup scripts and public T3 source lock
        shell: pwsh
        run: |
          Push-Location private-agent
          try {
            foreach($path in @(
                'tools/build_setup_core_windows_candidate.ps1',
                'qualification/phase1/build_native_windows_setup_candidate.ps1',
                'tools/qualify_explorer_windows_phase1_package.ps1')){
              $tokens=$null
              $errors=$null
              $null=[System.Management.Automation.Language.Parser]::ParseFile(
                (Resolve-Path $path),[ref]$tokens,[ref]$errors)
              if(@($errors).Count -ne 0){throw 'AGENT06_D6_SETUP_SCRIPT_SYNTAX_INVALID'}
            }
            & node scripts/prepare-public-modules.mjs --only-u04 --check *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-optional-u04-check-private.log')
            if($LASTEXITCODE -eq 0){
              Write-Host 'AGENT06_D6_ORIGINAL_SOURCE_LOCK_U04_CHECK_PASS'
            } else {
              # The source step has no prepared U04 checkout in this job.
              # Parse the lock through the same existing public source code,
              # not by fetching an unneeded private/native artifact.
              & node --input-type=module -e "import {readFileSync} from 'node:fs'; import {validateLock} from './scripts/prepare-public-modules.mjs'; validateLock(JSON.parse(readFileSync('./config/public-module-sources.json','utf8')));" *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-t3-lock-private.log')
              if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_PUBLIC_T3_SOURCE_LOCK_INVALID'}
              Write-Host 'AGENT06_D6_PUBLIC_T3_SOURCE_LOCK_PASS'
            }
            Write-Host 'AGENT06_D6_SETUP_SCRIPT_PARSE_PASS'
          } finally {Pop-Location}
      - name: Compile installed Agent corporate UI with original Atlas D6 controls
        shell: pwsh
        run: |
          Push-Location private-agent/desktop
          try {
            & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-npm-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_NPM_FAILED'}
            & npm.cmd run build *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-desktop-private.log')
            if($LASTEXITCODE -ne 0){
              $raw=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'agent06-d6-desktop-private.log') -Raw
              $codes=@([regex]::Matches($raw,'TS[0-9]{4}') | ForEach-Object { $_.Value } | Sort-Object -Unique)
              Write-Host ('AGENT06_D6_TYPESCRIPT_CODES='+($codes -join ','))
              throw 'AGENT06_D6_DESKTOP_BUILD_FAILED'
            }
            Write-Host 'AGENT06_D6_DESKTOP_TYPESCRIPT_VITE_PASS'
          } finally { Pop-Location }
      - name: Remove all private sources and diagnostics
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath private-agent -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'public-atlas/t3-original' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath public-atlas -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 't3-atlas-joint-*-public.log' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'agent06-d6-*-private.log' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host 'AGENT06_D6_PRIVATE_SOURCE_CLEANUP_DONE'
      # No upload-artifact, no source/log cache, no private workflow.
