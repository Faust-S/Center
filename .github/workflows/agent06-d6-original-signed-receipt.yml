# Public Center Windows runner, ephemeral read-only PRIVATE Agent source.
# No private source, artifacts, file paths, logs, EXE or credentials uploaded.
name: Agent06 D6 original signed Exchange receipt qualification
on:
  push:
    branches:
      - work/2026-11-17-agent06-d6-signed-receipt-source-ci
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-d6-receipt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-receipt:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing authorized private Agent read access
        shell: pwsh
        env:
          SOURCE_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)){
            throw 'AGENT06_D6_PRIVATE_READ_GRANT_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 6bdf1c06e7d3bba4766cef41b1e5a04865bb7f20
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Confirm pinned owner and private file presence
        shell: pwsh
        run: |
          $actual=(& git -C private-agent rev-parse HEAD).Trim()
          if($actual -cne '6bdf1c06e7d3bba4766cef41b1e5a04865bb7f20'){
            throw 'AGENT06_D6_PRIVATE_SOURCE_SHA_CHANGED'
          }
          foreach($path in @('runtime/t3_original_result_owner.py',
            'runtime/t3_original_employee_port.py',
            'runtime/t3_original_employee_worker.mjs',
            'tests/test_agent06_original_t3_result_owner.py',
            'requirements-ci.txt')){
            if(!(Test-Path -LiteralPath (Join-Path private-agent $path) -PathType Leaf)){
              throw 'AGENT06_D6_PRIVATE_SOURCE_MISSING'
            }
          }
          Write-Host 'AGENT06_D6_PRIVATE_AGENT_SHA_VERIFIED'
      - name: Install private Agent test dependencies silently
        shell: pwsh
        run: |
          & python -m pip install -r private-agent/requirements-ci.txt *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-pip-private.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_DEPS_FAILED'}
      - name: Run complete original Agent Task Result and D6 proof regression
        shell: pwsh
        run: |
          Push-Location private-agent
          try {
            $stages=@(
              @{ code='BASE'; expr='existing_core or real_core_durable_queue or lost_ack or foreign_work_revision or changed_original_signed_task' },
              @{ code='ACCEPTANCE'; expr='test_unaccepted_result_and_absent_original_kernel_owner_denied' },
              @{ code='READBACK'; expr='test_original_readback_and_exchange_are_required_twice' },
              @{ code='PROOF'; expr='test_original_exchange_cannot_confirm_weak_or_foreign_proofs' },
              @{ code='PUBLICATION'; expr='publication_uses or lost_original_export or prior_prepared or publication_requires or original_signed_denial' },
              @{ code='RECOVERY'; expr='no_original_publisher or corrupted_original_commit or no_foreign_kernel or real_agent_core_durable_job' }
            )
            $failed=$false
            foreach($stage in $stages){
              $log=Join-Path $env:RUNNER_TEMP ('agent06-d6-'+$stage.code+'-private.log')
              & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_original_t3_result_owner.py -k $stage.expr *> $log
              if($LASTEXITCODE -ne 0){
                $failed=$true
                $raw=Get-Content -LiteralPath $log -Raw
                $classes=@([regex]::Matches($raw,'(AssertionError|AttributeError|TypeError|ValueError|OSError|CorporateT3Error|KeyError|ImportError)') |
                  ForEach-Object { $_.Value } | Sort-Object -Unique)
                Write-Host ('AGENT06_D6_'+$stage.code+'_FAIL_CLASS='+($classes -join ','))
                if($stage.code -eq 'PROOF'){
                  $safe=[regex]::Match($raw,'T3_AGENT_D6_PROOF_CASE_[0-9]{2}_(WRONG_CODE|ACCEPTED)')
                  Write-Host ('AGENT06_D6_PROOF_SAFE_REASON='+$(if($safe.Success){$safe.Value}else{'NO_SAFE_CASE'}))
                }
              }else{
                Write-Host ('AGENT06_D6_'+$stage.code+'_PASS')
              }
            }
            if($failed){throw 'AGENT06_D6_RESULT_STAGE_FAILED'}
            Write-Host 'AGENT06_D6_ORIGINAL_OWNER_FULL_RESULT_TEST_PASS'
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_original_t3_denied_ipc.py *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-denied-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_DENIED_IPC_TEST_FAILED'}
            Write-Host 'AGENT06_D6_ORIGINAL_DENIED_IPC_PASS'
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_corporate_t3_employee.py *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-employee-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_CORPORATE_BASELINE_FAILED'}
            Write-Host 'AGENT06_D6_CORPORATE_EMPLOYEE_BASELINE_PASS'
            & node --check runtime/t3_original_employee_worker.mjs *> (Join-Path $env:RUNNER_TEMP 'agent06-d6-worker-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_D6_ORIGINAL_WORKER_SYNTAX_FAILED'}
            Write-Host 'AGENT06_D6_ORIGINAL_WORKER_SYNTAX_PASS'
          } finally { Pop-Location }
      - name: Remove all private sources and diagnostics
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath private-agent -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'agent06-d6-*-private.log' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Write-Host 'AGENT06_D6_PRIVATE_SOURCE_CLEANUP_DONE'
      # No upload-artifact, no source/log cache, no private workflow.
