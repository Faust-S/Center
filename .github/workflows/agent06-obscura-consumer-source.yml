# Public Center runner is the explicitly permitted source-qualification
# exception for private Agent. Never publish its code, artifacts, test output,
# temporary logs, executable, secrets, cache or model/user data.
name: Agent 0.6 Obscura source consumer qualification
on:
  push:
    branches:
      - work/2026-11-15-agent06-obscura-port-qualification
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent06-obscura-private-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-port:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout qualification harness (no product sources)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing approved read-only Agent credential
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        shell: bash
        run: |
          if [ -z "$PRIVATE_SOURCE_TOKEN" ]; then
            echo "AGENT06_PRIVATE_READ_UNAVAILABLE"
            exit 2
          fi
          echo "AGENT06_PRIVATE_READ_AVAILABLE"
      - name: Checkout exact private Agent source to ephemeral runner only
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: work/2026-11-15-agent06-obscura-consumer-optin
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - name: Checkout exact public Obscura/U01 source
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Br-test
          ref: afb49d5912b9f6ab8fc8054d8b554079a6bbda2e
          path: public-brtest
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact public and private SHAs without source output
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-agent rev-parse HEAD)" = "ee69c3c29f12d7afa8987268e41a27255ac168de"
          test "$(git -C public-brtest rev-parse HEAD)" = "afb49d5912b9f6ab8fc8054d8b554079a6bbda2e"
          echo "AGENT06_BOTH_SOURCES_EXACT_PASS"
      - name: Install private source test dependencies (no logs exported)
        shell: bash
        run: |
          set -euo pipefail
          if ! python -m pip install -r private-agent/requirements-ci.txt > "$RUNNER_TEMP/agent06-obscura-pip-private.log" 2>&1; then
            echo "AGENT06_PRIVATE_DEPENDENCIES_FAILED"
            exit 3
          fi
          echo "AGENT06_PRIVATE_DEPENDENCIES_PASS"
      - name: Download existing public native qualification candidate
        uses: actions/download-artifact@v4
        with:
          repository: Faust-S/Br-test
          run-id: 43724947827
          name: agent06-headless-${{ matrix.os }}
          github-token: ${{ github.token }}
          path: native-evidence
      - name: Require exact public native candidate files
        shell: bash
        run: |
          set -euo pipefail
          test -s native-evidence/candidate/candidate-manifest.json
          test -s native-evidence/candidate/obscura-*.zip || test -s native-evidence/candidate/obscura-*.tar.gz
          echo "AGENT06_NATIVE_ARTIFACT_AVAILABLE"
      - name: Source module imports and PA port contract, no native worker
        shell: bash
        run: |
          set -euo pipefail
          if ! python -B - > "$RUNNER_TEMP/agent06-obscura-import-private.log" 2>&1 <<'PY'
          import pathlib, sys
          root=pathlib.Path.cwd()
          sys.path[:0]=[
              str(root/'private-agent'),
              str(root/'public-brtest'/'agent-headless'),
              str(root/'public-brtest'/'universal-install'),
          ]
          from providers.tool_provider_port import TOOL_PROVIDER_CONTRACT_ID
          from providers.obscura_read_port import OptInObscuraWebCatalog
          from iwxa_obscura.agent_port import ObscuraAgentToolPort
          from iwxa_universal_install.obscura import ObscuraManagedBackend
          assert TOOL_PROVIDER_CONTRACT_ID == ObscuraAgentToolPort.contract_id
          assert callable(OptInObscuraWebCatalog)
          assert callable(ObscuraManagedBackend)
          PY
          then
            echo "AGENT06_PRIVATE_PUBLIC_PORT_IMPORT_FAILED"
            exit 4
          fi
          echo "AGENT06_PUBLIC_PRIVATE_IMPORT_PASS"
      - name: Test private read-only composition and unchanged port/U01 fixtures
        shell: bash
        working-directory: private-agent
        run: |
          set -euo pipefail
          if ! python -B -m pytest -q -p no:cacheprovider \
            tests/test_agent06_obscura_web_optin.py \
            tests/cells/test_tool_provider_port.py \
            tests/test_u01_owner_program_connection.py \
            tests/test_user_provider_settings.py \
            tests/test_fc3_provider_registry.py \
            > "$RUNNER_TEMP/agent06-obscura-pytest-private.log" 2>&1; then
            echo "AGENT06_PRIVATE_PORT_TEST_FAILED"
            exit 5
          fi
          echo "AGENT06_PRIVATE_PORT_TEST_PASS"
      - name: Regress original Task, Session and ToolRuntime before native replay
        shell: bash
        working-directory: private-agent
        run: |
          set -euo pipefail
          if ! python -B -m pytest -q -p no:cacheprovider \
            tests/test_daily_driver.py \
            tests/test_workspace_composer_integration.py \
            tests/test_tool_provider_layer.py \
            tests/test_interactive_task_list_status.py \
            > "$RUNNER_TEMP/agent06-original-task-regression-private.log" 2>&1; then
            echo "AGENT06_ORIGINAL_TASK_REGRESSION_FAILED"
            exit 8
          fi
          echo "AGENT06_ORIGINAL_TASK_REGRESSION_PASS"
      - name: Set up Node.js 22 for U01 packaging and Windows desktop source qualification
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Qualify pinned U01 package and original installed Python imports
        shell: bash
        run: |
          set -euo pipefail
          # The local public checkout is the exact source lock. No private
          # source leaves the ephemeral runner or becomes a GitHub artifact.
          export IWXA_PUBLIC_CHECKOUTS="$(python -c 'import os,json;print(json.dumps({"u01":os.path.join(os.environ["GITHUB_WORKSPACE"],"public-brtest")}))')"
          if ! node private-agent/scripts/prepare-public-modules.mjs --only-u01             > "$RUNNER_TEMP/agent06-private-u01-stage.log" 2>&1; then
            echo "AGENT06_U01_SOURCE_PREPARE_FAIL"
            exit 10
          fi
          export IWXA_AGENT06_U01_PREPARED="$GITHUB_WORKSPACE/private-agent/build/u01-owner-sources"
          if ! (cd private-agent && python -B -m pytest -q -s -p no:cacheprovider \
            tests/test_agent06_u01_public_sources.py -k PinnedU01SourceTests) \
            > "$RUNNER_TEMP/agent06-private-u01-unit.log" 2>&1; then
            echo "AGENT06_U01_RECEIPT_AND_PACKAGE_UNIT_FAIL"
            exit 11
          fi
          echo "AGENT06_U01_RECEIPT_AND_PACKAGE_UNIT_PASS"
          if ! (cd private-agent && python -B -m pytest -q -s -p no:cacheprovider \
            tests/test_agent06_u01_public_sources.py -k ActualOwnerU01InPackageTests) \
            > "$RUNNER_TEMP/agent06-private-u01-cold-import.log" 2>&1; then
            echo "AGENT06_U01_ACTUAL_OWNER_COLD_IMPORT_FAIL"
            exit 12
          fi
          if ! grep -Fq 'AGENT06_U01_INSTALLED_IMPORT_PASS' \
            "$RUNNER_TEMP/agent06-private-u01-cold-import.log"; then
            echo "AGENT06_U01_INSTALLED_IMPORT_MISSING"
            exit 13
          fi
          echo "AGENT06_U01_PINNED_INSTALLED_IMPORT_PASS"
          if ! (cd private-agent && python -B -m pytest -q -p no:cacheprovider \
            tests/test_agent06_obscura_user_install.py \
            -k 'not cold_restart and not origin_selection and not saved_source and not engine_uses') \
            > "$RUNNER_TEMP/agent06-private-u01-install-contract.log" 2>&1; then
            echo "AGENT06_U01_INSTALL_CONSENT_BASE_FAIL"
            exit 14
          fi
          echo "AGENT06_U01_INSTALL_CONSENT_BASE_PASS"
          if ! (cd private-agent && python -B -m pytest -q -p no:cacheprovider \
            tests/test_agent06_obscura_user_install.py \
            -k 'cold_restart or origin_selection or saved_source or engine_uses') \
            > "$RUNNER_TEMP/agent06-private-u01-origin-connection.log" 2>&1; then
            echo "AGENT06_U01_ORIGIN_CONNECTION_FAIL"
            exit 15
          fi
          echo "AGENT06_U01_ORIGIN_CONNECTION_PASS"
          echo "AGENT06_U01_USER_INSTALL_CONTRACT_PASS"
      - name: TypeScript and Vite desktop build of exact private Agent source
        if: runner.os == 'Windows'
        working-directory: private-agent/desktop
        shell: pwsh
        run: |
          & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'agent06-private-npm-install.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_PRIVATE_NPM_INSTALL_FAILED'}
          & npm.cmd run build *> (Join-Path $env:RUNNER_TEMP 'agent06-private-desktop-build.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_PRIVATE_DESKTOP_BUILD_FAILED'}
          Write-Host 'AGENT06_PRIVATE_DESKTOP_BUILD_PASS'
          & node.exe --test tests/agent05-owner-source-lock.test.mjs *> (Join-Path $env:RUNNER_TEMP 'agent06-private-u01-owner-lock-test.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_U01_DESKTOP_OWNER_LOCK_FAILED'}
          Write-Host 'AGENT06_U01_DESKTOP_OWNER_LOCK_PASS'
          & npm.cmd test *> (Join-Path $env:RUNNER_TEMP 'agent06-private-desktop-node-tests.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_PRIVATE_DESKTOP_TEST_FAILED'}
          Write-Host 'AGENT06_PRIVATE_DESKTOP_TEST_PASS'
      - name: Test native U01 install, real ToolRuntime read and cold TRR readback
        shell: bash
        working-directory: private-agent
        env:
          IWXA_AGENT06_NATIVE_EVIDENCE_DIR: ${{ github.workspace }}/native-evidence
          IWXA_AGENT06_PUBLIC_ROOT: ${{ github.workspace }}/public-brtest
        run: |
          set -euo pipefail
          if ! python -B -m pytest -q -s -p no:cacheprovider \
            tests/test_agent06_obscura_native_read.py \
            > "$RUNNER_TEMP/agent06-native-private.log" 2>&1; then
            # Only fixed tokens from the approved test source, never
            # private paths, stack traces or actual page contents.
            grep -E '^AGENT06_NATIVE_STAGE_[A-Z0-9_]+$' \
              "$RUNNER_TEMP/agent06-native-private.log" || true
            echo "AGENT06_NATIVE_TOOLRUNTIME_READ_FAILED"
            exit 6
          fi
          # Require explicit execution of the full real Engine scenario.
          # A skipped native test must never be reported as PASS.
          for milestone in ENGINE_T3_GUARD_PASS ENGINE_RECEIPT_TO_DRAFT_PASS ENGINE_TRR_CONTEXT_PROVENANCE_PASS ENGINE_TASK_REVIEW_PASS ENGINE_COLD_RESULT_PASS ENGINE_IWXA_INDEPENDENT_IMPORT_PASS ENGINE_LIVE_SWITCH_PASS ENGINE_NONE_RESTART_PASS ENGINE_FIRECRAWL_RESTART_PASS; do
            if ! grep -Fq "AGENT06_NATIVE_STAGE_$milestone" "$RUNNER_TEMP/agent06-native-private.log"; then
              echo "AGENT06_NATIVE_QUALIFICATION_STAGE_MISSING"
              exit 7
            fi
          done
          echo "AGENT06_NATIVE_ENGINE_FULL_SWITCH_PASS"
          echo "AGENT06_NATIVE_TOOLRUNTIME_READ_TRR_COLD_PASS"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            if ! python -B -m pytest -q -s -p no:cacheprovider \
              tests/test_agent06_obscura_native_first_user_flow.py \
              > "$RUNNER_TEMP/agent06-firstuser-real-native-private.log" 2>&1; then
              grep -E '^AGENT06_FIRSTUSER_[A-Z0-9_]+_PASS$' \
                "$RUNNER_TEMP/agent06-firstuser-real-native-private.log" || true
              echo "AGENT06_FIRSTUSER_NATIVE_FLOW_FAILED"
              exit 16
            fi
            for milestone in REAL_U01_INSTALL REAL_ORIGIN_CONSENT REAL_CORE_COLD_SELECTION REAL_HTTPS_READ REAL_RESULT_COLD MISSING_BINARY_CORE_RECOVERY; do
              if ! grep -Fq "AGENT06_FIRSTUSER_${milestone}_PASS" "$RUNNER_TEMP/agent06-firstuser-real-native-private.log"; then
                echo "AGENT06_FIRSTUSER_NATIVE_MILESTONE_MISSING"
                exit 17
              fi
            done
            echo "AGENT06_FIRSTUSER_NATIVE_FULL_COLD_PASS"
          fi
      # Absolutely no actions/upload-artifact, actions/cache, private source
      # binary distribution, workspace dump, diagnostic upload or raw test logs.
