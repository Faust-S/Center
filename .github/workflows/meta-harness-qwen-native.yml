name: Qwen Code native ACP public qualification
on:
  push:
    branches: [work/2026-11-24-meta-harness-source-qualification]
    paths:
      - .ci/meta-harness/requests/diagnostic-acp.json
concurrency:
  group: meta-harness-qwen-native-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Native protocol and real local model, public synthetic input only
        run: python qualification/meta_harness_qwen_native.py
