name: Agent 0.6.3 and original T3 corporate seat qualification
on:
  push:
    branches: ['work/2026-11-24-agent063-corporate-seat-qualification']
    paths: ['.github/workflows/agent063-corporate-seat-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent063-corporate-seat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-and-one-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      AGENT_PIN: '722c1b9d1e759d5d117f6811650c64c731ba753a'
      CORE_PIN: 'd89ec3ead3e660a7865043d1ecacd7f2b259f6cc'
    steps:
      - name: Require the existing authorized source grant
        shell: pwsh
        env:
          READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:READ_TOKEN)){throw 'PRIVATE_READ_GRANT_UNAVAILABLE'}
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT_PIN }}
          path: agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: ${{ env.CORE_PIN }}
          path: one-core
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source revisions
        id: pins
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($pair in @(@('agent',$env:AGENT_PIN),@('one-core',$env:CORE_PIN))){
            if((& git -C $pair[0] rev-parse HEAD).Trim() -cne $pair[1]){throw 'SOURCE_PIN_MISMATCH'}
          }
          Write-Host 'SOURCE_PINS=PASS'
      - name: Execute original worker IPC and original One Core seat policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $results=@()
          function Run-Suite($label,$root,$files){
            $log=Join-Path $env:RUNNER_TEMP "agent-seat-$label-private.log"
            Push-Location $root
            try {
              & node --test @files *> $log
              $exit=$LASTEXITCODE
              $raw=Get-Content -LiteralPath $log -Raw
              foreach($key in @('tests','pass','fail','cancelled','skipped')){
                $m=[regex]::Matches($raw,"(?m)^# $key (\d+)\s*$")
                if($m.Count -gt 0){Write-Host ($label+'_'+$key.ToUpperInvariant()+'='+$m[$m.Count-1].Groups[1].Value)}
              }
              $pass=[regex]::Matches($raw,'(?m)^# pass (\d+)\s*$')
              $fail=[regex]::Matches($raw,'(?m)^# fail (\d+)\s*$')
              $good=$exit -eq 0 -and $pass.Count -gt 0 -and $fail.Count -gt 0 -and [int]$pass[$pass.Count-1].Groups[1].Value -gt 0 -and [int]$fail[$fail.Count-1].Groups[1].Value -eq 0
              Write-Host ($label+'='+$(if($good){'PASS'}else{'FAIL'}))
              if(!$good){
                $indices=@([regex]::Matches($raw,'(?m)^not ok (\d+)') | ForEach-Object {$_.Groups[1].Value} | Select-Object -First 20)
                Write-Host ($label+'_FAILED_ORDINALS='+($indices -join ','))
              }
              return $good
            } finally {Pop-Location}
          }
          $results+=Run-Suite 'AGENT_WORKER' 'agent' @('tests/test_agent063_original_registry_refresh.test.mjs','tests/test_agent06_original_t3_large_ipc.test.mjs','tests/test_agent063_original_task_catalog.test.mjs')
          $results+=Run-Suite 'ONE_CORE_SEATS' 'one-core/packages/t3-core' @('tests/t3-corporate-product-license.test.mjs')
          if($results -contains $false){throw 'CORPORATE_SOURCE_REGRESSION_FAILED'}
      - name: Execute Python employee port, native chooser and interaction tests
        if: ${{ !cancelled() && steps.pins.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          Push-Location agent
          try{
            $log=Join-Path $env:RUNNER_TEMP 'agent-seat-pip-private.log'
            & python -m pip install -q -r requirements-ci.txt *> $log
            if($LASTEXITCODE -ne 0){throw 'PYTHON_DEPENDENCIES_FAILED'}
            $log=Join-Path $env:RUNNER_TEMP 'agent-seat-python-private.log'
            & python -m pytest -q tests/test_agent06_corporate_t3_employee.py tests/test_agent063_employee_path_picker.py tests/test_agent06_t3_setup_payload.py tests/test_work_areas_interaction.py *> $log
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $log -Raw
            foreach($key in @('passed','failed','skipped','errors')){
              $m=[regex]::Matches($raw,"(\d+) $key\b")
              Write-Host ('PYTHON_'+$key.ToUpperInvariant()+'='+$(if($m.Count){$m[$m.Count-1].Groups[1].Value}else{'0'}))
            }
            $failures=@([regex]::Matches($raw,'(?m)^FAILED (?:tests[/\\])?(test_agent06_corporate_t3_employee|test_agent063_employee_path_picker|test_agent06_t3_setup_payload|test_work_areas_interaction)\.py::([A-Za-z0-9_]+)(?:::([A-Za-z0-9_]+))?')|ForEach-Object{$_.Groups[1].Value+':'+$_.Groups[2].Value+':'+$_.Groups[3].Value})
            if($failures.Count){Write-Host ('PYTHON_CASES='+($failures -join ','))}
            if($exit -ne 0){throw 'PYTHON_QUALIFICATION_FAILED'}
          }finally{Pop-Location}
      - name: Execute original desktop UI flow and full desktop build
        if: ${{ !cancelled() && steps.pins.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $npm=if($IsWindows){'npm.cmd'}else{'npm'}
          Push-Location agent/desktop
          try{
            $install=Join-Path $env:RUNNER_TEMP 'agent-seat-install-private.log'
            & $npm ci --no-audit --no-fund *> $install
            if($LASTEXITCODE -ne 0){throw 'DESKTOP_INSTALL_FAILED'}
            Write-Host 'DESKTOP_INSTALL=PASS'
            $focused=Join-Path $env:RUNNER_TEMP 'agent-seat-desktop-focused-private.log'
            & node --test tests/corporate-work-flow.test.mjs *> $focused
            $focusedExit=$LASTEXITCODE
            $focusedRaw=Get-Content -LiteralPath $focused -Raw
            foreach($key in @('tests','pass','fail')){
              $m=[regex]::Matches($focusedRaw,"(?m)^# $key (\d+)\s*$")
              if($m.Count){Write-Host ('CORPORATE_UI_'+$key.ToUpperInvariant()+'='+$m[$m.Count-1].Groups[1].Value)}
            }
            $log=Join-Path $env:RUNNER_TEMP 'agent-seat-desktop-private.log'
            & node --test *> $log
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $log -Raw
            foreach($key in @('tests','pass','fail','cancelled','skipped')){
              $m=[regex]::Matches($raw,"(?m)^# $key (\d+)\s*$")
              if($m.Count -gt 0){Write-Host ('DESKTOP_'+$key.ToUpperInvariant()+'='+$m[$m.Count-1].Groups[1].Value)}
            }
            if($exit -ne 0){
              $indices=@([regex]::Matches($raw,'(?m)^not ok (\d+)') | ForEach-Object {$_.Groups[1].Value} | Select-Object -First 20)
              Write-Host ('DESKTOP_FAILED_ORDINALS='+($indices -join ','))
              foreach($match in [regex]::Matches($raw,'(?ms)^not ok (\d+)[^\n]*\n.*?location: [^\r\n]*[/\\]([A-Za-z0-9_.-]+\.test\.mjs):(\d+):(\d+)')){
                Write-Host ('DESKTOP_FAILED_LOCATION='+$match.Groups[1].Value+':'+$match.Groups[2].Value+':'+$match.Groups[3].Value+':'+$match.Groups[4].Value)
              }
            }
            $build=Join-Path $env:RUNNER_TEMP 'agent-seat-build-private.log'
            & $npm run build *> $build
            $built=$LASTEXITCODE -eq 0
            Write-Host ('DESKTOP_BUILD='+$(if($built){'PASS'}else{'FAIL'}))
            if(!$built){
              $raw=Get-Content -LiteralPath $build -Raw
              foreach($m in [regex]::Matches($raw,'(?m)(corporate-work-control|corporate-work-flow)\.tsx?\((\d+),(\d+)\): error (TS\d+)')){
                Write-Host ('CORPORATE_BUILD_DIAGNOSTIC='+$m.Groups[1].Value+':'+$m.Groups[2].Value+':'+$m.Groups[3].Value+':'+$m.Groups[4].Value)
              }
            }
            if($exit -ne 0 -or $focusedExit -ne 0 -or !$built){throw 'DESKTOP_QUALIFICATION_FAILED'}
          }finally{Pop-Location}
      - name: Remove transient private checkouts and private logs
        if: always()
        shell: pwsh
        run: |
          foreach($p in @('agent')){Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue}
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'agent-seat-*-private.*' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'PRIVATE_CLEANUP=COMPLETE'
  original-t3-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      IWXA_EXPECTED_T3: '6745f64dc92575ba8567e9fad838bb5206967656'
      IWXA_EXPECTED_ONE_CORE: 'd89ec3ead3e660a7865043d1ecacd7f2b259f6cc'
    steps:
      - name: Require the previously authorized private source grant
        shell: pwsh
        env:
          SOURCE_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:SOURCE_READ_TOKEN)){
            throw 'T3_CORPORATE_PRIVATE_READ_GRANT_UNAVAILABLE'
          }
          Write-Host 'T3_CORPORATE_READ_GRANT_PRESENT'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: d89ec3ead3e660a7865043d1ecacd7f2b259f6cc
          path: public-one-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: 6745f64dc92575ba8567e9fad838bb5206967656
          path: private-t3
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact original sources
        id: t3pins
        shell: pwsh
        run: |
          $actualT3=(& git -C private-t3 rev-parse HEAD).Trim()
          $actualCore=(& git -C public-one-core rev-parse HEAD).Trim()
          if($actualT3 -cne $env:IWXA_EXPECTED_T3 -or $actualCore -cne $env:IWXA_EXPECTED_ONE_CORE){
            throw 'T3_CORPORATE_SOURCE_PIN_MISMATCH'
          }
          Write-Host 'T3_CORPORATE_ORIGINAL_SOURCE_PINS_VERIFIED'
      - name: Source regression and native Windows credential tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 't3-corporate-tests-private.log'
          Push-Location private-t3
          try {
            $files=@(Get-ChildItem -LiteralPath tests -Filter 'access-product-license*.test.mjs' -File |
              Sort-Object Name | ForEach-Object {$_.FullName})
            $files+=@('tests/control-admin-interop.test.mjs','tests/multi-employee-provisioning.test.mjs')
            if($files.Count -lt 15){throw 'T3_CORPORATE_REGRESSION_SOURCE_MISSING'}
            & node --test @files *> $log
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $log -Raw
            # Fixed numeric TAP counters only, never raw private output.
            foreach($n in @('tests','pass','fail','cancelled','skipped')){
              $m=[regex]::Matches($raw,"(?m)^# $n (\d+)\s*$")
              if($m.Count -gt 0){Write-Host ("T3_CORPORATE_TEST_"+$n.ToUpperInvariant()+"="+$m[$m.Count-1].Groups[1].Value)}
            }
            if($exit -ne 0){
              $indices=@([regex]::Matches($raw,'(?m)^not ok (\d+)') | ForEach-Object {$_.Groups[1].Value} | Select-Object -First 20)
              Write-Host ("T3_CORPORATE_FAILED_TEST_ORDINALS="+($indices -join ','))
              # Diagnostic allowlist: file basename, line and fixed machine
              # error code only, never private source, values or stack text.
              $blocks=[regex]::Split($raw,'(?m)(?=^not ok \d+ )')
              foreach($block in $blocks){
                if($block -notmatch '^not ok (\d+) '){continue}
                $index=$Matches[1]
                $loc=[regex]::Match($block,'(?m)^\s*location: [^\r\n]*[/\\]([a-zA-Z0-9_.-]+\.test\.mjs):(\d+):(\d+)')
                if($loc.Success){Write-Host ('T3_FAILED_LOCATION='+$index+':'+$loc.Groups[1].Value+':'+$loc.Groups[2].Value+':'+$loc.Groups[3].Value)}
                $code=[regex]::Match($block,"(?m)^\s*(?:error|code):\s*['\x22]?((?:ERR_|INTEROP_|T3_|CORP_|CORPORATE_|ACCESS_)[A-Z0-9_]{3,100})")
                if($code.Success){Write-Host ('T3_FAILED_CODE='+$index+':'+$code.Groups[1].Value)}
              }
              throw 'T3_CORPORATE_PRIVATE_REGRESSION_FAILED'
            }
            Write-Host 'T3_CORPORATE_PRIVATE_REGRESSION_PASS'
          } finally {Pop-Location}
      - name: Real One Core Ed25519 and original encrypted Store qualification
        if: ${{ !cancelled() && steps.t3pins.outcome == 'success' }}
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 't3-corporate-onecore-private.log'
          $out=Join-Path $env:RUNNER_TEMP 't3-corporate-onecore-private.json'
          $core=(Resolve-Path public-one-core).Path
          & node private-t3/scripts/qualify-corporate-product-consumer-one-core.mjs $core 1>$out 2>$log
          if($LASTEXITCODE -ne 0){
            $raw=Get-Content -LiteralPath $log -Raw
            $m=[regex]::Matches($raw,'qualify-corporate-product-consumer-one-core\.mjs:(\d+):(\d+)')
            if($m.Count -gt 0){Write-Host ("T3_CORPORATE_QUALIFIER_LINE="+$m[0].Groups[1].Value)}
            throw 'T3_CORPORATE_REAL_ONE_CORE_FAILED'
          }
          $r=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if($r.result -ne 'PASS' -or [int]$r.checks -lt 9 -or
             $r.productionActivation -ne $false -or $r.nativeQualification -ne 'NOT_RUN'){
            throw 'T3_CORPORATE_REAL_ONE_CORE_RECEIPT_INVALID'
          }
          Write-Host ("T3_CORPORATE_REAL_ONE_CORE_PASS="+[int]$r.checks)
      - uses: oven-sh/setup-bun@v2
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.t3pins.outcome == 'success' }}
        with:
          bun-version: '1.3.4'
      - name: Compile exact release Consumer entry and qualify real Windows DPAPI
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.t3pins.outcome == 'success' }}
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 't3-corporate-compiled-private.log'
          $out=Join-Path $env:RUNNER_TEMP 't3-corporate-compiled-private.json'
          $core=(Resolve-Path public-one-core).Path
          & node private-t3/scripts/qualify-corporate-product-consumer-compiled.mjs $core 1>$out 2>$log
          if($LASTEXITCODE -ne 0){
            $raw=Get-Content -LiteralPath $log -Raw
            foreach($name in @('qualify-corporate-product-consumer-compiled','qualify-corporate-product-consumer-one-core')){
              $m=[regex]::Matches($raw,([regex]::Escape($name)+'\.mjs:(\d+):(\d+)'))
              if($m.Count -gt 0){Write-Host ("T3_CORPORATE_PRIVATE_LINE_"+$name+"="+$m[0].Groups[1].Value)}
            }
            throw 'T3_CORPORATE_COMPILED_NATIVE_QUALIFICATION_FAILED'
          }
          $r=Get-Content -LiteralPath $out -Raw | ConvertFrom-Json
          if($r.result -ne 'PASS' -or [int]$r.sourceChecks -lt 9 -or
            [int]$r.nativeChecks -lt 10 -or $r.exeSha256 -cnotmatch '^[a-f0-9]{64}$' -or
            $r.productionActivation -ne $false -or $r.assignablePersonalAgentSeats -ne 0){
            throw 'T3_CORPORATE_COMPILED_NATIVE_RECEIPT_INVALID'
          }
          Write-Host ("T3_CORPORATE_COMPILED_DPAPI_ED25519_PASS="+[int]$r.nativeChecks)
          Write-Host ("T3_CORPORATE_QUALIFIED_EXE_SHA256="+$r.exeSha256)
      - name: Discard private sources and all transient test logs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath private-t3 -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 't3-corporate-*-private.*' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter 'iwxa-corporate-compiled-*' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter 'iwxa-t3-corporate-*' -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'T3_CORPORATE_PRIVATE_CLEANUP_FINISHED'
# No private artifacts, logs, caches, releases, installers or source publication.
