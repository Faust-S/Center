name: Agent 0.6.3 original corporate seat qualification
on:
  push:
    branches: ['work/2026-11-24-agent063-corporate-seat-qualification']
    paths: ['.github/workflows/agent063-corporate-seat-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent063-corporate-seat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-and-one-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      AGENT_PIN: '1fabe161b278de032cddfbe37b1da7cbd52decba'
      CORE_PIN: 'd89ec3ead3e660a7865043d1ecacd7f2b259f6cc'
    steps:
      - name: Require the existing authorized source grant
        shell: pwsh
        env:
          READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:READ_TOKEN)){throw 'PRIVATE_READ_GRANT_UNAVAILABLE'}
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 1fabe161b278de032cddfbe37b1da7cbd52decba
          path: agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: d89ec3ead3e660a7865043d1ecacd7f2b259f6cc
          path: one-core
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact source revisions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($pair in @(@('agent',$env:AGENT_PIN),@('one-core',$env:CORE_PIN))){
            if((& git -C $pair[0] rev-parse HEAD).Trim() -cne $pair[1]){throw 'SOURCE_PIN_MISMATCH'}
          }
          Write-Host 'SOURCE_PINS=PASS'
      - name: Execute original worker IPC and original One Core seat policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $results=@()
          function Run-Suite($label,$root,$files){
            $log=Join-Path $env:RUNNER_TEMP "agent-seat-$label-private.log"
            Push-Location $root
            try {
              & node --test @files *> $log
              $exit=$LASTEXITCODE
              $raw=Get-Content -LiteralPath $log -Raw
              foreach($key in @('tests','pass','fail','cancelled','skipped')){
                $m=[regex]::Matches($raw,"(?m)^# $key (\d+)\s*$")
                if($m.Count -gt 0){Write-Host ($label+'_'+$key.ToUpperInvariant()+'='+$m[$m.Count-1].Groups[1].Value)}
              }
              $pass=[regex]::Matches($raw,'(?m)^# pass (\d+)\s*$')
              $fail=[regex]::Matches($raw,'(?m)^# fail (\d+)\s*$')
              $good=$exit -eq 0 -and $pass.Count -gt 0 -and $fail.Count -gt 0 -and [int]$pass[$pass.Count-1].Groups[1].Value -gt 0 -and [int]$fail[$fail.Count-1].Groups[1].Value -eq 0
              Write-Host ($label+'='+$(if($good){'PASS'}else{'FAIL'}))
              if(!$good){
                $indices=@([regex]::Matches($raw,'(?m)^not ok (\d+)') | ForEach-Object {$_.Groups[1].Value} | Select-Object -First 20)
                Write-Host ($label+'_FAILED_ORDINALS='+($indices -join ','))
              }
              return $good
            } finally {Pop-Location}
          }
          $results+=Run-Suite 'AGENT_WORKER' 'agent' @('tests/test_agent063_original_registry_refresh.test.mjs','tests/test_agent06_original_t3_large_ipc.test.mjs','tests/test_agent063_original_task_catalog.test.mjs')
          $results+=Run-Suite 'ONE_CORE_SEATS' 'one-core/packages/t3-core' @('tests/t3-corporate-product-license.test.mjs')
          if($results -contains $false){throw 'CORPORATE_SOURCE_REGRESSION_FAILED'}
      - name: Execute original desktop UI flow and full desktop build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$false
          $npm=if($IsWindows){'npm.cmd'}else{'npm'}
          Push-Location agent/desktop
          try{
            $install=Join-Path $env:RUNNER_TEMP 'agent-seat-install-private.log'
            & $npm ci --no-audit --no-fund *> $install
            if($LASTEXITCODE -ne 0){throw 'DESKTOP_INSTALL_FAILED'}
            Write-Host 'DESKTOP_INSTALL=PASS'
            $log=Join-Path $env:RUNNER_TEMP 'agent-seat-desktop-private.log'
            & node --test *> $log
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $log -Raw
            foreach($key in @('tests','pass','fail','cancelled','skipped')){
              $m=[regex]::Matches($raw,"(?m)^# $key (\d+)\s*$")
              if($m.Count -gt 0){Write-Host ('DESKTOP_'+$key.ToUpperInvariant()+'='+$m[$m.Count-1].Groups[1].Value)}
            }
            if($exit -ne 0){
              $indices=@([regex]::Matches($raw,'(?m)^not ok (\d+)') | ForEach-Object {$_.Groups[1].Value} | Select-Object -First 20)
              Write-Host ('DESKTOP_FAILED_ORDINALS='+($indices -join ','))
            }
            $build=Join-Path $env:RUNNER_TEMP 'agent-seat-build-private.log'
            & $npm run build *> $build
            $built=$LASTEXITCODE -eq 0
            Write-Host ('DESKTOP_BUILD='+$(if($built){'PASS'}else{'FAIL'}))
            if(!$built){
              $raw=Get-Content -LiteralPath $build -Raw
              foreach($m in [regex]::Matches($raw,'(?m)(corporate-work-control|corporate-work-flow)\.tsx?\((\d+),(\d+)\): error (TS\d+)')){
                Write-Host ('CORPORATE_BUILD_DIAGNOSTIC='+$m.Groups[1].Value+':'+$m.Groups[2].Value+':'+$m.Groups[3].Value+':'+$m.Groups[4].Value)
              }
            }
            if($exit -ne 0 -or !$built){throw 'DESKTOP_QUALIFICATION_FAILED'}
          }finally{Pop-Location}
      - name: Remove transient private checkouts and private logs
        if: always()
        shell: pwsh
        run: |
          foreach($p in @('agent')){Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue}
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'agent-seat-*-private.*' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'PRIVATE_CLEANUP=COMPLETE'
# Private T3 checkout returned HTTP 403 in run 45374238638. Keep the Agent/One Core checks independent.
# No private artifacts, logs, caches, releases, installers or source publication.
