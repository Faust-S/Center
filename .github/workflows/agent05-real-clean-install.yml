name: Agent 0.5 real clean install Windows
# Final qualification includes the occupied default-folder selection fix.
# No private source, binaries, model data or detailed logs are uploaded.

on:
  push:
    branches:
      - work/2026-11-14-setup-core-real-install-fix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent05-real-clean-install
  cancel-in-progress: true

jobs:
  short-path-build-only:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          path: center-owner
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 34e4303231c922584bc045d6a89cd518f7fb406b
          path: private-product
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout exact source into short Windows paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='C:\i5'
          if(Test-Path -LiteralPath $base){throw 'AGENT05_SHORT_ROOT_UNAVAILABLE'}
          New-Item -ItemType Directory -Path $base | Out-Null
          $a=Join-Path $base 'a'
          $c=Join-Path $base 'c'
          $privateLog=Join-Path $env:RUNNER_TEMP 'agent05-short-root-checkout-private.log'
          & git -c core.longpaths=true clone --no-checkout (Resolve-Path 'private-product').Path $a *> $privateLog
          if($LASTEXITCODE -ne 0){throw 'AGENT05_SHORT_ROOT_AGENT_CLONE_FAILED'}
          & git -C $a -c core.longpaths=true checkout --detach 34e4303231c922584bc045d6a89cd518f7fb406b *> $privateLog
          if($LASTEXITCODE -ne 0){throw 'AGENT05_SHORT_ROOT_AGENT_CHECKOUT_FAILED'}
          & git -c core.longpaths=true clone --no-checkout (Resolve-Path 'center-owner').Path $c *> $privateLog
          if($LASTEXITCODE -ne 0){throw 'AGENT05_SHORT_ROOT_CENTER_CLONE_FAILED'}
          & git -C $c -c core.longpaths=true checkout --detach $env:GITHUB_SHA *> $privateLog
          if($LASTEXITCODE -ne 0){throw 'AGENT05_SHORT_ROOT_CENTER_CHECKOUT_FAILED'}
          $gotA=(& git -C $a rev-parse HEAD).Trim()
          $gotC=(& git -C $c rev-parse HEAD).Trim()
          if($gotA -cne '34e4303231c922584bc045d6a89cd518f7fb406b' -or
              $gotC -cne $env:GITHUB_SHA){throw 'AGENT05_SHORT_ROOT_IDENTITY_FAILED'}
          Write-Host 'AGENT05_SHORT_ROOT_CHECKOUT_PASS'
      - name: Targeted Core install regression
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'agent05-regression-private.log'
          Push-Location private-product
          try{
            & python -m pip install -r requirements-ci.txt *> $log
            if($LASTEXITCODE -ne 0){throw 'AGENT05_PYTHON_DEPENDENCIES_FAILED'}
            & python -B -m pytest -q -p no:cacheprovider tests/test_setup_core_install_bridge.py tests/test_windows_install_authority.py tests/test_windows_user_runtime_readiness.py tests/test_explorer_windows_bootstrap.py tests/test_agent05_native_bootstrap_errors.py *> $log
            if($LASTEXITCODE -ne 0){
              $raw=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
              $failed='UNKNOWN'
              if($raw -match '([0-9]{1,5}) failed'){$failed=$Matches[1]}
              Write-Host ('AGENT05_INSTALL_PYTHON_FAILED_COUNT='+$failed)
              throw 'AGENT05_INSTALL_REGRESSION_FAILED'
            }
            Write-Host 'AGENT05_INSTALL_REGRESSION_PASS'
          }finally{Pop-Location}
      - name: Build Setup only and inspect its own receipt (no tests, no upload)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script='C:\i5\c\qualification\agent05-build-only.ps1'
          $logs=Join-Path $env:RUNNER_TEMP 'agent05-short-build-private.log'
          $errors=$null
          $tokens=$null
          [void][Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -ne 0){throw 'AGENT05_SHORT_ROOT_BUILDER_PARSE_FAILED'}
          & pwsh -NoProfile -NonInteractive -File $script -AgentRoot 'C:\i5\a' -OutputRoot 'C:\i5\o' *> $logs
          if($LASTEXITCODE -ne 0){
            $raw=Get-Content -LiteralPath $logs -Raw -ErrorAction SilentlyContinue
            $phase='UNKNOWN'
            $reason='UNKNOWN'
            if($raw -match 'AGENT05_BUILD_ONLY_FAIL_STAGE=([A-Z_]+)'){$phase=$Matches[1]}
            if($raw -match 'AGENT05_BUILD_ONLY_FAIL_REASON=([a-z0-9_]+)'){$reason=$Matches[1]}
            Write-Host ('AGENT05_SHORT_ROOT_FAILURE_PHASE='+$phase)
            Write-Host ('AGENT05_SHORT_ROOT_FAILURE_REASON='+$reason)
            throw 'AGENT05_SHORT_ROOT_BUILD_ONLY_FAILED'
          }
          $receipt=Get-Content 'C:\i5\o\build-receipt.json' -Raw | ConvertFrom-Json
          $exe='C:\i5\o\IWXA-Personal-Agent-0.5.0-Setup.exe'
          if(!(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'AGENT05_SHORT_ROOT_SETUP_MISSING'}
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($receipt.status -cne 'BUILT_ONLY' -or
             $receipt.version -cne '0.5.0' -or
             $receipt.source_commit -cne '34e4303231c922584bc045d6a89cd518f7fb406b' -or
             $receipt.setup_sha256 -cne $sha -or
             $receipt.tests_reexecuted -ne $false -or
             $receipt.installer_launched -ne $false -or
             $receipt.private_artifacts_published -ne $false){
            throw 'AGENT05_SHORT_ROOT_BUILD_RECEIPT_FAILED'
          }
          Write-Host 'AGENT05_SHORT_ROOT_WINDOWS_BUILD_ONLY_PASS'
          Write-Host ('AGENT05_SHORT_ROOT_SETUP_SHA256='+$sha)
      - name: Native Setup layout at standard and scaled Windows DPI
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup='C:\i5\o\IWXA-Personal-Agent-0.5.0-Setup.exe'
          $script='C:\i5\c\installer\windows\qualify-gui-layout-fast.ps1'
          $log=Join-Path $env:RUNNER_TEMP 'agent05-native-dpi-private.log'
          $ps=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $ps -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File $script -Stub $setup *> $log
          if($LASTEXITCODE -ne 0){throw 'AGENT05_NATIVE_SETUP_DPI_FAILED'}
          if(-not((Get-Content -LiteralPath $log) -ccontains 'IWXA_SETUP_NATIVE_UNIFIED_UX_ACCEPTANCE_PASS')){throw 'AGENT05_NATIVE_SETUP_DPI_RESULT_MISSING'}
          Write-Host 'AGENT05_NATIVE_SETUP_DPI_PASS'
      - name: Actual first install and visible installed Windows launcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup='C:\i5\o\IWXA-Personal-Agent-0.5.0-Setup.exe'
          $root='C:\IWXA\Agent'
          $data='C:\IWXA\Personal data Agent'
          $request='C:\i5\locations.json'
          $receipt='C:\i5\installed.json'
          $choice=[ordered]@{schema='IWXA_SETUP_LOCATIONS/1';programRoot=$root;dataRoot=(Join-Path $data 'Data');softwareRoot=(Join-Path $data 'Software');modelsRoot=(Join-Path $data 'Models');cacheRoot=(Join-Path $data 'Cache');startWithWindows=$false}
          New-Item -ItemType Directory -Force -Path (Join-Path $data 'Data') | Out-Null
          $sentinel=Join-Path $data 'Data\user-file.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve' -Encoding utf8
          $choice | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $request -Encoding utf8
          $p=Start-Process -FilePath $setup -ArgumentList @('--install-locations-file',$request,$receipt) -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'AGENT05_REAL_INSTALL_FAILED'}
          $status=Get-Content $receipt -Raw -Encoding utf8 | ConvertFrom-Json
          if($status.status -cne 'INSTALLED_NOT_LAUNCHED'){throw 'AGENT05_REAL_INSTALL_RESULT_INVALID'}
          $exe=Join-Path $root 'IWXA Personal Agent.exe'
          $inner=Join-Path $root 'desktop\bin\IWXA Personal.exe'
          if(!(Test-Path $exe -PathType Leaf) -or !(Test-Path $inner -PathType Leaf)){throw 'AGENT05_INSTALLED_ROOT_EXE_MISSING'}
          if((Get-FileHash $exe -Algorithm SHA256).Hash -cne (Get-FileHash $inner -Algorithm SHA256).Hash){throw 'AGENT05_INSTALLED_NATIVE_EXE_MISMATCH'}
          if(!(Test-Path $sentinel)){throw 'AGENT05_USER_DATA_MISSING'}
          Write-Host 'AGENT05_REAL_INSTALL_ROOT_EXE_PASS'
          $env:WEBVIEW2_USER_DATA_FOLDER='C:\i5\webview'
          # Reproduce inheritance of a PowerShell 7-only module search path
          # during an ordinary installed GUI first launch.
          $env:PSModulePath='C:\i5\incompatible-pwsh7-modules-only'
          $app=Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try{
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $ready=$false
            for($i=0;$i -lt 100;$i++){
              Start-Sleep -Milliseconds 800
              $app.Refresh()
              if($app.HasExited){throw 'AGENT05_INSTALLED_APP_EXITED'}
              if($app.MainWindowHandle -eq [IntPtr]::Zero){continue}
              $w=[System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
              $doc=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Document)
              if($w.FindAll([System.Windows.Automation.TreeScope]::Descendants,$doc).Count -gt 0){$ready=$true;break}
            }
            if(!$ready){throw 'AGENT05_INSTALLED_UI_NOT_READY'}
            $authority=Join-Path $env:LOCALAPPDATA 'IWXA\PersonalAgent\storage-authority.json'
            $installed=Join-Path $env:LOCALAPPDATA 'IWXA\PersonalAgent\current-install.json'
            if(!(Test-Path $authority) -or !(Test-Path $installed)){throw 'AGENT05_CORE_REGISTRATION_MISSING'}
            if((Get-Content $installed -Raw | ConvertFrom-Json).install_root -cne $root){throw 'AGENT05_CORE_ROOT_MISMATCH'}
            if(!(Test-Path $sentinel)){throw 'AGENT05_USER_DATA_CHANGED'}
            Write-Host 'AGENT05_REAL_INSTALLED_AGENT_OPEN_PASS'
            Write-Host 'AGENT05_PS_MODULE_PATH_DESKTOP_BOOT_PASS'
          }finally{
            $app.Refresh()
            if(!$app.HasExited){Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: Start Menu launcher and cold reopen
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\IWXA\Agent'
          $exe=Join-Path $root 'IWXA Personal Agent.exe'
          $inner=Join-Path $root 'desktop\bin\IWXA Personal.exe'
          $shortcuts=Join-Path ([Environment]::GetFolderPath('Programs')) '*.lnk'
          $shell=New-Object -ComObject WScript.Shell
          $match=@(Get-ChildItem -Path $shortcuts -ErrorAction Stop | Where-Object {
            $link=$shell.CreateShortcut($_.FullName)
            [string]::Equals($link.TargetPath,$inner,[StringComparison]::OrdinalIgnoreCase)
          })
          if($match.Count -ne 1){throw 'AGENT05_START_MENU_SHORTCUT_INVALID'}
          Write-Host 'AGENT05_START_MENU_SHORTCUT_PASS'
          $env:WEBVIEW2_USER_DATA_FOLDER='C:\i5\webview'
          $app=Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try{
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            $ready=$false
            for($i=0;$i -lt 80;$i++){
              Start-Sleep -Milliseconds 750
              $app.Refresh()
              if($app.HasExited){throw 'AGENT05_REOPEN_EXITED'}
              if($app.MainWindowHandle -eq [IntPtr]::Zero){continue}
              $window=[System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
              $condition=[System.Windows.Automation.PropertyCondition]::new([System.Windows.Automation.AutomationElement]::ControlTypeProperty,[System.Windows.Automation.ControlType]::Document)
              if($window.FindAll([System.Windows.Automation.TreeScope]::Descendants,$condition).Count -gt 0){$ready=$true;break}
            }
            if(!$ready){throw 'AGENT05_COLD_REOPEN_NOT_READY'}
            Write-Host 'AGENT05_COLD_REOPEN_PASS'
          }finally{
            $app.Refresh()
            if(!$app.HasExited){Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue}
          }
      - name: Finish a registered installation with a retained backup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\IWXA\Agent'
          $previous=$root+'.iwxa-previous'
          $setup='C:\i5\o\IWXA-Personal-Agent-0.5.0-Setup.exe'
          $sentinel='C:\IWXA\Personal data Agent\Data\user-file.txt'
          if(Test-Path -LiteralPath $previous){throw 'AGENT05_UNEXPECTED_PREVIOUS'}
          Copy-Item -LiteralPath $root -Destination $previous -Recurse -Force
          $plan='C:\i5\pending-plan.json'
          $result='C:\i5\finish-result.json'
          $p=Start-Process -FilePath $setup -ArgumentList @('--upgrade-plan-file',$plan) -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'AGENT05_PENDING_PLAN_FAILED'}
          $state=Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json
          if($state.status -cne 'UPGRADE_PENDING_CONFIRMATION'){throw 'AGENT05_ACTIVE_WITH_BACKUP_NOT_RECOGNIZED'}
          if(!(Test-Path 'C:\IWXA\Agent\IWXA Personal Agent.exe') -or !(Test-Path $sentinel)){throw 'AGENT05_ACTIVE_OR_DATA_MISSING'}
          Write-Host 'AGENT05_ACTIVE_WITH_BACKUP_PASS'
          $p=Start-Process -FilePath $setup -ArgumentList @('--confirm-upgrade-file',$result) -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'AGENT05_FINISH_PREVIOUS_FAILED'}
          $finished=Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if($finished.status -cne 'UPGRADE_CONFIRMED_OLD_RELEASE_REMOVED'){throw 'AGENT05_FINISH_RESULT_INVALID'}
          if((Test-Path $previous) -or !(Test-Path (Join-Path $root 'IWXA Personal Agent.exe')) -or !(Test-Path $sentinel)){throw 'AGENT05_FINISH_AFFECTED_ACTIVE_INSTALL'}
          $plan2='C:\i5\finished-plan.json'
          $p=Start-Process -FilePath $setup -ArgumentList @('--upgrade-plan-file',$plan2) -Wait -PassThru
          if($p.ExitCode -ne 0 -or (Get-Content $plan2 -Raw | ConvertFrom-Json).status -cne 'REPAIR_CANDIDATE_NOT_ACTIVATED'){throw 'AGENT05_FINISH_READBACK_FAILED'}
          Write-Host 'AGENT05_FINISH_WITH_PRESERVED_DATA_PASS'
      - name: Real installed local model Task Result and cold reopen
        shell: pwsh
        timeout-minutes: 35
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\IWXA\Agent'
          $receipt=Get-Content -LiteralPath (Join-Path $root 'explorer-install-receipt.json') -Raw -Encoding utf8 | ConvertFrom-Json
          $relative=[string]$receipt.managed_runtime.python_executable
          if([string]::IsNullOrWhiteSpace($relative) -or
             [IO.Path]::IsPathRooted($relative) -or
             $relative.Contains('..') -or $relative.Contains(':')){throw 'AGENT05_INSTALLED_PYTHON_PATH_INVALID'}
          $python=Join-Path $root ($relative.Replace('/','\'))
          $control=Join-Path $root 'tools\iwxa_windows_user_control.py'
          $probe='C:\i5\a\tools\qualify_setup_core_real_qwen.py'
          if(!(Test-Path $python -PathType Leaf) -or !(Test-Path $control -PathType Leaf) -or !(Test-Path $probe -PathType Leaf)){throw 'AGENT05_REAL_TASK_WITNESS_MISSING'}
          $port=8765
          $private=Join-Path $env:RUNNER_TEMP 'agent05-real-task'
          New-Item -ItemType Directory -Force -Path $private | Out-Null
          $proof=Join-Path $private 'proof.json'
          $errorCode=Join-Path $private 'failure-code.txt'
          $lastOperation=Join-Path $private 'last-operation.txt'
          function Invoke-Control([string]$action){
            $log=Join-Path $private ('control-'+$action+'.log')
            & $python -B $control --install-root $root --action $action --port $port --ready-timeout 60 --no-dialog *> $log
            if($LASTEXITCODE -ne 0){throw ('AGENT05_CORE_'+$action.ToUpperInvariant()+'_FAILED')}
            return (Get-Content -LiteralPath $log -Raw | ConvertFrom-Json)
          }
          $null=Invoke-Control 'stop'
          try{
            $start=Invoke-Control 'start'
            if($start.started -ne $true -or !$start.pid){throw 'AGENT05_TASK_CORE_START_INVALID'}
            $log=Join-Path $private 'execute.log'
            & $python -B $probe --install-root $root --port $port --proof $proof --phase execute --failure-code-path $errorCode --last-operation-path $lastOperation *> $log
            if($LASTEXITCODE -ne 0){
              $reason='UNKNOWN'
              if(Test-Path $errorCode){
                $candidate=(Get-Content -LiteralPath $errorCode -Raw).Trim()
                if($candidate -cmatch ('^[A-Z0-9_]{1,80}' + [char]36)){$reason=$candidate}
              }
              $phase='UNKNOWN'
              if(Test-Path $lastOperation){
                $candidate=(Get-Content -LiteralPath $lastOperation -Raw).Trim()
                if($candidate -cmatch ('^[A-Z0-9_]{1,40}' + [char]36)){$phase=$candidate}
              }
              Write-Host ('AGENT05_REAL_TASK_FAILURE_CATEGORY='+$reason)
              Write-Host ('AGENT05_REAL_TASK_FAILURE_PHASE='+$phase)
              throw 'AGENT05_REAL_TASK_EXECUTE_FAILED'
            }
            if(-not((Get-Content -LiteralPath $log) -ccontains 'AGENT_INSTALLED_REAL_QWEN_TASK_REVIEW_PASS')){throw 'AGENT05_REAL_TASK_NOT_ACCEPTED'}
            Write-Host 'AGENT05_REAL_TASK_REVIEW_PASS'
            $restart=Invoke-Control 'restart'
            if(!$restart.pid -or !$restart.token){throw 'AGENT05_REAL_TASK_RESTART_INVALID'}
            $cold=Join-Path $private 'cold-readback.log'
            & $python -B $probe --install-root $root --port $port --proof $proof --phase readback *> $cold
            if($LASTEXITCODE -ne 0 -or -not((Get-Content -LiteralPath $cold) -ccontains 'AGENT_INSTALLED_REAL_QWEN_RESULT_RESTART_PASS')){throw 'AGENT05_REAL_TASK_COLD_READBACK_FAILED'}
            if(!(Test-Path 'C:\IWXA\Personal data Agent\Data\user-file.txt')){throw 'AGENT05_REAL_TASK_EXISTING_DATA_LOST'}
            Write-Host 'AGENT05_REAL_TASK_RESULT_COLD_READBACK_PASS'
          }finally{
            $null=Invoke-Control 'stop'
          }
      - name: Direct reinstall after interrupted files with preserved data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\IWXA\Agent'
          $previous=$root+'.iwxa-previous'
          $setup='C:\i5\o\IWXA-Personal-Agent-0.5.0-Setup.exe'
          $sentinel='C:\IWXA\Personal data Agent\Data\user-file.txt'
          if(Test-Path $previous){throw 'AGENT05_INTERRUPTED_PRIOR_UNEXPECTED'}
          $receipt=Get-Content -LiteralPath (Join-Path $root 'explorer-install-receipt.json') -Raw -Encoding utf8 | ConvertFrom-Json
          $relative=[string]$receipt.managed_runtime.python_executable
          if([string]::IsNullOrWhiteSpace($relative) -or [IO.Path]::IsPathRooted($relative) -or $relative.Contains('..') -or $relative.Contains(':')){throw 'AGENT05_INTERRUPTED_PYTHON_PATH_INVALID'}
          $python=Join-Path $root ($relative.Replace('/','\'))
          $control=Join-Path $root 'tools\iwxa_windows_user_control.py'
          $coreLog=Join-Path $env:RUNNER_TEMP 'agent05-interrupted-core-stop-private.log'
          & $python -B $control --install-root $root --action stop --port 8765 --no-dialog *> $coreLog
          if($LASTEXITCODE -ne 0){throw 'AGENT05_INTERRUPTED_CORE_NOT_STOPPED'}
          $beforeData=(Get-FileHash -LiteralPath $sentinel -Algorithm SHA256).Hash
          $otherRoots=@('Software','Models','Cache')
          $otherHashes=@{}
          foreach($category in $otherRoots){
            $place=Join-Path 'C:\IWXA\Personal data Agent' $category
            New-Item -ItemType Directory -Force -Path $place | Out-Null
            $file=Join-Path $place 'preserve-user-file.txt'
            Set-Content -LiteralPath $file -Value 'preserve' -Encoding utf8
            $otherHashes[$category]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
          }
          Copy-Item -LiteralPath $root -Destination $previous -Recurse -Force
          $inner=Join-Path $root 'desktop\bin\IWXA Personal.exe'
          $visible=Join-Path $root 'IWXA Personal Agent.exe'
          Remove-Item -LiteralPath $inner,$visible -Force
          $plan='C:\i5\interrupted-plan.json'
          $p=Start-Process -FilePath $setup -ArgumentList @('--upgrade-plan-file',$plan) -Wait -PassThru
          if($p.ExitCode -ne 0 -or (Get-Content -LiteralPath $plan -Raw | ConvertFrom-Json).status -cne 'AGENT_INTERRUPTED_FILES_REINSTALL'){throw 'AGENT05_INTERRUPTED_INSTALL_NOT_OFFERED'}
          Write-Host 'AGENT05_INTERRUPTED_INSTALL_DETECTED_PASS'
          $repaired='C:\i5\interrupted-repaired.json'
          $p=Start-Process -FilePath $setup -ArgumentList @('--repair-file',$repaired) -Wait -PassThru
          if($p.ExitCode -ne 0 -or (Get-Content -LiteralPath $repaired -Raw | ConvertFrom-Json).status -cne 'REPAIRED_BACKUP_RETAINED'){throw 'AGENT05_INTERRUPTED_REINSTALL_FAILED'}
          if(!(Test-Path $inner -PathType Leaf) -or !(Test-Path $visible -PathType Leaf)){throw 'AGENT05_INTERRUPTED_EXE_NOT_RESTORED'}
          if((Get-FileHash $inner -Algorithm SHA256).Hash -cne (Get-FileHash $visible -Algorithm SHA256).Hash){throw 'AGENT05_INTERRUPTED_EXE_CHANGED'}
          if((Get-FileHash $sentinel -Algorithm SHA256).Hash -cne $beforeData){throw 'AGENT05_INTERRUPTED_DATA_CHANGED'}
          $pending='C:\i5\interrupted-pending.json'
          $p=Start-Process -FilePath $setup -ArgumentList @('--upgrade-plan-file',$pending) -Wait -PassThru
          if($p.ExitCode -ne 0 -or (Get-Content -LiteralPath $pending -Raw | ConvertFrom-Json).status -cne 'UPGRADE_PENDING_CONFIRMATION'){throw 'AGENT05_INTERRUPTED_REINSTALL_READBACK_INVALID'}
          $confirmed='C:\i5\interrupted-confirmed.json'
          $p=Start-Process -FilePath $setup -ArgumentList @('--confirm-upgrade-file',$confirmed) -Wait -PassThru
          if($p.ExitCode -ne 0 -or (Get-Content -LiteralPath $confirmed -Raw | ConvertFrom-Json).status -cne 'UPGRADE_CONFIRMED_OLD_RELEASE_REMOVED'){throw 'AGENT05_INTERRUPTED_CONFIRM_FAILED'}
          if(Test-Path $previous){throw 'AGENT05_INTERRUPTED_PREVIOUS_REMAINED'}
          if(@(Get-ChildItem -Path 'C:\IWXA' -Directory | Where-Object {$_.Name -like 'Agent.iwxa-unfinished-*' -or $_.Name -like 'Agent.iwxa-new-*'}).Count -ne 0){throw 'AGENT05_INTERRUPTED_STAGING_REMAINED'}
          if((Get-FileHash $sentinel -Algorithm SHA256).Hash -cne $beforeData){throw 'AGENT05_INTERRUPTED_USER_DATA_NOT_PRESERVED'}
          foreach($category in $otherRoots){
            $file=Join-Path (Join-Path 'C:\IWXA\Personal data Agent' $category) 'preserve-user-file.txt'
            if(!(Test-Path -LiteralPath $file -PathType Leaf) -or
               (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -cne $otherHashes[$category]){throw 'AGENT05_INTERRUPTED_NON_DATA_STORAGE_CHANGED'}
          }
          Write-Host 'AGENT05_INTERRUPTED_REINSTALL_PRESERVED_DATA_PASS'
          # Read the existing Task/Result saved BEFORE the files were replaced.
          $taskProof=Join-Path $env:RUNNER_TEMP 'agent05-real-task\proof.json'
          $probe='C:\i5\a\tools\qualify_setup_core_real_qwen.py'
          $readbackLog=Join-Path $env:RUNNER_TEMP 'agent05-interrupted-task-readback-private.log'
          $startLog=Join-Path $env:RUNNER_TEMP 'agent05-interrupted-core-start-private.log'
          & $python -B $control --install-root $root --action start --port 8765 --no-dialog *> $startLog
          if($LASTEXITCODE -ne 0){throw 'AGENT05_INTERRUPTED_CORE_REOPEN_FAILED'}
          try{
            & $python -B $probe --install-root $root --port 8765 --proof $taskProof --phase readback *> $readbackLog
            if($LASTEXITCODE -ne 0 -or -not((Get-Content -LiteralPath $readbackLog) -ccontains 'AGENT_INSTALLED_REAL_QWEN_RESULT_RESTART_PASS')){throw 'AGENT05_INTERRUPTED_TASK_RESULT_NOT_PRESERVED'}
            Write-Host 'AGENT05_INTERRUPTED_TASK_RESULT_PRESERVED_PASS'
          }finally{
            & $python -B $control --install-root $root --action stop --port 8765 --no-dialog *> $coreLog
            if($LASTEXITCODE -ne 0){throw 'AGENT05_INTERRUPTED_CORE_FINAL_STOP_FAILED'}
          }
      - name: Cold-open the actual Agent window and view saved Result
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\IWXA\Agent'
          $exe=Join-Path $root 'IWXA Personal Agent.exe'
          $modelProof=Join-Path $env:RUNNER_TEMP 'agent05-real-task\proof.json'
          $guiScript='C:\i5\a\tools\qualify_setup_core_native_gui.ps1'
          $log=Join-Path $env:RUNNER_TEMP 'agent05-real-task-gui-private.log'
          $receiptPath=Join-Path $env:RUNNER_TEMP 'agent05-real-task-gui.json'
          if(!(Test-Path -LiteralPath $modelProof -PathType Leaf) -or !(Test-Path $exe -PathType Leaf)){throw 'AGENT05_GUI_COLD_RESULT_PROOF_MISSING'}
          $proof=Get-Content -LiteralPath $modelProof -Raw -Encoding utf8 | ConvertFrom-Json
          if($proof.schema -cne 'IWXA_INSTALLED_REAL_QWEN_RESULT/1' -or !$proof.task_id -or !$proof.task_title_sha256 -or $proof.human_review_accepted -ne $true){throw 'AGENT05_GUI_COLD_RESULT_PROOF_INVALID'}
          $env:WEBVIEW2_USER_DATA_FOLDER='C:\i5\webview'
          $app=Start-Process -FilePath $exe -WorkingDirectory $root -PassThru
          try{
            $ps=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            & $ps -NoProfile -NonInteractive -Sta -ExecutionPolicy Bypass -File $guiScript -WindowProcessId $app.Id -Mode result -TaskId ([string]$proof.task_id) -ExpectedTitleSha256 ([string]$proof.task_title_sha256) -ReceiptPath $receiptPath *> $log
            if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $receiptPath -PathType Leaf)){throw 'AGENT05_GUI_COLD_RESULT_NOT_VISIBLE'}
            $receipt=Get-Content -LiteralPath $receiptPath -Raw -Encoding utf8 | ConvertFrom-Json
            if($receipt.status -cne 'PASS' -or
               $receipt.input -cne 'NATIVE_WINDOWS_UI_AUTOMATION' -or
               $receipt.source_task_selected -ne $true -or
               $receipt.accepted_result_visible -ne $true -or
               $receipt.title_digest_matched -ne $true){throw 'AGENT05_GUI_COLD_RESULT_MISMATCH'}
            Write-Host 'AGENT05_GUI_COLD_SAVED_RESULT_VISIBLE_PASS'
          }finally{
            $app.Refresh()
            if(!$app.HasExited){
              $null=$app.CloseMainWindow()
              if(!$app.WaitForExit(8000)){Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue}
            }
            $app.Dispose()
          }
