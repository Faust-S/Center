# Scoped public Center Windows qualification. Private outputs are transient.
# No checkout from a private repo occurs outside this approved runner.
name: IWXA Agent 0.6 AI Programs private source qualification
on:
  push:
    branches: ['work/2026-11-15-agent06-ai-integration-qualification']
permissions:
  contents: read
concurrency:
  group: iwxa-agent06-ai-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require pre-authorized read-only private checkout
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_AI_PRIVATE_READ_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: d0c88bd53b6def229ac6fc2bd1f6b8fc1de10b8e
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify SHA and CI dependencies
        shell: pwsh
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne 'd0c88bd53b6def229ac6fc2bd1f6b8fc1de10b8e'){throw 'AGENT06_AI_SOURCE_SHA_MISMATCH'}
          & python -m pip install -r private-agent/requirements-ci.txt *> (Join-Path $env:RUNNER_TEMP 'agent06-ai-pip-private.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_AI_DEPENDENCIES_FAIL'}
          Write-Host 'AGENT06_AI_DEPENDENCIES_PASS'
      - name: Independent grouped original Python regression
        shell: pwsh
        run: |
          Push-Location private-agent
          $failures=0
          function Check-Group([string]$label,[string[]]$cases){
            $privateLog=Join-Path $env:RUNNER_TEMP ('agent06-ai-'+$label+'-private.log')
            & python -B -m pytest -q -p no:cacheprovider @cases *> $privateLog
            if($LASTEXITCODE -ne 0){
              Write-Host ('AGENT06_AI_'+$label+'_FAIL')
              $script:failures++
            }else{Write-Host ('AGENT06_AI_'+$label+'_PASS')}
          }
          try{
            Check-Group 'CLI' @(
              'tests/test_agent06_claude_code_cli.py',
              'tests/test_agent06_external_program_selection.py',
              'tests/test_codex_chatgpt_cli_adapter.py',
              'tests/test_antigravity_agent_runtime.py',
              'tests/test_goose_agent_runtime_user_ready.py',
              'tests/test_agent06_program_cli_cancel.py',
              'tests/test_fc2_agent_runtime_management_port.py'
            )
            Check-Group 'GRAPH_RUNTIME' @('tests/test_fc6_graph_agent_runtime_executor.py')
            Check-Group 'GRAPH_CONFIG' @('tests/test_fc6_graph_node_config.py')
            Check-Group 'GRAPH_ORCHESTRATOR' @('tests/test_fc6_graph_orchestrator_wait_m9.py')
            Check-Group 'RETRY' @('tests/test_interactive_task_retry_claim.py')
            Check-Group 'T3' @('tests/test_t3_mode.py','tests/test_t3_result_projection.py')
            Check-Group 'GRAPH_TASK' @(
              'tests/test_agent06_graph_result_task_seed.py',
              'tests/test_agent06_graph_result_interaction.py'
            )
            Check-Group 'GRAPH_FILE' @('tests/test_agent06_graph_result_file_draft.py')
            Check-Group 'GRAPH_REVIEW' @('tests/test_fc6_graph_control_human_review_integration.py')
            Check-Group 'TASK_TOOL_SESSION' @(
              'tests/test_p01_obsidian_toolruntime.py',
              'tests/test_tool_execution_intent_claim_recovery.py',
              'tests/test_session_runtime_long_paths.py',
              'tests/test_agent05_existing_user_data_startup.py'
            )
          }finally{Pop-Location}
          Write-Host ('AGENT06_AI_PYTHON_FAILED_GROUPS='+$failures)
          if($failures -ne 0){throw 'AGENT06_AI_PYTHON_REGRESSIONS_FAIL'}
      - name: Complete existing desktop Node tests and TypeScript build
        shell: pwsh
        run: |
          Push-Location private-agent/desktop
          try{
            & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'agent06-ai-npm-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_AI_NPM_CI_FAIL'}
            & npm.cmd test *> (Join-Path $env:RUNNER_TEMP 'agent06-ai-node-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_AI_NODE_TESTS_FAIL'}
            Write-Host 'AGENT06_AI_NODE_TESTS_PASS'
            & npm.cmd run build *> (Join-Path $env:RUNNER_TEMP 'agent06-ai-desktop-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_AI_DESKTOP_BUILD_FAIL'}
            Write-Host 'AGENT06_AI_DESKTOP_BUILD_PASS'
          }finally{Pop-Location}
      # No artifacts, cache, installer, private test logs or model output.
