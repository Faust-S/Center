# Scoped public Center Windows qualification. Private outputs are transient.
# No checkout from a private repo occurs outside this approved runner.
name: IWXA Agent 0.6 AI Programs private source qualification
on:
  push:
    branches: ['work/2026-11-15-agent06-ai-integration-qualification']
permissions:
  contents: read
concurrency:
  group: iwxa-agent06-ai-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-source:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require pre-authorized read-only private checkout
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_AI_PRIVATE_READ_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 63d21298968f52f06b49b996634894a94f6392e0
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify SHA and CI dependencies
        shell: pwsh
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne '63d21298968f52f06b49b996634894a94f6392e0'){throw 'AGENT06_AI_SOURCE_SHA_MISMATCH'}
          & python -m pip install -r private-agent/requirements-ci.txt *> (Join-Path $env:RUNNER_TEMP 'agent06-ai-pip-private.log')
          if($LASTEXITCODE -ne 0){throw 'AGENT06_AI_DEPENDENCIES_FAIL'}
          Write-Host 'AGENT06_AI_DEPENDENCIES_PASS'
      - name: Diagnose Graph contract and control on original tests
        shell: pwsh
        run: |
          Push-Location private-agent
          $cases=@(
            @{Label='CANCEL_PRE_DISPATCH'; Node='tests/test_fc6_graph_agent_runtime_executor.py::test_graph_cancel_committed_before_cli_dispatch_never_launches_program'},
            @{Label='MODEL_PIN'; Node='tests/test_fc6_graph_node_config.py::test_pinned_local_model_config_is_immutable_and_refuses_identity_drift'},
            @{Label='GRAPH_ACK'; Node='tests/test_fc6_graph_control_human_review_integration.py::test_graph_prepare_ack_reuses_exact_verified_etag_without_granting_cancel'},
            @{Label='CONCURRENT_CANCEL'; Node='tests/test_fc6_graph_control_human_review_integration.py::test_graph_cancel_decision_is_not_blocked_by_running_advance'}
          )
          $bad=0
          try{
            foreach($case in $cases){
              $privateLog=Join-Path $env:RUNNER_TEMP ('agent06-ai-'+$case.Label+'-private.log')
              & python -B -m pytest -q -p no:cacheprovider $case.Node *> $privateLog
              if($LASTEXITCODE -ne 0){
                Write-Host ('AGENT06_DIAGNOSTIC_'+$case.Label+'_FAIL')
                $raw=Get-Content -LiteralPath $privateLog -Raw -ErrorAction SilentlyContinue
                $stage=[regex]::Match([string]$raw,'graph_cancel_did_not_reach_core_while_running:(query|prepare_revision|prepare_command|prepare_global_etag|prepare_graph_write|prepare_ack_revision|prepare|decide|checking|before_observation)')
                if($stage.Success){Write-Host ('AGENT06_DIAGNOSTIC_CANCEL_BLOCKING_PHASE='+$stage.Groups[1].Value)}
                $summary=[regex]::Match([string]$raw,'(?m)^FAILED\s+\S+\s+-\s+([A-Za-z_][A-Za-z0-9_]*)')
                if($summary.Success){
                  $type=$summary.Groups[1].Value
                  if($type -match '^(?:[A-Za-z_]*Error|Failed|TimeoutExpired|assert)$'){
                    Write-Host ('AGENT06_DIAGNOSTIC_'+$case.Label+'_EXCEPTION='+$type)
                  }
                }
                foreach($match in [regex]::Matches([string]$raw,'(?i)(?:test_fc6_graph_agent_runtime_executor|test_fc6_graph_node_config|test_fc6_graph_control_human_review_integration)\.py:(\d{1,5})')){
                  Write-Host ('AGENT06_DIAGNOSTIC_'+$case.Label+'_LINE='+$match.Groups[1].Value)
                }
                $bad++
              }else{
                Write-Host ('AGENT06_DIAGNOSTIC_'+$case.Label+'_PASS')
              }
            }
          }finally{Pop-Location}
          if($bad -ne 0){throw 'AGENT06_DIAGNOSTIC_GRAPH_REPRODUCED'}
      - name: Original Agent06 Python integration regression matrix
        if: always()
        shell: pwsh
        run: |
          Push-Location private-agent
          try{
            $patterns=@(
              'test_agent06_*.py','test_codex_*.py','test_antigravity_*.py',
              'test_goose_*.py','test_fc6_*.py','test_graph_*.py',
              'test_session_runtime_*.py','test_tool_execution_*.py',
              'test_t3_*.py','test_agent05_existing_user_data_startup.py',
              'test_interactive_task_retry_claim.py','test_p01_obsidian_toolruntime.py'
            )
            $cases=@()
            foreach($pattern in $patterns){
              $cases+=@(Get-ChildItem -LiteralPath tests -Filter $pattern -File |
                ForEach-Object {$_.FullName})
            }
            $cases=@($cases|Sort-Object -Unique)
            Write-Host ('AGENT06_AI_REGRESSION_FILES='+$cases.Count)
            if($cases.Count -lt 35){throw 'AGENT06_AI_REGRESSION_SUITE_INCOMPLETE'}
            $log=Join-Path $env:RUNNER_TEMP 'agent06-ai-full-regression-private.log'
            & python -B -m pytest -q -p no:cacheprovider @cases *> $log
            $raw=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            $summary=[regex]::Matches([string]$raw,'(?m)(\d{1,5}) (passed|failed|skipped|error|errors)\b')
            foreach($group in $summary){
              Write-Host ('AGENT06_AI_REGRESSION_'+$group.Groups[2].Value.ToUpperInvariant()+'='+$group.Groups[1].Value)
            }
            if($LASTEXITCODE -ne 0){throw 'AGENT06_AI_REGRESSION_FAIL'}
            Write-Host 'AGENT06_AI_REGRESSION_PASS'
          }finally{Pop-Location}
      - name: Diagnose existing Node tests and always execute TypeScript build
        if: always()
        shell: pwsh
        run: |
          Push-Location private-agent/desktop
          $bad=0
          try{
            & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'agent06-ai-npm-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_DIAGNOSTIC_NPM_CI_FAIL'}
            $nodeLog=Join-Path $env:RUNNER_TEMP 'agent06-ai-node-private.log'
            & npm.cmd test *> $nodeLog
            if($LASTEXITCODE -ne 0){
              Write-Host 'AGENT06_DIAGNOSTIC_NODE_FAIL'
              $raw=Get-Content -LiteralPath $nodeLog -Raw -ErrorAction SilentlyContinue
              foreach($match in [regex]::Matches([string]$raw,'(?m)^\s*not ok\s+(\d{1,5})\s+-\s+([^\r\n]+)')){
                Write-Host ('AGENT06_DIAGNOSTIC_NODE_TAP_INDEX='+$match.Groups[1].Value)
                $label=$match.Groups[2].Value.Trim()
                $digest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                  [Text.Encoding]::UTF8.GetBytes($label))).ToLowerInvariant()
                Write-Host ('AGENT06_DIAGNOSTIC_NODE_TITLE_HASH='+$digest.Substring(0,16))
              }
              # Match failed TAP test labels to source files INSIDE the
              # private runner; print only a short digest of each relative path.
              $failed=@{}
              foreach($m in [regex]::Matches([string]$raw,'(?m)^\s*not ok\s+\d{1,5}\s+-\s+([^\r\n]+)')){
                $title=$m.Groups[1].Value.Trim()
                $digest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                  [Text.Encoding]::UTF8.GetBytes($title))).ToLowerInvariant()
                $failed[$digest]=$true
              }
              $pattern='\btest\s*\(\s*[''"]([^''"\r\n]+)[''"]\s*,'
              foreach($file in Get-ChildItem -LiteralPath (Join-Path (Get-Location) 'tests') -Filter '*.test.*' -File){
                $source=Get-Content -LiteralPath $file.FullName -Raw -ErrorAction SilentlyContinue
                foreach($m in [regex]::Matches([string]$source,$pattern)){
                  $title=$m.Groups[1].Value
                  $digest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                    [Text.Encoding]::UTF8.GetBytes($title))).ToLowerInvariant()
                  if($failed.ContainsKey($digest)){
                    $relative='tests/'+$file.Name
                    $fileDigest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                      [Text.Encoding]::UTF8.GetBytes($relative))).ToLowerInvariant()
                    Write-Host ('AGENT06_DIAGNOSTIC_NODE_SOURCE_HASH='+$fileDigest.Substring(0,16))
                    Write-Host ('AGENT06_DIAGNOSTIC_NODE_MATCHED_TITLE_HASH='+$digest.Substring(0,16))
                  }
                }
              }
              $bad++
            }else{Write-Host 'AGENT06_DIAGNOSTIC_NODE_PASS'}
            $buildLog=Join-Path $env:RUNNER_TEMP 'agent06-ai-desktop-private.log'
            & npm.cmd run build *> $buildLog
            if($LASTEXITCODE -ne 0){
              Write-Host 'AGENT06_DIAGNOSTIC_DESKTOP_FAIL'
              $raw=Get-Content -LiteralPath $buildLog -Raw -ErrorAction SilentlyContinue
              $codes=[regex]::Matches([string]$raw,'\berror\s+TS(\d{4})\b')
              Write-Host ('AGENT06_DIAGNOSTIC_TYPESCRIPT_ERROR_COUNT='+$codes.Count)
              foreach($code in @($codes | ForEach-Object {$_.Groups[1].Value} | Select-Object -Unique)){
                Write-Host ('AGENT06_DIAGNOSTIC_TYPESCRIPT_CODE=TS'+$code)
              }
              foreach($match in [regex]::Matches([string]$raw,'(?m)^(.+?)\((\d{1,5}),(\d{1,5})\):\s+error\s+TS(\d{4}):')){
                $file=$match.Groups[1].Value.Replace('\','/')
                $digest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                  [Text.Encoding]::UTF8.GetBytes($file))).ToLowerInvariant()
                Write-Host ('AGENT06_DIAGNOSTIC_TYPESCRIPT_PATH_HASH='+$digest.Substring(0,16))
                Write-Host ('AGENT06_DIAGNOSTIC_TYPESCRIPT_LINE='+$match.Groups[2].Value)
              }
              $bad++
            }else{Write-Host 'AGENT06_DIAGNOSTIC_DESKTOP_PASS'}
          }finally{Pop-Location}
          if($bad -ne 0){throw 'AGENT06_DIAGNOSTIC_DESKTOP_REGRESSIONS_FAIL'}
      # No artifacts, cache, installer, private test logs or model output.

  native-windows:
    # Existing approved runner only. Private sources and installed binaries
    # remain transient. This is not an authenticated external account test.
    needs: windows-source
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Require scoped private read-only source permission
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: \${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_NATIVE_PRIVATE_SOURCE_READ_UNAVAILABLE'
          }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: 63d21298968f52f06b49b996634894a94f6392e0
          path: private-agent
          persist-credentials: false
          token: \${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Require exact source and native Rust toolchain
        shell: pwsh
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne '63d21298968f52f06b49b996634894a94f6392e0'){
            throw 'AGENT06_NATIVE_SOURCE_SHA_MISMATCH'
          }
          if($null -eq (Get-Command cargo.exe -ErrorAction SilentlyContinue)){
            throw 'AGENT06_NATIVE_RUST_TOOLCHAIN_UNAVAILABLE'
          }
          Write-Host 'AGENT06_NATIVE_SOURCE_TOOLCHAIN_PASS'
      - name: Install original runtime and Desktop dependencies
        shell: pwsh
        run: |
          Push-Location private-agent
          try{
            & python -m pip install -r requirements.txt *> (Join-Path $env:RUNNER_TEMP 'agent06-native-pip-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_PYTHON_DEPENDENCIES_FAIL'}
            Push-Location desktop
            try{
              & npm.cmd ci --no-audit --no-fund *> (Join-Path $env:RUNNER_TEMP 'agent06-native-npm-private.log')
              if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_NPM_DEPENDENCIES_FAIL'}
            }finally{Pop-Location}
            Write-Host 'AGENT06_NATIVE_DEPENDENCIES_PASS'
          }finally{Pop-Location}
      - name: Stage original public U04 owner in ephemeral checkout
        shell: pwsh
        run: |
          Push-Location private-agent
          try{
            & node scripts/prepare-public-modules.mjs --only-u04 --fetch *> (Join-Path $env:RUNNER_TEMP 'agent06-native-u04-prepare-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_U04_PREPARE_FAIL'}
            & node scripts/stage-u04-desktop.mjs build/u04-owner-sources desktop/public/u04 *> (Join-Path $env:RUNNER_TEMP 'agent06-native-u04-stage-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_U04_STAGE_FAIL'}
            Write-Host 'AGENT06_NATIVE_U04_OWNER_PASS'
          }finally{Pop-Location}
      - name: Compile original Tauri Windows executable from pinned integration SHA
        shell: pwsh
        run: |
          Push-Location private-agent/desktop
          try{
            & npm.cmd run tauri:build *> (Join-Path $env:RUNNER_TEMP 'agent06-native-tauri-private.log')
            if($LASTEXITCODE -ne 0){throw 'AGENT06_NATIVE_TAURI_COMPILE_FAIL'}
            if(-not (Test-Path -LiteralPath 'src-tauri/target/release/iwxa-personal.exe' -PathType Leaf)){
              throw 'AGENT06_NATIVE_BINARY_MISSING'
            }
            Write-Host 'AGENT06_NATIVE_TAURI_COMPILE_PASS'
          }finally{Pop-Location}
      - name: Installed native Windows UI and cold reopen qualification
        shell: pwsh
        run: |
          Push-Location private-agent
          try{
            $log=Join-Path $env:RUNNER_TEMP 'agent06-native-uia-private.log'
            & pwsh -NoProfile -NonInteractive -File qualification/phase1/agent02_installed_gui_acceptance.ps1 *> $log
            if($LASTEXITCODE -ne 0){
              $report=Join-Path (Join-Path $env:RUNNER_TEMP ('agent02-installed-gui-'+$env:GITHUB_RUN_ID)) 'logs/smoke-result.json'
              if(Test-Path -LiteralPath $report -PathType Leaf){
                try{
                  $observed=Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
                  foreach($field in @('install','button_invoked','react_page_changed',
                   'task_input_visible','task_input_editable','draft_restore',
                   'core_draft_before_close','core_draft_after_reopen')){
                    $v=[string]$observed.$field
                    if($v -in @('PASS','NOT_TESTED','NOT_NEEDED')){
                      Write-Host ('AGENT06_NATIVE_'+$field.ToUpperInvariant()+'='+$v)
                    }
                  }
                }catch{Write-Host 'AGENT06_NATIVE_UIA_REPORT_UNREADABLE'}
              }else{Write-Host 'AGENT06_NATIVE_UIA_REPORT_MISSING'}
              throw 'AGENT06_NATIVE_INSTALLED_UIA_FAIL'
            }
            Write-Host 'AGENT06_NATIVE_INSTALLED_COLD_REOPEN_PASS'
          }finally{Pop-Location}
      # No upload-artifact, cache, installer publication or raw private logs.
