name: Original T3 corporate return Exchange source qualification
on:
  push:
    branches: ['work/2026-11-24-corporate-result-exchange-source']
permissions:
  contents: read
concurrency:
  group: original-return-exchange-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  original-signed-exchange:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 05a87c8b1fa37ec69ea1df42a38ab4a527b45488
          path: public-one-core
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/T3
          ref: c368dcdec006349124f5698471c58d2e55a6caea
          path: private-t3
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Confirm exact source and original enrollment regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git -C private-t3 rev-parse HEAD).Trim() -cne 'c368dcdec006349124f5698471c58d2e55a6caea' -or
              (& git -C public-one-core rev-parse HEAD).Trim() -cne '05a87c8b1fa37ec69ea1df42a38ab4a527b45488') {
            throw 'ORIGINAL_RETURN_EXCHANGE_SOURCE_PIN_MISMATCH'
          }
          & node --test public-one-core/packages/t3-core/tests/t3-d3-independent-employee-original-enrollment.test.mjs public-one-core/packages/t3-core/tests/t3-d1-original-kernel-registry.test.mjs public-one-core/packages/t3-core/tests/t3-d1-original-control-http.test.mjs public-one-core/packages/t3-core/tests/t3-subject-kernel-scope.test.mjs public-one-core/packages/t3-core/tests/t3-corporate-business-exchange.test.mjs public-one-core/packages/t3-core/tests/t3-d1-signed-control-dist.test.mjs public-one-core/packages/t3-core/tests/t3-original-company-workspace-persistence.test.mjs public-one-core/packages/t3-core/tests/t3-company-workspace-readback.test.mjs public-one-core/packages/t3-core/tests/t3-reconciliation-kernel-apply.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_ENROLLMENT_REGRESSION_FAILED' }
      - name: Original signed Exchange and Control HTTP regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'original-exchange-private.log'
          Push-Location private-t3
          try {
            & node --test tests/t3-signed-workspace-exchange-owner.test.mjs tests/t3-signed-exchange-http-invite.test.mjs tests/admin-original-host-port.test.mjs *> $log
            $exit=$LASTEXITCODE
            $raw=Get-Content -LiteralPath $log -Raw
            foreach($n in @('tests','pass','fail','cancelled','skipped')){
              $m=[regex]::Matches($raw,"(?m)^# $n (\d+)\s*$")
              if($m.Count -gt 0){Write-Host ("EXCHANGE_TEST_"+$n.ToUpperInvariant()+"="+$m[$m.Count-1].Groups[1].Value)}
            }
            if($exit -ne 0){
              $indices=@([regex]::Matches($raw,'(?m)^not ok (\d+)') | ForEach-Object {$_.Groups[1].Value})
              Write-Host ("EXCHANGE_FAILED_ORDINALS="+($indices -join ','))
              foreach($name in @('t3-signed-workspace-exchange-owner','t3-signed-exchange-http-invite','runtime','server')){
                $lines=@([regex]::Matches($raw,([regex]::Escape($name)+'\.mjs:(\d+):(\d+)')) | ForEach-Object {$_.Groups[1].Value} | Sort-Object -Unique)
                if($lines.Count -gt 0){Write-Host ("EXCHANGE_PRIVATE_LINE_"+$name+"="+($lines -join ','))}
              }
              throw 'ORIGINAL_SIGNED_EXCHANGE_SOURCE_FAILED'
            }
            Write-Host 'ORIGINAL_SIGNED_EXCHANGE_SOURCE_PASS'
          } finally {Pop-Location}
      - name: Discard private checkout and logs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath private-t3 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'original-exchange-private.log') -Force -ErrorAction SilentlyContinue
  original-runtime-archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: 05a87c8b1fa37ec69ea1df42a38ab4a527b45488
          path: public-one-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Execute immutable original T2 with separate test IndexedDB platforms
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git -C public-one-core rev-parse HEAD).Trim() -cne '05a87c8b1fa37ec69ea1df42a38ab4a527b45488') { throw 'ORIGINAL_RUNTIME_SOURCE_PIN_MISMATCH' }
          $core=Join-Path $PWD 'public-one-core/packages/t3-core'
          $artifact=Join-Path $env:RUNNER_TEMP 'iwxa-qualified-t2-company'
          Expand-Archive -LiteralPath (Join-Path $core 'qualified-runtime/iwxa-kernel-k036-same-store-history-20261019-qualified.1.zip') -DestinationPath $artifact
          $idb=Join-Path $env:RUNNER_TEMP 'iwxa-indexeddb-test-platform'
          & npm install --prefix $idb --no-save --package-lock=false --ignore-scripts fake-indexeddb@6.2.4
          if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_RUNTIME_TEST_PLATFORM_INSTALL_FAILED' }
          $env:IWXA_COMPANY_TEST_QUALIFIED_T2=$artifact
          $env:IWXA_COMPANY_TEST_IDB_MODULE=Join-Path $idb 'node_modules/fake-indexeddb/build/esm/index.js'
          Push-Location $core
          try {
            # The original browser Runtime may leave live platform handles under Node.
            # Exit after all test results, without masking a failing exit code.
            & node --test --test-force-exit tests/t3-company-original-runtime-roundtrip.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_RUNTIME_CROSS_PRODUCT_ARCHIVE_FAILED' }
          } finally { Pop-Location }
      - name: Compile and test actual signed Workspace facade
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location public-one-core/packages/t3-core
          try {
            & npm ci --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_WORKSPACE_DEPENDENCIES_FAILED' }
            & npm run typecheck
            if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_WORKSPACE_TYPECHECK_FAILED' }
            & npx vitest run tests/module-kernel-facade.test.ts tests/exchange/import-validate-merge.test.ts tests/exchange/import-seed-workspace-map.test.ts tests/exchange/export-signed-whole-workspace.dom.test.tsx tests/exchange/runtime-contract-presentation.test.tsx
            if ($LASTEXITCODE -ne 0) { throw 'ORIGINAL_WORKSPACE_FACADE_TEST_FAILED' }
          } finally { Pop-Location }
# No private artifacts, test fixtures, source, logs, keys or builds are uploaded.
