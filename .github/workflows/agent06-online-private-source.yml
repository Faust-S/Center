# One-time public Center source qualifier. Private checkout is transient, SHA-pinned,
# read-only, without upload-artifact/cache and with no private trace emission.
name: Agent06 online services private source qualification
on:
  push:
    branches:
      - work/2026-11-15-agent06-online-services-source-ci
permissions:
  contents: read
concurrency:
  group: agent06-online-private-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-qualification:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      AGENT06_PRIVATE_PIN: 'c9a449c56b7ccde3bd00bb3e039b3e0673e3f05e'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require preauthorized read-only source connection
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_PRIVATE_SOURCE_PERMISSION_MISSING'
          }
          Write-Host 'AGENT06_PRIVATE_SOURCE_PERMISSION_PRESENT'
      - name: Read exact private Agent SHA
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT06_PRIVATE_PIN }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original private online services and interaction surface
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference='Continue'
          $observed=(& git -C private-agent rev-parse HEAD).Trim()
          if($observed -cne $env:AGENT06_PRIVATE_PIN){
            Write-Host 'AGENT06_PIN_MISMATCH'
            "AGENT06_PY_GATE=FAIL" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 1
          }
          Write-Host ('AGENT06_PIN='+$observed)
          $dep=Join-Path $env:RUNNER_TEMP 'agent06-online-install-private.log'
          & python -m pip install -r private-agent/requirements-ci.txt *> $dep
          if($LASTEXITCODE -ne 0){
            Write-Host 'AGENT06_PY_DEPENDENCIES_FAIL'
            "AGENT06_PY_GATE=FAIL" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 1
          }
          Write-Host 'AGENT06_PY_DEPENDENCIES_PASS'
          Push-Location private-agent
          try {
            # Full original online Python + Google OAuth + InteractionSurface suite.
            # The detailed JUnit and logs stay inside the runner temporary folder.
            $paths=@(Get-ChildItem tests -Filter 'test_agent06_*.py' -File | Sort-Object Name | ForEach-Object FullName)
            $paths+=@('tests/test_google_oauth_user_ready.py',
                      'tests/cells/test_interaction_surface.py')
            $log=Join-Path $env:RUNNER_TEMP 'agent06-online-py-private.log'
            $xml=Join-Path $env:RUNNER_TEMP 'agent06-online-py-private.xml'
            & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$xml) @paths *> $log
            $exitCode=$LASTEXITCODE
            if(Test-Path $xml){
              [xml]$doc=Get-Content -LiteralPath $xml -Raw
              $suite=$doc.testsuites.testsuite
              if($null -eq $suite){$suite=$doc.testsuite}
              Write-Host ('AGENT06_PY_TESTS='+[int]$suite.tests)
              Write-Host ('AGENT06_PY_FAILURES='+[int]$suite.failures)
              Write-Host ('AGENT06_PY_ERRORS='+[int]$suite.errors)
              Write-Host ('AGENT06_PY_SKIPPED='+[int]$suite.skipped)
              foreach($case in @($doc.SelectNodes('//testcase'))){
                $fail=$case.SelectSingleNode('failure')
                if($null -eq $fail){$fail=$case.SelectSingleNode('error')}
                if($null -eq $fail){continue}
                $hash=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                  [Text.Encoding]::UTF8.GetBytes([string]$case.classname+':'+[string]$case.name))).Substring(0,12)
                Write-Host ('AGENT06_PY_FAILED_CASE_SHA='+$hash)
                $category='OTHER'
                if([string]$case.classname -eq 'tests.test_agent06_setup_core_script_integrity'){
                  $category='SETUP_CORE_OWNER_SOURCE'
                }elseif([string]$case.classname -match 'agent06_(?:online|account|google|telegram|saved|dav|carddav|loopback)'){
                  $category='ONLINE_FUNCTIONAL'
                }
                Write-Host ('AGENT06_PY_FAILED_AREA='+$category)
                $type=[string]$fail.GetAttribute('type')
                if($type.Contains('.')){$type=$type.Split('.')[-1]}
                $allow=@('AssertionError','TypeError','ValueError','AttributeError',
                  'KeyError','IndexError','RuntimeError','ImportError','ModuleNotFoundError',
                  'PermissionError','OSError','FileNotFoundError','TimeoutError',
                  'OnlineStandardError','GoogleOAuthManagerError','InteractionSurfaceError',
                  'UserProviderSettingsError','OnlineAccountError','HTTPError',
                  'GoogleOAuthSupportError','RecursionError','StopIteration','SystemExit')
                if($type -notin $allow){$type='OTHER'}
                Write-Host ('AGENT06_PY_FAILED_CLASS='+$type)
                $trace=[string]$fail.InnerText
                foreach($category in @('SyntaxError','IndentationError','ModuleNotFoundError',
                    'ImportError','NameError','TypeError','AttributeError','ValueError',
                    'KeyError','CollectError','ImportPathMismatchError','RuntimeError')){
                  if($trace.Contains($category)){
                    Write-Host ('AGENT06_PY_SAFE_CATEGORY='+$category)
                  }
                }
                $locationMatches=[regex]::Matches($trace,'test_agent06_account_remove\\.py:(\\d+)')
                foreach($line in @($locationMatches|Select-Object -First 5)){
                  Write-Host ('AGENT06_PY_ACCOUNT_REMOVE_LINE='+$line.Groups[1].Value)
                }
                $locations=[regex]::Matches($trace,
                  'test_(?:agent06_online_interaction_surface|google_oauth_user_ready)\.py:(\d+)')
                if($locations.Count -gt 0){
                  $uniqueLines=@($locations | ForEach-Object {$_.Groups[1].Value} |
                    Select-Object -Unique | Select-Object -First 12)
                  Write-Host ('AGENT06_PY_FAILURE_CALL_LINES='+($uniqueLines -join ','))
                }
                $reasons=[regex]::Matches($trace,
                  '(?<![A-Za-z0-9_])(?:online|google_oauth|dav|interaction)_[a-z][a-z0-9_]{3,70}(?![A-Za-z0-9_])')
                foreach($reason in @($reasons|Select-Object -Last 8)){
                  Write-Host ('AGENT06_PY_SAFE_REASON='+$reason.Value)
                }
                if($type -eq 'OTHER'){
                  $exceptionType=[string]$fail.GetAttribute('type')
                  if($exceptionType.Contains('.')){$exceptionType=$exceptionType.Split('.')[-1]}
                  $exceptionType=$exceptionType -replace '[^A-Za-z0-9_]', ''
                  if($exceptionType.Length -gt 0 -and $exceptionType.Length -lt 81){
                    $digest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                      [Text.Encoding]::UTF8.GetBytes($exceptionType))).Substring(0,12)
                    Write-Host ('AGENT06_PY_UNRECOGNIZED_EXCEPTION_SHA='+$digest)
                  }
                }
              }
            }else{Write-Host 'AGENT06_PY_JUNIT_MISSING'}
            if($exitCode -ne 0){
              Write-Host 'AGENT06_PY_SOURCE_FAIL'
              "AGENT06_PY_GATE=FAIL" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              exit 1
            }
            Write-Host 'AGENT06_PY_SOURCE_PASS'
            "AGENT06_PY_GATE=PASS" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Pop-Location }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Type-check and build original private Desktop
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference='Continue'
          Push-Location private-agent/desktop
          try{
            $dep=Join-Path $env:RUNNER_TEMP 'agent06-online-node-private.log'
            & npm ci --no-audit --no-fund *> $dep
            if($LASTEXITCODE -ne 0){
              Write-Host 'AGENT06_DESKTOP_DEPS_FAIL'
              "AGENT06_DESKTOP_GATE=FAIL" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              exit 1
            }
            Write-Host 'AGENT06_DESKTOP_DEPS_PASS'
            $ts=Join-Path $env:RUNNER_TEMP 'agent06-online-types-private.log'
            & npx tsc --noEmit *> $ts
            $tsExit=$LASTEXITCODE
            if($tsExit -ne 0){
              Write-Host 'AGENT06_DESKTOP_TSC_FAIL'
              $safe=Get-Content -LiteralPath $ts -Raw
              [regex]::Matches($safe,'TS[0-9]{4,5}') |
                ForEach-Object Value | Sort-Object -Unique |
                ForEach-Object {Write-Host ('AGENT06_DESKTOP_TS_CODE='+$_)}
            }else{Write-Host 'AGENT06_DESKTOP_TSC_PASS'}
            $build=Join-Path $env:RUNNER_TEMP 'agent06-online-build-private.log'
            & npm run build *> $build
            $buildExit=$LASTEXITCODE
            if($buildExit -ne 0){Write-Host 'AGENT06_DESKTOP_BUILD_FAIL'}
            else{Write-Host 'AGENT06_DESKTOP_BUILD_PASS'}
            $nodeTests=Join-Path $env:RUNNER_TEMP 'agent06-private-desktop-node-tests.log'
            & npm test *> $nodeTests
            $testsExit=$LASTEXITCODE
            if(Test-Path -LiteralPath $nodeTests -PathType Leaf){
              $safe=Get-Content -LiteralPath $nodeTests -Raw
              foreach($key in @('tests','pass','fail','cancelled','skipped')){
                $count=[regex]::Match($safe,('(?m)^# '+$key+'\s+(\d+)'))
                if($count.Success){
                  Write-Host ('AGENT06_DESKTOP_NODE_'+$key.ToUpper()+'='+$count.Groups[1].Value)
                }
              }
            }
            if($testsExit -ne 0 -and (Test-Path -LiteralPath $nodeTests -PathType Leaf)){
              # Only stable anonymized identities from TAP test titles are public.
              # Never print the private failing assertions, stack traces or code.
              $failed=@([regex]::Matches($safe,'(?m)^not ok\s+\d+\s+-\s+([^\r\n]+)'))
              Write-Host ('AGENT06_DESKTOP_NODE_FAILURE_IDENTITIES='+$failed.Count)
              foreach($entry in @($failed|Select-Object -First 12)){
                $name=[string]$entry.Groups[1].Value
                $digest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                  [Text.Encoding]::UTF8.GetBytes($name))).Substring(0,12)
                $category='OTHER'
                if($name -match '(?i)online|google|oauth|account|provider'){$category='ONLINE_PROVIDER'}
                elseif($name -match '(?i)u01|native.program|module.source'){$category='U01'}
                elseif($name -match '(?i)t3|one.core'){$category='T3'}
                elseif($name -match '(?i)setup|install|package'){$category='SETUP'}
                Write-Host ('AGENT06_DESKTOP_NODE_FAILED_SHA='+$digest+':'+$category)
                # Identify the failing test's source frame without revealing code,
                # raw path, test name or stack in public CI.
                $portion=$safe.Substring($entry.Index,[Math]::Min(3500,$safe.Length-$entry.Index))
                $frame=[regex]::Match($portion,
                  '(?i)desktop[/\\]tests[/\\]([a-z0-9_.-]+\.test\.mjs):(\d{1,4})')
                if($frame.Success){
                  $sourceDigest=[Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                    [Text.Encoding]::UTF8.GetBytes($frame.Groups[1].Value))).Substring(0,12)
                  Write-Host ('AGENT06_DESKTOP_NODE_SOURCE_SHA='+$sourceDigest+':'+$frame.Groups[2].Value)
                }else{Write-Host 'AGENT06_DESKTOP_NODE_SOURCE_FRAME_MISSING'}
              }
            }
            if($testsExit -eq 0){Write-Host 'AGENT06_DESKTOP_NODE_TEST_PASS'}
            else{Write-Host 'AGENT06_DESKTOP_NODE_TEST_FAIL'}
            if($tsExit -ne 0 -or $buildExit -ne 0 -or $testsExit -ne 0){
              "AGENT06_DESKTOP_GATE=FAIL" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
              exit 1
            }
            "AGENT06_DESKTOP_GATE=PASS" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }finally{Pop-Location}
      - name: Compile and test exact original native Windows Tauri host
        shell: pwsh
        continue-on-error: true
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
        run: |
          $ErrorActionPreference='Continue'
          $env:CARGO_TARGET_DIR=Join-Path $env:RUNNER_TEMP 'agent06-private-rust-target'
          $cargo=Get-Command cargo -ErrorAction SilentlyContinue
          if(-not $cargo){
            Write-Host 'AGENT06_NATIVE_RUST_TOOLCHAIN_MISSING'
            "AGENT06_RUST_GATE=FAIL" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 1
          }
          $log=Join-Path $env:RUNNER_TEMP 'agent06-private-rust.log'
          & cargo test --locked --manifest-path private-agent/desktop/src-tauri/Cargo.toml *> $log
          $exitCode=$LASTEXITCODE
          if($exitCode -ne 0){
            $raw=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            [regex]::Matches([string]$raw,'error\[E[0-9]{4}\]') |
              ForEach-Object Value | Sort-Object -Unique |
              ForEach-Object {Write-Host ('AGENT06_NATIVE_RUST_ERROR_CODE='+$_)}
            $safe=@('google_oauth_authorization_url_invalid','valid_google_oauth_browser_url',
              'browser_handoff_accepts_only_google_oauth_pkce_for_local_callback',
              'close_permission_is_scoped_to_verified_core_window')
            foreach($kind in $safe){
              if(([string]$raw).Contains($kind)){
                Write-Host ('AGENT06_NATIVE_RUST_FAILURE_CATEGORY='+$kind)
              }
            }
            # Only finite classifications and line numbers. Private compiler output
            # is confined to the runner; no private code or source excerpts.
            foreach($candidate in @('COMPILE_ERROR','RUST_TEST_FAILED','CARGO_BUILD_FAILED',
                'RUST_LINKER_FAILED','RUST_PANIC','RUST_TEST_FAILURE','RUST_TOOLCHAIN_UNAVAILABLE')){
              $needle=switch($candidate){
                'COMPILE_ERROR' {'error: could not compile'}
                'RUST_TEST_FAILED' {'test result: FAILED'}
                'CARGO_BUILD_FAILED' {'failed to run custom build command'}
                'RUST_LINKER_FAILED' {'linking with'}
                'RUST_PANIC' {'panicked at'}
                'RUST_TEST_FAILURE' {'test tests::browser_handoff_accepts_only_google_oauth_pkce_for_local_callback'}
                'RUST_TOOLCHAIN_UNAVAILABLE' {'not recognized as the name'}
              }
              if(([string]$raw).Contains($needle)){
                Write-Host ('AGENT06_NATIVE_RUST_DIAGNOSTIC='+$candidate)
              }
            }
            $compiledLines=[regex]::Matches([string]$raw,'(?:desktop[/\\]src-tauri[/\\]src[/\\])?main\.rs:(\d{1,4}):(\d{1,4})')
            foreach($item in @($compiledLines|Select-Object -First 8)){
              Write-Host ('AGENT06_NATIVE_RUST_SOURCE_LINE='+$item.Groups[1].Value)
            }
            $tests=@('browser_handoff_accepts_only_google_oauth_pkce_for_local_callback',
                     'close_permission_is_scoped_to_verified_core_window')
            foreach($test in $tests){
              if(([string]$raw).Contains('test tests::'+$test+' ... FAILED')){
                Write-Host ('AGENT06_NATIVE_RUST_TEST_FAIL='+$test)
              }
            }
            Write-Host 'AGENT06_NATIVE_RUST_FAIL'
            "AGENT06_RUST_GATE=FAIL" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            exit 1
          }
          Write-Host 'AGENT06_NATIVE_RUST_PASS'
          "AGENT06_RUST_GATE=PASS" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Report final private source qualification gate only
        if: always()
        shell: pwsh
        run: |
          Write-Host ('AGENT06_PRIVATE_PY_GATE='+$env:AGENT06_PY_GATE)
          Write-Host ('AGENT06_PRIVATE_DESKTOP_GATE='+$env:AGENT06_DESKTOP_GATE)
          Write-Host ('AGENT06_PRIVATE_RUST_GATE='+$env:AGENT06_RUST_GATE)
          if($env:AGENT06_PY_GATE -ne 'PASS' -or
             $env:AGENT06_DESKTOP_GATE -ne 'PASS' -or
             $env:AGENT06_RUST_GATE -ne 'PASS'){
            throw 'AGENT06_ONLINE_PRIVATE_SOURCE_NOT_QUALIFIED'
          }
          Write-Host 'AGENT06_ONLINE_PRIVATE_SOURCE_QUALIFIED'
      # Deliberately no artifact, cache, private test logs or compiled app upload.
