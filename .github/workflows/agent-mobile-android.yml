name: IWXA Android notification open race regression
on:
  push:
    branches: ['ci/once/agent-mobile-android/*']
    paths: ['.github/ci-requests/agent-mobile-android.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: iwxa-mobile-source-diagnosis
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRIVATE_PIN: 'a4999e005e111781b013ae98d99dab48b5390a03'
      PRIVATE_TREE: 'a324c6283f0471a8ef1dca7a5cdc67955133d5d1'
      T3_PIN: 'ff27d248d224d04d8d06142842bad9087d9ab277'
      T3_TREE: '02ce7263c3122d5f9fa1580ff9948996a4e4c9eb'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-shot private source candidate
        run: python3 .ci/agent-mobile-android/admit-once.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Diagnose source regression only
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python3 .ci/agent-mobile-android/diagnose-source.py
