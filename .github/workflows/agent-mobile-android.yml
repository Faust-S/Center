name: IWXA Android consolidated qualification
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/once/agent-mobile-android/*'
    paths:
      - '.github/ci-requests/agent-mobile-android.json'

permissions:
  contents: read
concurrency:
  group: iwxa-agent-mobile-android-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created == false && github.event.deleted == false && github.event.forced == false) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRIVATE_PIN: '55fea626f4d2318c2f6c496befbf60022243b787'
      PRIVATE_TREE: '7d367dbc46ba216b57c85b6e4af7b2d082f359d1'
      T3_PIN: '1e5d54bba065f0e82cc506a5443b96079d070608'
      T3_TREE: '80f724d21d2acca0394e3694ae4a9a7fd65317bc'
    steps:
      - name: Checkout exact public request for admission
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exactly one intentional candidate request before private access
        run: |
          python3 .ci/agent-mobile-android/admit-once.py
          python3 .ci/agent-mobile-android/test-t3-receipts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Prepare public QA audio tools before private source access
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: One private source, Android build and installed emulator contour
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, shutil, subprocess, sys, tempfile, time
          sys.path.insert(0,str(pathlib.Path.cwd()/'.ci'/'agent-mobile-android'))
          import t3_receipts
          def status(name, value):
              print(name+"="+str(value),flush=True)
          def main():
              token=os.environ.pop("IWXA_TEMP_READ_TOKEN","")
              pin=os.environ["PRIVATE_PIN"]
              tree=os.environ["PRIVATE_TREE"]
              if not token or not re.fullmatch(r"[0-9a-f]{40}",pin) or not re.fullmatch(r"[0-9a-f]{40}",tree):
                  status("PRIVATE_READ","TOKEN_OR_PIN_UNAVAILABLE");return 1
              with tempfile.TemporaryDirectory(prefix="iwxa-android-",dir=os.environ["RUNNER_TEMP"]) as temporary:
                  root=pathlib.Path(temporary)
                  source=root/"source";source.mkdir()
                  env=dict(os.environ)
                  env.update({"GIT_TERMINAL_PROMPT":"0","GIT_LFS_SKIP_SMUDGE":"1","GRADLE_USER_HOME":str(root/"gradle"),"npm_config_cache":str(root/"npm-cache"),"ANDROID_AVD_HOME":str(root/"avd"),"ANDROID_EMULATOR_HOME":str(root/"emulator-home")})
                  if env.get("JAVA_HOME_21_X64"):
                      env["JAVA_HOME"]=env["JAVA_HOME_21_X64"]
                      env["PATH"]=str(pathlib.Path(env["JAVA_HOME"])/"bin")+os.pathsep+env["PATH"]
                  emulator=None
                  def run(args,cwd=source,custom=None,timeout=600,stdin=None):
                      return subprocess.run(args,cwd=cwd,env=custom or env,input=stdin,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout)
                  def stage(label,args,cwd=source,timeout=600,stdin=None):
                      try:
                          p=run(args,cwd,timeout=timeout,stdin=stdin)
                      except subprocess.TimeoutExpired:
                          status(label,"TIMEOUT");return False
                      status(label,"PASS" if p.returncode==0 else "FAIL")
                      return p.returncode==0
                  try:
                      if run(["git","init","-q"]).returncode:return 1
                      auth=dict(env)
                      auth.update({"GIT_CONFIG_COUNT":"1","GIT_CONFIG_KEY_0":"http.https://github.com/.extraheader","GIT_CONFIG_VALUE_0":"AUTHORIZATION: basic "+base64.b64encode(("x-access-token:"+token).encode()).decode()})
                      fetched=run(["git","fetch","--no-tags","--depth","1","https://github.com/Faust-S/iwxa-personal-agent.git",pin],custom=auth,timeout=180)
                      del auth,token
                      if fetched.returncode or run(["git","checkout","--detach","-q",pin]).returncode:
                          status("PRIVATE_READ","FETCH_FAIL");return 1
                      if run(["git","rev-parse","HEAD"]).stdout.decode().strip()!=pin or run(["git","rev-parse","HEAD^{tree}"]).stdout.decode().strip()!=tree:
                          status("PRIVATE_READ","PIN_MISMATCH");return 1
                      status("PRIVATE_READ","PASS");status("SOURCE_PIN",pin)
                      mobile=source/"mobile"
                      # Validate the original public WAV and AAC conversion before npm, models and SDK work.
                      media=run(["node","scripts/prepare-qa-speech.mjs","--media-only","--fetch"],mobile,timeout=180)
                      if media.returncode or b"QA_NATIVE_SPEECH_MEDIA_PREFLIGHT=PASS" not in media.stdout:
                          for code in re.findall(rb"\bQA_SPEECH_MEDIA_(SOURCE|ENCODE_TIMEOUT|ENCODE|FFMPEG_MISSING|FFPROBE_MISSING|PROBE|FORMAT)\b",media.stdout):
                              status("QA_NATIVE_SPEECH_MEDIA_FAILURE",code.decode())
                          status("QA_NATIVE_SPEECH_MEDIA_PREFLIGHT","FAIL");return 1
                      status("QA_NATIVE_SPEECH_MEDIA_PREFLIGHT","PASS")
                      tts_input=run(["node","scripts/prepare-qa-tts.mjs","--fetch"],mobile,timeout=600)
                      if tts_input.returncode or b"QA_NATIVE_TTS_FIXTURES_VERIFIED" not in tts_input.stdout:
                          for code in sorted(set(re.findall(rb"\bQA_(?:TTS|SPEECH)_(?:PIN_INVALID|FIXTURE_REQUIRED|DOWNLOAD_FAILED|FIXTURE_SIZE|FIXTURE_IDENTITY)\b",tts_input.stdout))):
                              status("QA_NATIVE_TTS_PREFLIGHT_FAILURE",code.decode())
                          status("QA_NATIVE_TTS_PREFLIGHT","FAIL");return 1
                      status("QA_NATIVE_TTS_PREFLIGHT","PASS")
                      audio_diagnostics=run(["python3","mobile/qualification/test_diagnostics.py"],source,timeout=60)
                      if audio_diagnostics.returncode or not re.search(rb"(?m)^Ran 21 tests? in [0-9.]+s\s*$",audio_diagnostics.stdout) or not re.search(rb"(?m)^OK\s*$",audio_diagnostics.stdout):
                          status("EXCHANGE_DIAGNOSTICS","FAIL");return 1
                      status("EXCHANGE_DIAGNOSTICS","PASS");status("AUDIO_DIAGNOSTICS_POLICY","21/21")
                      native=json.loads((mobile/"native/llama-source.json").read_text())
                      if native.get("revision")!="5220a2d4040aa75f52678ebf52d77a0fba85de9f":
                          status("LLAMA_PIN","FAIL");return 1
                      # The verified public dependency lock is now committed.
                      # Never regenerate it in qualification.
                      if not (mobile/"package-lock.json").is_file():
                          status("LOCK_STATUS","MISSING");return 1
                      lock=json.loads((mobile/"package-lock.json").read_text())
                      manifest=json.loads((mobile/"package.json").read_text())
                      if lock.get("lockfileVersion")!=3 or any(lock.get(k)!=manifest[k] or lock.get("packages",{}).get("",{}).get(k)!=manifest[k] for k in ("name","version")) or any(lock.get("packages",{}).get("",{}).get(k)!=manifest[k] for k in ("dependencies","devDependencies","engines")):
                          status("LOCK_STATUS","MISMATCH");return 1
                      status("LOCK_STATUS","SOURCE_LOCK")
                      status("LOCK_SHA256",hashlib.sha256((mobile/"package-lock.json").read_bytes()).hexdigest())
                      if not stage("NPM_CI",["npm","ci","--no-audit","--no-fund"],mobile,600):return 1
                      # Build first: emulator/KVM availability cannot suppress source or APK checks.
                      def report_stage(name,args,cwd,timeout):
                          try:outcome=run(args,cwd,timeout=timeout)
                          except subprocess.TimeoutExpired:
                              status(name,"TIMEOUT");return False
                          report=outcome.stdout.decode("utf-8",errors="replace")
                          if name=="ORIGINAL_AGENT_ROUTE":
                              expected={"CONNECT","MODEL_CATALOG","CHAT_ADMISSION","CHAT_HISTORY","CHAT_SEARCH","CHAT_GROUPS","CHAT_LIFECYCLE","WORK_AREAS","TASK_ADMISSION","REFERENCE_PERSISTED","RESTART_RECOVERY","HUMAN_REVIEW"}
                              observed=[]
                              for kind,value in re.findall(r"(?m)^ORIGINAL_AGENT_ROUTE_(STAGE|PASS)=([A-Z_]+)\s*$",report):
                                  if value in expected:
                                      status("ORIGINAL_AGENT_ROUTE_"+kind,value)
                                      if kind=="PASS":observed.append(value)
                              for failure in re.findall(r"(?m)^ORIGINAL_AGENT_ROUTE_FAILURE=(REMOTE_MODEL_CATALOG_CHANGED|REMOTE_MODEL_CATALOG_INVALID|REMOTE_CONVERSATIONS_INVALID|REMOTE_CHAT_INVALID|REMOTE_SUBMISSION_UNCONFIRMED|REMOTE_TASK_NOT_IN_AREA|REMOTE_RESULT_INCOMPLETE|REMOTE_REVIEW_CHANGED|REMOTE_REVIEW_UNCONFIRMED|API_CONNECTION_FAILED|QA_PENDING_TIMEOUT|REMOTE_CONVERSATION_UNCONFIRMED|REMOTE_DIALOGUE_CHANGED|REMOTE_CHAT_CONTEXT_UNSUPPORTED|REMOTE_ORGANIZER_CHANGED|REMOTE_ORGANIZER_UNCONFIRMED|REMOTE_AREA_CREATION_UNCONFIRMED|REMOTE_AREA_UPDATE_UNCONFIRMED|REMOTE_AREA_ACTIVATION_UNCONFIRMED|REMOTE_AREA_CATALOG_CHANGED|REMOTE_WORK_AREA_SELECTION_UNCONFIRMED|REMOTE_CATALOG_SEARCH_CHANGED|REMOTE_CATALOG_SEARCH_INVALID|REMOTE_CATALOG_SEARCH_UNSUPPORTED|REMOTE_CHAT_MATERIAL_CHANGED|REMOTE_CHAT_MATERIAL_INVALID|REMOTE_CHAT_MATERIAL_TOO_LARGE|REMOTE_WORK_ARCHIVE_CHANGED|REMOTE_WORK_ARCHIVE_INVALID|ERR_ASSERTION)\s*$",report):
                                  status("ORIGINAL_AGENT_ROUTE_FAILURE",failure)
                              for kind in re.findall(r"(?m)^ORIGINAL_AGENT_ROUTE_FAILURE_TYPE=(RuntimeError|ValueError|KeyError|TypeError|ImportError|ModuleNotFoundError|OSError|TimeoutExpired|CalledProcessError|FileNotFoundError|PermissionError|AssertionError)\s*$",report):
                                  status("ORIGINAL_AGENT_ROUTE_FAILURE_TYPE",kind)
                              passed=outcome.returncode==0 and sorted(observed)==sorted(expected) and re.search(r"(?m)^ORIGINAL_AGENT_ROUTE=PASS\s*$",report) is not None
                              status(name,"PASS" if passed else "FAIL")
                              return passed
                          if name=="INSTALLED_AGENT_ROUTE":
                              expected={"PREPARE","COLD_RESTART","RECOVER_AND_REVIEW"}
                              observed=[]
                              for value in re.findall(r"(?m)^INSTALLED_AGENT_ROUTE_PASS=([A-Z_]+)\s*$",report):
                                  if value in expected:
                                      observed.append(value);status("INSTALLED_AGENT_ROUTE_PASS",value)
                              allowed_failures={"HOME","REMOTE_HOME","ORIGIN_FIELD","TOKEN_FIELD","INVALID_TOKEN","AUTH_DENIED","TOKEN_CLEARED","CONNECT","CONNECTED","DEVICE_NAME","DEVICE_SAVE","DEVICE_SAVED","MODEL_NAVIGATION","MODEL_CATALOG","CHAT_NAVIGATION","NEW_CHAT","CHAT_DRAFT","CHAT_SUBMIT","CHAT_COMPLETE","CHAT_OPEN","CHAT_HISTORY","CHAT_CLOSE","CHAT_REFERENCE_CLOSED","WORK_NAVIGATION","WORK_DRAFT","WORK_SUBMIT","WORK_COMPLETE","WORK_OPEN","WORK_RESULT","STORAGE_MINIMIZED","RECOVERY_ADDRESS","RECOVERY_SELECT","RECOVERY_TOKEN_REQUIRED","RECOVERY_OPEN","RECOVERY_RESULT","REVIEW_NOTES","REVIEW_CONTROL","REVIEW_CONFIRMATION","REVIEW_READBACK","WORK_REFERENCE_CLOSE","WORK_REFERENCE_CLOSED","CHAT_RECOVERY_NAVIGATION","CHAT_RECOVERY_CATALOG","CHAT_RECOVERED","WEBVIEW_TIMEOUT","PACKAGE","VERSION","VERSION_CODE","FIXTURE_REQUIRED","ATTACHMENT_PICKER","ATTACHMENT_FIXTURE","ATTACHMENT_SELECT","ATTACHMENT_RETURN","ATTACHMENT_SELECTED","ATTACHMENT_CANCEL","ATTACHMENT_CONTEXT","ATTACHMENT_LOCAL_ONLY","ATTACHMENT_CONFIRM","ATTACHMENT_STORAGE","ATTACHMENT_REMOVE","ATTACHMENT_CLEANUP","ATTENTION_NAVIGATION","ATTENTION_NAVIGATION_REMOTE","ATTENTION_NAVIGATION_SCREEN","ATTENTION_ENABLE","ATTENTION_TASK_ID","ATTENTION_NOTIFICATION","ATTENTION_GENERIC","ATTENTION_SHADE","ATTENTION_RETURN","ATTENTION_READBACK","ATTENTION_DISABLE","ATTENTION_CLEANUP","ATTENTION_OPEN","PHOTO_PICKER","PHOTO_FIXTURE","PHOTO_DRAFT","PHOTO_SELECT","PHOTO_RETURN","PHOTO_PREVIEW","PHOTO_CANCEL","PHOTO_CAMERA","PHOTO_CAMERA_TEMP","PHOTO_CAMERA_CANCEL","PHOTO_CAMERA_UNAVAILABLE","PHOTO_CAMERA_CLEANUP","PHOTO_LOCAL_MODEL","PHOTO_CONTEXT","PHOTO_STORAGE","PHOTO_REMOVE","PHOTO_CLEANUP","PHOTO_FIXTURE_READBACK","PHOTO_PIXELS","PHOTO_SELECT_PICKER_LOST","PHOTO_SELECT_ROOTS_UNAVAILABLE","PHOTO_SELECT_ROOT_UNAVAILABLE","PHOTO_SELECT_LOCATION_UNCONFIRMED","PHOTO_SELECT_ALBUM_UNAVAILABLE","PHOTO_SELECT_ALBUM_UNCONFIRMED","PHOTO_SELECT_FILE_UNAVAILABLE","ATTACHMENT_CANCEL_PICKER_LOST","ATTACHMENT_CANCEL_BACK_REFUSED","ATTACHMENT_CANCEL_BACK_LIMIT","ATTACHMENT_CANCEL_RETURN","ATTACHMENT_CANCEL_DRAFT","PHOTO_CANCEL_PICKER_LOST","PHOTO_CANCEL_BACK_REFUSED","PHOTO_CANCEL_BACK_LIMIT","PHOTO_CANCEL_RETURN","PHOTO_CANCEL_DRAFT","PHOTO_CANCEL_MESSAGE","PHOTO_CAMERA_CANCEL_RETURN","PHOTO_CAMERA_CANCEL_DRAFT","PHOTO_CAMERA_CANCEL_MESSAGE","VISION_SOURCE","VISION_STORAGE","VISION_SUBMIT","VISION_CONFIRM","VISION_COMPLETE","VISION_POINTER","VISION_HISTORY","VISION_RECOVERED","VISION_DRAFT_CLEARED","CATALOG_SEARCH_NAVIGATION","CATALOG_SEARCH_DRAFT","CATALOG_SEARCH_QUERY","CATALOG_SEARCH_RESULT","CATALOG_SEARCH_OPEN","CHAT_MATERIAL_DRAFT","CHAT_MATERIAL_TRANSFER","CHAT_MATERIAL_RETURN","CHAT_MATERIAL_CLEANUP","DRAFT_RESUME_NAVIGATION","DRAFT_RESUME_TASK","DRAFT_RESUME_CHAT","ARCHIVE_NAVIGATION","ARCHIVE_RESULT","ARCHIVE_OPEN","ARCHIVE_RETURN","PHOTO_CAMERA_CONTROL","PHOTO_CAMERA_PERMISSION_DECLARED","PHOTO_CAMERA_LAUNCH","PHOTO_CAMERA_PERMISSION","PHOTO_CAMERA_PREPARE","PHOTO_CAMERA_RESOLUTION_CHANGED","PHOTO_CAMERA_CONTEXT","PHOTO_CAMERA_EARLY_CANCEL","PHOTO_CAMERA_CHOOSER","PHOTO_CAMERA_EXTERNAL_TIMEOUT","PHOTO_CAMERA_CANCEL_CONTEXT","CHECKPOINT_SAVE","CHECKPOINT_CONFIRM","CHECKPOINT_ENCRYPTED","CHECKPOINT_RESTORE","CHECKPOINT_READBACK","CHECKPOINT_CLEANUP","CHECKPOINT_APP_STOP"}
                              for value in re.findall(r"(?m)^INSTALLED_AGENT_FAILURE_STAGE=([A-Z_]+)\s*$",report):
                                  if value in allowed_failures:status("INSTALLED_AGENT_FAILURE_STAGE",value)
                              codes={"COMMAND_FAILED","SERVER_START","SERVER_PORT","SERVER_READY","SERVER_SHUTDOWN","QUERY_CONTRACT","RESPONSE_BOUND","TASK_CATALOG","CHAT_READBACK","CHAT_COUNT","DISPOSABLE_CI_REQUIRED","DISPOSABLE_EMULATOR_REQUIRED","DISPOSABLE_AVD_REQUIRED","APK_REQUIRED","DISPOSABLE_RESET","ANDROID_VERSION_CODE","INSTRUMENTATION_FAILED","INITIAL_TASKS","TASK_COUNT","TASK_ID","TASK_READBACK","RESTART_PORT","RESTART_RESULT","RESTART_CHAT","DUPLICATE_TASK","HUMAN_REVIEW_READBACK","CHAT_REPLAY","FIXTURE_MUST_BE_OUTSIDE_SOURCE","FIXTURE_ARGUMENTS","PHOTO_CAMERA_WITNESS_MISSING","PHOTO_NO_DEMO_INFERENCE","CHECKPOINT_WITNESS_MISSING","CHECKPOINT_APP_STOP"}
                              for value in re.findall(r"(?m)^INSTALLED_AGENT_FAILURE_CODE=([A-Z_]+)\s*$",report):
                                  if value in codes:status("INSTALLED_AGENT_FAILURE_CODE",value)
                              for kind in re.findall(r"(?m)^INSTALLED_AGENT_FAILURE_TYPE=(RuntimeError|ValueError|KeyError|TypeError|ImportError|ModuleNotFoundError|OSError|TimeoutExpired|CalledProcessError|FileNotFoundError|PermissionError|AssertionError|HTTPError|URLError|SSLError|ConnectionError)\s*$",report):
                                  status("INSTALLED_AGENT_FAILURE_TYPE",kind)
                              cameras=re.findall(r"(?m)^INSTALLED_AGENT_PHOTO_CAMERA=(INTENT_CANCELLED|UNAVAILABLE)\s*$",report)
                              for camera in cameras:status("INSTALLED_AGENT_PHOTO_CAMERA",camera)
                              checkpoints=re.findall(r"(?m)^INSTALLED_AGENT_CHECKPOINT=(PASS)\s*$",report)
                              if checkpoints==["PASS"]:status("INSTALLED_AGENT_CHECKPOINT","PASS")
                              passed=outcome.returncode==0 and sorted(observed)==sorted(expected) and len(cameras)==1 and checkpoints==["PASS"] and re.search(r"(?m)^INSTALLED_AGENT_ROUTE=PASS\s*$",report) is not None
                              status(name,"PASS" if passed else "FAIL")
                              return passed
                          if name=="NATIVE_REAL_SPEECH_ROUTE":
                              expected=["OFFLINE_START","MODEL_VERIFIED","AUDIO_VERIFIED","REAL_TRANSCRIPT","MEDIA_VERIFIED","UI_AUDIO_CANCEL","SECOND_TRANSCRIPT","LONG_MEDIA_TRANSCRIPT","UI_EXPORT_CANCEL","UI_EXPORT","UI_EXPORT_EXPECTED","MIC_CAPTURE_STARTED","MIC_CANCELLED","OFFLINE_END","EXPORT_ADB_READBACK","EXPORT_ADB_CLEANUP"]
                              stages=re.findall(r"(?m)^NATIVE_REAL_SPEECH_PASS=([A-Z_]+)\s*$",report)
                              for stage in stages:
                                  if stage in expected:status("NATIVE_REAL_SPEECH_PASS",stage)
                              for stage in re.findall(r"(?m)^NATIVE_REAL_SPEECH_OBSERVED=([A-Z_]+)\s*$",report):
                                  if stage in expected:status("NATIVE_REAL_SPEECH_OBSERVED",stage)
                              diagnostic_codes={
                                  "NATIVE_REAL_SPEECH_MEDIA_LAST":{"METADATA","COPY","HASH","DECODE","DECODED"},
                                  "NATIVE_REAL_SPEECH_CODEC_CHECK":{"TRACK_COUNT","AUDIO_TRACK_COUNT","INPUT_MIME","INPUT_BOUNDS","INPUT_ENCRYPTED","INPUT_TIMESTAMP","PCM_METADATA","PCM_RATE","PCM_CHANNELS","PCM_ENCODING","PCM_FORMAT_CHANGED","PCM_FRAME","OUTPUT_BOUNDS"},
                                  "NATIVE_REAL_SPEECH_MEDIA_ERROR":{"FORMAT","DURATION","DECODE"},
                                  "NATIVE_REAL_SPEECH_EXCEPTION":{"NATIVE_LINK","CLASS_LOADING","UI_AUTOMATION","ACTIVITY_STATE","JSON","NULL_REFERENCE","ILLEGAL_ARGUMENT","ILLEGAL_STATE","SECURITY","IO","ASSERTION","RUNNER","ANDROID_CODEC","UNCLASSIFIED"},
                              }
                              for key,allowed in diagnostic_codes.items():
                                  for value in re.findall(r"(?m)^"+key+r"=([A-Z_]+)\s*$",report):
                                      if value in allowed:status(key,value)
                              for value in re.findall(r"(?m)^NATIVE_REAL_SPEECH_FAILURE_CHECK=([A-Z_]+)\s*$",report):
                                  if value in {"OFFLINE","MODEL_ASSET","MODEL_IDENTITY","SAMPLE_LENGTH","SAMPLE_IDENTITY","SAMPLE_DURATION","DURATION","TRANSCRIPT_SEMANTIC","CLEANUP","CLEAN_ROOT","WEBVIEW_TIMEOUT","UI_PICKER","UI_RETURN","UI_CANCEL","UI_FIXTURE","UI_SELECT","UI_TEXT_PRESERVED","UI_DOWNLOADS","UI_FILENAME","UI_SAVE","UI_EXPORT_READBACK","UI_FIXTURE_CLEANUP","UI_EXPORT_CLEANUP","MEDIA_IDENTITY","MEDIA_FORMAT","MEDIA_DURATION","LONG_SEMANTIC","LONG_WINDOWS","MIC_PERMISSION","MIC_CAPTURE_START","MIC_CANCEL","MIC_STATE","MIC_EDITOR"}:status("NATIVE_REAL_SPEECH_FAILURE_CHECK",value)
                              for value in re.findall(r"(?m)^NATIVE_REAL_SPEECH_FAILURE_STAGE=([A-Z_]+)\s*$",report):
                                  if value in {"UI_HOME","UI_MODELS","UI_SPEECH","UI_READY","UI_AUDIO_CANCEL","UI_AUDIO","UI_TRANSCRIPT","UI_EXPORT_CANCEL","UI_EXPORT","MIC_CAPTURE_START","MIC_CANCEL","MIC_STATE"}:status("NATIVE_REAL_SPEECH_FAILURE_STAGE",value)
                              for value in re.findall(r"(?m)^NATIVE_REAL_SPEECH_FAILURE_TYPE=([A-Za-z]+)\s*$",report):
                                  if value in {"RuntimeError","ValueError","KeyError","TypeError","OSError","TimeoutExpired","CalledProcessError","AssertionError","FileNotFoundError"}:status("NATIVE_REAL_SPEECH_FAILURE_TYPE",value)
                              for value in re.findall(r"(?m)^NATIVE_REAL_SPEECH_FAILURE_CODE=([A-Z_]+)\s*$",report):
                                  if value in {"ARGUMENTS","ADB_FAILED","DISPOSABLE_CI_REQUIRED","DISPOSABLE_EMULATOR_REQUIRED","DISPOSABLE_AVD_REQUIRED","INSTRUMENTATION_FAILED","APP_NOT_INSTALLED","TEST_NOT_INSTALLED","OFFLINE_NOT_ENABLED","PROCESS_NOT_STOPPED","QA_EXPORT_ALREADY_EXISTS","QA_EXPORT_RECEIPT_REQUIRED","QA_EXPORT_READBACK_MISMATCH","QA_EXPORT_CLEANUP_FAILED","QA_EXPORT_ONLINE_FAILED"}:status("NATIVE_REAL_SPEECH_FAILURE_CODE",value)
                              export_checks=[]
                              for check in ("EXPORT_READBACK","EXPORT_CLEANUP"):
                                  values=re.findall(r"(?m)^NATIVE_REAL_SPEECH_"+check+r"=(PASS|FAIL)\s*$",report)
                                  if len(values)==1:status("NATIVE_REAL_SPEECH_"+check,values[0])
                                  export_checks.append(values==["PASS"])
                              passed=outcome.returncode==0 and stages==expected and re.findall(r"(?m)^NATIVE_REAL_SPEECH_ROUTE=(PASS|FAIL)\s*$",report)==["PASS"] and all(export_checks)
                              status(name,"PASS" if passed else "FAIL")
                              return passed
                          if name=="NATIVE_REAL_TTS_ROUTE":
                              expected=["OFFLINE_START","MODEL_VERIFIED","NATIVE_EN","UI_RU","UI_PLAY","UI_EXPORT_CANCEL","UI_EXPORT","UI_EXPORT_EXPECTED","UI_CLEAR","UI_SEQUENCE","UI_SEQUENCE_PLAY","UI_SEQUENCE_CLEAR","OFFLINE_END","EXPORT_ADB_READBACK","EXPORT_ADB_CLEANUP"]
                              stages=re.findall(r"(?m)^NATIVE_REAL_TTS_PASS=([A-Z_]+)\s*$",report)
                              for step in stages:
                                  if step in expected:status("NATIVE_REAL_TTS_PASS",step)
                              for step in re.findall(r"(?m)^NATIVE_REAL_TTS_OBSERVED=([A-Z_]+)\s*$",report):
                                  if step in expected:status("NATIVE_REAL_TTS_OBSERVED",step)
                              tts_codes={
                                  "NATIVE_REAL_TTS_LAST":{"CALLBACK_ABI","CONFIG","ENGINE_CREATE","MODEL_PROPERTIES","GENERATE","GENERATED","AUDIO_VALIDATE","SAVE","WAV_VERIFY","VERIFIED"},
                                  "NATIVE_REAL_TTS_ERROR":{"MODEL_INVALID","AUDIO_INVALID","TEXT_INVALID","REQUEST_INVALID","CALLBACK_ABI","CANCELLED","WAV_INVALID","MEMORY_REQUIRED","RESIDENT_CHANGED"},
                                  "NATIVE_REAL_TTS_EXCEPTION":{"NATIVE_LINK","CLASS_LOADING","UI_AUTOMATION","ACTIVITY_STATE","JSON","NULL_REFERENCE","ILLEGAL_ARGUMENT","ILLEGAL_STATE","SECURITY","IO","ASSERTION","RUNNER","JNI_SIGNATURE","NATIVE_CRASH","ORT_OPERATOR","MEMORY","UNCLASSIFIED"},
                              }
                              for key,allowed in tts_codes.items():
                                  for value in re.findall(r"(?m)^"+key+r"=([A-Z_]+)\s*$",report):
                                      if value in allowed:status(key,value)
                              for value in re.findall(r"(?m)^NATIVE_REAL_TTS_FAILURE_CHECK=([A-Z_]+)\s*$",report):
                                  if value in {"OFFLINE","MODEL_ASSET","MODEL_IDENTITY","AUDIO_FORMAT","AUDIO_RECEIPT","UI_PLAY","UI_PICKER","UI_CANCEL","UI_SAVE","UI_READBACK","UI_CLEAR","SEQUENCE_SOURCE","CLEANUP","WEBVIEW_TIMEOUT"}:status("NATIVE_REAL_TTS_FAILURE_CHECK",value)
                              for value in re.findall(r"(?m)^NATIVE_REAL_TTS_FAILURE_TYPE=([A-Za-z]+)\s*$",report):
