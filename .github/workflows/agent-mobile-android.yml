                              for s in ["NATIVE_VISION_ACTIVATE","NATIVE_VISION_ANSWER_MISMATCH","NATIVE_VISION_CONTEXT_GROWTH","NATIVE_VISION_CONTEXT_RECEIPT","NATIVE_VISION_DIRECTORY","NATIVE_VISION_EMPTY_CONTEXT","NATIVE_VISION_FIXTURE_SIZE","NATIVE_VISION_FIXTURE_TARGET","NATIVE_VISION_FIXTURE_ASSET","NATIVE_VISION_BUNDLE_PROFILE","NATIVE_VISION_BUNDLE_REVISION","NATIVE_VISION_BUNDLE_MODEL","NATIVE_VISION_BUNDLE_PROJECTOR","NATIVE_VISION_BUNDLE_PREEXISTING","NATIVE_VISION_BUNDLE_INSTALL","NATIVE_VISION_BUNDLE_REMOVAL","NATIVE_VISION_FRESH_CONTEXT","NATIVE_VISION_GENERATION_IDENTITY","NATIVE_VISION_IMAGE_RECEIPT","NATIVE_VISION_INVALID_IMAGE","NATIVE_VISION_INVALID_IMAGE_CONTEXT","NATIVE_VISION_JPEG","NATIVE_VISION_JPEG_SIZE","NATIVE_VISION_MODEL_CLEANUP","NATIVE_VISION_PROJECTOR_CLEANUP","NATIVE_VISION_TEXT_RECEIPT","NATIVE_VISION_UI_ACTIVATE","NATIVE_VISION_UI_CONTEXT","NATIVE_VISION_UI_FIXTURE","NATIVE_VISION_UI_FIXTURE_CLEANUP","NATIVE_VISION_UI_HASH","NATIVE_VISION_UI_PICKER","NATIVE_VISION_UI_PIXELS","NATIVE_VISION_UI_RETURN","NATIVE_VISION_UI_SELECT","NATIVE_VISION_UNLOAD","NATIVE_VISION_WEBVIEW_TIMEOUT"]:
                                  if re.search(r"\b"+s+r"\b",report):status("NATIVE_VISION_CHECK",s)
                              for s in ["ACTIVATE","INVALID_IMAGE","IMAGE","FOLLOWUP","STATUS","UNLOAD","HOME","UI_MODELS","UI_LOCAL","UI_MODEL","UI_ACTIVATE","UI_PICKER","UI_PREVIEW","UI_PIXELS","UI_GENERATE"]:
                                  for prefix in ("NATIVE_VISION_TIMEOUT:","NATIVE_VISION_BRIDGE:"):
                                      if re.search(re.escape(prefix+s)+r"\b",report):status("NATIVE_VISION_STAGE",s)
                          count=failures=errors=skipped=xml_errors=0
                          observed=[]
                          for xml in result_dir.rglob("TEST-*.xml"):
                              try:
                                  if xml.stat().st_size>16*1024*1024:raise ValueError("large XML")
                                  rootxml=ET.parse(xml).getroot()
                              except (ET.ParseError,OSError,ValueError):
                                  xml_errors+=1;continue
                              for case in rootxml.iter("testcase"):
                                  count+=1
                                  label=labels.get(case.get("name"),"OTHER")
                                  observed.append(label)
                                  f=case.find("failure");e=case.find("error");s=case.find("skipped")
                                  failures+=int(f is not None);errors+=int(e is not None);skipped+=int(s is not None)
                                  status("ANDROID_WITNESS",label+":"+("FAIL" if f is not None or e is not None else "SKIP" if s is not None else "PASS"))
                                  for node in [f,e]:
                                      if node is not None:device_failure(node.get("message","")+" "+node.get("type","")+" "+(node.text or ""))
                          status("ANDROID_TESTS",count)
                          status("ANDROID_FAILURES",failures+errors)
                          status("ANDROID_SKIPPED",skipped)
                          status("ANDROID_XML_ERRORS",xml_errors)
                          if not device_ok:
                              for package,label in [("ru.iwxa.agent.mobile","APP"),("ru.iwxa.agent.mobile.test","TEST")]:
                                  try:
                                      installed=run([adb,"shell","pm","path",package],timeout=10)
                                      status("INSTALLED_"+label+"_PACKAGE","PRESENT" if installed.returncode==0 and b"package:" in installed.stdout else "NOT_OBSERVED")
                                  except subprocess.TimeoutExpired:status("INSTALLED_"+label+"_PACKAGE","TIMEOUT")
                              try:
                                  logs=run([adb,"logcat","-d","-t","1000"],timeout=20)
                                  device_failure(logs.stdout.decode("utf-8",errors="replace"))
                              except subprocess.TimeoutExpired:status("DEVICE_LOG_DIAGNOSTICS","TIMEOUT")
                          native_ok=device_ok and sorted(observed)==sorted(labels.values()) and count==len(labels) and not failures and not errors and not skipped and not xml_errors
                          remote_ok=False
                          if native_ok:
                              # No second source checkout, npm install, native compilation or emulator.
                              remote_ok=report_stage("INSTALLED_AGENT_ROUTE",[py,"mobile/qualification/installed-agent-route.py","run",str(fixture),adb],source,2100)
                          else:
                              status("INSTALLED_AGENT_ROUTE","NOT_RUN")
                          vision_ok=False
                          if native_ok:
                              vision_ok=report_stage("NATIVE_REAL_VISION_ROUTE",[py,"mobile/qualification/installed-t3-route.py",adb,"--native-vision-only"],source,1800)
                          else:
                              status("NATIVE_REAL_VISION_ROUTE","NOT_RUN")
                          speech_ok=False
                          if native_ok:
                              speech_ok=report_stage("NATIVE_REAL_SPEECH_ROUTE",[py,"mobile/qualification/installed-t3-route.py",adb,"--native-speech-only"],source,1800)
                          else:
                              status("NATIVE_REAL_SPEECH_ROUTE","NOT_RUN")
                          tts_ok=False
                          if native_ok:
                              tts_ok=report_stage("NATIVE_REAL_TTS_ROUTE",[py,"mobile/qualification/installed-t3-route.py",adb,"--native-tts-only"],source,1800)
                          else:
                              status("NATIVE_REAL_TTS_ROUTE","NOT_RUN")
                          voice_ok=False
                          if native_ok:
                              voice_ok=report_stage("NATIVE_VOICE_DIALOGUE_ROUTE",[py,"mobile/qualification/installed-t3-route.py",adb,"--native-voice-dialogue-only"],source,2100)
                          else:
                              status("NATIVE_VOICE_DIALOGUE_ROUTE","NOT_RUN")
                          t3_ok=False
                          if native_ok:
                              # Independent installed T3 evidence remains useful after an Agent route failure.
                              t3_ok=report_stage("INSTALLED_T3_ROUTE",[py,"mobile/qualification/installed-t3-route.py",adb],source,2550)
                          else:
                              status("INSTALLED_T3_ROUTE","NOT_RUN")
                          passed=native_ok and remote_ok and vision_ok and speech_ok and tts_ok and voice_ok and t3_ok
                          status("QUALIFICATION","PASS" if passed else "FAIL")
                          status("PHYSICAL_ARM64","NOT_RUN")
                          status("REAL_VISION_ROUTE","NOT_RUN")
                          return 0 if passed else 1
                  finally:
                      if emulator is not None:
                          emulator.terminate()
                          try:emulator.wait(timeout=20)
                          except subprocess.TimeoutExpired:emulator.kill();emulator.wait()
          try:
              result=main()
          except (OSError,ValueError,KeyError,subprocess.TimeoutExpired) as e:
              status("HOST_ERROR",type(e).__name__);result=1
          status("RUNNER_CLEANUP","CHECKOUT_SCOPE_EXITED")
          sys.exit(result)
          PY
