name: IWXA mobile work port targeted qualification
on:
  push:
    branches: ['ci/once/agent-mobile-android/*']
    paths: ['.github/ci-requests/agent-mobile-android.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: iwxa-mobile-task-dispatch-host
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PRIVATE_PIN: 'bbd017268217dc290eb62fe01cca8c8a6c022a4b'
      PRIVATE_TREE: '8259699a15c4dbefad9b6bd9e02efb9417ebe922'
      T3_PIN: 'ff27d248d224d04d8d06142842bad9087d9ab277'
      T3_TREE: '02ce7263c3122d5f9fa1580ff9948996a4e4c9eb'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-shot private source candidate
        run: python3 .ci/agent-mobile-android/admit-once.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Qualify original Task dispatch on host
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python3 .ci/agent-mobile-android/diagnose-source.py
