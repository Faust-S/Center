name: IWXA Android native Task qualification
on:
  push:
    branches: ['ci/once/agent-mobile-android/*']
    paths: ['.github/ci-requests/agent-mobile-android.json']
permissions:
  contents: read
  actions: read
concurrency:
  group: iwxa-original-python-android-qualification
  cancel-in-progress: false
jobs:
  qualify:
    if: ${{ github.event.created == false && github.event.deleted == false && github.event.forced == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PRIVATE_PIN: '4db40f4b4cebe5c26be28f04498ebb060c5ed169'
      PRIVATE_TREE: 'ab4f5c4d5dea2f31aa9fdbb7481faa81b63b0170'
      T3_PIN: 'ff27d248d224d04d8d06142842bad9087d9ab277'
      T3_TREE: '02ce7263c3122d5f9fa1580ff9948996a4e4c9eb'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Admit exact one-shot private source candidate
        run: python3 .ci/agent-mobile-android/admit-once.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: rpds-py-2026.5.1-android-arm64_v8a
          github-token: ${{ github.token }}
          run-id: 46125511834
          path: ${{ runner.temp }}/iwxa-python-wheels/arm64
      - uses: actions/download-artifact@v4
        with:
          name: rpds-py-2026.5.1-android-x86_64
          github-token: ${{ github.token }}
          run-id: 46125511834
          path: ${{ runner.temp }}/iwxa-python-wheels/x86_64
      - name: Verify public native wheels and obtain exact pure Python wheels
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/iwxa-python-wheels"
          printf '%s\n' 'd54f05ee20ca1af882d8324c57ad3175b94df13ca9108c028b0ee3706b70cbb0  arm64/rpds_py-2026.5.1-cp313-cp313-android_24_arm64_v8a.whl' '0a4a4b2d306773a2343acb0c3954b22291f7f88fb25ab08385c9ac5b6b6760ac  x86_64/rpds_py-2026.5.1-cp313-cp313-android_24_x86_64.whl' | sha256sum -c -
          python -m pip download --no-deps --only-binary=:all: --dest pure 'attrs==26.1.0' 'jsonschema==4.26.0' 'jsonschema-specifications==2025.9.1' 'pypdf==6.21.4' 'referencing==0.37.0'
          command -v kotlinc
          command -v cmake
          echo PUBLIC_WHEELHOUSE=PASS
      - name: Qualify original native Task and memory regression without exporting private code or raw logs
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: python3 .ci/agent-mobile-android/qualify-original-python.py
