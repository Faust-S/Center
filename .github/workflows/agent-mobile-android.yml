name: IWXA Android consolidated qualification
on:
  push:
    branches:
      - work/2026-11-25-agent-mobile-android-qualification
    paths:
      - .ci/agent-mobile-android/request.json
permissions:
  contents: read
concurrency:
  group: iwxa-agent-mobile-android-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PRIVATE_PIN: '8b8e1234d2c0be97bc7bd76b30f487cf26b6402d'
      PRIVATE_TREE: 'c42e9ac85e6cb6928e13bc83efd83cc72d4e3c71'
      T3_PIN: '3c2530a62ed9d7d84ca40eea500fef161393424d'
      T3_TREE: '4f027d7fcdf49ced2a2e42a7795a994e1b3e6c69'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: One private source, Android build and installed emulator contour
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, shutil, subprocess, sys, tempfile, time
          def status(name, value):
              print(name+"="+str(value),flush=True)
          def main():
              token=os.environ.pop("IWXA_TEMP_READ_TOKEN","")
              pin=os.environ["PRIVATE_PIN"]
              tree=os.environ["PRIVATE_TREE"]
              if not token or not re.fullmatch(r"[0-9a-f]{40}",pin) or not re.fullmatch(r"[0-9a-f]{40}",tree):
                  status("PRIVATE_READ","TOKEN_OR_PIN_UNAVAILABLE");return 1
              with tempfile.TemporaryDirectory(prefix="iwxa-android-",dir=os.environ["RUNNER_TEMP"]) as temporary:
                  root=pathlib.Path(temporary)
                  source=root/"source";source.mkdir()
                  env=dict(os.environ)
                  env.update({"GIT_TERMINAL_PROMPT":"0","GIT_LFS_SKIP_SMUDGE":"1","GRADLE_USER_HOME":str(root/"gradle"),"npm_config_cache":str(root/"npm-cache"),"ANDROID_AVD_HOME":str(root/"avd"),"ANDROID_EMULATOR_HOME":str(root/"emulator-home")})
                  if env.get("JAVA_HOME_21_X64"):
                      env["JAVA_HOME"]=env["JAVA_HOME_21_X64"]
                      env["PATH"]=str(pathlib.Path(env["JAVA_HOME"])/"bin")+os.pathsep+env["PATH"]
                  emulator=None
                  def run(args,cwd=source,custom=None,timeout=600,stdin=None):
                      return subprocess.run(args,cwd=cwd,env=custom or env,input=stdin,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout)
                  def stage(label,args,cwd=source,timeout=600,stdin=None):
                      try:
                          p=run(args,cwd,timeout=timeout,stdin=stdin)
                      except subprocess.TimeoutExpired:
                          status(label,"TIMEOUT");return False
                      status(label,"PASS" if p.returncode==0 else "FAIL")
                      return p.returncode==0
                  try:
                      if run(["git","init","-q"]).returncode:return 1
                      auth=dict(env)
                      auth.update({"GIT_CONFIG_COUNT":"1","GIT_CONFIG_KEY_0":"http.https://github.com/.extraheader","GIT_CONFIG_VALUE_0":"AUTHORIZATION: basic "+base64.b64encode(("x-access-token:"+token).encode()).decode()})
                      fetched=run(["git","fetch","--no-tags","--depth","1","https://github.com/Faust-S/iwxa-personal-agent.git",pin],custom=auth,timeout=180)
                      del auth,token
                      if fetched.returncode or run(["git","checkout","--detach","-q",pin]).returncode:
                          status("PRIVATE_READ","FETCH_FAIL");return 1
                      if run(["git","rev-parse","HEAD"]).stdout.decode().strip()!=pin or run(["git","rev-parse","HEAD^{tree}"]).stdout.decode().strip()!=tree:
                          status("PRIVATE_READ","PIN_MISMATCH");return 1
                      status("PRIVATE_READ","PASS");status("SOURCE_PIN",pin)
                      mobile=source/"mobile"
                      native=json.loads((mobile/"native/llama-source.json").read_text())
                      if native.get("revision")!="5220a2d4040aa75f52678ebf52d77a0fba85de9f":
                          status("LLAMA_PIN","FAIL");return 1
                      # The verified public dependency lock is now committed.
                      # Never regenerate it in qualification.
                      if not (mobile/"package-lock.json").is_file():
                          status("LOCK_STATUS","MISSING");return 1
                      lock=json.loads((mobile/"package-lock.json").read_text())
                      manifest=json.loads((mobile/"package.json").read_text())
                      if lock.get("lockfileVersion")!=3 or any(lock.get(k)!=manifest[k] or lock.get("packages",{}).get("",{}).get(k)!=manifest[k] for k in ("name","version")) or any(lock.get("packages",{}).get("",{}).get(k)!=manifest[k] for k in ("dependencies","devDependencies","engines")):
                          status("LOCK_STATUS","MISMATCH");return 1
                      status("LOCK_STATUS","SOURCE_LOCK")
                      status("LOCK_SHA256",hashlib.sha256((mobile/"package-lock.json").read_bytes()).hexdigest())
                      if not stage("NPM_CI",["npm","ci","--no-audit","--no-fund"],mobile,600):return 1
                      # Build first: emulator/KVM availability cannot suppress source or APK checks.
                      def report_stage(name,args,cwd,timeout):
                          try:outcome=run(args,cwd,timeout=timeout)
                          except subprocess.TimeoutExpired:
                              status(name,"TIMEOUT");return False
                          report=outcome.stdout.decode("utf-8",errors="replace")
                          if name=="ORIGINAL_AGENT_ROUTE":
                              expected={"CONNECT","MODEL_CATALOG","CONVERSATION","TASK_ADMISSION","REFERENCE_PERSISTED","RESTART_RECOVERY","HUMAN_REVIEW"}
                              observed=[]
                              for kind,value in re.findall(r"(?m)^ORIGINAL_AGENT_ROUTE_(STAGE|PASS)=([A-Z_]+)\s*$",report):
                                  if value in expected:
                                      status("ORIGINAL_AGENT_ROUTE_"+kind,value)
                                      if kind=="PASS":observed.append(value)
                              for failure in re.findall(r"(?m)^ORIGINAL_AGENT_ROUTE_FAILURE=(REMOTE_MODEL_CATALOG_CHANGED|REMOTE_MODEL_CATALOG_INVALID|REMOTE_CONVERSATIONS_INVALID|REMOTE_CHAT_INVALID|REMOTE_SUBMISSION_UNCONFIRMED|REMOTE_TASK_NOT_IN_AREA|REMOTE_RESULT_INCOMPLETE|REMOTE_REVIEW_CHANGED|REMOTE_REVIEW_UNCONFIRMED|API_CONNECTION_FAILED|QA_PENDING_TIMEOUT)\s*$",report):
                                  status("ORIGINAL_AGENT_ROUTE_FAILURE",failure)
                              for kind in re.findall(r"(?m)^ORIGINAL_AGENT_ROUTE_FAILURE_TYPE=(RuntimeError|ValueError|KeyError|TypeError|ImportError|ModuleNotFoundError|OSError|TimeoutExpired|CalledProcessError|FileNotFoundError|PermissionError|AssertionError)\s*$",report):
                                  status("ORIGINAL_AGENT_ROUTE_FAILURE_TYPE",kind)
                              passed=outcome.returncode==0 and sorted(observed)==sorted(expected) and re.search(r"(?m)^ORIGINAL_AGENT_ROUTE=PASS\s*$",report) is not None
                              status(name,"PASS" if passed else "FAIL")
                              return passed
                          if name=="INSTALLED_AGENT_ROUTE":
                              expected={"PREPARE","COLD_RESTART","RECOVER_AND_REVIEW"}
                              observed=[]
                              for value in re.findall(r"(?m)^INSTALLED_AGENT_ROUTE_PASS=([A-Z_]+)\s*$",report):
                                  if value in expected:
                                      observed.append(value);status("INSTALLED_AGENT_ROUTE_PASS",value)
                              allowed_failures={"HOME","REMOTE_HOME","ORIGIN_FIELD","TOKEN_FIELD","INVALID_TOKEN","AUTH_DENIED","TOKEN_CLEARED","CONNECT","CONNECTED","DEVICE_NAME","DEVICE_SAVE","DEVICE_SAVED","MODEL_NAVIGATION","MODEL_CATALOG","CHAT_NAVIGATION","NEW_CHAT","CHAT_DRAFT","CHAT_SUBMIT","CHAT_COMPLETE","CHAT_OPEN","CHAT_HISTORY","CHAT_CLOSE","CHAT_REFERENCE_CLOSED","WORK_NAVIGATION","WORK_DRAFT","WORK_SUBMIT","WORK_COMPLETE","WORK_OPEN","WORK_RESULT","STORAGE_MINIMIZED","RECOVERY_ADDRESS","RECOVERY_SELECT","RECOVERY_TOKEN_REQUIRED","RECOVERY_OPEN","RECOVERY_RESULT","REVIEW_NOTES","REVIEW_CONTROL","REVIEW_CONFIRMATION","REVIEW_READBACK","WORK_REFERENCE_CLOSE","WORK_REFERENCE_CLOSED","CHAT_RECOVERY_NAVIGATION","CHAT_RECOVERY_CATALOG","CHAT_RECOVERED","WEBVIEW_TIMEOUT","PACKAGE","VERSION","VERSION_CODE","FIXTURE_REQUIRED"}
                              for value in re.findall(r"(?m)^INSTALLED_AGENT_FAILURE_STAGE=([A-Z_]+)\s*$",report):
                                  if value in allowed_failures:status("INSTALLED_AGENT_FAILURE_STAGE",value)
                              codes={"COMMAND_FAILED","SERVER_START","SERVER_PORT","SERVER_READY","SERVER_SHUTDOWN","QUERY_CONTRACT","RESPONSE_BOUND","TASK_CATALOG","CHAT_READBACK","CHAT_COUNT","DISPOSABLE_CI_REQUIRED","DISPOSABLE_EMULATOR_REQUIRED","DISPOSABLE_AVD_REQUIRED","APK_REQUIRED","DISPOSABLE_RESET","ANDROID_VERSION_CODE","INSTRUMENTATION_FAILED","INITIAL_TASKS","TASK_COUNT","TASK_ID","TASK_READBACK","RESTART_PORT","RESTART_RESULT","RESTART_CHAT","DUPLICATE_TASK","HUMAN_REVIEW_READBACK","CHAT_REPLAY","FIXTURE_MUST_BE_OUTSIDE_SOURCE","FIXTURE_ARGUMENTS"}
                              for value in re.findall(r"(?m)^INSTALLED_AGENT_FAILURE_CODE=([A-Z_]+)\s*$",report):
                                  if value in codes:status("INSTALLED_AGENT_FAILURE_CODE",value)
                              for kind in re.findall(r"(?m)^INSTALLED_AGENT_FAILURE_TYPE=(RuntimeError|ValueError|KeyError|TypeError|ImportError|ModuleNotFoundError|OSError|TimeoutExpired|CalledProcessError|FileNotFoundError|PermissionError|AssertionError|HTTPError|URLError|SSLError|ConnectionError)\s*$",report):
                                  status("INSTALLED_AGENT_FAILURE_TYPE",kind)
                              passed=outcome.returncode==0 and sorted(observed)==sorted(expected) and re.search(r"(?m)^INSTALLED_AGENT_ROUTE=PASS\s*$",report) is not None
                              status(name,"PASS" if passed else "FAIL")
                              return passed
                          if name=="INSTALLED_T3_ROUTE":
                              expected={"CREATE_OFFLINE","NATIVE_DRAFT_SAVED","COLD_RESTART","NATIVE_DRAFT_REOPENED","LIFECYCLE_RESTORE"}
                              observed=re.findall(r"(?m)^INSTALLED_T3_ROUTE_PASS=([A-Z_]+)\s*$",report)
                              for value in observed:
                                  if value in expected:status("INSTALLED_T3_ROUTE_PASS",value)
                              allowed={"WEBVIEW","OFFLINE","HOME","MORE","T3_SECTION","T3_OPEN","CATALOG","FIXTURE","CREATE_CONTROL","EMPTY_ORIGINAL_STORE","NEW_WORKSPACE","CONFIRM_CREATE","CREATED_ROUTE","CREATED_ID","CREATE_READBACK","CARD","COLD_READBACK","SOFT_DELETE","TRASH_READBACK","TRASH_PAGE","TRASH_ROW","RESTORE","RESTORE_READBACK","RETURN_HOME","MODEL_FIXTURE","MODEL_FIELD","NATIVE_LAUNCHER","NATIVE_PANEL","NATIVE_WORKSPACE_OPTION","NATIVE_WORKSPACE_SELECT","NATIVE_WORKSPACE_SELECTED","NATIVE_MODEL_OPTION","NATIVE_ACTIVATE","NATIVE_READY","NATIVE_GENERATE","NATIVE_GENERATED","NATIVE_EXPLICIT_SAVE","NATIVE_SAVE","NATIVE_SAVED","NATIVE_DRAFT_READBACK","NATIVE_DRAFT_ID","NATIVE_DRAFT_CONTENT","NATIVE_UNLOAD","NATIVE_UNLOADED","NATIVE_COLD_NO_MODEL","NATIVE_LIST","NATIVE_REOPEN","NATIVE_REOPENED"}
                              for value in re.findall(r"(?m)^INSTALLED_T3_FAILURE_STAGE=([A-Z_]+)\s*$",report):
                                  if value in allowed:status("INSTALLED_T3_FAILURE_STAGE",value)
                              codes={"ARGUMENTS","ADB_FAILED","DISPOSABLE_CI_REQUIRED","DISPOSABLE_EMULATOR_REQUIRED","DISPOSABLE_AVD_REQUIRED","INSTRUMENTATION_FAILED","WORKSPACE_ID_REQUIRED","APP_NOT_INSTALLED","TEST_NOT_INSTALLED","OFFLINE_NOT_ENABLED","PROCESS_NOT_STOPPED","DRAFT_RECEIPT_REQUIRED"}
                              for value in re.findall(r"(?m)^INSTALLED_T3_FAILURE_CODE=([A-Z_]+)\s*$",report):
                                  if value in codes:status("INSTALLED_T3_FAILURE_CODE",value)
                              passed=outcome.returncode==0 and sorted(observed)==sorted(expected) and re.search(r"(?m)^INSTALLED_T3_ROUTE=PASS\s*$",report) is not None
                              status(name,"PASS" if passed else "FAIL")
                              return passed
                          if name=="ORIGINAL_T3_BUILD":
                              required={"ORIGINAL_KERNEL","NATIVE_MODULE_STAGE","ORIGINAL_BUILD","ONE_DIST"}
                              observed=re.findall(r"(?m)^MOBILE_T3_(ORIGINAL_KERNEL|NATIVE_MODULE_STAGE|ORIGINAL_BUILD|ONE_DIST)=PASS\s*$",report)
                              for value in observed:status("MOBILE_T3_"+value,"PASS")
                              codes={"OUTPUT_SCOPE","SOURCE_PIN","SOURCE_LOCK","KERNEL_ARCHIVE","KERNEL_PIN","KERNEL_ARCHIVE_MEMBERS","KERNEL_ARCHIVE_ENTRY","KERNEL_BYTES","NPM_REQUIRED","SOURCE_CHANGED","ORIGINAL_RECEIPT","DIST_ROOT","DIST_ENTRY","DIST_PATH","DIST_SIZE","NATIVE_MODULE_REQUIRED","MODULE_STAGE_FAILED","DEPENDENCIES_FAILED","TYPECHECK_FAILED","ORIGINAL_BUILD_FAILED","ASSEMBLER_FAILED"}
                              for value in re.findall(r"\bMOBILE_T3_([A-Z_]+)\b",report):
                                  if value in codes:status("ORIGINAL_T3_FAILURE",value)
                              for value in re.findall(r"\bT3_AGENT_ONE_DIST_([A-Z_]+)\b",report):
                                  if value in {"PRODUCT_STAGE_INPUTS_REQUIRED","PRODUCT_STAGE_MUST_BE_FRESH_AND_OUTSIDE_SOURCE","OWNING_AGENT_PRODUCT_PROFILE_INVALID","ORIGINAL_T2_DOMAIN_VALIDATION_FAILED","ORIGINAL_QUALIFIED_ASSEMBLY_REQUIRED","IMMUTABLE_OUTPUT_OUTSIDE_SOURCE_REQUIRED","PRODUCT_INPUT_MODE_INVALID","ANDROID_ASSET_OWNING_PROFILE_REQUIRED"}:status("ORIGINAL_T3_ASSEMBLER_FAILURE",value)
                              for value in re.findall(r"(?m)^MOBILE_T3_ASSEMBLER_CODE=((?:T3_AGENT_ONE_DIST_|T3_D1_DIST_|T2_QUALIFIED_KERNEL_STAGE_|T3_D5_MODULE_|T2_EXTERNAL_MODULE_|FACTORY2_WITNESS_|ERR_)[A-Z0-9_]{1,100})\s*$",report):
                                  status("ORIGINAL_T3_ASSEMBLER_CODE",value)
                              for value in re.findall(r"(?m)^MOBILE_T3_ASSEMBLER_TYPE=(TypeError|ReferenceError|SyntaxError|RangeError)\s*$",report):
                                  status("ORIGINAL_T3_ASSEMBLER_TYPE",value)
                              for value in re.findall(r"(?m)^MOBILE_T3_TYPE_LOCATION=((?:NativeInferencePanel\.tsx|NativeInferenceLauncher\.tsx|native-t3-session\.d\.mts|index\.ts):\d{1,5}:\d{1,4}:TS\d{4,5})\s*$",report):
                                  status("ORIGINAL_T3_TYPE_LOCATION",value)
                              passed=outcome.returncode==0 and sorted(observed)==sorted(required)
                              status(name,"PASS" if passed else "FAIL")
                              return passed
                          if name=="ASSEMBLY":
                              counts=re.findall(r"(?m)^MOBILE_T3_APK_ASSETS_STAGED=(\d{1,4})\s*$",report)
                              if counts:status("MOBILE_T3_APK_ASSETS",counts[-1])
                              if outcome.returncode==0 and not counts:
                                  status("ASSEMBLY","T3_NOT_STAGED");return False
                          for label in ["tests","pass","fail","skipped"]:
                              matches=re.findall(r"(?m)^# "+label+r" (\d+)\s*$",report)
                              if matches:status("NODE_"+label.upper(),matches[-1])
                          for marker,label in [
                              (r"(?m)^PASS: 26 routes\b","PROTOTYPE"),
                              (r"(?m)^LLAMA_AAR_BUILT=[a-f0-9]{64}\s*$","LLAMA_AAR"),
                              (r"(?m)^QA_MODEL_VERIFIED\s*$","QA_MODEL"),
                              (r"(?m)^ANDROID_CONFIGURATION_PREPARED\s*$","ANDROID_CONFIGURATION_PREPARED"),
                              (r"(?m)^INSTALLED_AGENT_DEBUG_TRUST_PREPARED\s*$","INSTALLED_AGENT_DEBUG_TRUST"),
                              (r"(?m)^ANDROID_PACKAGE_IDENTITY_TEST_PREPARED\s*$","PACKAGE_IDENTITY_TEST_PREPARED"),
                              (r"(?m)^ANDROID_GRADLE_WRAPPER_STARTED\s*$","GRADLE_WRAPPER_STARTED"),
                              (r"(?m)^ANDROID_GRADLE_WRAPPER_PASS\s*$","GRADLE_WRAPPER"),
                              (r"(?m)^ANDROID_GRADLE_CONFIGURATION_STARTED\s*$","GRADLE_CONFIGURATION_STARTED"),
                              (r"(?m)^ANDROID_GRADLE_CONFIGURATION_PASS\s*$","GRADLE_CONFIGURATION"),
                              (r"(?m)^ANDROID_SOURCE_PREPARED\b","ANDROID_PREPARED"),
                              (r"(?m)^ANDROID_GRADLE_ASSEMBLY_STARTED\s*$","GRADLE_STARTED"),
                              (r"(?m)^DEBUG_APK_BUILT\s*$","APK"),
                              (r"(?m)^INSTALLED_INSTRUMENTATION_PASS\b","INSTALLED")]:
                              if re.search(marker,report):status(label,"PASS")
                          if outcome.returncode:
                              for n in sorted(set(re.findall(r"(?m)^not ok (\d{1,3})\s+-",report)),key=int):status("NODE_FAILURE_ORDINAL",n)
                              if name=="DEVICE_EXECUTION":
                                  for code in ("GRADLE_ARGUMENT_INVALID","ASSEMBLED_DEVICE_INPUTS_REQUIRED"):
                                      if code in report:status("DEVICE_EXECUTION_FAILURE_CODE",code)
                                  for kind,pattern in [
                                      ("PACKAGE_INSTALL",r"INSTALL_FAILED_[A-Z_]+|InstallException"),
                                      ("INSTRUMENTATION_RUNNER",r"INSTRUMENTATION_FAILED|Unable to find instrumentation|Process crashed"),
                                      ("NATIVE_LINK",r"UnsatisfiedLinkError|dlopen failed"),
                                      ("DEVICE_DISCONNECTED",r"device offline|device not found|No connected devices"),
                                  ]:
                                      if re.search(pattern,report,re.IGNORECASE):status("DEVICE_FAILURE_CLASS",kind)
                              if "ANDROID_GRADLE_ASSEMBLY_STARTED" in report:status("GRADLE_PHASE","ASSEMBLY")
                              elif "ANDROID_GRADLE_CONFIGURATION_STARTED" in report and "ANDROID_GRADLE_CONFIGURATION_PASS" not in report:status("GRADLE_PHASE","CONFIGURATION")
                              elif "ANDROID_GRADLE_WRAPPER_STARTED" in report and "ANDROID_GRADLE_WRAPPER_PASS" not in report:status("GRADLE_PHASE","WRAPPER")
                              elif name=="DEVICE_EXECUTION":status("GRADLE_PHASE","INSTRUMENTATION")
                              for code in sorted(set(re.findall(r"(?m)^RELEASE_SPAWN_ERROR=(ENOENT|EACCES|EPERM|ETIMEDOUT|OTHER)\s*$",report))):status("SPAWN_ERROR",code)
                              # The private checkout, raw compiler messages, paths and logs never leave
                              # the runner. Only predetermined categories and bounded numeric locations.
                              for kind,pattern in [
                                  ("SDK_OR_NDK",r"SDK location|NDK.*not found|CMake.*not found"),
                                  ("GRADLE_DISTRIBUTION",r"Could not (?:install|download) Gradle distribution|Gradle distribution.*(?:failed|not found)"),
                                  ("GRADLE_SCRIPT_COMPILE",r"Could not compile (?:build file|script|settings file)|startup failed:"),
                                  ("GRADLE_SCRIPT_EVALUATE",r"A problem occurred evaluating (?:root project|project|script|settings)"),
                                  ("GRADLE_PLUGIN_NOT_FOUND",r"Plugin with id .* not found|Plugin \[id: .*\] was not found"),
                                  ("GRADLE_PLUGIN_CLASSPATH",r"plugin is already on the classpath|Plugin .* was already requested|plugin.*different version"),
                                  ("GRADLE_DSL_METHOD",r"Could not find method|No signature of method"),
                                  ("GRADLE_DSL_PROPERTY",r"Could not get unknown property|Could not set unknown property"),
                                  ("GRADLE_TASK_CONFIGURATION",r"Could not create task|Could not determine the dependencies of task"),
                                  ("GRADLE_TOOLCHAIN",r"Cannot find a Java installation|No matching toolchains found|Unsupported class file major version|Minimum supported Gradle version|requires Java"),
                                  ("GRADLE_NETWORK",r"PKIX path building failed|UnknownHostException|ConnectException|SocketTimeoutException"),
                                  ("LLAMA_AAR",r"\b(?:LLAMA_PREPARE_FAILED|LLAMA_AAR_REQUIRED|LLAMA_AAR_PIN_MISMATCH)\b"),
                                  ("QA_MODEL",r"\bQA_MODEL_(?:HASH_MISMATCH|REQUIRED|DOWNLOAD_FAILED|SIZE)\b"),
                                  ("KOTLIN_COMPILE",r"(?m)^e: .*\.kt:"),
                                  ("JAVA_COMPILE",r"(?m)^.*\.java:\d+: error:"),
                                  ("DEPENDENCY_RESOLUTION",r"Could not resolve all (?:files|dependencies)|Could not find [^ \r\n]+:[^ \r\n]+"),
                                  ("JVM_TARGET_MISMATCH",r"Inconsistent JVM-target compatibility|inconsistent JVM target|Cannot inline bytecode built with JVM target"),
                                  ("KOTLIN_METADATA",r"incompatible version of Kotlin|binary version of its metadata|Kotlin metadata version"),
                                  ("DUPLICATE_CLASSES",r"Duplicate class|DuplicateRelativeFileException"),
                                  ("ANDROID_RESOURCES",r"Android resource linking failed|AAPT: error"),
                                  ("MANIFEST_MERGE",r"Manifest merger failed"),
                                  ("DEX",r"DexArchiveMergerException|Error while dexing|D8: error"),
                                  ("DISK_OR_MEMORY",r"No space left on device|Java heap space|OutOfMemoryError"),
                                  ("GRADLE",r"\bBUILD FAILED\b"),
                                  ("DEVICE",r"INSTALLED_ROUTE_TIMEOUT|NATIVE_BROWSER_CLOSE_NOT_FOUND"),
                              ]:
                                  if re.search(pattern,report,re.IGNORECASE):status("FAILURE_CLASS",kind)
                              # Report known script roles and bounded numeric locations only.
                              for line in report.splitlines():
                                  loc=re.search(r"(?i)(?:Build file|Settings file|Script) '([^'\r\n]+)' line: (\d{1,5})",line)
                                  if not loc:continue
                                  path=loc.group(1).replace(chr(92),"/")
                                  role="OTHER"
                                  if path.endswith("/android/app/iwxa-native.gradle"):role="NATIVE_FRAGMENT"
                                  elif path.endswith("/android/app/build.gradle"):role="APP_BUILD"
                                  elif path.endswith("/android/build.gradle"):role="ROOT_BUILD"
                                  elif path.endswith("/android/settings.gradle"):role="SETTINGS"
                                  elif "/node_modules/@capacitor/" in path:role="CAPACITOR_MODULE"
                                  status("GRADLE_CONFIG_LOCATION",role+":"+str(int(loc.group(2))))
                              tasks={
                                  "compileDebugKotlin":"APP_KOTLIN",
                                  "compileDebugJavaWithJavac":"APP_JAVA",
                                  "compileDebugAndroidTestKotlin":"TEST_KOTLIN",
                                  "compileDebugAndroidTestJavaWithJavac":"TEST_JAVA",
                                  "checkDebugAarMetadata":"AAR_METADATA",
                                  "checkDebugDuplicateClasses":"DUPLICATE_CLASSES",
                                  "mergeDebugJavaResource":"JAVA_RESOURCES",
                                  "mergeDebugNativeLibs":"NATIVE_LIBS",
                                  "mergeDebugResources":"RESOURCES",
                                  "processDebugResources":"RESOURCE_LINK",
                                  "processDebugMainManifest":"MANIFEST",
                                  "mergeExtDexDebug":"EXTERNAL_DEX",
                                  "mergeLibDexDebug":"LIBRARY_DEX",
                                  "dexBuilderDebug":"DEX_BUILDER",
                                  "packageDebug":"PACKAGE",
                                  "testDebugUnitTest":"UNIT_TEST",
                                  "connectedDebugAndroidTest":"INSTRUMENTATION",
                              }
                              failed=re.findall(r"Execution failed for task ':[^'\r\n]*:([A-Za-z0-9]+)'",report)
                              for task in sorted({tasks.get(x,"OTHER") for x in failed}):status("GRADLE_FAILED_TASK",task)
                              roles={"LocalModelPlugin.kt":"MODEL_BRIDGE","RecommendedModels.kt":"MODEL_DOWNLOAD","ModelFileIntegrity.kt":"FILE_INTEGRITY","InstalledRouteTest.java":"INSTALLED_WITNESS","OriginalAgentInstalledTest.java":"ORIGINAL_AGENT_INSTALLED_WITNESS","OriginalT3InstalledTest.java":"ORIGINAL_T3_INSTALLED_WITNESS","T3AssetWebViewClient.java":"T3_ASSET_DELIVERY","MainActivity.java":"ACTIVITY","NetworkRouteSpec.java":"NETWORK_SPEC","RoutedJsonHttp.java":"ROUTED_HTTP","RoutedNetworkPlugin.java":"NETWORK_PLUGIN","ProfileBrowserActivity.java":"PROFILE_BROWSER","NetworkRouteInstalledTest.java":"NETWORK_WITNESS","NetworkRouteSpecTest.java":"NETWORK_UNIT_TEST"}
                              for line in report.splitlines():
                                  if not (line.startswith("e:") or "error:" in line):continue
                                  loc=re.search(r"(LocalModelPlugin\.kt|RecommendedModels\.kt|ModelFileIntegrity\.kt|InstalledRouteTest\.java|OriginalAgentInstalledTest\.java|OriginalT3InstalledTest\.java|T3AssetWebViewClient\.java|MainActivity\.java|NetworkRouteSpec\.java|RoutedJsonHttp\.java|RoutedNetworkPlugin\.java|ProfileBrowserActivity\.java|NetworkRouteInstalledTest\.java|NetworkRouteSpecTest\.java):(?:(\d{1,5}):(\d{1,4})|(\d{1,5}):)",line)
                                  if not loc:continue
                                  kind="OTHER"
                                  for category,pattern in [
                                      ("UNRESOLVED_REFERENCE",r"Unresolved reference|cannot find symbol"),
