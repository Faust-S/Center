name: IWXA Android consolidated qualification
on:
  push:
    branches:
      - work/2026-11-25-agent-mobile-android-qualification
    paths:
      - .ci/agent-mobile-android/request.json
permissions:
  contents: read
concurrency:
  group: iwxa-agent-mobile-android-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      PRIVATE_PIN: 'ce86c0080dd25db3aab5e36eeb8ae77fe407581d'
      PRIVATE_TREE: '5b7fec6c0d369ded6bd0b88210f2fc5248127f9c'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: One private source, Android build and installed emulator contour
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, shutil, subprocess, sys, tempfile, time
          def status(name, value):
              print(name+"="+str(value),flush=True)
          def main():
              token=os.environ.pop("IWXA_TEMP_READ_TOKEN","")
              pin=os.environ["PRIVATE_PIN"]
              tree=os.environ["PRIVATE_TREE"]
              if not token or not re.fullmatch(r"[0-9a-f]{40}",pin) or not re.fullmatch(r"[0-9a-f]{40}",tree):
                  status("PRIVATE_READ","TOKEN_OR_PIN_UNAVAILABLE");return 1
              with tempfile.TemporaryDirectory(prefix="iwxa-android-",dir=os.environ["RUNNER_TEMP"]) as temporary:
                  root=pathlib.Path(temporary)
                  source=root/"source";source.mkdir()
                  env=dict(os.environ)
                  env.update({"GIT_TERMINAL_PROMPT":"0","GIT_LFS_SKIP_SMUDGE":"1","GRADLE_USER_HOME":str(root/"gradle"),"npm_config_cache":str(root/"npm-cache"),"ANDROID_AVD_HOME":str(root/"avd"),"ANDROID_EMULATOR_HOME":str(root/"emulator-home")})
                  if env.get("JAVA_HOME_21_X64"):
                      env["JAVA_HOME"]=env["JAVA_HOME_21_X64"]
                      env["PATH"]=str(pathlib.Path(env["JAVA_HOME"])/"bin")+os.pathsep+env["PATH"]
                  emulator=None
                  def run(args,cwd=source,custom=None,timeout=600,stdin=None):
                      return subprocess.run(args,cwd=cwd,env=custom or env,input=stdin,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout)
                  def stage(label,args,cwd=source,timeout=600,stdin=None):
                      try:
                          p=run(args,cwd,timeout=timeout,stdin=stdin)
                      except subprocess.TimeoutExpired:
                          status(label,"TIMEOUT");return False
                      status(label,"PASS" if p.returncode==0 else "FAIL")
                      return p.returncode==0
                  try:
                      if run(["git","init","-q"]).returncode:return 1
                      auth=dict(env)
                      auth.update({"GIT_CONFIG_COUNT":"1","GIT_CONFIG_KEY_0":"http.https://github.com/.extraheader","GIT_CONFIG_VALUE_0":"AUTHORIZATION: basic "+base64.b64encode(("x-access-token:"+token).encode()).decode()})
                      fetched=run(["git","fetch","--no-tags","--depth","1","https://github.com/Faust-S/iwxa-personal-agent.git",pin],custom=auth,timeout=180)
                      del auth,token
                      if fetched.returncode or run(["git","checkout","--detach","-q",pin]).returncode:
                          status("PRIVATE_READ","FETCH_FAIL");return 1
                      if run(["git","rev-parse","HEAD"]).stdout.decode().strip()!=pin or run(["git","rev-parse","HEAD^{tree}"]).stdout.decode().strip()!=tree:
                          status("PRIVATE_READ","PIN_MISMATCH");return 1
                      status("PRIVATE_READ","PASS");status("SOURCE_PIN",pin)
                      mobile=source/"mobile"
                      native=json.loads((mobile/"native/llama-source.json").read_text())
                      if native.get("revision")!="5220a2d4040aa75f52678ebf52d77a0fba85de9f":
                          status("LLAMA_PIN","FAIL");return 1
                      # Bootstrap a lock only when absent. This run is not a locked
                      # release until the generated lock is separately admitted.
                      if not (mobile/"package-lock.json").exists():
                          if not stage("NPM_LOCK_BOOTSTRAP",["npm","install","--package-lock-only","--ignore-scripts","--no-audit","--no-fund"],mobile,600):return 1
                          status("LOCK_STATUS","BOOTSTRAP_ONLY")
                      else:status("LOCK_STATUS","SOURCE_LOCK")
                      status("LOCK_SHA256",hashlib.sha256((mobile/"package-lock.json").read_bytes()).hexdigest())
                      if not stage("NPM_CI",["npm","ci","--no-audit","--no-fund"],mobile,600):return 1
                      # Build first: emulator/KVM availability cannot suppress source or APK checks.
                      def report_stage(name,args,cwd,timeout):
                          try:outcome=run(args,cwd,timeout=timeout)
                          except subprocess.TimeoutExpired:
                              status(name,"TIMEOUT");return False
                          report=outcome.stdout.decode("utf-8",errors="replace")
                          for label in ["tests","pass","fail","skipped"]:
                              matches=re.findall(r"(?m)^# "+label+r" (\d+)\s*$",report)
                              if matches:status("NODE_"+label.upper(),matches[-1])
                          for marker,label in [
                              (r"(?m)^PASS: 26 routes\b","PROTOTYPE"),
                              (r"(?m)^LLAMA_AAR_BUILT=[a-f0-9]{64}\s*$","LLAMA_AAR"),
                              (r"(?m)^QA_MODEL_VERIFIED\s*$","QA_MODEL"),
                              (r"(?m)^ANDROID_CONFIGURATION_PREPARED\s*$","ANDROID_CONFIGURATION_PREPARED"),
                              (r"(?m)^ANDROID_GRADLE_WRAPPER_STARTED\s*$","GRADLE_WRAPPER_STARTED"),
                              (r"(?m)^ANDROID_GRADLE_WRAPPER_PASS\s*$","GRADLE_WRAPPER"),
                              (r"(?m)^ANDROID_GRADLE_CONFIGURATION_STARTED\s*$","GRADLE_CONFIGURATION_STARTED"),
                              (r"(?m)^ANDROID_GRADLE_CONFIGURATION_PASS\s*$","GRADLE_CONFIGURATION"),
                              (r"(?m)^ANDROID_SOURCE_PREPARED\b","ANDROID_PREPARED"),
                              (r"(?m)^ANDROID_GRADLE_ASSEMBLY_STARTED\s*$","GRADLE_STARTED"),
                              (r"(?m)^DEBUG_APK_BUILT\s*$","APK"),
                              (r"(?m)^INSTALLED_INSTRUMENTATION_PASS\b","INSTALLED")]:
                              if re.search(marker,report):status(label,"PASS")
                          if outcome.returncode:
                              if "ANDROID_GRADLE_ASSEMBLY_STARTED" in report:status("GRADLE_PHASE","ASSEMBLY")
                              elif "ANDROID_GRADLE_CONFIGURATION_STARTED" in report and "ANDROID_GRADLE_CONFIGURATION_PASS" not in report:status("GRADLE_PHASE","CONFIGURATION")
                              elif "ANDROID_GRADLE_WRAPPER_STARTED" in report and "ANDROID_GRADLE_WRAPPER_PASS" not in report:status("GRADLE_PHASE","WRAPPER")
                              elif name=="DEVICE_EXECUTION":status("GRADLE_PHASE","INSTRUMENTATION")
                              for code in sorted(set(re.findall(r"(?m)^RELEASE_SPAWN_ERROR=(ENOENT|EACCES|EPERM|ETIMEDOUT|OTHER)\s*$",report))):status("SPAWN_ERROR",code)
                              # The private checkout, raw compiler messages, paths and logs never leave
                              # the runner. Only predetermined categories and bounded numeric locations.
                              for kind,pattern in [
                                  ("SDK_OR_NDK",r"SDK location|NDK.*not found|CMake.*not found"),
                                  ("GRADLE_DISTRIBUTION",r"Could not (?:install|download) Gradle distribution|Gradle distribution.*(?:failed|not found)"),
                                  ("GRADLE_SCRIPT_COMPILE",r"Could not compile (?:build file|script|settings file)|startup failed:"),
                                  ("GRADLE_SCRIPT_EVALUATE",r"A problem occurred evaluating (?:root project|project|script|settings)"),
                                  ("GRADLE_PLUGIN_NOT_FOUND",r"Plugin with id .* not found|Plugin \[id: .*\] was not found"),
                                  ("GRADLE_PLUGIN_CLASSPATH",r"plugin is already on the classpath|Plugin .* was already requested|plugin.*different version"),
                                  ("GRADLE_DSL_METHOD",r"Could not find method|No signature of method"),
                                  ("GRADLE_DSL_PROPERTY",r"Could not get unknown property|Could not set unknown property"),
                                  ("GRADLE_TASK_CONFIGURATION",r"Could not create task|Could not determine the dependencies of task"),
                                  ("GRADLE_TOOLCHAIN",r"Cannot find a Java installation|No matching toolchains found|Unsupported class file major version|Minimum supported Gradle version|requires Java"),
                                  ("GRADLE_NETWORK",r"PKIX path building failed|UnknownHostException|ConnectException|SocketTimeoutException"),
                                  ("LLAMA_AAR",r"\b(?:LLAMA_PREPARE_FAILED|LLAMA_AAR_REQUIRED|LLAMA_AAR_PIN_MISMATCH)\b"),
                                  ("QA_MODEL",r"\bQA_MODEL_(?:HASH_MISMATCH|REQUIRED|DOWNLOAD_FAILED|SIZE)\b"),
                                  ("KOTLIN_COMPILE",r"(?m)^e: .*\.kt:"),
                                  ("JAVA_COMPILE",r"(?m)^.*\.java:\d+: error:"),
                                  ("DEPENDENCY_RESOLUTION",r"Could not resolve all (?:files|dependencies)|Could not find [^ \r\n]+:[^ \r\n]+"),
                                  ("JVM_TARGET_MISMATCH",r"Inconsistent JVM-target compatibility|inconsistent JVM target|Cannot inline bytecode built with JVM target"),
                                  ("KOTLIN_METADATA",r"incompatible version of Kotlin|binary version of its metadata|Kotlin metadata version"),
                                  ("DUPLICATE_CLASSES",r"Duplicate class|DuplicateRelativeFileException"),
                                  ("ANDROID_RESOURCES",r"Android resource linking failed|AAPT: error"),
                                  ("MANIFEST_MERGE",r"Manifest merger failed"),
                                  ("DEX",r"DexArchiveMergerException|Error while dexing|D8: error"),
                                  ("DISK_OR_MEMORY",r"No space left on device|Java heap space|OutOfMemoryError"),
                                  ("GRADLE",r"\bBUILD FAILED\b"),
                                  ("DEVICE",r"INSTALLED_ROUTE_TIMEOUT|NATIVE_BROWSER_CLOSE_NOT_FOUND"),
                              ]:
                                  if re.search(pattern,report,re.IGNORECASE):status("FAILURE_CLASS",kind)
                              # Report known script roles and bounded numeric locations only.
                              for line in report.splitlines():
                                  loc=re.search(r"(?i)(?:Build file|Settings file|Script) '([^'\r\n]+)' line: (\d{1,5})",line)
                                  if not loc:continue
                                  path=loc.group(1).replace(chr(92),"/")
                                  role="OTHER"
                                  if path.endswith("/android/app/iwxa-native.gradle"):role="NATIVE_FRAGMENT"
                                  elif path.endswith("/android/app/build.gradle"):role="APP_BUILD"
                                  elif path.endswith("/android/build.gradle"):role="ROOT_BUILD"
                                  elif path.endswith("/android/settings.gradle"):role="SETTINGS"
                                  elif "/node_modules/@capacitor/" in path:role="CAPACITOR_MODULE"
                                  status("GRADLE_CONFIG_LOCATION",role+":"+str(int(loc.group(2))))
                              tasks={
                                  "compileDebugKotlin":"APP_KOTLIN",
                                  "compileDebugJavaWithJavac":"APP_JAVA",
                                  "compileDebugAndroidTestKotlin":"TEST_KOTLIN",
                                  "compileDebugAndroidTestJavaWithJavac":"TEST_JAVA",
                                  "checkDebugAarMetadata":"AAR_METADATA",
                                  "checkDebugDuplicateClasses":"DUPLICATE_CLASSES",
                                  "mergeDebugJavaResource":"JAVA_RESOURCES",
                                  "mergeDebugNativeLibs":"NATIVE_LIBS",
                                  "mergeDebugResources":"RESOURCES",
                                  "processDebugResources":"RESOURCE_LINK",
                                  "processDebugMainManifest":"MANIFEST",
                                  "mergeExtDexDebug":"EXTERNAL_DEX",
                                  "mergeLibDexDebug":"LIBRARY_DEX",
                                  "dexBuilderDebug":"DEX_BUILDER",
                                  "packageDebug":"PACKAGE",
                                  "testDebugUnitTest":"UNIT_TEST",
                                  "connectedDebugAndroidTest":"INSTRUMENTATION",
                              }
                              failed=re.findall(r"Execution failed for task ':[^'\r\n]*:([A-Za-z0-9]+)'",report)
                              for task in sorted({tasks.get(x,"OTHER") for x in failed}):status("GRADLE_FAILED_TASK",task)
                              roles={"LocalModelPlugin.kt":"MODEL_BRIDGE","RecommendedModels.kt":"MODEL_DOWNLOAD","ModelFileIntegrity.kt":"FILE_INTEGRITY","InstalledRouteTest.java":"INSTALLED_WITNESS","MainActivity.java":"ACTIVITY"}
                              for line in report.splitlines():
                                  if not (line.startswith("e:") or "error:" in line):continue
                                  loc=re.search(r"(LocalModelPlugin\.kt|RecommendedModels\.kt|ModelFileIntegrity\.kt|InstalledRouteTest\.java|MainActivity\.java):(?:(\d{1,5}):(\d{1,4})|(\d{1,5}):)",line)
                                  if not loc:continue
                                  kind="OTHER"
                                  for category,pattern in [
                                      ("UNRESOLVED_REFERENCE",r"Unresolved reference|cannot find symbol"),
                                      ("TYPE_MISMATCH",r"Type mismatch|Argument type mismatch|incompatible types"),
                                      ("OVERRIDE",r"overrides nothing|does not override|cannot override"),
                                      ("INFERENCE",r"Cannot infer|Not enough information to infer"),
                                      ("VISIBILITY",r"Cannot access|has private access|has protected access"),
                                      ("SYNTAX",r"Expecting|Syntax error|illegal start"),
                                  ]:
                                      if re.search(pattern,line,re.IGNORECASE):kind=category;break
                                  status("COMPILE_LOCATION",roles[loc.group(1)]+":"+str(int(loc.group(2) or loc.group(4)))+":"+str(int(loc.group(3) or 0))+":"+kind)
                          status(name,"PASS" if outcome.returncode==0 else "FAIL")
                          return outcome.returncode==0
                      android=pathlib.Path(env.get("ANDROID_HOME") or env.get("ANDROID_SDK_ROOT") or "/usr/local/lib/android/sdk")
                      env["ANDROID_HOME"]=str(android)
                      env["ANDROID_SDK_ROOT"]=str(android)
                      def android_tool(name):
                          candidates=[android/"cmdline-tools/latest/bin"/name,*sorted(android.glob("cmdline-tools/*/bin/"+name),reverse=True),android/"tools/bin"/name]
                          result=shutil.which(name,path=env["PATH"])
                          if result:return result
                          return next((str(p) for p in candidates if p.is_file() and os.access(p,os.X_OK)),None)
                      sdk=android_tool("sdkmanager")
                      avd=android_tool("avdmanager")
                      status("SDK_ROOT","PRESENT" if android.is_dir() else "MISSING")
                      status("SDKMANAGER","PRESENT" if sdk else "MISSING")
                      status("AVDMANAGER","PRESENT" if avd else "MISSING")
                      status("KVM_DEVICE","PRESENT" if pathlib.Path("/dev/kvm").exists() else "MISSING")
                      if not sdk:
                          # Keep source coverage even if image provisioning fails.
                          report_stage("SOURCE",["npm","run","check:source"],mobile,120)
                          status("APK","NOT_RUN");return 1
                      if not stage("SDK_BUILD_INPUTS",[sdk,"--install","--channel=3","platforms;android-36","build-tools;36.0.0","ndk;"+native["ndk"],"cmake;"+native["cmake"]],timeout=1200,stdin=b"y\n"*100):
                          report_stage("SOURCE",["npm","run","check:source"],mobile,120)
                          status("APK","NOT_RUN");return 1
                      if not report_stage("ASSEMBLY",["npm","run","qualify:release","--","--assemble-device","--fetch-public-inputs"],mobile,3600):
                          status("INSTALLED","NOT_RUN");return 1
                      if not avd:
                          status("ANDROID_EMULATOR","AVDMANAGER_MISSING");return 1
                      image="system-images;android-35;google_apis;x86_64"
                      if not stage("SDK_EMULATOR_INPUTS",[sdk,"--install","emulator",image],timeout=900,stdin=b"y\n"*100):return 1
                      if not pathlib.Path("/dev/kvm").exists():
                          # Standard kernel virtualization is optional for assembly.
                          # Probe it only after APK has already been built.
                          run(["sudo","modprobe","kvm"],timeout=20)
                          run(["sudo","modprobe","kvm_intel"],timeout=20)
                      accelerated=pathlib.Path("/dev/kvm").exists()
                      if accelerated:
                          accelerated=stage("KVM",["sudo","chmod","a+rw","/dev/kvm"])
                      status("EMULATOR_ACCELERATION","KVM" if accelerated else "SOFTWARE")
                      pathlib.Path(env["ANDROID_AVD_HOME"]).mkdir(parents=True,exist_ok=True)
                      pathlib.Path(env["ANDROID_EMULATOR_HOME"]).mkdir(parents=True,exist_ok=True)
                      if not stage("AVD_CREATE",[avd,"create","avd","-n","iwxa_mobile_ci","-k",image,"--force"],stdin=b"no\n"):return 1
                      adb=str(android/"platform-tools/adb")
                      with (root/"emulator.log").open("wb") as elog:
                          emulator=subprocess.Popen([str(android/"emulator/emulator"),"-avd","iwxa_mobile_ci","-no-window","-no-audio","-no-boot-anim","-no-snapshot","-gpu","swiftshader_indirect","-accel","on" if accelerated else "off","-memory","4096"],env=env,stdout=elog,stderr=subprocess.STDOUT)
                          deadline=time.monotonic()+(300 if accelerated else 600)
                          booted=False
                          while time.monotonic()<deadline and emulator.poll() is None:
                              try:
                                  p=run([adb,"shell","getprop","sys.boot_completed"],timeout=10)
                                  if p.returncode==0 and p.stdout.strip()==b"1":
                                      booted=True;break
                              except subprocess.TimeoutExpired:pass
                              time.sleep(5)
                          if not booted:
                              status("ANDROID_EMULATOR","BOOT_FAIL");return 1
                          status("ANDROID_EMULATOR","PASS")
                          for setting in ["window_animation_scale","transition_animation_scale","animator_duration_scale"]:
                              run([adb,"shell","settings","put","global",setting,"0"],timeout=15)
                          run([adb,"shell","input","keyevent","82"],timeout=15)
                          # Same checkout and APK inputs; no repeated source suite.
                          if not report_stage("DEVICE_EXECUTION",["npm","run","qualify:release","--","--installed-only"],mobile,1200):
                              status("QUALIFICATION","FAIL");return 1
                          import xml.etree.ElementTree as ET
                          result_dir=mobile/"android/app/build/outputs/androidTest-results/connected"
                          count=failures=errors=skipped=0
                          for xml in result_dir.rglob("TEST-*.xml"):
                              rootxml=ET.parse(xml).getroot()
                              for case in rootxml.iter("testcase"):
                                  count+=1
                                  failures+=int(case.find("failure") is not None)
                                  errors+=int(case.find("error") is not None)
                                  skipped+=int(case.find("skipped") is not None)
                          status("ANDROID_TESTS",count)
                          status("ANDROID_FAILURES",failures+errors)
                          status("ANDROID_SKIPPED",skipped)
                          passed=count==3 and not failures and not errors and not skipped
                          status("QUALIFICATION","PASS" if passed else "FAIL")
                          status("PHYSICAL_ARM64","NOT_RUN")
                          return 0 if passed else 1
                  finally:
                      if emulator is not None:
                          emulator.terminate()
                          try:emulator.wait(timeout=20)
                          except subprocess.TimeoutExpired:emulator.kill();emulator.wait()
          try:
              result=main()
          except (OSError,ValueError,KeyError,subprocess.TimeoutExpired) as e:
              status("HOST_ERROR",type(e).__name__);result=1
          status("RUNNER_CLEANUP","CHECKOUT_SCOPE_EXITED")
          sys.exit(result)
          PY
