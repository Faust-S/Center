name: Agent 0.5 old user data startup
# Public Center qualification only. No private artifacts, logs, or data uploads.
on:
  push:
    branches: [work/2026-11-14-setup-core-real-install-fix]
    paths: [.github/workflows/agent05-existing-data-reuse.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previous-data-startup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: f6947fab2fa16d0a12e1d3fe972ca357054737d4
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing data and clean data Core regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location 'private-agent'
          try {
            $log=Join-Path $env:RUNNER_TEMP 'agent05-existing-data-private.log'
            & python -m pip install -r requirements-ci.txt *> $log
            if($LASTEXITCODE -ne 0){ throw 'AGENT05_EXISTING_DATA_DEPENDENCIES_FAILED' }
            & python -B -m pytest -q --tb=line -p no:cacheprovider tests/test_agent05_existing_user_data_startup.py tests/test_daily_driver_composition.py tests/test_user_provider_settings.py *> $log
            if($LASTEXITCODE -ne 0){
              $text=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
              $failed='UNKNOWN'
              if($text -match '([0-9]{1,3}) failed'){$failed=$Matches[1]}
              Write-Host ('AGENT05_EXISTING_DATA_FAILED_COUNT='+$failed)
              $case='UNKNOWN'
              $allowed=@(
                'test_legacy_optional_settings_preserve_existing_tasks_and_results',
                'test_new_user_data_keeps_clean_startup_without_warnings',
                'test_saved_valid_provider_limit_rebinds_old_binding_atomically',
                'test_verified_saved_policy_rebinds_without_enabling_other_mcp_tools',
                'test_tampered_binding_history_is_never_auto_rebound',
                'test_legacy_invalid_model_selection_keeps_weights_and_does_not_block_core'
              )
              foreach($candidate in $allowed){
                if($text.Contains('::'+$candidate)){$case=$candidate;break}
              }
              Write-Host ('AGENT05_EXISTING_DATA_FAILED_CASE='+$case)
              $stage='UNKNOWN'
              $allowedStages=@('CORE_INIT','STATUS_QUERY','STATUS_ISSUES','PLAN_ENGINE','PLAN_ENGINE_SHA','REV_TASKS','REV_GOALS','REV_BOARDS','REV_AUTOMATIONS','REV_TOOL_PLANS','REV_TOOL_APPROVALS','REV_TOOL_REPAIRS','REV_TOOL_RECEIPTS','REV_MEMORY','REV_PROVIDERS','FULL_REVISION','FULL_REVISION_SHA','PLAN_QUERY','PLAN_SHA','PRESERVE_BYTES','COLD_INIT','COLD_STATUS','REPEAT_STATUS','COLD_ISSUES')
              foreach($candidateStage in $allowedStages){
                if($text.Contains('AGENT05_LEGACY_STAGE_'+$candidateStage)){
                  $stage=$candidateStage
                  break
                }
              }
              Write-Host ('AGENT05_EXISTING_DATA_FAILED_STAGE='+$stage)
              throw 'AGENT05_EXISTING_DATA_TEST_FAILED'
            }
            Write-Host 'AGENT05_EXISTING_DATA_AND_CLEAN_START_PASS'
          }finally{
            Pop-Location
          }
