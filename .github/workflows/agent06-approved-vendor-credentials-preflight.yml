# Detect only explicitly dedicated QA credentials for official vendor programs.
# Never print, export or use actual secret contents. No private checkout.
name: IWXA Agent06 approved vendor QA credential preflight
on:
  push:
    branches: ['work/2026-11-16-agent06-vendor-account-preflight']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      IWXA_CODEX_QA: ${{ secrets.IWXA_AGENT06_CODEX_QA_ACCESS_TOKEN }}
      IWXA_CLAUDE_QA: ${{ secrets.IWXA_AGENT06_CLAUDE_QA_API_KEY }}
      IWXA_ANTIGRAVITY_QA: ${{ secrets.IWXA_AGENT06_ANTIGRAVITY_QA_API_KEY }}
    steps:
      - name: Check user-approved isolated QA credential slots
        shell: pwsh
        run: |
          # These names are dedicated to QA to avoid accidentally using
          # production credentials configured elsewhere.
          $present = @{
            CODEX = -not [string]::IsNullOrWhiteSpace($env:IWXA_CODEX_QA)
            CLAUDE = -not [string]::IsNullOrWhiteSpace($env:IWXA_CLAUDE_QA)
            ANTIGRAVITY = -not [string]::IsNullOrWhiteSpace($env:IWXA_ANTIGRAVITY_QA)
          }
          $total = 0
          foreach ($vendor in @('CODEX','CLAUDE','ANTIGRAVITY')) {
            if ($present[$vendor]) {
              Write-Host ('AGENT06_' + $vendor + '_QA_CREDENTIAL=PROVISIONED')
              $total++
            } else {
              Write-Host ('AGENT06_' + $vendor + '_QA_CREDENTIAL=NOT_PROVISIONED')
            }
          }
          Write-Host ('AGENT06_APPROVED_QA_CREDENTIAL_COUNT=' + $total)
          Write-Host 'AGENT06_CLI_LOGIN=NOT_RUN'
          Write-Host 'AGENT06_VENDOR_MODEL_INFERENCE=NOT_RUN'
          Write-Host 'AGENT06_INSTALLED_E2E=NOT_RUN'
          # A provisioning preflight is successful even when access is absent;
          # it never falsely reports authenticated model generation.
