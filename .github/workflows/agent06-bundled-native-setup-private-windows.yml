# Only public Center workflow code is committed here. Private Agent is
# checked out READ-ONLY to an ephemeral Windows runner and never uploaded.
name: IWXA Agent06 bundled original Obscura Setup Core native qualification
on:
  push:
    branches:
      - work/2026-11-16-agent06-bundled-setup-qualification
permissions:
  contents: read
jobs:
  bundled-native-setup:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout full original public Setup Core owner
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: c10e193846a0ea4c73cabe3744aa7db82439d54e
          path: center-owner
          persist-credentials: false
      - name: Require permitted read-only Agent checkout
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){throw 'AGENT06_PRIVATE_READ_UNAVAILABLE'}
          Write-Host 'AGENT06_BUNDLE_PRIVATE_READ_ONLY_PASS'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: dbee477a574d9fa93149d7899c59b14959ad9050
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          repository: Faust-S/Br-test
          run-id: 43739318017
          name: agent06-u01-unsigned-release-candidate
          github-token: ${{ github.token }}
          path: public-u01-candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Pin exact public native and private source
        shell: pwsh
        run: |
          $sha=(& git -C private-agent rev-parse HEAD).Trim()
          if($sha -cne 'dbee477a574d9fa93149d7899c59b14959ad9050'){throw 'AGENT06_SETUP_PRIVATE_SOURCE_MISMATCH'}
          $native=Join-Path $env:GITHUB_WORKSPACE 'public-u01-candidate'
          $manifest=Join-Path $native 'manifest.candidate.json'
          $archive=Join-Path $native 'obscura-windows-x86_64.zip'
          if(!(Test-Path -LiteralPath $manifest -PathType Leaf) -or !(Test-Path -LiteralPath $archive -PathType Leaf)){throw 'AGENT06_SETUP_PUBLIC_U01_CANDIDATE_MISSING'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant() -cne 'd53a21682a174f34f9bbdfbb9214b45b0fec58f489ad12a7dd535e326baaaef5'){throw 'AGENT06_SETUP_U01_PUBLIC_MANIFEST_MISMATCH'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant() -cne 'fa25e7b76800faad4f0ca5b8837d03311ff8cd7720f895c495f8c632969157a5'){throw 'AGENT06_SETUP_U01_NATIVE_ARCHIVE_MISMATCH'}
          $dirty=@(& git -C private-agent status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or @($dirty | Where-Object {$_}).Count -ne 0){throw 'AGENT06_SETUP_PRIVATE_SOURCE_DIRTY'}
          Write-Host 'AGENT06_SETUP_PUBLIC_U01_NATIVE_SHA_PASS'
      - name: Build and install original Windows Setup Core with bundled U01 native worker
        shell: pwsh
        env:
          IWXA_AGENT06_U01_CANDIDATE: ${{ github.workspace }}/public-u01-candidate
        run: |
          $repo=Join-Path $env:GITHUB_WORKSPACE 'private-agent'
          # Use the original PUBLIC product owner, never the CI-only harness.
          $center=Join-Path $env:GITHUB_WORKSPACE 'center-owner'
          $centerSha=(& git -C $center rev-parse HEAD).Trim()
          if($centerSha -cne 'c10e193846a0ea4c73cabe3744aa7db82439d54e'){throw 'AGENT06_PUBLIC_SETUP_CORE_OWNER_REVISION_MISMATCH'}
          foreach($path in @('installer/build_bundle.py','installer/windows/build-stub.ps1','installer/windows/qualify-local-bundle.ps1')){
            if(!(Test-Path -LiteralPath (Join-Path $center $path) -PathType Leaf)){throw 'AGENT06_PUBLIC_SETUP_CORE_OWNER_FILE_MISSING'}
          }
          $dirty=@(& git -C $center status --porcelain --untracked-files=all)
          if($LASTEXITCODE -ne 0 -or @($dirty | Where-Object {$_}).Count -ne 0){throw 'AGENT06_PUBLIC_SETUP_CORE_OWNER_DIRTY'}
          Write-Host 'AGENT06_PUBLIC_SETUP_CORE_OWNER_PINNED_CLEAN_PASS'
          $out=Join-Path $env:RUNNER_TEMP 'agent06-bundled-setup-core'
          $cache=Join-Path $env:RUNNER_TEMP 'agent06-bundled-release-cache'
          $file=Join-Path $repo 'tools/build_setup_core_windows_candidate.ps1'
          $log=Join-Path $env:RUNNER_TEMP 'agent06-bundled-setup-private.log'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $file -CenterRoot $center -CenterCommit $centerSha -ReleaseCacheRoot $cache -OutputRoot $out -PublicObscuraCandidate $env:IWXA_AGENT06_U01_CANDIDATE *> $log
          if($LASTEXITCODE -ne 0){
            # No private logs, code, EXE, setup screenshots or installer bytes
            # are printed or published by this public workflow.
            $raw=Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue
            $reasonCodes=@(
              'private_setup_windows_required',
              'private_setup_core_revision_invalid',
              'private_setup_output_must_be_empty',
              'private_setup_git_identity_failed',
              'private_setup_checkout_not_clean',
              'private_setup_core_checkout_not_pinned_and_clean',
              'private_setup_native_product_package_build_failed',
              'native_candidate_stub_compile_failed',
              'native_candidate_test_python_failed',
              'native_candidate_u04_sources_failed',
              'native_candidate_frontend_dependencies_failed',
              'native_candidate_tauri_build_failed',
              'native_candidate_rust_toolchain_missing',
              'native_candidate_obscura_native_u01_bundle_missing_or_invalid',
              'obscura_pinned_public_native_candidate_missing',
              'U01 pinned owner source preparation failed',
              'private_setup_core_package_build_failed',
              'private_setup_core_local_acceptance_failed',
              'private_setup_core_local_acceptance_not_confirmed'
            )
            foreach($name in $reasonCodes){
              if(([string]$raw).Contains($name)){Write-Host ('AGENT06_BUNDLED_SETUP_REASON='+$name)}
            }
            if(Test-Path -LiteralPath (Join-Path $out 'logs/private-build-result.json')){
              Write-Host 'AGENT06_BUNDLED_NATIVE_SETUP_BUILD_STAGE_REACHED'
            }
            # Only finite, whitelisted codes leave the ephemeral Windows runner.
            # Never expose private application logs, source, paths, receipts, or model text.
            $acceptLog=Join-Path $out 'logs/public-test-local-result.txt'
            if(Test-Path -LiteralPath $acceptLog -PathType Leaf){
              $safeAcceptanceCodes=@(
                'SETUP_LOCAL_OPERATION_TIMEOUT',
                'SETUP_LOCAL_WITNESS_TIMEOUT',
                'SETUP_LOCAL_WITNESS_EXIT_FAILED',
                'SETUP_LOCAL_WITNESS_RECEIPT_MISSING',
                'SETUP_LOCAL_WITNESS_READBACK_INVALID',
                'SETUP_LOCAL_REPAIR_NOT_ACTIVATED',
                'SETUP_LOCAL_REPAIR_READBACK_INVALID',
                'SETUP_LOCAL_REPAIR_CONFIRM_OR_USER_DATA_LOST',
                'SETUP_LOCAL_UNINSTALL_OR_DATA_LOSS',
                'SETUP_LOCAL_PRODUCT_IDENTITY_INVALID',
                'SETUP_LOCAL_SOURCE_IDENTITY_INVALID',
                'SETUP_LOCAL_ACTIVATION_INVALID',
                'SETUP_LOCAL_ON_DISK_IDENTITY_INVALID',
                'SETUP_LOCAL_LOCATION_READBACK_INVALID'
              )
              $localText=Get-Content -LiteralPath $acceptLog -Raw -ErrorAction SilentlyContinue
              foreach($code in $safeAcceptanceCodes){
                if(([string]$localText).Contains($code)){
                  Write-Host ('AGENT06_BUNDLED_SETUP_ACCEPTANCE_CODE='+$code)
                }
              }
            }
            $witnessPath=Join-Path $out 'temporary-installed-fixture/installed-witness.json'
            if(Test-Path -LiteralPath $witnessPath -PathType Leaf){
              try {
                $w=Get-Content -LiteralPath $witnessPath -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
                if($w.status -ceq 'FAIL'){
                  $safePhases=@(
                    'SHORTCUT_READBACK','COLD_GUI_BOOT','FIRST_CORE','CORE_QUERIES',
                    'DRAFT_CREATE','GUI_DRAFT_EDIT','GUI_DRAFT_READBACK','QWEN_EXECUTE',
                    'COLD_RESTART','COLD_CORE_QUERIES','GUI_DRAFT_REOPEN','QWEN_COLD_IMPORT',
                    'GUI_RESULT','GUI_TASK_SUBMIT','GUI_TASK_RESULT','GUI_TASK_REVIEW',
                    'GUI_TASK_REVIEW_READBACK','GUI_COLD_RESTART','GUI_COLD_IMPORT',
                    'K03_TASK_EXECUTE','K03_TASK_COLD_RESTART','K03_TASK_COLD_READBACK',
                    'CLEAN_STOP','WITNESS_RECEIPT'
                  )
                  $phase=[string]$w.phase
                  if($phase -cin $safePhases){
                    Write-Host ('AGENT06_BUNDLED_SETUP_WITNESS_PHASE='+$phase)
                  }
                  $safeCodes=@(
                    'PROOF_EXISTS','DOWNLOAD_MODE','CORE_NOT_READY','PREFS_READBACK',
                    'PREFS_NOT_CONFIRMED','RUNTIME_PLAN','MODEL_PLAN','MODEL_DOWNLOAD',
                    'MODEL_NOT_READY','INFERENCE','TASK_SUBMIT','TASK_STOPPED',
                    'TASK_TIMEOUT','RESULT_READBACK','REVIEW_READBACK','EXCHANGE_EXPORT',
                    'MODEL_PROCESS_FAILED','MODEL_FINAL_OUTPUT_UNAVAILABLE',
                    'MODEL_TIMED_OUT','MODEL_ALREADY_BUSY','MODEL_EFFORT_INVALID',
                    'MODEL_START_FAILED','MODEL_TOKEN_LIMIT_INVALID','MODEL_BINARY_CHANGED',
                    'MODEL_PROMPT_INVALID','OTHER_RUNTIME','OTHER_HTTP','OTHER_NETWORK',
                    'OTHER_TIMEOUT','OTHER_VALUE','OTHER_KEY','OTHER_TYPE','OTHER_OS',
                    'HTTP_400','HTTP_401','HTTP_403','HTTP_404','HTTP_409','HTTP_422',
                    'HTTP_429','HTTP_500','HTTP_502','HTTP_503','HTTP_504','OTHER'
                  )
                  $code=[string]$w.failure_code
                  if($code -cin $safeCodes){
                    Write-Host ('AGENT06_BUNDLED_SETUP_WITNESS_CODE='+$code)
                  }
                  $safeOperations=@(
                    'UI_PREFS_READ','UI_PREFS_SAVE','RUNTIME_PLAN','RUNTIME_INSTALL',
                    'MODEL_PLAN','MODEL_DOWNLOAD','MODEL_SELECT','MODEL_CONTROL',
                    'PROVIDER_SWITCH','MODEL_STATUS','MODEL_TRY','WORK_AREAS',
                    'TASK_SUBMIT','TASK_POLL','TASK_READ','TASKS_READ','HUMAN_REVIEW',
                    'EXCHANGE_PREVIEW','EXCHANGE_EXPORT','EXCHANGE_INSPECT','SNAPSHOT'
                  )
                  $op=[string]$w.last_operation
                  if($op -cin $safeOperations){
                    Write-Host ('AGENT06_BUNDLED_SETUP_WITNESS_OPERATION='+$op)
                  }
                  $safeCheckpoints=@(
                    'NONE_OBSERVED','AGENT_REAL_QWEN_CORE_SESSION_READY',
                    'AGENT_REAL_QWEN_DOWNLOAD_MODE_READY',
                    'AGENT_REAL_QWEN_VERIFIED_RUNTIME_READY',
                    'AGENT_REAL_QWEN_MODEL_PLAN_READY',
                    'AGENT_REAL_QWEN_VERIFIED_WEIGHTS_READY',
                    'AGENT_REAL_QWEN_MODEL_ACTIVE_READY',
                    'AGENT_REAL_QWEN_INFERENCE_PASS',
                    'AGENT_REAL_QWEN_TASK_ACCEPTED',
                    'AGENT_REAL_QWEN_RESULT_IMPORTED',
                    'AGENT_REAL_QWEN_TASK_HUMAN_REVIEW_PASS',
                    'AGENT_REAL_QWEN_IWXA_EXPORT_INSPECT_PASS'
                  )
                  $checkpoint=[string]$w.last_checkpoint
                  if($checkpoint -cin $safeCheckpoints){
                    Write-Host ('AGENT06_BUNDLED_SETUP_WITNESS_CHECKPOINT='+$checkpoint)
                  }
                }
              } catch {
                Write-Host 'AGENT06_BUNDLED_SETUP_WITNESS_RECEIPT_UNREADABLE'
              }
            } else {
              Write-Host 'AGENT06_BUNDLED_SETUP_WITNESS_RECEIPT_ABSENT'
            }
            Write-Host 'AGENT06_BUNDLED_NATIVE_SETUP_QUALIFICATION_FAIL'
            throw 'AGENT06_BUNDLED_NATIVE_SETUP_FAILED'
          }
          $setup=Join-Path $out 'IWXA-Private-SetupCore-Candidate.exe'
          if(!(Test-Path -LiteralPath $setup -PathType Leaf)){throw 'AGENT06_BUNDLED_NATIVE_SETUP_EXE_NOT_CREATED'}
          $artifact=(Get-Item -LiteralPath $setup)
          if($artifact.Length -lt 100000){throw 'AGENT06_BUNDLED_NATIVE_SETUP_SIZE_INVALID'}
          Write-Host 'AGENT06_BUNDLED_NATIVE_SETUP_INSTALLED_PASS'
          Write-Host 'AGENT06_OBSCURA_NATIVE_INCLUDED_IN_SETUP_PASS'
          Write-Host 'AGENT06_PRIVATE_ARTIFACTS_UPLOADED=0'
      # No upload-artifact, cache, build log, EXE, private model/Task content.
