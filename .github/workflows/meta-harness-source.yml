# Scoped read-only qualification of the private Agent. No artifacts or logs
# from the private checkout may be published.
name: Meta Harness original source qualification
on:
  push:
    branches:
      - work/2026-11-24-meta-harness-source-qualification
    paths:
      - .github/workflows/meta-harness-source.yml
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PRIVATE_PIN: d07d3d79c106653c5e7c7eb3c492e02f06a786cd
      PRIVATE_TREE: b969bd11f1c6cd0cd04a868ed1adfcb8140532c4
      QUALIFY_SCOPE: ADAPTER_PRODUCT
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read pinned source, qualify and remove temporary checkout
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, sys, tempfile
          def status(label, value):
              print(label + "=" + str(value), flush=True)
          def main():
              pin = os.environ["PRIVATE_PIN"]
              tree = os.environ["PRIVATE_TREE"]
              token = os.environ.pop("IWXA_TEMP_READ_TOKEN", "")
              if not token:
                  status("PRIVATE_READ", "TOKEN_UNAVAILABLE")
                  return 1
              clean = dict(os.environ)
              clean.update({"GIT_TERMINAL_PROMPT":"0", "GIT_LFS_SKIP_SMUDGE":"1", "PYTHONUTF8":"1"})
              with tempfile.TemporaryDirectory(prefix="iwxa-private-", dir=os.environ.get("RUNNER_TEMP")) as td:
                  root = pathlib.Path(td)
                  source = root / "source"
                  source.mkdir()
                  def run(args, cwd=source, env=clean, timeout=600):
                      return subprocess.run(args, cwd=cwd, env=env, stdout=subprocess.PIPE,
                                            stderr=subprocess.PIPE, timeout=timeout)
                  def ok(args, cwd=source, env=clean, timeout=600):
                      return run(args,cwd,env,timeout).returncode == 0
                  if not ok(["git","init","-q"]):
                      status("PRIVATE_READ","INIT_FAIL"); return 1
                  auth = dict(clean)
                  auth.update({"GIT_CONFIG_COUNT":"1",
                      "GIT_CONFIG_KEY_0":"http.https://github.com/.extraheader",
                      "GIT_CONFIG_VALUE_0":"AUTHORIZATION: basic "+base64.b64encode(
                          ("x-access-token:"+token).encode()).decode()})
                  fetched = ok(["git","fetch","--no-tags","--depth","1",
                                "https://github.com/Faust-S/iwxa-personal-agent.git",pin],
                               env=auth,timeout=180)
                  del auth, token
                  if not fetched or not ok(["git","checkout","--detach","-q",pin]):
                      status("PRIVATE_READ","FETCH_FAIL"); return 1
                  if (run(["git","rev-parse","HEAD"]).stdout.decode().strip()!=pin
                      or run(["git","rev-parse","HEAD^{tree}"]).stdout.decode().strip()!=tree):
                      status("PRIVATE_READ","PIN_MISMATCH"); return 1
                  status("PRIVATE_READ","PASS"); status("SOURCE_PIN",pin)
                  if not ok([sys.executable,"-m","pip","install","--disable-pip-version-check",
                             "-r","requirements-ci.txt"],timeout=420):
                      status("PYTHON_DEPS","FAIL"); return 1
                  status("PYTHON_DEPS","PASS")
                  plugin = root / "run_qualification.py"
                  plugin.write_text('''import hashlib,json,os,pathlib,re,sys
          import pytest
          sys.path.insert(0,os.getcwd())
          counts={"passed":0,"failed":0,"skipped":0,"collection_errors":0}
          failures=[]
          def fingerprint(value):
              return hashlib.sha256(value.encode()).hexdigest()[:16]
          class Plugin:
              def pytest_runtest_logreport(self,report):
                  rep=report
                  if rep.when=="call" and rep.passed: counts["passed"]+=1
                  if rep.skipped: counts["skipped"]+=1
                  if rep.failed:
                      counts["failed"]+=1
                      crash=getattr(rep.longrepr,"reprcrash",None)
                      detail=str(rep.longrepr)
                      match=re.search(r"TRANSPORT_DIAGNOSTIC:([A-Za-z0-9_:]+)",detail)
                      allowed={"FIRST","SECOND","CLI_ENTERED","BEFORE_CLI","NONE","OTHER","AssertionError","OSError","FileNotFoundError","TypeError","ValueError","RuntimeError","PORT_UNAVAILABLE","PORT_PROTOCOL_ERROR","AUTHORITY_REQUIRED","PRIVACY_DENIED","TIMED_OUT","CANCELLED","AGENT_RUNTIME_TIMEOUT","AGENT_RUNTIME_PRIVACY_DENIED","AGENT_RUNTIME_RESPONSE_INVALID","AGENT_RUNTIME_UNAVAILABLE","AGENT_RUNTIME_INVOCATION_FAILED","AGENT_RUNTIME_RESULT_AFTER_CANCEL_UNCONFIRMED","AGENT_RUNTIME_OUTCOME_UNKNOWN","AGENT_HANDOFF_PREVIEW_CHANGED","goose_runtime_not_selected","goose_local_model_not_configured","goose_local_model_not_ready","goose_local_agent_runtime_failed","goose_agent_runtime_failed","goose_agent_runtime_launch_failed","goose_executable_identity_changed_during_execution","goose_model_identity_changed_during_execution","goose_local_model_endpoint_invalid","goose_non_loopback_model_endpoint_forbidden","goose_executable_invalid","goose_runtime_executable_invalid","goose_output_secret_pattern","goose_agent_runtime_empty_output","goose_cancelled_before_dispatch","goose_user_cancelled","goose_local_cli_stop_unconfirmed","goose_agent_runtime_timeout","explicit_agent_runtime_usage_confirmation_required","goose_system_secret_pattern","goose_prompt_secret_pattern","goose_system_local_user_path","goose_prompt_local_user_path","claude_cli_execution_failed","claude_cli_launch_failed","claude_result_event_missing","claude_result_failed","claude_empty_result","claude_user_login_required","claude_user_cancelled","claude_result_secret_pattern","claude_runtime_id_mismatch","agent_runtime_route_mismatch","agent_runtime_binding_digest_mismatch"}
                      diag=":".join(x if x in allowed else "OTHER" for x in match.group(1).split(":")[:6]) if match else ""
                      failures.append({"id":fingerprint(rep.nodeid),"phase":rep.when,
                          "line":int(getattr(crash,"lineno",0) or 0),"diag":diag})
              def pytest_collectreport(self,report):
                  rep=report
                  if rep.failed:
                      counts["collection_errors"]+=1
                      failures.append({"id":fingerprint(rep.nodeid),"phase":"collect","line":0})
          result=pytest.main(sys.argv[2:]+["-q","--tb=short","--continue-on-collection-errors","-p","no:cacheprovider"],plugins=[Plugin()])
          pathlib.Path(sys.argv[1]).write_text(json.dumps({"counts":counts,"failures":failures,"exit":int(result)}),encoding="utf-8")
          sys.exit(int(result))
          ''',encoding="utf-8")
                  groups = {
                      "TASK": ["tests/test_meta_harness_original_task_workflow.py"],
                      "STRATEGY": ["tests/test_meta_harness_strategy_history.py"],
                      "HOST": ["tests/test_fc6_configured_chain_interaction.py",
                               "tests/test_fc6_daily_driver_graph_binding_m10.py",
                               "tests/test_fc6_initial_chain_interaction_integration.py",
                               "tests/test_agent06_graph_result_task_seed.py",
                               "tests/test_k01_accepted_result_real_cycle.py",
                               "tests/test_graph_result_readback_integrity.py"],
                      "HANDOFF": ["tests/test_meta_harness_contextual_handoff_graph.py"],
                      "WORK_BOARD": ["tests/test_work_board_state_transaction.py"],
                      "META": sorted(str(p.relative_to(source)) for p in source.glob("tests/test_meta_harness_*.py")
                                     if p.name not in {"test_meta_harness_contextual_handoff_graph.py","test_meta_harness_original_task_workflow.py","test_meta_harness_strategy_history.py"}),
                      "GRAPH": sorted(str(p.relative_to(source)) for p in source.glob("tests/test_fc6_graph*.py")),
                      "ADAPTERS": ["tests/test_goose_agent_runtime_user_ready.py",
                                   "tests/test_agent06_claude_code_cli.py",
                                   "tests/test_codex_chatgpt_cli_adapter.py",
                                   "tests/test_antigravity_agent_runtime.py"],
                  }
                  if os.environ.get("QUALIFY_SCOPE")=="TASK_TRANSPORT":
                      groups={"TASK_TRANSPORT":["tests/test_meta_harness_original_task_workflow.py"]}
                  if os.environ.get("QUALIFY_SCOPE") in {"ADAPTER_DEPTH","ADAPTER_PRODUCT"}:
                      groups={"ADAPTER_DEPTH":["tests/test_meta_harness_acp_v1.py",
                          "tests/test_meta_harness_acp_port.py",
                          "tests/test_meta_harness_acp_exchange.py",
                          "tests/test_meta_harness_native_session.py",
                          "tests/test_meta_harness_native_observation.py",
                          "tests/test_meta_harness_acp_product_owner.py",
                          "tests/test_meta_harness_acp_host_owner.py",
                          "tests/test_session_runtime_state_transaction.py",
                          "tests/test_meta_harness_original_core.py",
                          "tests/test_meta_harness_adapter_depth.py",
                          "tests/test_meta_harness_adapter_controls.py",
                          "tests/test_meta_harness_preview_performance.py",
                          "tests/test_fc2_agent_runtime_portfolio.py"]}
                  failed = False
                  for group, files in groups.items():
                      if not files or any(not (source / f.split("::",1)[0]).is_file() for f in files):
                          status(group,"FILES_MISSING"); failed=True; continue
                      report = root / (group+".json")
                      status(group,"STARTED")
                      proc = run([sys.executable,str(plugin),str(report),*files],timeout=900 if group in {"TASK","TASK_TRANSPORT","STRATEGY","WORK_BOARD"} else 420)
                      if not report.is_file():
                          status(group,"REPORT_MISSING"); status(group+"_EXIT",proc.returncode); failed=True; continue
                      data=json.loads(report.read_text(encoding="utf-8"))
                      for key in ("passed","failed","skipped","collection_errors"):
                          status(group+"_"+key.upper(),int(data["counts"][key]))
                      for row in data["failures"][:80]:
                          if re.fullmatch("[0-9a-f]{16}",row["id"]) and row["phase"] in {"setup","call","teardown","collect"}:
                              status(group+"_CASE",row["id"]+":"+row["phase"]+":"+str(int(row["line"])))
                              if row.get("diag"): status(group+"_DIAGNOSTIC",row["diag"])
                      success = proc.returncode==0 and data["counts"]["passed"]>0 and not data["counts"]["failed"] and not data["counts"]["collection_errors"]
                      status(group,"PASS" if success else "FAIL")
                      failed = failed or not success
                  if os.environ.get("QUALIFY_SCOPE") in {"TASK_TRANSPORT","ADAPTER_DEPTH"}:
                      return int(failed)
                  # Compile the complete existing desktop; publish only results.
                  desktop=source / "desktop"
                  npm=["cmd.exe","/d","/c","npm"] if os.name=="nt" else ["npm"]
                  deps=ok(npm+["ci","--no-audit","--no-fund"],cwd=desktop,timeout=420)
                  status("DESKTOP_DEPS","PASS" if deps else "FAIL")
                  if deps:
                      tests=ok(["node","--test","tests/meta-harness-host.test.mjs"],cwd=desktop,timeout=120)
                      status("DESKTOP_META_TESTS","PASS" if tests else "FAIL")
                      compiled=run(npm+["run","build"],cwd=desktop,timeout=420)
                      build=compiled.returncode==0
                      if not build:
                          # No source text, filenames, messages or private path publication.
                          data=(compiled.stdout+compiled.stderr).decode("utf-8",errors="replace")
                          seen=set()
                          for match in re.finditer(r"(?m)^([^\r\n(]{1,260})\((\d{1,7}),(\d{1,7})\): error TS(\d{4,6}):",data):
                              path=match.group(1).replace("\\","/")
                              if not path.startswith("src/"): continue
                              key=hashlib.sha256(path.encode()).hexdigest()[:16]+":"+":".join(match.groups()[1:])
                              if key not in seen and len(seen)<50:
                                  seen.add(key);status("DESKTOP_TSC_CASE",key)
                      status("DESKTOP_BUILD","PASS" if build else "FAIL")
                      failed=failed or not tests or not build
                  else:
                      failed=True
                  return int(failed)
          try:
              code=main()
          except subprocess.TimeoutExpired:
              status("QUALIFICATION","TIMEOUT"); code=1
          except Exception:
              status("QUALIFICATION","INTERNAL_ERROR"); code=1
          status("TEMP_CHECKOUT","CLEANUP_ATTEMPTED")
          sys.exit(code)
          PY
