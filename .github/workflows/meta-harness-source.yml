# Scoped read-only qualification of the private Agent. No artifacts or logs
# from the private checkout may be published.
name: Meta Harness original source qualification
on:
  push:
    branches:
      - work/2026-11-24-meta-harness-source-qualification
    paths:
      - .github/workflows/meta-harness-source.yml
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PRIVATE_PIN: 7015a3965f7ab895270cf7bd53ad1bf13f944f4f
      PRIVATE_TREE: 18e7766b0f90c7493bf22ef83dc9170f1681d45f
      QUALIFY_SCOPE: ADAPTER_PRODUCT
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read pinned source, qualify and remove temporary checkout
        shell: bash
        env:
          IWXA_TEMP_READ_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          python - <<'PY'
