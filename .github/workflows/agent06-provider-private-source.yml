# A public source-only qualifier: exact private SHA, no artifacts or logs.
name: Agent06 provider catalog private source qualification
on:
  push:
    branches:
      - work/2026-11-21-agent06-provider-source-ci
permissions:
  contents: read
concurrency:
  group: agent06-provider-private-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      AGENT06_PRIVATE_PIN: 'af159abd8bf2fe3ac92636fe96358beba2367d0a'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing read-only source access
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_PROVIDER_PRIVATE_SOURCE_PERMISSION_MISSING'
          }
          Write-Host 'AGENT06_PROVIDER_PRIVATE_SOURCE_PERMISSION_PRESENT'
      - name: Read exact private source revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT06_PRIVATE_PIN }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test focused online account and OAuth contracts
        id: contracts
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $observed = (& git -C private-agent rev-parse HEAD).Trim()
          if($observed -cne $env:AGENT06_PRIVATE_PIN){
            throw 'AGENT06_PROVIDER_PRIVATE_PIN_MISMATCH'
          }
          Write-Host ('AGENT06_PROVIDER_SOURCE_SHA='+$observed)
          $installLog = Join-Path $env:RUNNER_TEMP 'agent06-provider-deps-private.log'
          & python -m pip install -r private-agent/requirements-ci.txt *> $installLog
          if($LASTEXITCODE -ne 0){throw 'AGENT06_PROVIDER_DEPENDENCY_INSTALL_FAILED'}
          Write-Host 'AGENT06_PROVIDER_DEPENDENCIES_PASS'
          Push-Location private-agent
          try{
            $log = Join-Path $env:RUNNER_TEMP 'agent06-provider-tests-private.log'
            $xml = Join-Path $env:RUNNER_TEMP 'agent06-provider-tests-private.xml'
            & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$xml) tests/test_google_oauth_user_ready.py tests/test_agent06_google_multi_account.py tests/test_agent06_online_task_account_roundtrip.py tests/test_agent06_account_binding_port.py tests/test_agent06_account_connection_verify.py tests/test_agent06_account_remove.py tests/test_agent06_current_online_surface.py tests/test_agent06_yandex_mailru_tool_provider.py tests/test_agent06_online_services.py tests/test_agent061_imap_search_confirmation.py *> $log
            $exitCode = $LASTEXITCODE
            if(Test-Path -LiteralPath $xml){
              [xml]$doc = Get-Content -LiteralPath $xml -Raw
              $suite = $doc.testsuites.testsuite
              if($null -eq $suite){$suite = $doc.testsuite}
              Write-Host ('AGENT06_PROVIDER_TESTS='+[int]$suite.tests)
              Write-Host ('AGENT06_PROVIDER_FAILURES='+[int]$suite.failures)
              Write-Host ('AGENT06_PROVIDER_ERRORS='+[int]$suite.errors)
              Write-Host ('AGENT06_PROVIDER_SKIPPED='+[int]$suite.skipped)
              foreach($case in @($doc.SelectNodes('//testcase'))){
                $failed = $case.SelectSingleNode('failure')
                if($null -eq $failed){$failed = $case.SelectSingleNode('error')}
                if($null -eq $failed){continue}
                $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                    [Text.Encoding]::UTF8.GetBytes([string]$case.classname+':'+[string]$case.name)
                )).Substring(0,12)
                Write-Host ('AGENT06_PROVIDER_FAILURE_SHA='+$fingerprint)
                $family='OTHER'
                if([string]$case.classname -match 'google_multi_account'){$family='GOOGLE_MULTI_ACCOUNT'}
                elseif([string]$case.classname -match 'google_oauth_user_ready'){$family='GOOGLE_OAUTH'}
                elseif([string]$case.classname -match 'online_services'){$family='STANDARD_ONLINE'}
                elseif([string]$case.classname -match 'account_binding'){$family='ACCOUNT_BINDING'}
                elseif([string]$case.classname -match 'yandex_mailru'){$family='MAIL_PROVIDER'}
                Write-Host ('AGENT06_PROVIDER_FAILURE_FAMILY='+$family)
              }
            }
            if($exitCode -ne 0){throw 'AGENT06_PROVIDER_SOURCE_TESTS_FAILED'}
            Write-Host 'AGENT06_PROVIDER_SOURCE_TESTS_PASS'
          }finally{Pop-Location}

      - name: Live two-account Ethereal SMTP IMAP qualification
        id: ethereal
        continue-on-error: true
        shell: pwsh
        env:
          IWXA_RUN_ETHEREAL_LIVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'agent061-ethereal-private.log'
          $xml = Join-Path $env:RUNNER_TEMP 'agent061-ethereal-private.xml'
          Push-Location private-agent
          try{
            # Test creates two owned disposable sandbox accounts via official API.
            # SMTP delivery is trapped at Ethereal. No username/password, real
            # recipients, private code, mailbox content or preview URL printed.
            & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$xml) tests/test_agent06_ethereal_live.py *> $log
            $rc = $LASTEXITCODE
            if(Test-Path -LiteralPath $xml){
              [xml]$d = Get-Content -LiteralPath $xml -Raw
              $suite = $d.testsuites.testsuite
              if($null -eq $suite){$suite = $d.testsuite}
              Write-Host ('AGENT061_ETHEREAL_TESTS='+[int]$suite.tests)
              Write-Host ('AGENT061_ETHEREAL_FAILURES='+[int]$suite.failures)
              foreach($case in @($d.SelectNodes('//testcase'))){
                $failed = $case.SelectSingleNode('failure')
                if($null -eq $failed){$failed = $case.SelectSingleNode('error')}
                if($null -eq $failed){continue}
                $family='OTHER'
                $name=[string]$case.name
                if($name -eq 'test_real_ethereal_two_accounts_review_and_cold_readback'){$family='FULL_IMAP_AND_SMTP'}
                elseif($name -eq 'test_real_ethereal_smtp_reviewed_task_receipt_without_imap_readback'){$family='SMTP_ACTION'}
                elseif($name -eq 'test_real_ethereal_smtp_only_reviewed_send_and_cold_receipt'){$family='SMTP_COLD'}
                Write-Host ('AGENT061_ETHEREAL_FAILED_TEST='+$family)
                $message=[string]$failed.GetAttribute('message')
                $whitelist=@(
                  'ethereal_imap_tls_or_connect_failed',
                  'ethereal_imap_login_failed',
                  'ethereal_imap_noop_failed',
                  'ethereal_imap_noop_not_ok',
                  'ethereal_original_account_verify_disagrees_with_imap_probe',
                  'ethereal_original_account_verify_raised',
                  'ethereal_full_ACCOUNT_SETUP_failed',
                  'ethereal_full_CONFIGURE_failed',
                  'ethereal_full_VERIFY_failed',
                  'ethereal_full_SEND_failed',
                  'ethereal_full_READ_failed',
                  'ethereal_full_READ_SEARCH_ALPHA_failed',
                  'ethereal_full_READ_SEARCH_BETA_failed',
                  'ethereal_full_READ_FULL_ALPHA_failed',
                  'ethereal_full_READ_FULL_BETA_failed',
                  'ethereal_full_READ_ISOLATION_ALPHA_failed',
                  'ethereal_full_READ_ISOLATION_BETA_failed',
                  'ethereal_full_COLD_failed',
                  'ethereal_full_SECRETS_failed',
                  'ethereal_verify_imap_verification_failed',
                  'ethereal_verify_smtp_verification_failed',
                  'ethereal_smtp_tool_send_failed',
                  'ethereal_sent_message_missing_from_own_mailbox',
                  'ethereal_agent_search_exclusion_disagrees_with_direct_imap',
                  'ethereal_direct_imap_other_marker_present',
                  'ethereal_remote_imap_text_search_overmatches',
                  'ethereal_direct_imap_select_failed',
                  'ethereal_direct_imap_search_failed',
                  'ethereal_direct_imap_fetch_failed',
                  'ethereal_direct_imap_isolation_probe_failed',
                  'ethereal_account_creation_unavailable',
                  'ethereal_account_creation_rejected'
                )
                $code='OTHER'
                foreach($allowed in $whitelist){
                  if($message.Contains($allowed)){$code=$allowed;break}
                }
                Write-Host ('AGENT061_ETHEREAL_JUNIT_FAILURE_CODE='+$code)
              }
              $sendOnly = @($d.SelectNodes('//testcase[contains(@name,"test_real_ethereal_smtp_only_reviewed_send_and_cold_receipt")]'))
              if($sendOnly.Count -eq 1 -and
                  $null -eq $sendOnly[0].SelectSingleNode('failure') -and
                  $null -eq $sendOnly[0].SelectSingleNode('error') -and
                  $null -eq $sendOnly[0].SelectSingleNode('skipped')){
                Write-Host 'AGENT061_ETHEREAL_SMTP_ONLY_PASS'
              }else{Write-Host 'AGENT061_ETHEREAL_SMTP_ONLY_NOT_PROVEN'}
            }
            if($rc -ne 0){
              $raw = Get-Content -LiteralPath $log -Raw
              # Pick only an explicit pytest exception code from the terminal
              # E AssertionError line, not a string from the source traceback.
              $found = [regex]::Matches([string]$raw,
                  '(?m)^\s*E\s+AssertionError:\s+(ethereal_[a-z0-9_]+)\s*$')
              $allowed = @(
                'ethereal_account_creation_unavailable',
                'ethereal_account_creation_rejected',
                'ethereal_account_transport_contract_changed',
                'ethereal_account_credentials_invalid',
                'ethereal_imap_tls_or_connect_failed',
                'ethereal_imap_login_failed',
                'ethereal_imap_noop_failed',
                'ethereal_imap_noop_not_ok',
                'ethereal_original_account_verify_disagrees_with_imap_probe',
                'ethereal_original_account_verify_raised',
                'ethereal_verify_imap_verification_failed',
                'ethereal_verify_smtp_verification_failed',
                'ethereal_smtp_tool_send_failed',
                'ethereal_sent_message_missing_from_own_mailbox'
              )
              $code='OTHER'
              foreach($item in $found){
                $candidate=[string]$item.Groups[1].Value
                if($candidate -cin $allowed){$code=$candidate;break}
              }
              Write-Host ('AGENT061_ETHEREAL_LIVE_FAILURE_CODE='+$code)
              throw 'AGENT061_ETHEREAL_LIVE_FAILED'
            }
            Write-Host 'AGENT061_ETHEREAL_LIVE_TWO_ACCOUNTS_PASS'
          }finally{
            Pop-Location
            if(Test-Path -LiteralPath $log){Remove-Item -LiteralPath $log -Force}
            if(Test-Path -LiteralPath $xml){Remove-Item -LiteralPath $xml -Force}
          }
      - name: Public provider TLS and Google OIDC metadata (no login)
        id: transport
        continue-on-error: true
        shell: pwsh
        env:
          IWXA_RUN_PROVIDER_TRANSPORT_LIVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'agent061-public-protocols-private.log'
          Push-Location private-agent
          try{
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_provider_public_tls_live.py *> $log
            if($LASTEXITCODE -ne 0){
              $content = Get-Content -LiteralPath $log -Raw
              $status='OTHER'
              foreach($code in @('vendor_YANDEX_imap_tls_unavailable',
                                  'vendor_YANDEX_smtp_tls_unavailable',
                                  'vendor_MAILRU_imap_tls_unavailable',
                                  'vendor_MAILRU_smtp_tls_unavailable',
                                  'google_oidc_public_metadata_unavailable',
                                  'google_oidc_public_contract_changed')){
                if($content.Contains($code)){$status=$code;break}
              }
              Write-Host ('AGENT061_PUBLIC_TRANSPORT_FAILURE_CODE='+$status)
              throw 'AGENT061_PUBLIC_TRANSPORT_FAILED'
            }
            Write-Host 'AGENT061_PUBLIC_TRANSPORT_PASS'
          }finally{
            Pop-Location
            if(Test-Path -LiteralPath $log){Remove-Item -LiteralPath $log -Force}
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current online account UI using original Desktop build
        id: desktop
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location private-agent/desktop
          try{
            $deps = Join-Path $env:RUNNER_TEMP 'agent06-online-ui-deps-private.log'
            & npm ci --no-audit --no-fund *> $deps
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ONLINE_UI_DEPENDENCIES_FAILED'}
            Write-Host 'AGENT06_ONLINE_UI_DEPENDENCIES_PASS'
            $testLog = Join-Path $env:RUNNER_TEMP 'agent06-online-ui-node-private.log'
            & node --test tests/agent06-current-online-accounts.test.mjs tests/tools-read-execution-route.test.mjs tests/tools-read-catalog-latency.test.mjs *> $testLog
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ONLINE_UI_NODE_FAILED'}
            Write-Host 'AGENT06_ONLINE_UI_NODE_PASS'
            $buildLog = Join-Path $env:RUNNER_TEMP 'agent06-online-ui-build-private.log'
            & npm run build *> $buildLog
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ONLINE_UI_BUILD_FAILED'}
            Write-Host 'AGENT06_ONLINE_UI_TYPESCRIPT_VITE_PASS'
          }finally{Pop-Location}
      - name: Enforce all independent qualification outcomes
        if: always()
        shell: pwsh
        env:
          CONTRACT_OUTCOME: ${{ steps.contracts.outcome }}
          ETHEREAL_OUTCOME: ${{ steps.ethereal.outcome }}
          TRANSPORT_OUTCOME: ${{ steps.transport.outcome }}
          DESKTOP_OUTCOME: ${{ steps.desktop.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach($gate in @('CONTRACT','ETHEREAL','TRANSPORT','DESKTOP')){
            $value = [string]([Environment]::GetEnvironmentVariable($gate+'_OUTCOME'))
            if($value -notin @('success','failure','skipped','cancelled')){$value='unknown'}
            Write-Host ('AGENT061_GATE_'+$gate+'='+$value)
            if($value -ne 'success'){$script:failed=$true}
          }
          if($script:failed){throw 'AGENT061_INDEPENDENT_GATES_NOT_ALL_PASS'}
          Write-Host 'AGENT061_ALL_SOURCE_GATES_PASS'
      # No private artifacts, cache, raw test traces or compiled app upload.
