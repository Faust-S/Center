# A public source-only qualifier: exact private SHA, no artifacts or logs.
name: Agent06 provider catalog private source qualification
on:
  push:
    branches:
      - work/2026-11-21-agent06-provider-source-ci
permissions:
  contents: read
concurrency:
  group: agent06-provider-private-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      AGENT06_PRIVATE_PIN: 'ba69884ef47fee8e4077029d423c8b1bf0e68048'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require existing read-only source access
        shell: pwsh
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:PRIVATE_SOURCE_TOKEN)){
            throw 'AGENT06_PROVIDER_PRIVATE_SOURCE_PERMISSION_MISSING'
          }
          Write-Host 'AGENT06_PROVIDER_PRIVATE_SOURCE_PERMISSION_PRESENT'
      - name: Read exact private source revision
        uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: ${{ env.AGENT06_PRIVATE_PIN }}
          path: private-agent
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test focused online account and OAuth contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $observed = (& git -C private-agent rev-parse HEAD).Trim()
          if($observed -cne $env:AGENT06_PRIVATE_PIN){
            throw 'AGENT06_PROVIDER_PRIVATE_PIN_MISMATCH'
          }
          Write-Host ('AGENT06_PROVIDER_SOURCE_SHA='+$observed)
          $installLog = Join-Path $env:RUNNER_TEMP 'agent06-provider-deps-private.log'
          & python -m pip install -r private-agent/requirements-ci.txt *> $installLog
          if($LASTEXITCODE -ne 0){throw 'AGENT06_PROVIDER_DEPENDENCY_INSTALL_FAILED'}
          Write-Host 'AGENT06_PROVIDER_DEPENDENCIES_PASS'
          Push-Location private-agent
          try{
            $log = Join-Path $env:RUNNER_TEMP 'agent06-provider-tests-private.log'
            $xml = Join-Path $env:RUNNER_TEMP 'agent06-provider-tests-private.xml'
            & python -B -m pytest -q -p no:cacheprovider ('--junitxml='+$xml) tests/test_google_oauth_user_ready.py tests/test_agent06_google_multi_account.py tests/test_agent06_online_task_account_roundtrip.py tests/test_agent06_account_binding_port.py tests/test_agent06_account_connection_verify.py tests/test_agent06_account_remove.py tests/test_agent06_current_online_surface.py tests/test_agent06_yandex_mailru_tool_provider.py tests/test_agent06_online_services.py *> $log
            $exitCode = $LASTEXITCODE
            if(Test-Path -LiteralPath $xml){
              [xml]$doc = Get-Content -LiteralPath $xml -Raw
              $suite = $doc.testsuites.testsuite
              if($null -eq $suite){$suite = $doc.testsuite}
              Write-Host ('AGENT06_PROVIDER_TESTS='+[int]$suite.tests)
              Write-Host ('AGENT06_PROVIDER_FAILURES='+[int]$suite.failures)
              Write-Host ('AGENT06_PROVIDER_ERRORS='+[int]$suite.errors)
              Write-Host ('AGENT06_PROVIDER_SKIPPED='+[int]$suite.skipped)
              foreach($case in @($doc.SelectNodes('//testcase'))){
                $failed = $case.SelectSingleNode('failure')
                if($null -eq $failed){$failed = $case.SelectSingleNode('error')}
                if($null -eq $failed){continue}
                $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData(
                    [Text.Encoding]::UTF8.GetBytes([string]$case.classname+':'+[string]$case.name)
                )).Substring(0,12)
                Write-Host ('AGENT06_PROVIDER_FAILURE_SHA='+$fingerprint)
              }
            }
            if($exitCode -ne 0){throw 'AGENT06_PROVIDER_SOURCE_TESTS_FAILED'}
            Write-Host 'AGENT06_PROVIDER_SOURCE_TESTS_PASS'
          }finally{Pop-Location}

      - name: Live two-account Ethereal SMTP IMAP qualification
        shell: pwsh
        env:
          IWXA_RUN_ETHEREAL_LIVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'agent061-ethereal-private.log'
          Push-Location private-agent
          try{
            # Test creates two owned disposable sandbox accounts via official API.
            # SMTP delivery is trapped at Ethereal. No username/password, real
            # recipients, private code, mailbox content or preview URL printed.
            & python -B -m pytest -q -p no:cacheprovider tests/test_agent06_ethereal_live.py *> $log
            $rc = $LASTEXITCODE
            if($rc -ne 0){
              $raw = Get-Content -LiteralPath $log -Raw
              $codes = @(
                'ethereal_account_creation_unavailable',
                'ethereal_account_creation_rejected',
                'ethereal_account_transport_contract_changed',
                'ethereal_account_credentials_invalid',
                'imap_verification_failed',
                'smtp_verification_failed',
                'smtp_send_failed',
                'imap_read_failed',
                'ethereal_sent_message_missing_from_own_mailbox',
                'online_account_slot_capabilities_incompatible',
                'tool_provider_binding_mismatch'
              )
              $code='OTHER'
              foreach($candidate in $codes){
                if($raw.Contains($candidate)){$code=$candidate;break}
              }
              Write-Host ('AGENT061_ETHEREAL_LIVE_FAILURE_CODE='+$code)
              throw 'AGENT061_ETHEREAL_LIVE_FAILED'
            }
            Write-Host 'AGENT061_ETHEREAL_LIVE_TWO_ACCOUNTS_PASS'
          }finally{
            Pop-Location
            if(Test-Path -LiteralPath $log){Remove-Item -LiteralPath $log -Force}
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check current online account UI using original Desktop build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location private-agent/desktop
          try{
            $deps = Join-Path $env:RUNNER_TEMP 'agent06-online-ui-deps-private.log'
            & npm ci --no-audit --no-fund *> $deps
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ONLINE_UI_DEPENDENCIES_FAILED'}
            Write-Host 'AGENT06_ONLINE_UI_DEPENDENCIES_PASS'
            $testLog = Join-Path $env:RUNNER_TEMP 'agent06-online-ui-node-private.log'
            & node --test tests/agent06-current-online-accounts.test.mjs tests/tools-read-execution-route.test.mjs tests/tools-read-catalog-latency.test.mjs *> $testLog
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ONLINE_UI_NODE_FAILED'}
            Write-Host 'AGENT06_ONLINE_UI_NODE_PASS'
            $buildLog = Join-Path $env:RUNNER_TEMP 'agent06-online-ui-build-private.log'
            & npm run build *> $buildLog
            if($LASTEXITCODE -ne 0){throw 'AGENT06_ONLINE_UI_BUILD_FAILED'}
            Write-Host 'AGENT06_ONLINE_UI_TYPESCRIPT_VITE_PASS'
          }finally{Pop-Location}
      # No private artifacts, cache, raw test traces or compiled app upload.
