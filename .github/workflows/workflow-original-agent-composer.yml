# Public runner only. No private source, logs, artifacts or caches are published.
name: Workflow original Agent composer source qualification
on:
  push:
    branches: ['work/2026-11-27-workflow-original-agent-composer-qualification']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-composer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require authorized private read-only checkout
        env:
          PRIVATE_SOURCE_TOKEN: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
        run: test -n "$PRIVATE_SOURCE_TOKEN" || { echo ORIGINAL_AGENT_SOURCE_ACCESS_REQUIRED; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/iwxa-personal-agent
          ref: a45e206291068147d4460acfa1ae91615accfcdf
          path: private-agent
          persist-credentials: false
          token: ${{ secrets.IWXA_PRIVATE_SOURCE_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/knowledge
          ref: fa36fe1c299075fb7e05da56db76802845ee5836
          path: knowledge
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Private dependencies
        run: |
          test "$(git -C private-agent rev-parse HEAD)" = "a45e206291068147d4460acfa1ae91615accfcdf"
          test "$(git -C knowledge rev-parse HEAD)" = "fa36fe1c299075fb7e05da56db76802845ee5836"
          python -m pip install -r private-agent/requirements-ci.txt > "$RUNNER_TEMP/composer-deps-private.log" 2>&1 || { echo ORIGINAL_AGENT_DEPENDENCIES_FAIL; exit 1; }
      - name: Verify original Core exact-byte regression
        run: |
          cd private-agent
          python -B -m pytest -q -p no:cacheprovider tests/test_k01_accepted_result_real_cycle.py tests/test_workspace_composer_integration.py > "$RUNNER_TEMP/original-core-regression-private.log" 2>&1 || { echo ORIGINAL_AGENT_CORE_REGRESSION_FAIL; exit 1; }
          echo ORIGINAL_AGENT_CORE_REGRESSION_PASS
      - name: Exercise original SessionRuntime with synthetic Workflow materials
        run: |
          node qualification/workflow-original-composer.mjs "$PWD/private-agent" "$PWD/knowledge" > "$RUNNER_TEMP/composer-qualification-private.log" 2>&1 || { grep -E '^WORKFLOW_QUALIFICATION_FAILURE_(PHASE|CODE)=[A-Z0-9_]+$' "$RUNNER_TEMP/composer-qualification-private.log" || true; echo ORIGINAL_AGENT_COMPOSER_WORKFLOW_SOURCE_FAIL; exit 1; }
          grep -qx ORIGINAL_AGENT_COMPOSER_COLD_READBACK_AND_SCOPE_CAS_PASS "$RUNNER_TEMP/composer-qualification-private.log"
          grep -qx ORIGINAL_AGENT_ACCEPTED_TASK_DECLARED_INPUTS_PASS "$RUNNER_TEMP/composer-qualification-private.log"
          echo ORIGINAL_AGENT_COMPOSER_WORKFLOW_SOURCE_PASS
          grep -qx ORIGINAL_AGENT_PERSONAL_THREE_WORK_CHAIN_PASS "$RUNNER_TEMP/composer-qualification-private.log"
          echo ORIGINAL_AGENT_ACCEPTED_TASK_DECLARED_INPUTS_PASS
          grep -qx ORIGINAL_AGENT_PERSONAL_CHAIN_COLD_BINDING_RECOVERY_PASS "$RUNNER_TEMP/composer-qualification-private.log"
          echo ORIGINAL_AGENT_PERSONAL_THREE_WORK_CHAIN_PASS
          grep -qx ORIGINAL_AGENT_PERSONAL_DIRECT_SELECTION_PASS "$RUNNER_TEMP/composer-qualification-private.log"
          echo ORIGINAL_AGENT_PERSONAL_CHAIN_COLD_BINDING_RECOVERY_PASS
          echo ORIGINAL_AGENT_PERSONAL_DIRECT_SELECTION_PASS
      - name: Remove private working copies and logs
        if: always()
        run: |
          rm -rf private-agent
          rm -f "$RUNNER_TEMP/original-core-regression-private.log" "$RUNNER_TEMP/composer-deps-private.log" "$RUNNER_TEMP/composer-qualification-private.log"
